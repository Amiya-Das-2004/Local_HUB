/**
 * 03_Notes/B_Editor_View/01_Blocks/Figure_Utils.js
 * Unified scientific figure numbering, DOM attributes, and caption formatting
 * for Image Block and TikZ Block.
 */

/**
 * Applies scientific figure attributes (tag, ID, figure number) to a container element.
 * 
 * @param {HTMLElement} figureEl - Figure container element
 * @param {Object} options
 * @param {string} [options.tag=''] - Unique citation tag (e.g. 'arch')
 * @param {number|null} [options.figNumber=null] - Computed numeric figure number
 */
function applyFigureAttributes(figureEl, { tag = '', figNumber = null } = {}) {
  if (!figureEl) return;
  const normTag = (tag || '').trim().toLowerCase();
  if (normTag) {
    figureEl.setAttribute('data-fig-tag', normTag);
  }
  if (figNumber) {
    figureEl.id = `fig-${figNumber}`;
    figureEl.setAttribute('data-fig-num', String(figNumber));
  } else if (normTag) {
    figureEl.id = `fig-${normTag}`;
  }
}

/**
 * Formats standard scientific caption text: "Fig: X: Caption" or "Fig: X"
 * 
 * @param {Object} options
 * @param {string} [options.caption=''] - User caption
 * @param {boolean} [options.allowNumbering=true] - Whether numbering is enabled
 * @param {number|null} [options.figNumber=null] - Computed numeric figure number
 * @returns {string} Formatted caption string
 */
function formatFigureCaptionText({ caption = '', allowNumbering = true, figNumber = null } = {}) {
  const trimmed = (caption || '').trim();
  if (allowNumbering && figNumber) {
    return trimmed ? `Fig: ${figNumber}: ${trimmed}` : `Fig: ${figNumber}`;
  }
  return trimmed;
}

/**
 * Creates and appends a styled <figcaption> element if captionText is non-empty.
 * 
 * @param {HTMLElement} figureEl - Parent figure element
 * @param {string} captionText - Formatted caption text
 * @param {string} [extraClass=''] - Additional CSS classes
 * @returns {HTMLElement|null} The created figcaption or null
 */
function appendFigureCaption(figureEl, captionText, extraClass = '') {
  if (!figureEl || !captionText) return null;
  const capEl = document.createElement('figcaption');
  capEl.className = `text-xs text-[var(--text-secondary)] font-medium mt-2 px-2 text-center select-text ${extraClass}`.trim();
  capEl.textContent = captionText;
  figureEl.appendChild(capEl);
  return capEl;
}

// Convenience aliases for backward compatibility
const setupFigureElement = applyFigureAttributes;
function getFigureCaptionText(caption, figNumber, allowNumbering) {
  return formatFigureCaptionText({ caption, allowNumbering, figNumber });
}


/* --- 03_Notes/B_Editor_View/01_Blocks/Block_Textarea.js --- */
/**
 * 03_Notes/B_Editor_View/01_Blocks/Block_Textarea.js
 * Reusable, smooth editor textarea component for note blocks (Table, Equation, TikZ, Code).
 * Eliminates cursor drag stutter/rubber-banding by scoping CSS transitions to border-color/box-shadow only.
 */

/**
 * Creates and returns a smoothly resizable editor textarea element.
 * 
 * @param {Object} options
 * @param {string} options.value - Initial text value
 * @param {string} options.placeholder - Placeholder text
 * @param {string} [options.minHeight='100px'] - Minimum height
 * @param {string} [options.height='140px'] - Initial height
 * @param {string} [options.className=''] - Extra classes
 * @param {Function} [options.onInput=null] - Input event handler (value, event)
 * @param {Function} [options.onChange=null] - Change event handler (value, event)
 * @param {Function} [options.onKeyDown=null] - Keydown event handler
 * @returns {HTMLTextAreaElement}
 */
function createBlockTextarea({
  value = '',
  placeholder = '',
  minHeight = '100px',
  height = '140px',
  className = '',
  onInput = null,
  onChange = null,
  onKeyDown = null
} = {}) {
  const textarea = document.createElement('textarea');

  textarea.className = `w-full p-2.5 text-sm leading-snug rounded-lg border border-[var(--border)] bg-[var(--surface)] focus:border-purple-500 outline-none box-border text-[var(--text)] select-text ${className}`.trim();
  
  textarea.spellcheck = false;
  textarea.autocapitalize = 'off';
  textarea.autocomplete = 'off';
  textarea.autocorrect = 'off';
  textarea.placeholder = placeholder;
  textarea.value = value;

  // IMPORTANT: Never use 'transition: all' or 'transition-all' on resizable textareas!
  // Height transitions fight native drag handles, causing lag and rubber-banding.
  textarea.style.minHeight = minHeight;
  textarea.style.height = height;
  textarea.style.resize = 'vertical';
  textarea.style.scrollbarWidth = 'thin';
  textarea.style.fontFamily = 'var(--note-font-family, inherit)';
  textarea.style.transition = 'border-color 0.15s ease, box-shadow 0.15s ease';

  if (onInput) {
    textarea.addEventListener('input', (e) => onInput(textarea.value, e));
  }

  if (onChange) {
    textarea.addEventListener('change', (e) => onChange(textarea.value, e));
  }

  if (onKeyDown) {
    textarea.addEventListener('keydown', onKeyDown);
  }

  return textarea;
}

const TABLE_TEMPLATES_STORAGE_KEY = 'localhub_table_templates';

/**
 * Retrieves all custom user templates from NotesState or LocalStorage
 */
function GetCustomTableTemplates() {
  if (NotesState && Array.isArray(NotesState.tableTemplates) && NotesState.tableTemplates.length > 0) {
    return NotesState.tableTemplates;
  }

  try {
    const raw = localStorage.getItem(TABLE_TEMPLATES_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        if (NotesState) NotesState.tableTemplates = parsed;
        return parsed;
      }
    }
  } catch (err) {
    console.warn('Failed to parse custom Table templates from localStorage:', err);
  }

  return [];
}

/**
 * Returns all templates (Built-in + Custom)
 */
function GetAllTableTemplates() {
  const custom = GetCustomTableTemplates();
  const map = new Map();
  BUILTIN_TABLE_TEMPLATES.forEach(t => map.set(t.id, t));
  custom.forEach(t => map.set(t.id, t));
  return Array.from(map.values());
}

/**
 * Saves a new custom Table template into NotesState and LocalStorage
 */
function SaveCustomTableTemplate({ name, category, code, description = '' }) {
  const trimmedName = (name || 'Untitled Template').trim();
  const trimmedCat = (category || 'Custom').trim();
  const trimmedCode = (code || '').trim();

  const newTpl = {
    id: 'custom_tbl_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
    name: trimmedName,
    category: trimmedCat,
    description: description.trim(),
    code: trimmedCode,
    isBuiltin: false,
    createdAt: new Date().toISOString()
  };

  const current = GetCustomTableTemplates();
  const updated = [newTpl, ...current];

  if (NotesState) {
    NotesState.tableTemplates = updated;
    if (typeof SaveNotesState === 'function') {
      SaveNotesState();
    }
  }

  try {
    localStorage.setItem(TABLE_TEMPLATES_STORAGE_KEY, JSON.stringify(updated));
  } catch (err) {
    console.warn('Failed to save Table template to localStorage:', err);
  }

  return newTpl;
}

/**
 * Deletes a custom Table template by ID
 */
function DeleteCustomTableTemplate(id) {
  const current = GetCustomTableTemplates();
  const updated = current.filter(t => t.id !== id);

  if (NotesState) {
    NotesState.tableTemplates = updated;
    if (typeof SaveNotesState === 'function') {
      SaveNotesState();
    }
  }

  try {
    localStorage.setItem(TABLE_TEMPLATES_STORAGE_KEY, JSON.stringify(updated));
  } catch (err) {
    console.warn('Failed to delete Table template from localStorage:', err);
  }

  return updated;
}

/**
 * Initializes the Template Browser and Save Template UI logic.
 */
function InitTableTemplatesLogic(parentEl, { onInsert = null, getCurrentCode = () => '' } = {}) {
  if (!parentEl) return;

  let activeCategory = 'ALL';
  let templateCols = 2;

  const btnTemplates = parentEl.querySelector('.btn-templates-toggle');
  const browserWindow = parentEl.querySelector('.template-browser-window');
  const btnCloseTemplates = parentEl.querySelector('.btn-close-templates');
  const searchInput = parentEl.querySelector('.template-search-input');
  const colDecBtn = parentEl.querySelector('.btn-col-dec');
  const colIncBtn = parentEl.querySelector('.btn-col-inc');
  const colValEl = parentEl.querySelector('.col-count-val');
  const categoriesBar = parentEl.querySelector('.template-categories-bar');
  const templatesGrid = parentEl.querySelector('.templates-grid-container');

  const btnSaveTemplate = parentEl.querySelector('.btn-save-template');
  const saveModal = parentEl.querySelector('.save-template-modal');
  const btnCloseSaveModal = parentEl.querySelector('.btn-close-save-modal');
  const btnCancelSave = parentEl.querySelector('.btn-cancel-save');
  const btnConfirmSave = parentEl.querySelector('.btn-confirm-save');
  const inputTemplateName = parentEl.querySelector('.input-template-name');
  const inputTemplateCategory = parentEl.querySelector('.input-template-category');
  const saveCodePreview = parentEl.querySelector('.save-code-preview');

  const renderBrowser = () => {
    const allTemplates = GetAllTableTemplates();
    const query = (searchInput?.value || '').toLowerCase().trim();

    const counts = { 'ALL': allTemplates.length };
    allTemplates.forEach(t => {
      const cat = t.category || (t.isBuiltin ? 'General' : 'Custom');
      counts[cat] = (counts[cat] || 0) + 1;
    });

    const categories = ['ALL', ...Object.keys(counts).filter(k => k !== 'ALL').sort()];

    if (categoriesBar) {
      categoriesBar.innerHTML = categories.map(cat => `
        <button type="button" class="template-cat-pill px-2.5 py-1 rounded-lg text-[11px] font-semibold transition-all border flex items-center gap-1.5 whitespace-nowrap cursor-pointer ${activeCategory === cat ? 'bg-[var(--accent,#8b6dff)] text-white border-[var(--accent,#8b6dff)]' : 'bg-[var(--card,#1c1f2e)] text-[var(--text-secondary)] border-[var(--border)] hover:text-white'}" data-cat="${cat}">
          <span>${cat}</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded-full ${activeCategory === cat ? 'bg-white/20 text-white' : 'bg-[var(--surface)] text-[var(--text-secondary)]'}">${counts[cat] || 0}</span>
        </button>
      `).join('');

      categoriesBar.querySelectorAll('.template-cat-pill').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          activeCategory = btn.dataset.cat;
          renderBrowser();
        });
      });
    }

    let filtered = allTemplates;
    if (activeCategory !== 'ALL') {
      filtered = filtered.filter(t => (t.category || (t.isBuiltin ? 'General' : 'Custom')) === activeCategory);
    }
    if (query) {
      filtered = filtered.filter(t =>
        (t.name || '').toLowerCase().includes(query) ||
        (t.category || '').toLowerCase().includes(query) ||
        (t.code || '').toLowerCase().includes(query) ||
        (t.description || '').toLowerCase().includes(query)
      );
    }

    if (colValEl) colValEl.textContent = templateCols;
    if (colDecBtn) colDecBtn.disabled = templateCols <= 1;
    if (colIncBtn) colIncBtn.disabled = templateCols >= 3;

    if (templatesGrid) {
      templatesGrid.style.gridTemplateColumns = templateCols === 1 ? '1fr' : `repeat(${templateCols}, minmax(0, 1fr))`;

      if (filtered.length === 0) {
        templatesGrid.innerHTML = '<div class="col-span-full py-8 text-center text-xs text-[var(--text-secondary)]">No matching templates found</div>';
        return;
      }

      templatesGrid.innerHTML = filtered.map(t => `
        <div class="template-tile p-2.5 rounded-lg border border-[var(--border)] bg-[var(--card,#1c1f2e)] hover:border-[var(--accent,#8b6dff)] transition-all flex flex-col justify-between gap-2" data-id="${t.id}">
          <div class="flex flex-col gap-1 min-w-0">
            <div class="flex items-center justify-between gap-1">
              <span class="text-xs font-bold text-[var(--text)] truncate" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</span>
              <span class="text-[9.5px] px-1.5 py-0.5 rounded border border-[var(--border)] bg-[var(--surface)] text-[var(--text-secondary)] whitespace-nowrap">${escapeHtml(t.category || (t.isBuiltin ? 'Built-in' : 'Custom'))}</span>
            </div>
            ${t.description ? `<span class="text-[10px] text-[var(--text-secondary)] line-clamp-1">${escapeHtml(t.description)}</span>` : ''}
          </div>

          <div class="flex items-center justify-between gap-1 pt-1.5 border-t border-[var(--border)]">
            <div class="flex items-center gap-1">
              <button type="button" class="btn-insert-tpl px-2 h-6 rounded text-[10.5px] font-semibold bg-[var(--accent,#8b6dff)] hover:opacity-90 text-white cursor-pointer" title="Insert snippet into editor">+ Insert</button>
              <button type="button" class="btn-replace-tpl px-1.5 h-6 rounded text-[10.5px] font-medium border border-[var(--border)] text-[var(--text-secondary)] hover:text-white hover:border-[var(--text-secondary)] cursor-pointer" title="Replace entire editor with this template">Replace</button>
            </div>
            ${!t.isBuiltin ? `<button type="button" class="btn-delete-tpl w-6 h-6 rounded text-xs text-[var(--text-secondary)] hover:text-red-400 hover:bg-red-950/20 flex items-center justify-center transition-colors cursor-pointer" title="Delete custom template">🗑</button>` : ''}
          </div>
        </div>
      `).join('');

      templatesGrid.querySelectorAll('.template-tile').forEach(tile => {
        const tplId = tile.dataset.id;
        const targetTpl = allTemplates.find(t => t.id === tplId);
        if (!targetTpl) return;

        tile.querySelector('.btn-insert-tpl')?.addEventListener('click', (e) => {
          e.stopPropagation();
          if (onInsert) onInsert(targetTpl.code, 'insert');
          browserWindow?.classList.add('hidden');
        });

        tile.querySelector('.btn-replace-tpl')?.addEventListener('click', (e) => {
          e.stopPropagation();
          if (onInsert) onInsert(targetTpl.code, 'replace');
          browserWindow?.classList.add('hidden');
        });

        tile.querySelector('.btn-delete-tpl')?.addEventListener('click', (e) => {
          e.stopPropagation();
          if (confirm(`Delete template "${targetTpl.name}"?`)) {
            DeleteCustomTableTemplate(targetTpl.id);
            renderBrowser();
          }
        });
      });
    }
  };

  // Toggle Browser
  btnTemplates?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!browserWindow) return;
    const isHidden = browserWindow.classList.contains('hidden');
    if (isHidden) {
      renderBrowser();
      browserWindow.classList.remove('hidden');
      searchInput?.focus();
    } else {
      browserWindow.classList.add('hidden');
    }
  });

  btnCloseTemplates?.addEventListener('click', (e) => {
    e.stopPropagation();
    browserWindow?.classList.add('hidden');
  });

  searchInput?.addEventListener('input', () => {
    renderBrowser();
  });

  colDecBtn?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (templateCols > 1) {
      templateCols--;
      renderBrowser();
    }
  });

  colIncBtn?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (templateCols < 3) {
      templateCols++;
      renderBrowser();
    }
  });

  // Save Modal
  btnSaveTemplate?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!saveModal) return;
    const currentCode = getCurrentCode();
    if (!currentCode || !currentCode.trim()) {
      alert('Please enter table code before saving a template.');
      return;
    }
    if (saveCodePreview) saveCodePreview.textContent = currentCode;
    if (inputTemplateName) inputTemplateName.value = '';
    saveModal.classList.remove('hidden');
    inputTemplateName?.focus();
  });

  const closeSaveModal = () => {
    saveModal?.classList.add('hidden');
  };

  btnCloseSaveModal?.addEventListener('click', (e) => {
    e.stopPropagation();
    closeSaveModal();
  });

  btnCancelSave?.addEventListener('click', (e) => {
    e.stopPropagation();
    closeSaveModal();
  });

  btnConfirmSave?.addEventListener('click', (e) => {
    e.stopPropagation();
    const name = inputTemplateName?.value?.trim();
    if (!name) {
      alert('Please enter a template name.');
      inputTemplateName?.focus();
      return;
    }
    const category = inputTemplateCategory?.value?.trim() || 'Custom';
    const code = getCurrentCode();

    SaveCustomTableTemplate({
      name,
      category,
      code,
      description: `User-saved custom table (${new Date().toLocaleDateString()})`
    });

    closeSaveModal();
    renderBrowser();
  });
}

  }

const TIKZ_TEMPLATES_STORAGE_KEY = 'localhub_tikz_templates';

/**
 * Retrieves all custom user templates from NotesState or LocalStorage
 */
function GetCustomTikzTemplates() {
  // 1. Check NotesState
  if (NotesState && Array.isArray(NotesState.tikzTemplates) && NotesState.tikzTemplates.length > 0) {
    return NotesState.tikzTemplates;
  }

  // 2. Fallback to LocalStorage
  try {
    const raw = localStorage.getItem(TIKZ_TEMPLATES_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) {
        if (NotesState) NotesState.tikzTemplates = parsed;
        return parsed;
      }
    }
  } catch (err) {
    console.warn('Failed to parse custom TikZ templates from localStorage:', err);
  }

  return [];
}

/**
 * Returns all templates (Built-in + Custom)
 */
function GetAllTikzTemplates() {
  const custom = GetCustomTikzTemplates();
  const map = new Map();
  BUILTIN_TIKZ_TEMPLATES.forEach(t => map.set(t.id, t));
  custom.forEach(t => map.set(t.id, t));
  return Array.from(map.values());
}

/**
 * Saves a new custom TikZ template into NotesState and LocalStorage
 */
function SaveCustomTikzTemplate({ name, category, code, description = '' }) {
  const trimmedName = (name || 'Untitled Template').trim();
  const trimmedCat = (category || 'Custom').trim();
  const trimmedCode = (code || '').trim();

  if (!trimmedCode) return null;

  const newTemplate = {
    id: `tpl_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
    name: trimmedName,
    category: trimmedCat,
    description: description.trim(),
    code: trimmedCode,
    isBuiltin: false,
    createdAt: new Date().toISOString()
  };

  const custom = GetCustomTikzTemplates();
  custom.unshift(newTemplate);

  // Sync to NotesState
  if (NotesState) {
    NotesState.tikzTemplates = custom;
    try {
      SaveNotesState();
    } catch (e) {}
  }

  // Sync to LocalStorage
  try {
    localStorage.setItem(TIKZ_TEMPLATES_STORAGE_KEY, JSON.stringify(custom));
  } catch (err) {
    console.warn('Failed to save TikZ template to localStorage:', err);
  }

  return newTemplate;
}

/**
 * Deletes a custom template by ID
 */
function DeleteCustomTikzTemplate(templateId) {
  const custom = GetCustomTikzTemplates().filter(t => t.id !== templateId);

  if (NotesState) {
    NotesState.tikzTemplates = custom;
    try {
      SaveNotesState();
    } catch (e) {}
  }

  try {
    localStorage.setItem(TIKZ_TEMPLATES_STORAGE_KEY, JSON.stringify(custom));
  } catch (err) {
    console.warn('Failed to remove TikZ template from localStorage:', err);
  }

  return custom;
}

      categoriesBar.querySelectorAll('.template-cat-pill').forEach(btn => {

        });

    if (activeCategory !== 'ALL') {

    }
    if (query) {
      filtered = filtered.filter(t =>
        (t.name || '').toLowerCase().includes(query) ||

            <div class="flex items-center gap-1">

              <button type="button" class="btn-replace-tpl px-1.5 h-6 rounded text-[10.5px] font-medium border border-[var(--border)] text-[var(--text-secondary)] hover:text-white hover:border-[var(--text-secondary)] cursor-pointer" title="Replace entire editor with this template">Replace</button>

        if (!targetTpl) return;

        tile.querySelector('.btn-insert-tpl')?.addEventListener('click', (e) => {
          e.stopPropagation();
          browserWindow.classList.add('hidden');
          if (onInsert) onInsert(targetTpl.code, 'insert');
        });

        tile.querySelector('.btn-replace-tpl')?.addEventListener('click', (e) => {
          e.stopPropagation();
          browserWindow.classList.add('hidden');
          if (onInsert) onInsert(targetTpl.code, 'replace');

          }
        });
      });
    }
  };

  // Toggle Template Browser
  btnTemplates?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!browserWindow) return;
    browserWindow.classList.toggle('hidden');
    if (!browserWindow.classList.contains('hidden')) {
      renderBrowser();
      searchInput?.focus();
    }
  });

  btnCloseTemplates?.addEventListener('click', (e) => {
    e.stopPropagation();
    browserWindow?.classList.add('hidden');
  });

  searchInput?.addEventListener('input', () => {
    renderBrowser();
  });

  colDecBtn?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (templateCols > 1) {
      templateCols--;
      renderBrowser();
    }
  });

  colIncBtn?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (templateCols < 3) {
      templateCols++;
      renderBrowser();
    }
  });

  // Save Template Modal Handlers
  btnSaveTemplate?.addEventListener('click', (e) => {
    e.stopPropagation();
    const currentCode = getCurrentCode().trim();
    if (!currentCode) {
      alert('Please enter some TikZ code first before saving as a template.');
      return;
    }
    if (inputTemplateName) inputTemplateName.value = '';
    if (saveCodePreview) saveCodePreview.textContent = currentCode;
    saveModal?.classList.remove('hidden');
    inputTemplateName?.focus();
  });

  const closeSaveModal = () => {
    saveModal?.classList.add('hidden');
  };

  btnCloseSaveModal?.addEventListener('click', closeSaveModal);
  btnCancelSave?.addEventListener('click', closeSaveModal);

  btnConfirmSave?.addEventListener('click', (e) => {
    e.stopPropagation();
    const name = inputTemplateName?.value.trim() || 'Custom TikZ Diagram';
    const cat = inputTemplateCategory?.value.trim() || 'Custom';
    const code = getCurrentCode().trim();

    SaveCustomTikzTemplate({ name, category: cat, code });
    closeSaveModal();

    if (browserWindow && !browserWindow.classList.contains('hidden')) {
      renderBrowser();
    }
  });

  // Dismiss dropdowns when clicking outside
  const onDocClick = (e) => {
    if (browserWindow && !browserWindow.contains(e.target) && btnTemplates && !btnTemplates.contains(e.target)) {
      browserWindow.classList.add('hidden');
    }
  };
  document.addEventListener('click', onDocClick);

  return {
    cleanup: () => {
      document.removeEventListener('click', onDocClick);
    }
  };
}

      }
      const curLvl = levelSelect.value;
      note.autoNumbering[curLvl] = autoNumStyleSelect.value;
      if (onConfigUpdate) onConfigUpdate();
    }

  // Action Button Listeners

  if (!isViewMode && onExpand) {
    span.addEventListener('click', (e) => {
      e.stopPropagation();
      onExpand(span);

  const triggerUpdate = () => {

    rawContent = currentMarkdown;

      onUpdate({
        content: currentMarkdown,
        bulletStyle: block.bulletStyle,
        lineSpacing: block.lineSpacing || 'normal'

  let currentExpandedNode = null;

  const expandWidget = (widget, { atEnd = false, atStart = false } = {}) => {
    const raw = widget.getAttribute('data-raw');
    if (!raw) return;

    collapseExpandedNode();

    const textNode = document.createTextNode(raw);
    const parent = widget.parentNode;
    if (!parent) return;

    parent.replaceChild(textNode, widget);
    currentExpandedNode = textNode;

    liveSurface.focus();
    const sel = window.getSelection();
    if (sel) {
      const range = document.createRange();
      let pos = atEnd ? raw.length : (atStart ? (raw.startsWith('$') ? 1 : 0) : (raw.length > 1 ? raw.length - 1 : raw.length));
      pos = Math.max(0, Math.min(pos, raw.length));
      range.setStart(textNode, pos);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    if (widget.getAttribute('data-type') === 'math') {
      updateKatexPill();
    }
  };

  const collapseExpandedNode = () => {
    if (!currentExpandedNode || !currentExpandedNode.parentNode) {
      currentExpandedNode = null;
      hideKatexPill();
      return;
    }

    const text = currentExpandedNode.nodeValue;
    if (!text) {
      currentExpandedNode = null;
      hideKatexPill();
      return;
    }

    const parent = currentExpandedNode.parentNode;
    const fragment = parseTextToFragment(text, editModeOptions);

    parent.replaceChild(fragment, currentExpandedNode);
    currentExpandedNode = null;
    hideKatexPill();
  };

    onCheckboxToggle: () => triggerUpdate(),

    onUpdate: () => triggerUpdate(),
    parseSubFragment: (subText) => parseTextToFragment(subText, editModeOptions)
  };

  const buildEditorDom = () => {
    liveSurface.innerHTML = '';
    const lines = (rawContent || '').split('\n');

    lines.forEach((l) => {
      liveSurface.appendChild(renderSingleLineToDom(l, editModeOptions));
    });

    if (liveSurface.childNodes.length === 0) {
      const emptyLine = document.createElement('div');
      emptyLine.className = 'live-line min-h-[1.5em] my-0.5';
      emptyLine.innerHTML = '<br>';
      liveSurface.appendChild(emptyLine);
    }
  };

  buildEditorDom();

  // Floating KaTeX Math Pill
  const updateKatexPill = () => {
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || !liveSurface.contains(sel.anchorNode)) {
      hideKatexPill();
      return;
    }

    const node = sel.anchorNode;
    const text = node.nodeType === Node.TEXT_NODE ? node.nodeValue : '';
    const offset = sel.anchorOffset;

    const lastDollar = text.lastIndexOf('$', offset > 0 ? offset - 1 : 0);
    if (lastDollar === -1) {
      hideKatexPill();
      return;
    }

    const nextDollar = text.indexOf('$', offset);
    if (nextDollar === -1) {
      hideKatexPill();
      return;
    }

    const mathFormula = text.substring(lastDollar + 1, nextDollar).trim();
    if (!mathFormula) {
      floatingPill.innerHTML = '<span class="text-xs text-[var(--text-dim)] italic font-mono">type math (e.g. \\alpha, \\frac{a}{b})...</span>';

  // Toolbar formatting helper
  function insertOrWrapMarkdown(before, after = '') {
    liveSurface.focus();
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;

    const range = sel.getRangeAt(0);
    const selectedText = range.toString();

    if (selectedText) {
      const replacement = before + selectedText + after;
      document.execCommand('insertText', false, replacement);
    } else {
      const node = sel.anchorNode;
      const offset = sel.anchorOffset;

      if (node && node.nodeType === Node.TEXT_NODE) {
        const text = node.nodeValue;
        const b = text.substring(0, offset);
        const a = text.substring(offset);
        node.nodeValue = b + before + after + a;

        const newR = document.createRange();
        newR.setStart(node, offset + before.length);
        newR.collapse(true);
        sel.removeAllRanges();
        sel.addRange(newR);
      } else {
        document.execCommand('insertText', false, before + after);
        if (before.length > 0) {
          for (let i = 0; i < after.length; i++) {
            sel.modify('move', 'backward', 'character');
          }
        }
      }
    }

    triggerUpdate();

    if (!sel || sel.rangeCount === 0) return;

    let curLine = getContainingLine(node, liveSurface) || liveSurface.firstElementChild;

    if (!curLine) {

    const existingBullet = curLine.querySelector('.live-bullet');

    if (existingCheckbox) existingCheckbox.remove();

    const isCheckbox = prefix === '- [ ] ';

    if (isCheckbox) {

      let icon = prefix.trim();

      itemsHtml += `
        <button type="button" class="spacing-preset-item w-full flex items-center justify-between px-2 py-1.5 rounded-md hover:bg-[var(--surface-hover)] text-left transition-colors cursor-pointer ${isSelected ? 'bg-purple-500/15 text-purple-400 font-bold' : 'text-[var(--text)]'}" data-spacing="${opt.id}">
          <div class="flex flex-col">
            <span class="text-xs ${isSelected ? 'text-purple-400 font-bold' : ''}">${opt.label}</span>
            <span class="text-[10px] text-[var(--text-dim)] font-normal">${opt.desc}</span>
          </div>
          ${isSelected ? '<span class="text-xs text-purple-400 font-bold">✓</span>' : ''}
        </button>
      `;
    });

    spacingMenu.innerHTML = itemsHtml;

    spacingMenu.querySelectorAll('.spacing-preset-item').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = btn.getAttribute('data-spacing');
        applyLineSpacing(key);
        closeSpacingMenu();
      });
    });
  };

  const toggleSpacingMenu = () => {
    if (!spacingMenu) return;
    if (spacingMenu.classList.contains('hidden')) {
      closeBulletMenu();
      renderSpacingMenu();
      spacingMenu.classList.remove('hidden');
    } else {
      spacingMenu.classList.add('hidden');
    }
  };

  const closeSpacingMenu = () => {
    spacingMenu?.classList.add('hidden');
  };

  btnOpenSpacingDropdown?.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleSpacingMenu();
  });

  btnToggleSpacing?.addEventListener('click', (e) => {
    e.stopPropagation();
    const order = ['compact', 'normal', 'spacious'];
    const nextIdx = (order.indexOf(currentLineSpacing) + 1) % order.length;
    applyLineSpacing(order[nextIdx]);
  });

  const showFloatingDock = () => {
    if (!floatingDock.parentNode) {
      document.body.appendChild(floatingDock);
    }
  };

  const hideFloatingDock = () => {
    closeBulletMenu();
    closeSpacingMenu();
    if (floatingDock.parentNode) {
      floatingDock.remove();
    }
  };

  const cleanupFloatingDock = () => {
    document.removeEventListener('click', onDocClick);
    hideFloatingDock();
  };

  floatingDock.__cleanup = cleanupFloatingDock;

  // Re-show floating dock if user clicks back into this block
  container.addEventListener('click', () => {
    showFloatingDock();
  });

  // Click outside to dismiss menus and close floating dock when leaving text block
  const onDocClick = (e) => {
    // If the click is inside the dock or inside this block container, keep it open
    if (floatingDock.contains(e.target) || container.contains(e.target)) {
      return;
    }
    // If click is inside a modal/dialog (e.g. custom bullet modal, macros modal), keep it open
    if (e.target.closest('#notes-custom-bullet-modal, #notes-macros-modal, #sidebar-logo-modal')) {
      return;
    }
    // Leaving text block: hide floating dock
    hideFloatingDock();
  };

  // Attach onDocClick asynchronously so the event that selected this block does not immediately dismiss it
  setTimeout(() => {
    document.addEventListener('click', onDocClick);
  }, 100);

  // Auto-focus live surface when entering edit mode
  setTimeout(() => {
    if (document.body.contains(liveSurface)) {
      liveSurface.focus();
    }
  }, 50);

  container.__blockCleanup = () => {
    cleanupFloatingDock();
  };

  // Block Actions (Done, Up, Down, + Below, Delete)
  initBlockActions(editWrap, {
    onDone: () => {
      cleanupFloatingDock();
      collapseExpandedNode();
      triggerUpdate();
      if (onDone) onDone();
    },
    onMoveUp: () => {
      cleanupFloatingDock();
      if (onMoveUp) onMoveUp();
    },
    onMoveDown: () => {
      cleanupFloatingDock();
      if (onMoveDown) onMoveDown();
    },
    onAddBelow: onInsertBelow ? () => {
      cleanupFloatingDock();
      onInsertBelow(index);
    } : null,
    onDelete: () => {
      cleanupFloatingDock();
      if (onDelete) onDelete();
    }
  });

  container.appendChild(editWrap);
  return container;
}

  const colorMount = editWrap.querySelector('.eq-color-mount');
  if (colorMount) {
    const colorWidget = CreateColorSelector({

    const val = textarea.value;

    if (onUpdate) {
      onUpdate({ tex: val, content: val });
    }
  });

  // 3. Bidirectional Double-Click Highlight Synchronization
  attachHighlightSync(preview, textarea);

  // 4. Action Button Listeners
  initBlockActions(editWrap, { onDone, onMoveUp, onMoveDown, onDelete, index });

  container.appendChild(editWrap);
  return container;

      const end = textarea.selectionEnd;

      if (start !== undefined && end !== undefined && start !== current.length) {
        textarea.value = current.substring(0, start) + '\n' + trimmedTpl + '\n' + current.substring(end);
      } else {
        const hasExistingTikz = current.includes('\\begin{tikzpicture}');

  compile(false);

/**
 * Downsamples and compresses raster images (PNG/JPG) using an off-screen canvas.
 * Preserves vector SVGs as clean data URIs without quality loss.
 */
async function processAndCompressImage(fileOrDataUrl) {
  if (!fileOrDataUrl) return '';

  // 1. File or Blob object
  if (fileOrDataUrl instanceof File || fileOrDataUrl instanceof Blob) {
    const isSvg = fileOrDataUrl.type === 'image/svg+xml' || (fileOrDataUrl.name && fileOrDataUrl.name.toLowerCase().endsWith('.svg'));
    if (isSvg) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const text = (e.target?.result || '').trim();
          if (text.startsWith('<svg')) {
            resolve(`data:image/svg+xml;utf8,${encodeURIComponent(text)}`);
          } else {
            resolve(text);
          }
        };
        reader.readAsText(fileOrDataUrl);
      });
    }

    // Raster file -> read as dataURL then compress
    const rawDataUrl = await new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target?.result || '');
      reader.readAsDataURL(fileOrDataUrl);
    });
    return compressRasterDataUrl(rawDataUrl);
  }

  // 2. String input (SVG code, Base64, Data URL, Web URL)
  const str = String(fileOrDataUrl).trim();
  if (str.startsWith('<svg')) {
    return `data:image/svg+xml;utf8,${encodeURIComponent(str)}`;
  }
  if (str.startsWith('data:image/svg+xml')) {
    return str;
  }
  if (str.startsWith('data:image/')) {
    return compressRasterDataUrl(str);
  }
  // Raw base64 string without data: prefix
  if (/^[A-Za-z0-9+/=\s]{80,}$/.test(str)) {
    const cleanB64 = str.replace(/\s+/g, '');
    return compressRasterDataUrl(`data:image/png;base64,${cleanB64}`);
  }

  // Regular web URL fallback
  return str;
}

function compressRasterDataUrl(dataUrl, maxDim = 1600, quality = 0.85) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width <= maxDim && height <= maxDim && dataUrl.length < 320000) {
        resolve(dataUrl);
        return;
      }

      if (width > maxDim || height > maxDim) {
        if (width > height) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      const isPng = dataUrl.startsWith('data:image/png');
      const compressed = canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', quality);

      if (isPng && compressed.length > 450000) {
        const jpegCompressed = canvas.toDataURL('image/jpeg', quality);
        resolve(jpegCompressed.length < compressed.length ? jpegCompressed : compressed);
      } else {
        resolve(compressed);
      }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

// Re-export parseLatexTabular for backwards compatibility

 * Compiles raw table input (LaTeX Tabular or Markdown) into HTML markup
 */

  const trimmed = (rawTable || '').trim();
  if (!trimmed) {
    return '<div class="italic text-[var(--text-dim)] text-xs select-none py-2 text-center">Empty table block. Click to edit or insert a template...</div>';
  }

  // 1. Try LaTeX Tabular / Table parser
  const latexHtml = parseLatexTabular(trimmed);
  if (latexHtml) return latexHtml;

  // 2. Try Markdown table fallback
  if (trimmed.includes('|') && trimmed.includes('\n')) {
    const mdHtml = parseMarkdownTable(trimmed);
    if (mdHtml) return mdHtml;
  }

  // 3. Fallback preview
  return `
    <div class="p-3 rounded-lg border border-dashed border-[var(--border)] bg-[var(--surface)] text-xs text-[var(--text-secondary)] font-mono whitespace-pre-wrap">
      ${escapeHtml(trimmed)}
    </div>
  `;
}

Gauss's Law & Electric Flux & $\nabla \cdot \mathbf{E} = \frac{\rho}{\varepsilon_0}$ \\
Faraday's Law & Induction & $\nabla \times \mathbf{E} = -\frac{\partial \mathbf{B}}{\partial t}$ \\
Ampere-Maxwell & Magnetism & $\nabla \times \mathbf{B} = \mu_0 \mathbf{J} + \mu_0 \varepsilon_0 \frac{\partial \mathbf{E}}{\partial t}$ \\
\bottomrule
\end{tabular}`;

  const rawTable = (block.content !== undefined && block.content !== null) ? block.content : (block.table || defaultLatex);
  const hasBorder = block.hasBorder !== false; // Default: true

  // =========================================================================
  // 1. VIEW MODE
  // =========================================================================
  if (!isEditing) {
    const wrap = document.createElement('div');
    const borderClasses = hasBorder
      ? 'border border-[var(--border)] bg-[var(--surface)] shadow-xs'
      : 'border border-transparent bg-transparent';
    wrap.className = `my-1.5 p-2.5 rounded-xl overflow-x-auto select-text transition-all ${borderClasses}`;
    wrap.style.scrollbarWidth = 'thin';
    wrap.innerHTML = renderTableHtml(rawTable);
    container.appendChild(wrap);
    return container;
  }

  // =========================================================================
  // 2. EDIT MODE
  // =========================================================================
  let currentBorderState = hasBorder;

  const editWrap = document.createElement('div');
  editWrap.className = 'flex flex-col gap-2 my-0.5 w-full relative';

  editWrap.innerHTML = `
    <!-- Top Row: Title, Border, Templates | Actions -->
    <div class="flex items-center justify-between gap-1.5 w-full pb-1.5 border-b border-[var(--border)] select-none flex-wrap">
      <!-- Top Left: Title, Border, Templates -->
      <div class="flex items-center gap-1.5 flex-wrap min-w-0">
        <span class="text-xs font-bold text-[var(--text)] px-1">Table</span>

        <!-- Border Toggle Button -->
        <button type="button" class="btn-border-toggle h-7 px-2.5 py-0 text-xs font-semibold rounded-md border flex items-center justify-center gap-1.5 transition-all flex-shrink-0 cursor-pointer ${currentBorderState ? 'border-purple-500 bg-purple-500/15 text-purple-400 shadow-xs' : 'border-[var(--border)] bg-[var(--surface)] text-[var(--text-dim)] opacity-70'}" title="Surrounding Border: ${currentBorderState ? 'ON' : 'OFF'}">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
            <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
          </svg>
          <span>Border</span>
        </button>

        <!-- Templates Dropdown Toggle -->
        <button type="button" class="btn-templates-toggle notes-ghost-btn h-7 px-2.5 py-0 text-[11px] font-medium flex items-center gap-1.5 cursor-pointer" title="Browse and insert Table templates">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          <span>Templates</span>
          <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>

        <!-- Save Template Button -->
        <button type="button" class="btn-save-template notes-ghost-btn h-7 px-2 py-0 text-[11px] font-medium flex items-center gap-1 cursor-pointer" title="Save current editor code as a template">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
          <span class="hidden sm:inline">Save Template</span>
        </button>
      </div>

      <!-- Top Right: Actions -->
      ${getBlockActionsHTML({ index, totalBlocks })}
    </div>

    <!-- Template Browser & Save Modals Mount -->
    ${GetTableTemplatesModalHTML()}

    <!-- Middle: Live Table Preview -->
    <div class="preview-pane w-full p-2.5 rounded-xl overflow-x-auto min-h-[60px] transition-all ${currentBorderState ? 'border border-[var(--border)] bg-[var(--surface)] shadow-xs' : 'border border-transparent bg-transparent'}" style="scrollbar-width: thin;">
      ${renderTableHtml(rawTable)}
    </div>

    <!-- Bottom: Resizable Smooth Textarea Mount -->
    <div class="table-textarea-mount w-full"></div>
  `;

  const preview = editWrap.querySelector('.preview-pane');
  const textareaMount = editWrap.querySelector('.table-textarea-mount');

  // Border Toggle Logic
  const borderToggleBtn = editWrap.querySelector('.btn-border-toggle');
  borderToggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    currentBorderState = !currentBorderState;
    block.hasBorder = currentBorderState;

    if (currentBorderState) {
      borderToggleBtn.className = 'btn-border-toggle h-7 px-2.5 py-0 text-xs font-semibold rounded-md border flex items-center justify-center gap-1.5 transition-all flex-shrink-0 cursor-pointer border-purple-500 bg-purple-500/15 text-purple-400 shadow-xs';
      preview.className = 'preview-pane w-full p-2.5 rounded-xl overflow-x-auto min-h-[60px] transition-all border border-[var(--border)] bg-[var(--surface)] shadow-xs';
    } else {
      borderToggleBtn.className = 'btn-border-toggle h-7 px-2.5 py-0 text-xs font-semibold rounded-md border flex items-center justify-center gap-1.5 transition-all flex-shrink-0 cursor-pointer border-[var(--border)] bg-[var(--surface)] text-[var(--text-dim)] opacity-70';
      preview.className = 'preview-pane w-full p-2.5 rounded-xl overflow-x-auto min-h-[60px] transition-all border border-transparent bg-transparent';
    }

    borderToggleBtn.title = `Surrounding Border: ${currentBorderState ? 'ON' : 'OFF'}`;
    if (onUpdate) {
      onUpdate({ hasBorder: currentBorderState });
    }
  });

  // Create Smooth Resizable Textarea
  const textarea = createBlockTextarea({
    value: rawTable,
    placeholder: 'Enter LaTeX tabular code (\\begin{tabular}...\\end{tabular}) or Markdown table...',
    minHeight: '110px',
    height: '140px',
    className: 'font-mono text-xs leading-relaxed',
    onInput: (val) => {
      preview.innerHTML = renderTableHtml(val);
      if (onUpdate) {
        onUpdate({ content: val, table: val, hasBorder: currentBorderState });
      }
    }
  });
  textareaMount.appendChild(textarea);

  // Synchronize Token/Cell Double-Click Highlight
  attachHighlightSync(preview, textarea);

  // Initialize Template Browser & Modal Logic
  InitTableTemplatesLogic(editWrap, {
    getCurrentCode: () => textarea.value,
    onInsert: (tplCode, mode) => {
      const current = textarea.value;
      const trimmedTpl = (tplCode || '').trim();

      if (mode === 'replace' || !current.trim()) {
        textarea.value = trimmedTpl;
      } else {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        if (start !== undefined && end !== undefined && start !== current.length) {
          textarea.value = current.substring(0, start) + '\n' + trimmedTpl + '\n' + current.substring(end);
        } else {
          textarea.value = current + '\n\n' + trimmedTpl;
        }
      }

      preview.innerHTML = renderTableHtml(textarea.value);
      if (onUpdate) {
        onUpdate({ content: textarea.value, table: textarea.value });
      }
      textarea.focus();
    }
  });

  // Top Action Buttons
  initBlockActions(editWrap, {
    onDone,
    onMoveUp,
    onMoveDown,
    onDelete,
    index
  });

  container.appendChild(editWrap);
  return container;
}


/* --- 03_Notes/B_Editor_View/01_Blocks/Code_Block.js --- */
/**
 * 03_Notes/B_Editor_View/01_Blocks/Code_Block.js
 * Streamlined Theme-Dynamic Code Block (Option A - In-Place Toggle)
 * - Dark header bar in both light and dark themes
 * - Left: Editable title (defaults to "Code")
 * - Right: Action buttons (↑, ↓, ✕, Copy) in Edit Mode; only Copy in Reading Mode
 * - Body: Theme-dynamic (light in light mode, dark in dark mode)
 * - Single Area: Preserves pasted code exactly as pasted; click to edit, blur to highlight
 */


// Inject code card styling once
if (typeof document !== 'undefined' && !document.getElementById('notes-code-block-styles')) {
  const style = document.createElement('style');
  style.id = 'notes-code-block-styles';
  style.textContent = `
    .notes-code-card {
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      background-color: var(--surface);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;

    .notes-code-header {

      background-color: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.18s ease;
    }
    .code-header-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    [data-theme="light"] .code-header-btn {
      background-color: rgba(0, 0, 0, 0.05);
      color: #475569;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    [data-theme="light"] .code-header-btn:hover {
      background-color: rgba(0, 0, 0, 0.12);
      color: #0f172a;
    }
    .code-header-del-btn:hover {
      background-color: #ef4444 !important;
      color: #ffffff !important;
      border-color: #ef4444 !important;
    }
    .code-title-input {
      color: #e2e8f0;
    }
    [data-theme="light"] .code-title-input {
      color: #1e293b;
    }
    .code-title-input:focus {
      color: #ffffff;
    }
    [data-theme="light"] .code-title-input:focus {
      color: #0f172a;
    }
    .code-title-static {
      color: #e2e8f0;
    }
    [data-theme="light"] .code-title-static {
      color: #1e293b;
    }
    .notes-code-body {
      background-color: #12141e;
      color: #abb2bf;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    [data-theme="light"] .notes-code-body {
      background-color: #f8fafc;
      color: #1e293b;
    }
    .notes-code-body pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12.5px;
      line-height: 1.6;
      tab-size: 2;
      margin: 0;
      padding: 12px 14px;
      white-space: pre;
      word-break: normal;
      overflow-x: auto;
    }
    .notes-code-textarea {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: inherit;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12.5px;
      line-height: 1.6;
      tab-size: 2;
      padding: 12px 14px;
      margin: 0;
      box-sizing: border-box;
      resize: none;
      display: block;
      overflow-y: hidden;
      white-space: pre;
    }
  `;
  document.head.appendChild(style);
}
function renderCodeBlock(
  block,
  isEditing = false,
  onUpdate = null,
  {
    isEditMode = true,
    onDone = null,
    onMoveUp = null,
    onMoveDown = null,
    onDelete = null,
    index = 0,
    totalBlocks = 1
  } = {}
) {
  ensureHighlightJsLoaded();

  const container = document.createElement('div');
  container.className = 'w-full my-1.5';

  const card = document.createElement('div');
  card.className = 'notes-code-card w-full shadow-xs';

  let currentCode = block.code || block.content || '';
  let currentTitle = (block.title !== undefined && block.title !== null && block.title !== '') ? block.title : 'Code';
  const language = block.language || 'javascript';

  // -------------------------------------------------------------
  // 1. Header: Dark Color Bar (Title on Left, Actions on Right)
  // -------------------------------------------------------------
  const header = document.createElement('div');
  header.className = 'notes-code-header flex items-center justify-between px-3 py-1.5 gap-2 select-none';

  // Left: Title
  const titleContainer = document.createElement('div');
  titleContainer.className = 'flex items-center gap-1.5 flex-1 min-w-0';

  let titleInput = null;
  if (isEditMode) {
    titleInput = document.createElement('input');
    titleInput.type = 'text';
    titleInput.className = 'code-title-input bg-transparent text-xs font-semibold outline-none border border-transparent focus:border-purple-400/50 rounded px-1.5 py-0.5 flex-1 max-w-[280px] transition-all';
    titleInput.value = currentTitle;
    titleInput.placeholder = 'Code';
    titleInput.spellcheck = false;
    titleInput.autocomplete = 'off';

    titleInput.addEventListener('click', (e) => e.stopPropagation());
    titleInput.addEventListener('input', () => {
      currentTitle = titleInput.value;
      block.title = currentTitle;
      if (onUpdate) {
        onUpdate({ title: currentTitle, code: currentCode, content: currentCode, language });
      }
    });
    titleContainer.appendChild(titleInput);
  } else {
    const titleSpan = document.createElement('span');
    titleSpan.className = 'code-title-static text-xs font-semibold select-text px-1 py-0.5 tracking-wide';
    titleSpan.textContent = currentTitle || 'Code';
    titleContainer.appendChild(titleSpan);
  }
  header.appendChild(titleContainer);

  // Right: Action Buttons
  const actionsContainer = document.createElement('div');
  actionsContainer.className = 'flex items-center gap-1 flex-shrink-0';

  if (isEditMode) {
    // Up Button
    if (index > 0) {
      const upBtn = document.createElement('button');
      upBtn.type = 'button';
      upBtn.className = 'code-header-btn w-6 h-6 rounded flex items-center justify-center text-xs cursor-pointer up-btn shadow-2xs';
      upBtn.title = 'Move up';
      upBtn.textContent = '↑';
      upBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (onMoveUp) onMoveUp();
      });
      actionsContainer.appendChild(upBtn);
    }

    // Down Button
    if (index < totalBlocks - 1) {
      const downBtn = document.createElement('button');
      downBtn.type = 'button';
      downBtn.className = 'code-header-btn w-6 h-6 rounded flex items-center justify-center text-xs cursor-pointer down-btn shadow-2xs';
      downBtn.title = 'Move down';
      downBtn.textContent = '↓';
      downBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (onMoveDown) onMoveDown();
      });
      actionsContainer.appendChild(downBtn);
    }

    // Delete Button
    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'code-header-btn code-header-del-btn w-6 h-6 rounded flex items-center justify-center text-xs cursor-pointer del-btn shadow-2xs';
    delBtn.title = 'Delete code block';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (onDelete) onDelete();
    });
    actionsContainer.appendChild(delBtn);
  }

  // Copy Button (Always visible in both Edit Mode & Reading Mode)
  const copyBtn = document.createElement('button');
  copyBtn.type = 'button';
  copyBtn.className = 'code-header-btn copy-btn h-6 px-2 rounded flex items-center justify-center gap-1 text-[11px] font-medium cursor-pointer shadow-2xs';
  copyBtn.title = 'Copy code';
  copyBtn.innerHTML = `
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    <span>Copy</span>
  `;

  copyBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const textToCopy = currentCode;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textToCopy);
    }
    copyBtn.innerHTML = '<span class="text-emerald-400 font-bold">✓ Copied</span>';
    setTimeout(() => {
      copyBtn.innerHTML = `
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>Copy</span>
      `;
    }, 1500);
  });
  actionsContainer.appendChild(copyBtn);

  header.appendChild(actionsContainer);
  card.appendChild(header);

  // -------------------------------------------------------------
  // 2. Body: Single Unified Code Area (In-Place Toggle - Option A)
  // -------------------------------------------------------------
  const body = document.createElement('div');
  body.className = 'notes-code-body w-full';

  let isInlineEditing = isEditMode && (!currentCode || currentCode.trim() === '');

  function renderBody() {
    body.innerHTML = '';

    if (!isEditMode || !isInlineEditing) {
      // Highlighted View Mode
      if (!currentCode || currentCode.trim() === '') {
        const emptyNotice = document.createElement('div');
        emptyNotice.className = `p-3.5 text-xs italic text-[var(--text-dim)] select-none ${isEditMode ? 'cursor-pointer hover:text-[var(--text)]' : ''}`;
        emptyNotice.textContent = isEditMode ? '+ Click to paste or write code...' : 'Empty code block';
        if (isEditMode) {
          emptyNotice.addEventListener('click', (e) => {
            e.stopPropagation();
            isInlineEditing = true;
            renderBody();
          });
        }
        body.appendChild(emptyNotice);
      } else {
        const pre = document.createElement('pre');
        pre.className = `select-text ${isEditMode ? 'cursor-pointer' : ''}`;
        if (isEditMode) {
          pre.title = 'Click to edit code';
        }
        const codeEl = document.createElement('code');
        codeEl.className = `hljs language-${language}`;
        codeEl.innerHTML = highlightCode(currentCode, language);
        pre.appendChild(codeEl);

        if (isEditMode) {
          pre.addEventListener('click', (e) => {
            // Allow user to select text if they dragged; toggle on clean click
            if (window.getSelection && window.getSelection().toString().length > 0) return;
            e.stopPropagation();
            isInlineEditing = true;
            renderBody();
          });
        }
        body.appendChild(pre);
      }
    } else {
      // In-Place Monospace Textarea Editor
      const textarea = document.createElement('textarea');
      textarea.className = 'notes-code-textarea';
      textarea.value = currentCode;
      textarea.placeholder = 'Paste or write code here...';
      textarea.spellcheck = false;
      textarea.autocapitalize = 'off';
      textarea.autocomplete = 'off';
      textarea.autocorrect = 'off';

      const autoResize = () => {
        textarea.style.height = 'auto';
        textarea.style.height = Math.max(70, textarea.scrollHeight) + 'px';
      };

      textarea.addEventListener('input', () => {
        currentCode = textarea.value;
        block.code = currentCode;
        block.content = currentCode;
        autoResize();
        if (onUpdate) {
          onUpdate({ code: currentCode, content: currentCode, title: currentTitle, language });
        }
      });

      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
          textarea.selectionStart = textarea.selectionEnd = start + 2;
          currentCode = textarea.value;
          block.code = currentCode;
          block.content = currentCode;
          autoResize();
          if (onUpdate) {
            onUpdate({ code: currentCode, content: currentCode, title: currentTitle, language });
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          isInlineEditing = false;
          renderBody();
        }
      });

      textarea.addEventListener('click', (e) => e.stopPropagation());

      textarea.addEventListener('blur', () => {
        currentCode = textarea.value;
        block.code = currentCode;
        block.content = currentCode;
        if (onUpdate) {
          onUpdate({ code: currentCode, content: currentCode, title: currentTitle, language });
        }
        if (currentCode && currentCode.trim() !== '') {
          isInlineEditing = false;
          renderBody();
        }
      });

      body.appendChild(textarea);
      setTimeout(() => {
        autoResize();
        textarea.focus();
      }, 0);
    }
  }

  renderBody();
  card.appendChild(body);
  container.appendChild(card);
  return container;
}

/**
 * 03_Notes/05_Blocks/Block_Block.js
 * Callout & Semantic Block component (Theorem, Definition, Proof, Lemma, Corollary, Example, Remark, Note, Warning, Info).
 * Renamed from Theorem to Block.

const BLOCK_THEME_STYLES = {
  Theorem: { border: 'border-purple-500/60', bg: 'bg-purple-500/5', title: 'text-purple-400', badge: 'bg-purple-500/20 text-purple-300' },
  Definition: { border: 'border-blue-500/60', bg: 'bg-blue-500/5', title: 'text-blue-400', badge: 'bg-blue-500/20 text-blue-300' },
  Proof: { border: 'border-gray-500/50', bg: 'bg-gray-500/5', title: 'text-[var(--text-secondary)]', badge: 'bg-gray-500/20 text-gray-300' },
  Lemma: { border: 'border-indigo-500/60', bg: 'bg-indigo-500/5', title: 'text-indigo-400', badge: 'bg-indigo-500/20 text-indigo-300' },
  Corollary: { border: 'border-pink-500/60', bg: 'bg-pink-500/5', title: 'text-pink-400', badge: 'bg-pink-500/20 text-pink-300' },
  Proposition: { border: 'border-cyan-500/60', bg: 'bg-cyan-500/5', title: 'text-cyan-400', badge: 'bg-cyan-500/20 text-cyan-300' },
  Example: { border: 'border-emerald-500/60', bg: 'bg-emerald-500/5', title: 'text-emerald-400', badge: 'bg-emerald-500/20 text-emerald-300' },
  Remark: { border: 'border-amber-500/60', bg: 'bg-amber-500/5', title: 'text-amber-400', badge: 'bg-amber-500/20 text-amber-300' },

  Warning: { border: 'border-rose-500/60', bg: 'bg-rose-500/5', title: 'text-rose-400', badge: 'bg-rose-500/20 text-rose-300' },
  Info: { border: 'border-teal-500/60', bg: 'bg-teal-500/5', title: 'text-teal-400', badge: 'bg-teal-500/20 text-teal-300' }
};
function renderBlockBlock(block, isEditing = false, onUpdate = null, allNotes = [], { onDone = null, onMoveUp = null, onMoveDown = null, onDelete = null, index = 0, totalBlocks = 1 } = {}) {
  const container = document.createElement('div');
  container.className = 'w-full my-1.5';
  
  const env = block.env || block.blockType || 'Theorem';
  const title = block.title || '';
  const content = block.content || '';
  const style = BLOCK_THEME_STYLES[env] || BLOCK_THEME_STYLES.Theorem;

  const renderContentHtml = (raw) => {
    if (!raw || !raw.trim()) return '<div class="italic text-[var(--text-dim)] text-xs">Empty block content.</div>';
    let html = formatRichTextWithMath(raw);
    return parseWikiLinks(html, allNotes);
  };

  // 1. View Mode
  if (!isEditing) {
    const wrap = document.createElement('div');
    wrap.className = `p-3.5 rounded-xl border ${style.border} ${style.bg} select-text shadow-xs`;
    wrap.innerHTML = `
      <div class="flex items-center gap-2 mb-1.5">
        <span class="px-2 py-0.5 rounded text-[10.5px] font-bold tracking-wide uppercase ${style.badge}">${escapeHtml(env)}</span>
        ${title ? `<span class="font-bold text-sm ${style.title}">${escapeHtml(title)}</span>` : ''}
      </div>
      <div class="text-sm leading-snug text-[var(--text)]">

  const envSelect = editWrap.querySelector('.env-select');

  const update = () => {
    const curEnv = envSelect.value;

    const curStyle = BLOCK_THEME_STYLES[curEnv] || BLOCK_THEME_STYLES.Theorem;

  };

  envSelect.addEventListener('change', update);

  attachHighlightSync(preview, textarea);

/* --- 03_Notes/B_Editor_View/01_Blocks/Block_Dispatcher.js --- */
/**
 * 03_Notes/B_Editor_View/01_Blocks/Block_Dispatcher.js
 * Centralized Block Dispatcher: Maps block type to its dedicated renderer.
 * Shared between Block_Item.js (main canvas) and Multi_Column_Block.js (column slots).
 */









/**
 * Dispatches and renders a single block into its corresponding DOM element.
 * 
 * @param {Object} block - Block data model
 * @param {boolean} isEditing - Whether block is in active edit mode
 * @param {Function} onUpdate - Callback when block content/fields change
 * @param {Array} allNotes - All notes in vault (for wikilinks and autocomplete)
 * @param {Object} options - Configuration and action handlers
 * @returns {HTMLElement} The rendered block element
 */
function renderBlockContent(block, isEditing = false, onUpdate = null, allNotes = [], options = {}) {
  if (!block || typeof block !== 'object') {
    block = { type: 'text', content: String(block || '') };
  }

  const type = block.type || 'text';

  switch (type) {
    case 'heading':
      return renderHeadingBlock(block, isEditing, onUpdate, options);

    case 'equation':
      return renderEquationBlock(block, isEditing, onUpdate, options);

    case 'tikz':
      return renderTikzBlock(block, isEditing, onUpdate, options);

    case 'image':
      return renderImageBlock(block, isEditing, onUpdate, options);

    case 'table':
    case 'tables':
      return renderTableBlock(block, isEditing, onUpdate, options);

    case 'code':
      return renderCodeBlock(block, isEditing, onUpdate, options);

    case 'block':
    case 'theorem':
      return renderBlockBlock(block, isEditing, onUpdate, allNotes, options);

    case 'columns':
    case 'multicolumn':
    case 'multi-column':
      return renderMultiColumnBlock(block, isEditing, onUpdate, allNotes, options);

    case 'text':
    default:
      return renderTextBlock(block, isEditing, onUpdate, allNotes, options);
  }
}


/* --- 03_Notes/B_Editor_View/01_Blocks/Multi_Column_Block.js --- */
/**
 * 03_Notes/B_Editor_View/01_Blocks/Multi_Column_Block.js
 * Complete Reconstructed Multi-Column Layout Block:
 * - Each column houses a full child block (Text, Equation, Table, Image, TikZ, Code, Callout).
 * - Edit Mode: Displays columns vertically stacked in full-width rows for comfortable, unconstrained editing.
 * - View Mode: Displays columns side-by-side in responsive CSS Grid with Container Queries.
 * - Responsive Breaking: Columns shrink smoothly and automatically break into 1-column vertical rows when width limit or mobile viewport is reached.
 * - Pre-Existing Block Integration: Seamlessly move existing note blocks into columns by clicking them on the page or browsing from a visual picker.
 * - Eject / Reverse Move: Eject child blocks back into the main note canvas anytime.
 */





// Inject multi-column responsive and container-query styles once
if (typeof document !== 'undefined' && !document.getElementById('notes-multicolumn-styles')) {
  const style = document.createElement('style');
  style.id = 'notes-multicolumn-styles';
  style.textContent = `
    .notes-multi-col-wrapper {
      container-type: inline-size;
      container-name: notesmulticol;
      width: 100%;
    }
    .notes-multi-col-grid {
      display: grid;
      gap: 0.875rem;
      width: 100%;
      align-items: stretch;
    }
    .notes-col-item {
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    /* Suppress child block's own Done/Up/Down/Del buttons when rendered inside column editor slots */
    .notes-col-slot .done-btn,
    .notes-col-slot .up-btn,
    .notes-col-slot .down-btn,
    .notes-col-slot .del-btn {
      display: none !important;
    }
    /* Responsive Breakpoints via Container Queries */
    @container notesmulticol (max-width: 560px) {
      .notes-multi-col-grid {
        grid-template-columns: 1fr !important;
      }
    }
    @container notesmulticol (max-width: 780px) {
      .notes-multi-col-grid[data-col-count="3"],
      .notes-multi-col-grid[data-col-count="4"],
      .notes-multi-col-grid[data-col-count="5"] {
        grid-template-columns: 1fr !important;
      }
    }
    @container notesmulticol (max-width: 980px) {
      .notes-multi-col-grid[data-col-count="4"],
      .notes-multi-col-grid[data-col-count="5"] {
        grid-template-columns: 1fr !important;
      }
    }
    @media (max-width: 640px) {
      .notes-multi-col-grid {
        grid-template-columns: 1fr !important;
      }
    }
  `;
  document.head.appendChild(style);
}

/**
 * Normalizes block.cols ensuring all items are valid block objects.
 * Backward compatible with legacy string columns.
 */
function normalizeColumnBlocks(block) {
  if (!Array.isArray(block.cols)) {
    block.cols = [block.left || '', block.right || ''];
  }

  block.cols = block.cols.map((col, idx) => {
    if (!col || typeof col === 'string') {
      return {
        id: `col_b_${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 6)}`,
        type: 'text',
        content: col || ''
      };
    }
    if (typeof col === 'object' && !col.id) {
      col.id = `col_b_${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 6)}`;
    }
    return col;
  });

  const layout = block.layout || '50-50';
  let minCount = 2;
  if (layout === '33-33-33' || layout === '50-25-25' || layout === '25-50-25' || layout === '25-25-50') {
    minCount = 3;
  } else if (layout === '25-25-25-25') {
    minCount = 4;
  }
  while (block.cols.length < minCount) {
    block.cols.push(createNewBlock('text', { content: '' }));
  }

  return block.cols;
}

/**
 * Returns grid-template-columns CSS value based on column count and split ratio.
 */
function getGridTemplate(layout, colCount) {
  if (colCount === 2) {
    if (layout === '60-40') return 'minmax(0, 3fr) minmax(0, 2fr)';
    if (layout === '40-60') return 'minmax(0, 2fr) minmax(0, 3fr)';
    if (layout === '70-30') return 'minmax(0, 7fr) minmax(0, 3fr)';
    if (layout === '30-70') return 'minmax(0, 3fr) minmax(0, 7fr)';
    return 'repeat(2, minmax(0, 1fr))'; // 50-50 default
  }
  if (colCount === 3) {
    if (layout === '50-25-25') return 'minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr)';
    if (layout === '25-50-25') return 'minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr)';
    if (layout === '25-25-50') return 'minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr)';
    return 'repeat(3, minmax(0, 1fr))'; // 33-33-33 default
  }
  return `repeat(${colCount}, minmax(0, 1fr))`;
}

/**
 * Returns layout ratio options for the select element based on column count.
 */
function getLayoutOptionsHtml(layout, colCount) {
  if (colCount === 2) {
    return `
      <option value="50-50" ${layout === '50-50' ? 'selected' : ''}>2-Cols (50 / 50)</option>
      <option value="60-40" ${layout === '60-40' ? 'selected' : ''}>2-Cols (60 / 40)</option>
      <option value="40-60" ${layout === '40-60' ? 'selected' : ''}>2-Cols (40 / 60)</option>
      <option value="70-30" ${layout === '70-30' ? 'selected' : ''}>2-Cols (70 / 30)</option>
      <option value="30-70" ${layout === '30-70' ? 'selected' : ''}>2-Cols (30 / 70)</option>
    `;
  }
  if (colCount === 3) {
    return `
      <option value="33-33-33" ${layout === '33-33-33' ? 'selected' : ''}>3-Cols (Equal 33 / 33 / 33)</option>
      <option value="50-25-25" ${layout === '50-25-25' ? 'selected' : ''}>3-Cols (50 / 25 / 25)</option>
      <option value="25-50-25" ${layout === '25-50-25' ? 'selected' : ''}>3-Cols (25 / 50 / 25)</option>
      <option value="25-25-50" ${layout === '25-25-50' ? 'selected' : ''}>3-Cols (25 / 25 / 50)</option>
    `;
  }
  if (colCount === 4) {
    return `
      <option value="25-25-25-25" ${layout === '25-25-25-25' ? 'selected' : ''}>4-Cols (Equal 25 / 25 / 25 / 25)</option>
    `;
  }
  return `
    <option value="equal" selected>${colCount}-Cols (Equal)</option>
  `;
}

/**
 * Dispatches and renders a child block by its type.
 */
function renderChildBlock(child, isEditing, onUpdate, allNotes, options = {}) {
  return renderBlockContent(child, isEditing, onUpdate, allNotes, options);
}

/**

function renderMultiColumnBlock(
  block,

  const container = document.createElement('div');
