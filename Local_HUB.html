      <!-- Select from Existing Blocks Button -->
      <button type="button" class="btn-pick-existing px-2.5 h-7 rounded-md border border-cyan-500/50 bg-cyan-500/10 hover:bg-cyan-500/25 text-cyan-300 font-semibold text-xs flex items-center gap-1.5 transition-colors cursor-pointer shadow-xs" title="Select & move existing blocks from this note into columns">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        <span>Select from Note</span>
      </button>
    </div>

    <!-- Top Right: Actions -->
    ${getBlockActionsHTML({ index, totalBlocks })}
  `;
  editWrap.appendChild(topBar);

  // --- Vertical Stack of Column Slots (Full Width Rows) ---
  const slotsContainer = document.createElement('div');
  slotsContainer.className = 'flex flex-col gap-3 w-full my-1';

  cols.forEach((colBlock, cIdx) => {
    const slotEl = document.createElement('div');
    slotEl.className = 'notes-col-slot flex flex-col gap-2 p-3 rounded-xl border border-[var(--border)] bg-[var(--card)] shadow-xs transition-all';

    // Slot Header
    const slotHeader = document.createElement('div');
    slotHeader.className = 'flex items-center justify-between gap-2 pb-2 border-b border-[var(--border)] flex-wrap select-none';
    slotHeader.innerHTML = `
      <!-- Left: Column Number & Type Switcher -->
      <div class="flex items-center gap-2 flex-wrap">
        <span class="px-2 py-0.5 rounded bg-purple-500/20 text-purple-300 font-mono font-bold text-[11px] tracking-wider">
          COLUMN ${cIdx + 1} OF ${cols.length}
        </span>

        <div class="flex items-center gap-1">
          <span class="text-[11px] text-[var(--text-dim)] font-medium">Type:</span>
          <select class="slot-type-select notes-ghost-btn text-xs h-6 px-1.5 py-0 font-medium cursor-pointer">
            <option value="text" ${colBlock.type === 'text' ? 'selected' : ''}>¶ Text</option>
            <option value="equation" ${colBlock.type === 'equation' ? 'selected' : ''}>∑ Equation</option>
            <option value="table" ${(colBlock.type === 'table' || colBlock.type === 'tables') ? 'selected' : ''}>⊞ Table</option>
            <option value="image" ${colBlock.type === 'image' ? 'selected' : ''}>🖼 Image</option>
            <option value="tikz" ${colBlock.type === 'tikz' ? 'selected' : ''}>⬡ TikZ</option>
            <option value="code" ${colBlock.type === 'code' ? 'selected' : ''}>&lt;/&gt; Code</option>
            <option value="block" ${(colBlock.type === 'block' || colBlock.type === 'theorem') ? 'selected' : ''}>★ Callout</option>
          </select>
        </div>

        <button type="button" class="slot-pick-btn px-2 py-0.5 rounded border border-cyan-500/40 text-cyan-400 hover:bg-cyan-500/15 text-[11px] font-medium transition-colors cursor-pointer" title="Pick an existing block from this note for this column">
          Pick Existing
        </button>
      </div>

      <!-- Right: Column Controls (Move Left, Move Right, Eject, Delete) -->
      <div class="flex items-center gap-1.5 flex-shrink-0">
        ${cIdx > 0 ? `<button type="button" class="slot-left-btn px-1.5 h-6 rounded border border-[var(--border)] bg-[var(--surface)] text-[var(--text-secondary)] hover:text-white text-xs transition-colors cursor-pointer" title="Swap Left">←</button>` : ''}
        ${cIdx < cols.length - 1 ? `<button type="button" class="slot-right-btn px-1.5 h-6 rounded border border-[var(--border)] bg-[var(--surface)] text-[var(--text-secondary)] hover:text-white text-xs transition-colors cursor-pointer" title="Swap Right">→</button>` : ''}
        <button type="button" class="slot-eject-btn px-2 h-6 rounded border border-amber-500/40 text-amber-400 hover:bg-amber-500/15 text-[11px] font-medium transition-colors cursor-pointer" title="Eject block back to main document outside columns">
          📤 Eject
        </button>
        ${cols.length > 2 ? `<button type="button" class="slot-del-btn w-6 h-6 rounded border border-[var(--border)] hover:border-red-500 text-[var(--text-dim)] hover:text-red-400 flex items-center justify-center text-xs transition-colors cursor-pointer" title="Remove this column slot">✕</button>` : ''}
      </div>
    `;

    // Type Change Listener
    const typeSelect = slotHeader.querySelector('.slot-type-select');
    typeSelect.addEventListener('change', () => {
      const newType = typeSelect.value;
      cols[cIdx] = createNewBlock(newType);
      block.cols = cols;
      if (onUpdate) onUpdate({ cols });
      SaveNotesState();
      refreshEditView();
    });

    // Pick Existing for this Slot
    const slotPickBtn = slotHeader.querySelector('.slot-pick-btn');
    slotPickBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      openBlockPickerModal(cIdx);
    });

    // Swap Left
    const leftBtn = slotHeader.querySelector('.slot-left-btn');
    if (leftBtn) {
      leftBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const tmp = cols[cIdx];
        cols[cIdx] = cols[cIdx - 1];
        cols[cIdx - 1] = tmp;
        block.cols = cols;
        if (onUpdate) onUpdate({ cols });
        SaveNotesState();
        refreshEditView();
      });
    }

    // Swap Right
    const rightBtn = slotHeader.querySelector('.slot-right-btn');
    if (rightBtn) {
      rightBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const tmp = cols[cIdx];
        cols[cIdx] = cols[cIdx + 1];
        cols[cIdx + 1] = tmp;
        block.cols = cols;
        if (onUpdate) onUpdate({ cols });
        SaveNotesState();
        refreshEditView();
      });
    }

    // Eject to Document
    const ejectBtn = slotHeader.querySelector('.slot-eject-btn');
    ejectBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!note || !note.blocks) return;
      const parentIdx = note.blocks.findIndex(b => b.id === block.id);
      if (parentIdx === -1) return;

      const [ejectedBlock] = cols.splice(cIdx, 1);
      // Ensure at least 2 columns remain
      if (cols.length < 2) {
        cols.push(createNewBlock('text', { content: '' }));
      }
      block.cols = cols;

      // Insert ejected block immediately below this column block
      note.blocks.splice(parentIdx + 1, 0, ejectedBlock);
      SaveNotesState();
      if (onConfigUpdate) onConfigUpdate();
    });

    // Delete Slot
    const delSlotBtn = slotHeader.querySelector('.slot-del-btn');
    if (delSlotBtn) {
      delSlotBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        cols.splice(cIdx, 1);
        block.cols = cols;
        if (onUpdate) onUpdate({ cols });
        SaveNotesState();
        refreshEditView();
      });
    }

    slotEl.appendChild(slotHeader);

    // Slot Body: Full Editor of the Child Block
    const childEditorContainer = document.createElement('div');
    childEditorContainer.className = 'w-full';

    const childEditor = renderChildBlock(
      colBlock,
      true,
      (updatedFields) => {
        Object.assign(colBlock, updatedFields);
        if (onUpdate) onUpdate({ cols });
        SaveNotesState();
      },
      allNotes,
      {
        index: cIdx,
        totalBlocks: cols.length,
        note,
        onDone: () => {
          // If child done is clicked, finish editing column block
          if (onDone) onDone();
        }
      }
    );

    childEditorContainer.appendChild(childEditor);
    slotEl.appendChild(childEditorContainer);
    slotsContainer.appendChild(slotEl);
  });

  editWrap.appendChild(slotsContainer);

  // --- Bottom Action Bar: Add Column & Done ---
  const bottomBar = document.createElement('div');
  bottomBar.className = 'flex items-center justify-between gap-2 pt-2 border-t border-[var(--border)]';
  bottomBar.innerHTML = `
    <button type="button" class="btn-add-col px-3 py-1.5 rounded-lg border border-dashed border-purple-500/60 bg-purple-500/10 hover:bg-purple-500/20 text-purple-300 text-xs font-semibold flex items-center gap-1.5 transition-colors cursor-pointer">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span>Add Column Slot</span>
    </button>
    <button type="button" class="px-4 py-1.5 rounded-lg bg-green-600 hover:bg-green-500 text-white text-xs font-bold shadow-xs transition-colors cursor-pointer bottom-done-btn">
      Done Editing
    </button>
  `;
  editWrap.appendChild(bottomBar);

  // --- Event Listeners for Top & Bottom Controls ---
  const refreshEditView = () => {
    const refreshed = renderMultiColumnBlock(block, isEditing, onUpdate, allNotes, {
      note,
      onConfigUpdate,
      pickerState,
      onStartPicking,
      onCancelPicking,
      onDone,
      onMoveUp,
      onMoveDown,
      onDelete,
      index,
      totalBlocks
    });
    container.replaceChild(refreshed.firstElementChild, editWrap);
  };

  // Layout Select
  const layoutSelect = topBar.querySelector('.layout-select');
  layoutSelect.addEventListener('change', () => {
    block.layout = layoutSelect.value;
    if (onUpdate) onUpdate({ layout: block.layout });
    SaveNotesState();
  });

  // Increment Column Count
  const incBtn = topBar.querySelector('.btn-inc-col');
  if (incBtn) {
    incBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (cols.length < 5) {
        cols.push(createNewBlock('text', { content: '' }));
        block.cols = cols;
        if (cols.length === 3 && block.layout === '50-50') block.layout = '33-33-33';
        if (cols.length === 4) block.layout = '25-25-25-25';
        if (onUpdate) onUpdate({ cols, layout: block.layout });
        SaveNotesState();
        refreshEditView();
      }
    });
  }

  // Decrement Column Count
  const decBtn = topBar.querySelector('.btn-dec-col');
  if (decBtn) {
    decBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (cols.length > 2) {
        cols.pop();
        block.cols = cols;
        if (cols.length === 2) block.layout = '50-50';
        if (cols.length === 3) block.layout = '33-33-33';
        if (onUpdate) onUpdate({ cols, layout: block.layout });
        SaveNotesState();
        refreshEditView();
      }
    });
  }

  // Pick Existing Button (Global)
  const pickExistingBtn = topBar.querySelector('.btn-pick-existing');
  pickExistingBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openBlockPickerModal(null);
  });

  // Add Column Slot Button (Bottom)
  bottomBar.querySelector('.btn-add-col')?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (cols.length < 5) {
      cols.push(createNewBlock('text', { content: '' }));
      block.cols = cols;
      if (cols.length === 3 && block.layout === '50-50') block.layout = '33-33-33';
      if (cols.length === 4) block.layout = '25-25-25-25';
      if (onUpdate) onUpdate({ cols, layout: block.layout });
      SaveNotesState();
      refreshEditView();
    }
  });

  // Action Buttons
  initBlockActions(topBar, { onDone, onMoveUp, onMoveDown, onDelete, index });
  bottomBar.querySelector('.bottom-done-btn')?.addEventListener('click', (e) => {
    e.stopPropagation();
    if (onDone) onDone();
  });

  container.appendChild(editWrap);
  return container;
}


/* --- 03_Notes/B_Editor_View/01_Blocks/Block_Item.js --- */
/**
 * 03_Notes/B_Editor_View/01_Blocks/Block_Item.js
 * Dispatcher component that wraps and renders individual block types.
 */
function CreateBlockItem({
  block,
  index,
  totalBlocks,
  isEditing,
  isEditMode,
  allNotes,
  prefix = '',
  figureInfo = null,
  note = null,
  pickerState = null,
  onPickBlock = null,
  onStartPicking = null,
  onCancelPicking = null,
  onConfigUpdate = null,
  onUpdate,
  onSelect,
  onDone,
  onMoveUp,
  onMoveDown,
  onDelete,
  onInsertBelow
}) {
  const wrap = document.createElement('section');
  const isHeading = block.type === 'heading';
  const isFirst = index === 0;
  const headingMargin = isHeading && !isEditing
    ? (isFirst ? 'mt-0.5 mb-1.5' : (block.level === 'h1' ? 'mt-4 mb-1.5' : (block.level === 'h2' ? 'mt-3.5 mb-1' : 'mt-2.5 mb-0.5')))
    : 'my-0.5';

  const isPickerTarget = pickerState && (block.id === pickerState.targetBlockId);
  const isPickable = pickerState && !isPickerTarget && block.type !== 'columns' && block.type !== 'multicolumn' && block.type !== 'multi-column';

  if (isPickable) {
    wrap.className = 'notes-block-item group relative px-2.5 my-2 rounded-xl border-2 border-dashed border-cyan-400/90 bg-cyan-500/10 hover:bg-cyan-500/20 hover:border-cyan-300 shadow-md cursor-pointer transition-all duration-150 ring-2 ring-cyan-400/20 select-none';
    const pickBadge = document.createElement('div');
    pickBadge.className = 'absolute -top-2.5 right-3 px-2.5 py-0.5 rounded-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-[11px] shadow-sm flex items-center gap-1.5 z-20 cursor-pointer animate-pulse select-none';
    pickBadge.innerHTML = `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg><span>Move to Column</span>`;
    wrap.appendChild(pickBadge);

    wrap.addEventListener('click', (e) => {
      e.stopPropagation();
      if (onPickBlock) onPickBlock(block, index);
    });
  } else if (isPickerTarget) {
    wrap.className = 'notes-block-item group relative px-2.5 my-2 rounded-xl border-2 border-purple-500 bg-[var(--surface)] shadow-xl ring-4 ring-purple-500/20';
  } else {
    wrap.className = `notes-block-item group relative px-2.5 ${headingMargin} rounded-lg border transition-all duration-200 ease-out ${
      isEditing
        ? 'border-purple-500 bg-[var(--surface)] shadow-lg py-2'
        : (isEditMode ? 'border-transparent hover:border-[var(--border)] cursor-pointer py-0.5' : 'border-transparent py-0')
    }`;
    wrap.style.transition = 'border-color 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s cubic-bezier(0.16, 1, 0.3, 1), padding 0.2s ease, background-color 0.2s ease';

    if (isEditMode) {
      wrap.addEventListener('click', (e) => {
        if (e.target.closest('button') || isEditing) return;
        if (onSelect) onSelect();
      });
    }
  }

  // Unified Action Parameters passed to each block's top toolbar
  const actionHandlers = {
    isEditMode,
    onDone,
    onMoveUp,
    onMoveDown,
    onDelete,
    onInsertBelow,
    index,
    totalBlocks,
    figureInfo,
    prefix,
    note,
    onConfigUpdate,
    pickerState,
    onStartPicking,
    onCancelPicking
  };

  const blockEl = renderBlockContent(block, isEditing, onUpdate, allNotes, actionHandlers);
  wrap.appendChild(blockEl);
  if (blockEl && typeof blockEl.__blockCleanup === 'function') {
    wrap.__blockCleanup = () => blockEl.__blockCleanup();
  }
  return wrap;
}


/* --- 03_Notes/B_Editor_View/01_Doc_Header.js --- */
/**
 * 03_Notes/B_Editor_View/01_Doc_Header.js
 * LaTeX Editor Document Header: Static Academic Article Title & Metadata.
 * Hierarchy: Note Title (Top) -> Left: Group Name (Plain Text) | Right: Date (Plain Text).
 */
function CreateDocHeader(note, { onTitleClick = null } = {}) {
  const header = document.createElement('header');
  header.className = 'doc-header mb-4 pb-3 border-b border-[var(--border)] select-text';

  const title = escapeHtml(note.title || 'Untitled Note');
  const folder = escapeHtml(note.folder || 'General');
  const createdDate = note.meta?.created ? escapeHtml(note.meta.created) : (note.date ? escapeHtml(note.date) : '');

  header.innerHTML = `
    <!-- 1. Note Name (Top) - Click to pop up sidebar -->
    <h1 class="doc-title-trigger text-2xl md:text-3xl font-extrabold font-serif text-[var(--text)] hover:text-purple-400 cursor-pointer tracking-tight mb-2 leading-tight transition-colors" title="Click to open Outline Sidebar">
      ${title}
    </h1>

    <!-- 2. Sub-row: Group on Left, Date on Right -->
    <div class="flex items-center justify-between gap-3 text-xs text-[var(--text-secondary)] font-mono flex-wrap">
      <span class="font-semibold text-purple-400">${folder}</span>
      ${createdDate ? `<span class="text-[var(--text-dim)]">${createdDate}</span>` : ''}
    </div>
  `;

  const titleEl = header.querySelector('.doc-title-trigger');
  if (titleEl) {
    titleEl.addEventListener('click', (e) => {
      e.stopPropagation();
      const sidebar = document.getElementById('notes-sidebar');
      const overlay = document.getElementById('notes-sidebar-overlay');
      if (sidebar) {
        sidebar.classList.add('visible');
        if (overlay) overlay.classList.add('active');
        document.body.classList.add('sidebar-open');
      }
      if (onTitleClick) onTitleClick();
    });
  }

  return header;
}


/* --- 03_Notes/B_Editor_View/02_Sidebar/01_Sidebar_Logo.js --- */
/**
 * 03_Notes/B_Editor_View/02_Sidebar/01_Sidebar_Logo.js
 * Sidebar Top Logo Component:
 * - Default: Auto Favicon-style SVG generated from the first letter of note title
 * - Image Upload / Clipboard Paste (PNG, JPG) encoded as Base64
 * - Raw SVG Code pasting
 * - Shape toggling: Rounded Square vs Circular
 * - Edit modal window with instant preview
 */
function CreateSidebarLogo(note, onLogoChange = null, isEditMode = true) {
  const container = document.createElement('div');
  container.className = 'sidebar-logo-card relative flex flex-col items-center justify-center p-3 rounded-xl border border-[var(--border)] bg-[var(--card)] shadow-xs select-none group';

  container.innerHTML = `
    <style>
      .sidebar-logo-card .sidebar-logo-edit-btn {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .sidebar-logo-card:hover .sidebar-logo-edit-btn {
        opacity: 1;
        pointer-events: auto;
      }
    </style>
    ${isEditMode ? `
    <button type="button" class="sidebar-logo-edit-btn absolute top-2 right-2 w-6 h-6 rounded-md border border-[var(--border)] bg-[var(--surface)] text-[var(--text-secondary)] hover:text-purple-400 hover:border-purple-400 flex items-center justify-center transition-colors text-xs shadow-xs" title="Customize Note Logo">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    </button>` : ''}
    <div class="sidebar-logo-view-wrap my-1 flex items-center justify-center w-[72px] h-[72px]">
      ${GetLogoMarkup(note)}
    </div>
    <div class="text-[11px] font-bold text-[var(--text)] tracking-tight truncate max-w-[220px] mt-1 text-center font-serif">
      ${escapeHtml(note.title || 'Untitled Note')}
    </div>
  `;

  if (isEditMode) {
    const editBtn = container.querySelector('.sidebar-logo-edit-btn');
    if (editBtn) {
      editBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        OpenSidebarLogoModal(note, () => {
          const viewWrap = container.querySelector('.sidebar-logo-view-wrap');
          if (viewWrap) viewWrap.innerHTML = GetLogoMarkup(note);
          if (onLogoChange) onLogoChange();
        });
      });
    }
  }

  return container;
}
function GetLogoMarkup(note) {
  const logo = note.logo || { type: 'auto', shape: 'square' };
  const shape = logo.shape || 'square';
  const shapeClass = (shape === 'circle') ? 'rounded-full' : 'rounded-2xl';
  const letter = (note.title || 'N').trim().charAt(0).toUpperCase() || 'N';

  if (logo.type === 'image' && logo.data) {
    return `<img src="${logo.data}" alt="Note Logo" class="w-16 h-16 object-cover ${shapeClass} border border-[var(--border)] shadow-sm" />`;
  }

  if (logo.type === 'svg' && logo.data) {
    return `<div class="w-16 h-16 ${shapeClass} overflow-hidden flex items-center justify-center border border-[var(--border)] bg-[var(--surface)] shadow-sm svg-logo-wrapper [&>svg]:w-full [&>svg]:h-full">${logo.data}</div>`;
  }

  // Default: Auto Favicon initial letter with vibrant gradient
  const gradId = `logo-grad-${(note.id || 'def').replace(/[^a-zA-Z0-9]/g, '')}`;
  const rx = (shape === 'circle') ? '50' : '24';
  return `
    <svg class="w-16 h-16 ${shapeClass} shadow-sm select-none flex-shrink-0" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gradId}" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#8b6dff" />
          <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>
      </defs>
      <rect width="100" height="100" rx="${rx}" fill="url(#${gradId})" />
      <text x="50" y="66" font-family="'Lora', Georgia, serif, system-ui" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle">${escapeHtml(letter)}</text>
    </svg>
  `;
}

  modalOverlay.innerHTML = `

      <div class="flex items-center justify-between px-5 py-4 border-b border-[var(--border)] bg-[var(--card)]">

          <div class="text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-2">Live Logo Preview</div>
          <div id="modal-logo-preview" class="w-18 h-18 flex items-center justify-center">
            ${GetLogoMarkup({ ...note, logo: tempLogo })}
          </div>
        </div>

        <!-- Shape Selector -->
        <div>
          <label class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-1.5">Icon Shape</label>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" class="shape-btn shape-square-btn flex items-center justify-center gap-2 py-2 px-3 rounded-lg border text-xs font-semibold ${tempLogo.shape === 'square' ? 'border-purple-500 bg-purple-500/10 text-purple-400' : 'border-[var(--border)] bg-[var(--card)] text-[var(--text-secondary)]'}">
              <span class="w-3.5 h-3.5 rounded-sm border border-current"></span> Rounded Square

              <input type="radio" name="logo-type" value="image" ${tempLogo.type === 'image' ? 'checked' : ''} class="accent-purple-500 mt-0.5" />
              <div class="flex-1 text-xs">
                <span class="font-bold text-[var(--text)]">Custom Image (PNG, JPG)</span>
                <span class="text-[var(--text-dim)] block mb-2">Upload a file or paste directly from clipboard</span>
                
                <div id="image-upload-panel" class="${tempLogo.type === 'image' ? 'block' : 'hidden'} space-y-2">
                  <div id="dropzone-paste-box" class="p-3 rounded-lg border border-dashed border-[var(--border)] bg-[var(--surface)] text-center cursor-pointer hover:border-purple-400 transition-colors">
                    <span class="text-[11px] text-[var(--text-secondary)] block">📁 Click to choose file or press <b>Ctrl+V</b> to paste</span>

                  <textarea id="svg-code-input" class="w-full p-2 text-xs font-mono rounded-lg border border-[var(--border)] bg-[var(--surface)] text-[var(--text)] outline-none focus:border-purple-500" rows="3" placeholder="<svg viewBox='0 0 100 100'>...</svg>">${tempLogo.type === 'svg' ? escapeHtml(tempLogo.data || '') : ''}</textarea>

        <button type="button" class="save-logo-btn py-1.5 px-4 rounded-lg bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs transition-colors shadow-sm">Save Logo</button>
      </div>
    </div>
  `;

  document.body.appendChild(modalOverlay);

  const previewMount = modalOverlay.querySelector('#modal-logo-preview');
  const imgPanel = modalOverlay.querySelector('#image-upload-panel');
  const svgPanel = modalOverlay.querySelector('#svg-input-panel');
  const fileInput = modalOverlay.querySelector('#logo-file-input');
  const dropzone = modalOverlay.querySelector('#dropzone-paste-box');
  const svgTextarea = modalOverlay.querySelector('#svg-code-input');
  const squareBtn = modalOverlay.querySelector('.shape-square-btn');
  const circleBtn = modalOverlay.querySelector('.shape-circle-btn');

  function updateModalPreview() {
    previewMount.innerHTML = GetLogoMarkup({ ...note, logo: tempLogo });
  }

  // Shape toggles
  squareBtn.addEventListener('click', () => {
    tempLogo.shape = 'square';
    squareBtn.className = 'shape-btn shape-square-btn flex items-center justify-center gap-2 py-2 px-3 rounded-lg border text-xs font-semibold border-purple-500 bg-purple-500/10 text-purple-400';
    circleBtn.className = 'shape-btn shape-circle-btn flex items-center justify-center gap-2 py-2 px-3 rounded-lg border text-xs font-semibold border-[var(--border)] bg-[var(--card)] text-[var(--text-secondary)]';
    updateModalPreview();
  });

  circleBtn.addEventListener('click', () => {
    tempLogo.shape = 'circle';
    circleBtn.className = 'shape-btn shape-circle-btn flex items-center justify-center gap-2 py-2 px-3 rounded-lg border text-xs font-semibold border-purple-500 bg-purple-500/10 text-purple-400';
    squareBtn.className = 'shape-btn shape-square-btn flex items-center justify-center gap-2 py-2 px-3 rounded-lg border text-xs font-semibold border-[var(--border)] bg-[var(--card)] text-[var(--text-secondary)]';
    updateModalPreview();
  });

  // Radio switcher
  modalOverlay.querySelectorAll('input[name="logo-type"]').forEach(radio => {
    radio.addEventListener('change', () => {
      tempLogo.type = radio.value;
      if (tempLogo.type === 'image') {
        imgPanel.classList.remove('hidden');
        svgPanel.classList.add('hidden');
      } else if (tempLogo.type === 'svg') {
        imgPanel.classList.add('hidden');
        svgPanel.classList.remove('hidden');
        tempLogo.data = svgTextarea.value;
      } else {
        imgPanel.classList.add('hidden');
        svgPanel.classList.add('hidden');
      }
      updateModalPreview();
    });
  });

  // SVG textarea input
  svgTextarea.addEventListener('input', () => {
    tempLogo.data = svgTextarea.value.trim();
    updateModalPreview();
  });

  // Dropzone file picker click
  dropzone.addEventListener('click', () => {
    fileInput.click();
  });

  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        tempLogo.type = 'image';
        tempLogo.data = e.target.result;
        updateModalPreview();
      };
      reader.readAsDataURL(file);
    }
  });

  // Global clipboard paste listener while modal is active
  const pasteHandler = (e) => {
    const items = e.clipboardData?.items;
    if (items) {
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          const file = items[i].getAsFile();
          if (file) {
            const reader = new FileReader();
            reader.onload = (evt) => {
              tempLogo.type = 'image';
              tempLogo.data = evt.target.result;
              const imgRadio = modalOverlay.querySelector('input[name="logo-type"][value="image"]');
              if (imgRadio) imgRadio.checked = true;
              imgPanel.classList.remove('hidden');
              svgPanel.classList.add('hidden');
              updateModalPreview();
            };
            reader.readAsDataURL(file);
            e.preventDefault();
            break;
          }
        }
      }
    }
  };

  document.addEventListener('paste', pasteHandler);

  // Close handlers
  const closeModal = () => {
    document.removeEventListener('paste', pasteHandler);
    modalOverlay.remove();
  };

  modalOverlay.querySelector('.close-modal-btn').addEventListener('click', closeModal);
  modalOverlay.querySelector('.cancel-modal-btn').addEventListener('click', closeModal);

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  // Save handler
  modalOverlay.querySelector('.save-logo-btn').addEventListener('click', () => {
    note.logo = {
      type: tempLogo.type,
      shape: tempLogo.shape,
      data: tempLogo.data
    };
    SaveNotesState();
    if (onSaveCallback) onSaveCallback(note.logo);
    closeModal();
  });
}


/* --- 03_Notes/B_Editor_View/02_Sidebar/02_Sidebar_TOC.js --- */
/**
 * 03_Notes/B_Editor_View/02_Sidebar/02_Sidebar_TOC.js
 * Sticky / Drawer Outline & Table of Contents Sidebar.
 * Integrates:
 * - Sidebar_Logo.js (Top Icon / Logo avatar with edit modal)
 * - Hierarchical Outline (H1 Section -> H2 Subsection -> H3 Subsubsection)
 * - Traceback jump to editor blocks
 * - No horizontal scroll, full word wrap
 * - Opposite theme vertical scrollbar
 */
function CreateSidebarTOC(note, { isEditMode = true, onNavigate = null } = {}) {
  const sidebar = document.createElement('aside');
  sidebar.id = 'notes-sidebar';
  sidebar.className = 'notes-sidebar-drawer';

  sidebar.innerHTML = `
    <style>
      .toc-link-item {
        display: block;
        line-height: 1.3;
        white-space: normal;
        word-break: break-word;
        overflow-wrap: anywhere;
        transition: color var(--transition, 0.2s), background-color var(--transition, 0.2s);
        user-select: none;
      }

      /* Section (H1) */
      .toc-level-h1 {
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--text);
        padding: 0.22rem 0.35rem;
        border-top: 1px solid var(--border);
        margin-top: 0.3rem;
        border-radius: 4px;
      }
      .toc-level-h1:first-child {
        border-top: none;
        margin-top: 0;
      }

      /* Subsection (H2 - Tab indent) */
      .toc-level-h2 {
        font-size: 0.70rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-left: 0.6rem;
        padding: 0.16rem 0.3rem 0.16rem 0.45rem;
        border-left: 1.5px solid var(--border);
        border-radius: 0 4px 4px 0;
      }

      /* Subsubsection (H3 - Double Tab indent) */
      .toc-level-h3 {
        font-size: 0.64rem;
        font-weight: 500;
        color: var(--text-dim);
        margin-left: 1.2rem;
        padding: 0.12rem 0.25rem 0.12rem 0.45rem;
        border-left: 1.5px solid var(--border);
        border-radius: 0 4px 4px 0;
      }

      .toc-link-item:hover {
        color: var(--accent);
        background: var(--accent-soft, rgba(139, 109, 255, 0.08));
      }
    </style>

    <div class="notes-sidebar-inner p-3 rounded-xl border border-[var(--border)] bg-[var(--surface)] shadow-sm w-full flex flex-col gap-1">
      <!-- 1. Top Sidebar Logo Mount -->
      <div id="notes-sidebar-logo-container"></div>

      <!-- 2. Outline Header -->
      <div class="flex items-center justify-between text-[10px] font-bold text-[var(--text-secondary)] uppercase tracking-wider mt-2 mb-1 pb-1.5 border-b border-[var(--border)]">
        <span class="flex items-center gap-1 font-bold tracking-widest text-[var(--text)]">Outline</span>
        <span class="font-semibold text-[var(--text-secondary)] truncate max-w-[130px]" title="${escapeHtml(note.folder || 'General')}">${escapeHtml(note.folder || 'General')}</span>
      </div>

      <!-- 3. Outline TOC Tree -->
      <nav class="notes-toc-nav w-full" id="notes-toc-nav">
        <ul class="space-y-0.5" id="notes-toc-list"></ul>
      </nav>
    </div>
  `;

  // Mount Logo
  const logoMount = sidebar.querySelector('#notes-sidebar-logo-container');
  if (logoMount) {
    logoMount.appendChild(CreateSidebarLogo(note, null, isEditMode));
  }

  // Populate Headings
  const ul = sidebar.querySelector('#notes-toc-list');
  const headings = (note.blocks || []).filter(b => b.type === 'heading');
  const prefixMap = computeHeadingPrefixes(note.blocks || [], note.autoNumbering);

  if (ul) {
    if (headings.length === 0) {
      ul.innerHTML = '<li class="italic text-[var(--text-dim)] py-2 text-xs text-center">No section headings in note</li>';
    } else {
      headings.forEach((h, idx) => {
        const li = document.createElement('li');
        const level = h.level || 'h1';
        const anchorId = (h.id || h.title || `section-${idx}`).toLowerCase().replace(/[^a-z0-9]+/g, '-');
        const prefix = prefixMap.get(h.id || idx) || '';

        let levelClass = 'toc-level-h2';
        if (level === 'h1') levelClass = 'toc-level-h1';
        else if (level === 'h3') levelClass = 'toc-level-h3';

        li.className = `toc-link-item cursor-pointer ${levelClass}`;
        li.innerHTML = `<span class="mr-1.5 font-serif font-bold">${escapeHtml(prefix)}</span><span>${escapeHtml(h.title || 'Untitled Section')}</span>`;

        li.addEventListener('click', () => {
          const target = document.getElementById(anchorId);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
          if (onNavigate) onNavigate();
          // Auto close mobile drawer if open
          document.getElementById('notes-sidebar')?.classList.remove('visible');
          document.getElementById('notes-sidebar-overlay')?.classList.remove('active');
          document.body.classList.remove('sidebar-open');
        });

        ul.appendChild(li);
      });
    }
  }

  return sidebar;
}

/**
 * 03_Notes/B_Editor_View/03_Floating_ToolBar/01_Study_View_Toggle.js
 * Button to toggle between Edit Mode and Study View (Clean Read-Only Mode).
 */
function GetStudyViewToggleHTML(isStudyMode = false) {
  return `
    <button id="btn-study-view-toggle" class="notes-study-toggle-btn rounded-full flex items-center justify-center border border-[var(--border)] ${isStudyMode ? 'bg-purple-600 text-white border-purple-500 shadow-md' : 'bg-[var(--surface)] text-[var(--text)] hover:border-purple-500 hover:text-purple-400'} transition-all flex-shrink-0 cursor-pointer shadow-xs" style="width: 32px; height: 32px; min-width: 32px; min-height: 32px; padding: 0;" type="button" title="${isStudyMode ? 'Study View Active (Click to Edit Note)' : 'Study View (Read-Only Note)'}">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: block;">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
    </button>
  `;
}
function InitStudyViewToggleLogic(onToggle = null) {
  const btn = document.getElementById('btn-study-view-toggle') || document.querySelector('.notes-study-toggle-btn');
  if (!btn) return;
  if (btn._hasStudyToggleListener) return;
  btn._hasStudyToggleListener = true;

  btn.addEventListener('click', (e) => {
    e.stopPropagation();

    if (typeof onToggle === 'function') {
      onToggle();
      return;
    }

    const hash = window.location.hash || '';
    const qIdx = hash.indexOf('?');
    const params = new URLSearchParams(qIdx !== -1 ? hash.slice(qIdx) : '');
    const isCurrentlyStudy = params.get('view') === 'study' || hash.includes('view=study') || btn.classList.contains('bg-purple-600');

    if (isCurrentlyStudy) {
      // --- TURN OFF STUDY MODE: RETURN TO EDITOR VIEW ---
      params.delete('view');
      const remainingQuery = params.toString();
      const targetHash = remainingQuery ? `#Notes?${remainingQuery}` : '#Notes';

      if (window.location.hash === targetHash) {
        if (typeof window.initNotesApp === 'function') {
          window.initNotesApp();
        }
      } else {
        window.location.hash = targetHash;
      }
    } else {
      // --- TURN ON STUDY MODE ---
      params.set('view', 'study');
      const targetHash = `#Notes?${params.toString()}`;
      if (window.location.hash === targetHash) {
        if (typeof window.initNotesApp === 'function') {
          window.initNotesApp();
        }
      } else {
        window.location.hash = targetHash;
      }
    }
  });
}

        <button type="button" class="btn-scope-global px-2.5 py-1 rounded-md transition-all cursor-pointer font-medium" title="Vault-wide macros applied across all notes">
          🌐 Global
        </button>
        <button type="button" class="btn-scope-local px-2.5 py-1 rounded-md transition-all cursor-pointer font-medium" title="Note-specific macros applied only to this note">
          📄 Local ${note?.title ? `(${escapeHtml(note.title.slice(0, 14))}${note.title.length > 14 ? '…' : ''})` : ''}
        </button>
      </div>

      <!-- Center-Right: Color Selector Mount -->
      <div class="color-tool-mount flex items-center flex-shrink-0"></div>

      <!-- Far Right: Close Button -->
      <button type="button" class="btn-close-modal w-7 h-7 rounded-lg border border-[var(--border)] hover:bg-[var(--card-hover)] flex items-center justify-center text-xs transition-colors text-[var(--text-secondary)] hover:text-[var(--text)] flex-shrink-0 cursor-pointer" title="Close">
        ✕
      </button>
    </div>

    <!-- 2. VS Code–Style Tabs Bar -->
    <div class="flex items-center border-b border-[var(--border)] bg-[var(--bg-secondary,var(--bg))] px-3 pt-2 gap-1.5 select-none">
      <!-- Tab 1: Equation Macros -->
      <button type="button" class="tab-btn tab-btn-equation flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-t-lg border-t-2 transition-all cursor-pointer" title="LaTeX Equation & Math Macros (KaTeX)">
        <span class="text-[var(--accent)] font-bold text-sm leading-none">∑</span>
        <span>Equation Macros</span>
      </button>

      <!-- Tab 2: TikZ Macros -->
      <button type="button" class="tab-btn tab-btn-tikz flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-t-lg border-t-2 transition-all cursor-pointer" title="TikZ Diagram Styles & Preamble (TikZJax)">
        <span class="text-purple-400 font-bold text-sm leading-none">🎨</span>
        <span>TikZ Macros & Styles</span>
      </button>
    </div>

    <!-- Main Code Editor -->
    <div class="p-3.5 sm:p-4 flex-1 flex flex-col min-h-[260px] bg-[var(--card)]">
      <textarea class="macro-editor-textarea font-mono text-xs leading-relaxed p-3 rounded-xl border border-[var(--border)] bg-[var(--surface)] text-[var(--text)] focus:border-[var(--accent)] outline-none resize-none flex-1 box-border transition-all" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" style="min-height: 280px; height: 320px; scrollbar-width: thin;" placeholder="Enter LaTeX definitions..."></textarea>
    </div>

    <!-- 5. Footer Actions -->
    <div class="flex items-center justify-between gap-2 px-4 py-3 border-t border-[var(--border)] bg-[var(--surface)] select-none flex-wrap">
      <button type="button" class="btn-reset-defaults notes-ghost-btn h-8 px-3 text-xs font-medium text-[var(--text-secondary)] hover:text-red-400" title="Reset current view to standard preset">
        Reset to Defaults
      </button>

        <button type="button" class="btn-cancel notes-ghost-btn h-8 px-3 text-xs font-medium">
          Cancel
        </button>
        <button type="button" class="btn-save-apply px-3.5 h-8 rounded-lg text-xs font-bold bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-white shadow-xs transition-all flex items-center justify-center gap-1.5 cursor-pointer">
          <span>Save & Apply</span>
        </button>
      </div>
    </div>
  `;

  backdrop.appendChild(modal);
  document.body.appendChild(backdrop);

  // Grab DOM references
  const btnGlobal = modal.querySelector('.btn-scope-global');
  const btnLocal = modal.querySelector('.btn-scope-local');
  const tabEquation = modal.querySelector('.tab-btn-equation');
  const tabTikz = modal.querySelector('.tab-btn-tikz');
  const textarea = modal.querySelector('.macro-editor-textarea');
  const btnReset = modal.querySelector('.btn-reset-defaults');
  const btnCancel = modal.querySelector('.btn-cancel');
  const btnSave = modal.querySelector('.btn-save-apply');
  const btnClose = modal.querySelector('.btn-close-modal');
  const colorMount = modal.querySelector('.color-tool-mount');

  // Insert Color Selector Component [ + | ○ Light | ○ Dark ]
  const colorSelector = CreateColorSelector({
    btnTitle: "Insert #Light|#Dark color code at cursor in macro editor",
    onApply: ({ dual }) => {
      insertAtCursor(`\\textcolor{${dual}}{}`);
    }
  });
  colorMount.appendChild(colorSelector);

  // Function to insert text at textarea cursor
  function insertAtCursor(textToInsert) {
    const startPos = textarea.selectionStart;
    const endPos = textarea.selectionEnd;
    const val = textarea.value;
    textarea.value = val.substring(0, startPos) + textToInsert + val.substring(endPos, val.length);
    const newPos = startPos + textToInsert.length;
    textarea.selectionStart = newPos;
    textarea.selectionEnd = newPos;
    textarea.focus();
    saveCurrentTextareaToState();
  }

  // Save current textarea content to working state
  function saveCurrentTextareaToState() {
    const target = isGlobal ? workingGlobal : workingLocal;
    target[activeTab] = textarea.value;
  }

  textarea.addEventListener('input', saveCurrentTextareaToState);

  // Update UI appearance based on isGlobal and activeTab
  function updateUI() {
    // 1. Update Global / Local switch buttons
    if (isGlobal) {
      btnGlobal.className = 'btn-scope-global px-2.5 py-1 rounded-md transition-all cursor-pointer font-bold bg-[var(--accent)] text-white shadow-xs';
      btnLocal.className = 'btn-scope-local px-2.5 py-1 rounded-md transition-all cursor-pointer font-medium text-[var(--text-secondary)] hover:text-[var(--text)]';
    } else {
      btnLocal.className = 'btn-scope-local px-2.5 py-1 rounded-md transition-all cursor-pointer font-bold bg-[var(--accent)] text-white shadow-xs';
      btnGlobal.className = 'btn-scope-global px-2.5 py-1 rounded-md transition-all cursor-pointer font-medium text-[var(--text-secondary)] hover:text-[var(--text)]';
    }

    // 2. Update Tabs
    if (activeTab === 'equation') {
      tabEquation.className = 'tab-btn tab-btn-equation flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-bold rounded-t-lg border-t-2 border-[var(--accent)] bg-[var(--card)] text-[var(--text)] shadow-xs cursor-pointer';
      tabTikz.className = 'tab-btn tab-btn-tikz flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold rounded-t-lg border-t-2 border-transparent text-[var(--text-dim)] hover:text-[var(--text)] hover:bg-[var(--card)]/50 cursor-pointer';
    } else {
      tabTikz.className = 'tab-btn tab-btn-tikz flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-bold rounded-t-lg border-t-2 border-purple-500 bg-[var(--card)] text-[var(--text)] shadow-xs cursor-pointer';
      tabEquation.className = 'tab-btn tab-btn-equation flex items-center gap-1.5 px-3.5 py-1.5 text-xs font-semibold rounded-t-lg border-t-2 border-transparent text-[var(--text-dim)] hover:text-[var(--text)] hover:bg-[var(--card)]/50 cursor-pointer';
    }

    // 3. Load text content into editor
    const source = isGlobal ? workingGlobal : workingLocal;
    textarea.value = source[activeTab] || '';
  }

  // Scope button listeners
  btnGlobal.addEventListener('click', () => {
    saveCurrentTextareaToState();
    isGlobal = true;
    updateUI();
  });

  btnLocal.addEventListener('click', () => {
    saveCurrentTextareaToState();
    isGlobal = false;
    updateUI();
  });

  // Tab button listeners
  tabEquation.addEventListener('click', () => {
    saveCurrentTextareaToState();
    activeTab = 'equation';
    updateUI();
  });

  tabTikz.addEventListener('click', () => {
    saveCurrentTextareaToState();
    activeTab = 'tikz';
    updateUI();
  });

  // Reset defaults
  btnReset.addEventListener('click', () => {
    if (confirm(`Reset ${isGlobal ? 'Global' : 'Local'} ${activeTab === 'equation' ? 'Equation' : 'TikZ'} macros to default preset?`)) {
      if (isGlobal) {
        workingGlobal[activeTab] = DEFAULT_GLOBAL_MACROS[activeTab];
      } else {
        workingLocal[activeTab] = '';
      }
      updateUI();
    }
  });

  // Dismiss Modal
  function closeModal() {
    backdrop.classList.add('opacity-0');
    setTimeout(() => backdrop.remove(), 150);
  }

  btnCancel.addEventListener('click', closeModal);
  btnClose.addEventListener('click', closeModal);

  // Save & Apply
  btnSave.addEventListener('click', () => {
    saveCurrentTextareaToState();

    // 1. Commit Global Macros
    NotesState.globalMacros = { ...workingGlobal };

    // 2. Commit Local Note Macros
    if (note) {
      note.macros = { ...workingLocal };
    }

    // 3. Persist State
    SaveNotesState();

    // 4. Notify Parent / Re-render canvas
    if (onSave) {
      onSave({
        globalMacros: workingGlobal,
        localMacros: workingLocal
      });
    }

    closeModal();
  });

  // Initial UI Render
  updateUI();
}

/**
 * 03_Notes/B_Editor_View/04_LaTeX_Editor.js
 * Master LaTeX Editor Module.
 * Connects Sidebar Outline, Document Header, Block Engine, In-Between Block Hover Inserters, and Contextual Insertion.
 */
function RenderLaTeXEditor(container, noteId, isEditMode = true) {
  if (!container) return;

  // Clean up any previous editor event listeners / observers
  if (container.__editorCleanup) {
    container.__editorCleanup();
    container.__editorCleanup = null;
  }

  container.innerHTML = '';

  const allNotes = NotesState.notes || [];
  const note = allNotes.find(n => n.id === noteId);

  if (!note) {
    container.innerHTML = `
      <div class="flex flex-col items-center justify-center w-full py-16 text-center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-12 h-12 text-amber-500 mb-3"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <div class="text-xl font-bold">Note Not Found</div>
        <div class="text-sm text-gray-500 mt-1">The note with ID "${escapeHtml(noteId)}" does not exist.</div>
        <a href="#Notes" class="notes-ghost-btn mt-4">Return to Deck</a>
      </div>
    `;
    return;
  }

  // Set active note context for KaTeX macros and TikZ preambles
  setActiveNoteContext(note);
  setActiveTikzNoteContext(note);
  const initialFigures = computeFigureNumbers(note.blocks || []);
  setActiveFigureTagMap(initialFigures.tagMap);

  let activeBlockIndex = -1;
  let activeSelectorIndex = -1; // Index where in-place block selector popup is open, or -1
  let pickerState = null; // State when picking existing blocks into multi-column

  const editorWrapper = document.createElement('div');
  editorWrapper.className = 'notes-editor-wrapper relative w-full';

  // Backdrop overlay for mobile / <1000px drawer mode
  const overlay = document.createElement('div');
  overlay.id = 'notes-sidebar-overlay';
  overlay.className = 'notes-sidebar-overlay';
  editorWrapper.appendChild(overlay);

  overlay.addEventListener('click', () => {
    document.getElementById('notes-sidebar')?.classList.remove('visible');
    overlay.classList.remove('active');
    document.body.classList.remove('sidebar-open');
  });

  const layout = document.createElement('div');
  layout.className = 'notes-editor-layout flex justify-center items-start gap-6 w-full max-w-full mx-auto py-2';

  // 1. Sidebar TOC Container (300px)
  let sidebarEl = CreateSidebarTOC(note, { isEditMode });
  layout.appendChild(sidebarEl);

  function refreshSidebar() {
    const newSidebar = CreateSidebarTOC(note, { isEditMode });
    layout.replaceChild(newSidebar, sidebarEl);
    sidebarEl = newSidebar;
  }

  // Dismiss sidebar when clicking outside
  const onDocClick = (e) => {
    const sidebar = document.getElementById('notes-sidebar');
    const overlay = document.getElementById('notes-sidebar-overlay');
    const toggleBtn = document.getElementById('notes-sidebar-toggle-btn');
    const titleTrigger = document.querySelector('.doc-title-trigger');
    const logoModal = document.getElementById('sidebar-logo-modal');
    if (logoModal) return;

    if (sidebar && sidebar.classList.contains('visible')) {
      if (!sidebar.contains(e.target) && (!toggleBtn || !toggleBtn.contains(e.target)) && (!titleTrigger || !titleTrigger.contains(e.target))) {
        sidebar.classList.remove('visible');
        if (overlay) overlay.classList.remove('active');
        document.body.classList.remove('sidebar-open');
      }
    }
  };
  document.addEventListener('click', onDocClick);

  // 2. Paper Container (Fluid full available width with bottom padding for floating toolbar)
  const paper = document.createElement('article');
  paper.className = 'notes-paper-canvas w-full max-w-full flex-1 p-4 sm:p-6 md:p-8 pb-24 rounded-2xl border border-[var(--border)] bg-[var(--card)] shadow-md box-border mx-auto';

  // Apply Global Typography
  function applyTypography() {
    const typo = note.typography || { fontFamily: 'serif', fontSize: 'base' };
    const fontInfo = GLOBAL_FONT_FAMILIES[typo.fontFamily] || GLOBAL_FONT_FAMILIES.serif;
    const sizeInfo = GLOBAL_FONT_SIZES[typo.fontSize] || GLOBAL_FONT_SIZES.base;
    paper.style.setProperty('--note-font-family', fontInfo.css);
    paper.style.setProperty('--note-font-size', sizeInfo.css);
    paper.style.setProperty('--note-line-height', sizeInfo.lineHeight);
    paper.style.fontFamily = 'var(--note-font-family)';
    paper.style.fontSize = 'var(--note-font-size)';
  }
  applyTypography();

  // Document Header (Title, Folder, Date)
  const headerEl = CreateDocHeader(note);
  paper.appendChild(headerEl);

  // Picker Banner Container
  const bannerContainer = document.createElement('div');
  bannerContainer.className = 'w-full';
  paper.appendChild(bannerContainer);

  // Blocks Container
  const blocksContainer = document.createElement('div');
  blocksContainer.className = 'space-y-0.5';
  paper.appendChild(blocksContainer);

  // Core Block Insertion Method
  function insertBlock(type, level = null, targetIndex = -1) {
    if (!note.blocks) note.blocks = [];
    const newBlock = createNewBlock(type, { level });

    // Determine target index:
    let actualIndex = targetIndex;
    if (actualIndex === -1 || actualIndex === null || actualIndex === undefined) {
      if (activeBlockIndex !== -1) {
        actualIndex = activeBlockIndex + 1; // Insert directly below active block
      } else {
        actualIndex = note.blocks.length; // Append to end
      }
    }

    const insertedIdx = insertBlockAt(note.blocks, newBlock, actualIndex);
    activeBlockIndex = insertedIdx;
    activeSelectorIndex = -1;
    SaveNotesState();
    renderBlocks();
    refreshSidebar();
  }

  // In-Place Block Selector Popover Component
  function createBlockSelector(targetIndex) {
    const selectorWrap = document.createElement('div');
    selectorWrap.className = 'notes-block-selector-popover my-2 p-2 sm:p-2.5 rounded-xl border border-purple-500/60 bg-[var(--surface)] shadow-xl animate-fade-in flex flex-col gap-2 z-30 select-none';
    selectorWrap.innerHTML = `
      <div class="flex items-center justify-between pb-1.5 border-b border-[var(--border)] text-xs text-[var(--text-secondary)] font-mono">
        <span class="flex items-center gap-1.5 text-purple-400 font-semibold">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>Insert Block ${targetIndex < (note.blocks || []).length ? `at Position #${targetIndex + 1}` : 'at End of Document'}</span>
        </span>
        <button type="button" class="close-selector-btn text-[var(--text-dim)] hover:text-red-400 text-xs px-1.5 py-0.5 rounded transition-colors cursor-pointer" title="Cancel">✕</button>
      </div>
      <div class="grid grid-cols-3 sm:grid-cols-5 md:grid-cols-9 gap-1.5">
        ${BLOCK_DEFINITIONS.map(def => `
          <button type="button" data-type="${def.type}" class="block-pick-btn flex flex-col items-center justify-center p-2 rounded-lg border border-[var(--border)] hover:border-purple-500 bg-[var(--card)] hover:bg-purple-500/10 text-[var(--text)] transition-all cursor-pointer group shadow-xs" title="${escapeHtml(def.description)}">
            <span class="text-purple-400 group-hover:scale-110 transition-transform mb-1">${def.icon}</span>
            <span class="text-[11px] font-semibold">${def.label}</span>
          </button>
        `).join('')}
      </div>
    `;

    selectorWrap.querySelector('.close-selector-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      activeSelectorIndex = -1;
      renderBlocks();
    });

    selectorWrap.addEventListener('click', (e) => {
      const btn = e.target.closest('.block-pick-btn');
      if (!btn) return;
      e.stopPropagation();
      const type = btn.dataset.type;
      insertBlock(type, null, targetIndex);
    });

    return selectorWrap;
  }

  // In-Between Hover Divider (VS Code / Jupyter Notebook style)
  function createHoverDivider(insertIndex) {
    const divider = document.createElement('div');
    divider.className = 'notes-insert-divider-zone group relative flex items-center justify-center h-4 my-[-3px] z-20 cursor-pointer';
    divider.dataset.insertIndex = insertIndex;

    divider.innerHTML = `
      <div class="divider-line absolute inset-x-2 sm:inset-x-6 h-[1.5px] bg-purple-500/0 group-hover:bg-purple-500/50 transition-all duration-200"></div>
      <button type="button" class="divider-btn opacity-0 group-hover:opacity-100 scale-90 group-hover:scale-100 transition-all duration-200 h-5 px-2.5 rounded-full border border-purple-500/60 bg-[var(--surface)] hover:bg-purple-600 hover:text-white text-purple-300 text-[10px] font-bold shadow-md flex items-center gap-1 z-10 cursor-pointer select-none" title="Insert block here">
        <svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        <span>Add Block</span>
      </button>
    `;

    divider.addEventListener('click', (e) => {
      e.stopPropagation();
      activeSelectorIndex = insertIndex;
      renderBlocks();
    });

    return divider;
  }

  function startPicking(targetBlock, targetSlotIdx = null, neededCount = 1) {
    pickerState = {
      targetBlockId: targetBlock.id,
      targetColIndex: targetSlotIdx,
      totalNeeded: neededCount,
      pickedCount: 0
    };
    activeSelectorIndex = -1;
    renderBlocks();
  }

  function cancelPicking() {
    pickerState = null;
    renderBlocks();
  }

  function handlePickBlock(pickedBlock, pickedIdx) {
    if (!pickerState) return;
    const targetBlock = (note.blocks || []).find(b => b.id === pickerState.targetBlockId);
    if (!targetBlock) {
      pickerState = null;
      renderBlocks();
      return;
    }

    // 1. Remove picked block from note.blocks
    const removeIdx = note.blocks.findIndex(b => b.id === pickedBlock.id);
    if (removeIdx === -1) return;
    const [movedBlock] = note.blocks.splice(removeIdx, 1);

    // 2. Insert into targetBlock.cols
    if (!Array.isArray(targetBlock.cols)) targetBlock.cols = [];

    if (pickerState.targetColIndex !== null && pickerState.targetColIndex >= 0 && pickerState.targetColIndex < targetBlock.cols.length) {
      targetBlock.cols[pickerState.targetColIndex] = movedBlock;
      pickerState.targetColIndex++;
    } else {
      // Find empty slot or append
      const emptySlot = targetBlock.cols.findIndex(c => !c || (c.type === 'text' && !c.content));
      if (emptySlot !== -1) {
        targetBlock.cols[emptySlot] = movedBlock;
      } else {
        targetBlock.cols.push(movedBlock);
      }
    }

    pickerState.pickedCount++;

    // 3. Keep activeBlockIndex pointing to the targetBlock
    const newTargetIdx = note.blocks.findIndex(b => b.id === pickerState.targetBlockId);
    if (newTargetIdx !== -1) {
      activeBlockIndex = newTargetIdx;
    }

    SaveNotesState();

    if (pickerState.pickedCount >= pickerState.totalNeeded) {
      pickerState = null;
    }

    renderBlocks();
    refreshSidebar();
  }

  function renderBlocks() {
    blocksContainer.querySelectorAll('.notes-block-item').forEach(el => {
      if (typeof el.__blockCleanup === 'function') {
        el.__blockCleanup();
      }
    });
    const oldDock = document.getElementById('notes-text-floating-dock');
    if (oldDock) {
      if (typeof oldDock.__cleanup === 'function') oldDock.__cleanup();
      oldDock.remove();
    }
    blocksContainer.innerHTML = '';
    bannerContainer.innerHTML = '';

    const blocks = note.blocks || [];
    const prefixMap = computeHeadingPrefixes(blocks, note.autoNumbering);
    const { figureMap, tagMap } = computeFigureNumbers(blocks);
    setActiveFigureTagMap(tagMap);

    // Render Picking Banner if active
    if (pickerState) {
      const banner = document.createElement('div');
      banner.className = 'sticky top-2 z-40 my-2 p-3 px-4 rounded-xl bg-gradient-to-r from-cyan-950/95 via-slate-900/95 to-purple-950/95 border-2 border-cyan-400 text-white shadow-2xl flex items-center justify-between gap-3 animate-fade-in backdrop-blur-md select-none';
      banner.innerHTML = `
        <div class="flex items-center gap-2.5 text-xs font-medium min-w-0">
          <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping flex-shrink-0"></span>
          <span class="font-bold text-cyan-300 flex-shrink-0">Block Selection Mode:</span>
          <span class="truncate">Click any block in your note to move it into your Multi-Column block (${pickerState.pickedCount} of ${pickerState.totalNeeded} picked).</span>
        </div>
        <div class="flex items-center gap-2 flex-shrink-0">
          <button type="button" class="done-pick-btn px-3 py-1 rounded-md bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold shadow-xs transition-colors cursor-pointer">Done Picking</button>
          <button type="button" class="cancel-pick-btn px-2.5 py-1 rounded-md bg-white/10 hover:bg-white/20 text-white text-xs transition-colors cursor-pointer">Cancel</button>
        </div>
      `;
      banner.querySelector('.done-pick-btn').addEventListener('click', () => {
        cancelPicking();
      });
      banner.querySelector('.cancel-pick-btn').addEventListener('click', () => {
        cancelPicking();
      });
      bannerContainer.appendChild(banner);
    }

    if (blocks.length === 0) {
      if (activeSelectorIndex === 0) {
        blocksContainer.appendChild(createBlockSelector(0));
      } else {
        const blankCanvas = document.createElement('div');
        blankCanvas.className = 'py-14 text-center text-[var(--text-dim)] font-mono text-xs italic border border-dashed border-[var(--border)] hover:border-purple-500/70 rounded-xl my-4 select-none cursor-pointer transition-colors';
        blankCanvas.innerHTML = `
          <div class="text-sm font-semibold text-purple-400 mb-1">+ Click to Add Your First Block</div>
          <div>Or use the dock below to insert sections, equations, or notes.</div>
        `;
        blankCanvas.addEventListener('click', () => {
          activeSelectorIndex = 0;
          renderBlocks();
        });
        blocksContainer.appendChild(blankCanvas);
      }
      return;
    }

    blocks.forEach((block, idx) => {
      // 1. In-between hover divider before this block
      if (isEditMode) {
        if (activeSelectorIndex === idx) {
          blocksContainer.appendChild(createBlockSelector(idx));
        } else {
          blocksContainer.appendChild(createHoverDivider(idx));
        }
      }

      // 2. Render block item
      const isEditing = isEditMode && (idx === activeBlockIndex);
      const prefix = prefixMap.get(block.id || idx) || '';
      const figureInfo = figureMap.get(block.id || idx) || null;

      const blockEl = CreateBlockItem({
        block: block,
        index: idx,
        totalBlocks: blocks.length,
        isEditing: isEditing,
        isEditMode: isEditMode,
        allNotes: allNotes,
        prefix: prefix,
        figureInfo: figureInfo,
        note: note,
        pickerState: pickerState,
        onPickBlock: (pickedBlock, pickedIdx) => {
          handlePickBlock(pickedBlock, pickedIdx);
        },
        onStartPicking: (targetColBlock, targetSlotIdx, neededCount) => {
          startPicking(targetColBlock, targetSlotIdx, neededCount);
        },
        onCancelPicking: () => {
          cancelPicking();
        },
        onConfigUpdate: () => {
          SaveNotesState();
          renderBlocks();
          refreshSidebar();
        },
        onUpdate: (fields) => {
          Object.assign(block, fields);
          SaveNotesState();
          if (block.type === 'heading') {
            refreshSidebar();
          }
        },
        onSelect: () => {
          document.getElementById('notes-text-floating-dock')?.remove();
          activeBlockIndex = idx;
          activeSelectorIndex = -1;
          renderBlocks();
        },
        onDone: () => {
          document.getElementById('notes-text-floating-dock')?.remove();
          activeBlockIndex = -1;
          renderBlocks();
        },
        onMoveUp: () => {
          document.getElementById('notes-text-floating-dock')?.remove();
          const temp = blocks[idx];
          blocks[idx] = blocks[idx - 1];
          blocks[idx - 1] = temp;
          activeBlockIndex = idx - 1;
          SaveNotesState();
          renderBlocks();
          refreshSidebar();
        },
        onMoveDown: () => {
          document.getElementById('notes-text-floating-dock')?.remove();
          const temp = blocks[idx];
          blocks[idx] = blocks[idx + 1];
          blocks[idx + 1] = temp;
          activeBlockIndex = idx + 1;
          SaveNotesState();
          renderBlocks();
          refreshSidebar();
        },
        onDelete: () => {
          blocks.splice(idx, 1);
          activeBlockIndex = -1;
          activeSelectorIndex = -1;
          SaveNotesState();
          renderBlocks();
          refreshSidebar();
        },
        onInsertBelow: (blockIdx) => {
          activeSelectorIndex = blockIdx + 1;
          renderBlocks();
        }
      });

      blocksContainer.appendChild(blockEl);
    });

    // 3. Trailing hover divider after the last block
    if (isEditMode) {
      const endIdx = blocks.length;
      if (activeSelectorIndex === endIdx) {
        blocksContainer.appendChild(createBlockSelector(endIdx));
      } else {
        blocksContainer.appendChild(createHoverDivider(endIdx));
      }
    }
  }

  // Bottom Floating Dock Toolbar (Sidebar Toggle, Study Toggle, Note Fonts, Font Size, Macros)
  const typo = note.typography || { fontFamily: 'serif', fontSize: 'base' };
  const floatingToolbar = CreateFloatingToolbar({
    currentFont: typo.fontFamily || 'serif',
    currentSize: typo.fontSize || 'base',
    isStudyMode: !isEditMode,
    note: note,
    onFontChange: (newFont) => {
      note.typography = { ...(note.typography || {}), fontFamily: newFont };
      SaveNotesState();
      applyTypography();
    },
    onSizeChange: (newSize) => {
      note.typography = { ...(note.typography || {}), fontSize: newSize };
      SaveNotesState();
      applyTypography();
    },
    onToggleStudy: () => {
      if (isEditMode) {
        window.location.hash = `#Notes?view=study&id=${encodeURIComponent(noteId)}`;
      } else {
        window.location.hash = `#Notes?id=${encodeURIComponent(noteId)}`;
      }
    },
    onMacrosChange: () => {
      // Re-render blocks and sidebar to apply updated macros and styles in real-time
      renderBlocks();
      refreshSidebar();
    }
  });

  // Clean up any existing theme observer on container
  if (container.__themeObserver) {
    container.__themeObserver.disconnect();
    container.__themeObserver = null;
  }

  // Observe theme changes to re-render blocks with active light/dark colors only if needed
  let themeDebounceTimer = null;
  const themeObserver = new MutationObserver(() => {
    clearTimeout(themeDebounceTimer);
    themeDebounceTimer = setTimeout(() => {
      // Standard blocks (text, headings, tables, equations without dual-colors) adapt instantly via CSS variables.
      // Only re-render blocks if the note contains non-TikZ blocks using dual-theme colors (#Light|#Dark).
      const blocks = note.blocks || [];
      const hasDualThemeBlocks = blocks.some(b => b.type !== 'tikz' && typeof (b.content || b.code) === 'string' && (b.content || b.code).includes('|#'));
      if (hasDualThemeBlocks) {
        renderBlocks();
      }
    }, 100);
  });
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  container.__themeObserver = themeObserver;

  editorWrapper.appendChild(floatingToolbar);

  layout.appendChild(paper);
  editorWrapper.appendChild(layout);
  container.appendChild(editorWrapper);

  // Keyboard shortcut support (Ctrl+Enter / Escape to finish editing section, Escape to close sidebar drawer / cancel picker)
  const onDocKeyDown = (e) => {
    if (e.key === 'Escape' && pickerState) {
      cancelPicking();
      return;
    }
    if (e.key === 'Escape') {
      const sidebar = document.getElementById('notes-sidebar');
      const overlay = document.getElementById('notes-sidebar-overlay');
      if (sidebar && sidebar.classList.contains('visible')) {
        sidebar.classList.remove('visible');
        if (overlay) overlay.classList.remove('active');
        document.body.classList.remove('sidebar-open');
      }
    }
    if ((e.key === 'Escape' || (e.ctrlKey && e.key === 'Enter')) && activeBlockIndex !== -1) {
      activeBlockIndex = -1;
      activeSelectorIndex = -1;
      renderBlocks();
    }
  };
  document.addEventListener('keydown', onDocKeyDown);

  // Register teardown callback to prevent listener leaks on future renders
  container.__editorCleanup = () => {
    const oldDock = document.getElementById('notes-text-floating-dock');
    if (oldDock) {
      if (typeof oldDock.__cleanup === 'function') oldDock.__cleanup();
      oldDock.remove();
    }
    document.removeEventListener('click', onDocClick);
    document.removeEventListener('keydown', onDocKeyDown);
    if (container.__themeObserver) {
      container.__themeObserver.disconnect();
      container.__themeObserver = null;
    }
  };

  renderBlocks();
}

// Handles view toggle button click, updates icon, persists mode, and triggers callback
function InitViewToggle(onViewChange) {
  const btn = document.getElementById('notes-view-toggle-btn');
  if (!btn) return;

  btn.addEventListener('click', () => {
    CurrentView = (CurrentView === 'Grid_Card_View') ? 'List_Card_View' : 'Grid_Card_View';
    localStorage.setItem('List_Card_View', CurrentView);

    const isGrid = (CurrentView === 'Grid_Card_View');

    // Update button icon & tooltip
    btn.title = isGrid ? 'Switch to List View' : 'Switch to Grid View';
    btn.innerHTML = isGrid ? `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="3" width="7" height="7" rx="1.5" />
        <rect x="14" y="14" width="7" height="7" rx="1.5" />
        <rect x="3" y="14" width="7" height="7" rx="1.5" />
      </svg>
    ` : `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6" />
        <line x1="8" y1="12" x2="21" y2="12" />
        <line x1="8" y1="18" x2="21" y2="18" />
        <line x1="3" y1="6" x2="3.01" y2="6" stroke-width="3" />
        <line x1="3" y1="12" x2="3.01" y2="12" stroke-width="3" />
        <line x1="3" y1="18" x2="3.01" y2="18" stroke-width="3" />
      </svg>
    `;

    // Instantly update any rendered notes-grid elements on the page
    document.querySelectorAll('.notes-grid').forEach(grid => {
      if (isGrid) {
        grid.classList.remove('view-list', 'List_Card_View');
        grid.classList.add('view-grid', 'Grid_Card_View');
      } else {
        grid.classList.remove('view-grid', 'Grid_Card_View');
        grid.classList.add('view-list', 'List_Card_View');
      }
    });

    if (onViewChange) onViewChange(CurrentView);
  });
}

              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>

          </div>
          <div class="notes-col-stepper">

            <span class="notes-stepper-val" id="notes-col-count-val">2</span>

        </div>
        <div class="notes-groups-grid-container" id="notes-groups-grid-container"></div>
      </div>

}

// Calculate the uniform tile width based on the longest group name
function ComputeUniformTileWidth(groups) {
  let maxCharLength = 0;
  groups.forEach(g => {
    if (g && g.length > maxCharLength) maxCharLength = g.length;
  });

  const computed = Math.ceil(maxCharLength * 8.5) + 68;
  return Math.min(280, Math.max(150, computed));
}

// Calculate the maximum number of columns that can fit without horizontal overflow
function GetMaxPossibleColumns(tileWidth) {
  const windowPadding = 28;
  const gap = 8;
  const viewportMax = Math.min(window.innerWidth - 20, 650);
  const maxCols = Math.floor((viewportMax - windowPadding + gap) / (tileWidth + gap));
  return Math.max(1, maxCols);
}

// Renders interactive drag-and-drop grid inside dropdown to filter and reorder note groups
function RenderGroupsDropdownGrid(state, onGroupSelect, onOrderUpdate) {
  const grid = document.getElementById('notes-groups-grid-container');
  const dropdownWindow = document.getElementById('notes-groups-dropdown-window');
  if (!grid || !dropdownWindow) return;

  const searchInput = document.getElementById('notes-group-search-input');
  const searchVal = (searchInput?.value || '').toLowerCase().trim();
  const colValEl = document.getElementById('notes-col-count-val');
  const colDecBtn = document.getElementById('notes-col-dec-btn');
  const colIncBtn = document.getElementById('notes-col-inc-btn');

  // Compute note counts per folder/group
  const counts = {};
  const allNotes = (state && Array.isArray(state.notes)) ? state.notes : [];
  allNotes.forEach(n => {
    const grp = n.folder || 'General';
    counts[grp] = (counts[grp] || 0) + 1;
  });
  counts['ALL'] = allNotes.length;

  // Determine folder order from state.folders or note folders
  const existingFolders = (state && Array.isArray(state.folders) && state.folders.length > 0)
    ? [...state.folders]
    : Object.keys(counts).filter(k => k !== 'ALL').sort();

  // Ensure any newly added note folder is included
  Object.keys(counts).forEach(grp => {
    if (grp !== 'ALL' && !existingFolders.includes(grp)) {
      existingFolders.push(grp);
    }
  });

  const rawOrder = ['ALL', ...existingFolders.filter(k => k !== 'ALL')];
  const currentList = TemporaryOrder || rawOrder;
  const tileWidth = ComputeUniformTileWidth(currentList);
  const maxPossibleCols = GetMaxPossibleColumns(tileWidth);

  if (DropdownCols > maxPossibleCols) DropdownCols = maxPossibleCols;
  if (colValEl) colValEl.textContent = DropdownCols;
  if (colDecBtn) colDecBtn.disabled = DropdownCols <= 1;
  if (colIncBtn) colIncBtn.disabled = DropdownCols >= maxPossibleCols;

  if (DropdownCols === 1) {
    dropdownWindow.style.width = '240px';
    grid.style.gridTemplateColumns = '1fr';
  } else {
    dropdownWindow.style.width = 'max-content';
    grid.style.gridTemplateColumns = `repeat(${DropdownCols}, ${tileWidth}px)`;
  }

  const filtered = currentList.filter(f => !searchVal || f.toLowerCase().includes(searchVal));

  grid.innerHTML = filtered.map(f => `
    <div class="notes-group-grid-tile ${ActiveGroup === f ? 'active' : ''} ${DraggedGroup === f ? 'is-dragging' : ''}"
         data-group="${f}"
         draggable="${f !== 'ALL' ? 'true' : 'false'}"
         style="${DropdownCols === 1 ? 'width: 100%;' : `width: ${tileWidth}px;`}">
      <span class="group-tile-title">${f === 'ALL' ? '📁 ALL GROUPS' : f}</span>
      <span class="count-badge">${counts[f] || 0}</span>
    </div>
  `).join('');

  grid.querySelectorAll('.notes-group-grid-tile').forEach(tile => {
    const groupName = tile.dataset.group;

    tile.addEventListener('click', (e) => {
      e.stopPropagation();
      ActiveGroup = groupName;
      const label = document.getElementById('notes-current-group-label');
      if (label) label.textContent = ActiveGroup;
      RenderGroupsDropdownGrid(state, onGroupSelect, onOrderUpdate);
      if (onGroupSelect) onGroupSelect(ActiveGroup);
      dropdownWindow.classList.add('hidden');
    });

    if (groupName !== 'ALL') {
      tile.addEventListener('dragstart', (e) => {
        IsDragging = true;
        DraggedGroup = groupName;
        tile.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', groupName);
      });

      tile.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';

        if (!IsDragging || !DraggedGroup || DraggedGroup === groupName || groupName === 'ALL') return;

        const draggedEl = grid.querySelector('.notes-group-grid-tile.is-dragging');
        if (!draggedEl || draggedEl === tile) return;

        const rect = tile.getBoundingClientRect();
        const next = (e.clientY > rect.top + rect.height / 2) || (e.clientX > rect.left + rect.width / 2);
        grid.insertBefore(draggedEl, next ? tile.nextSibling : tile);
      });

      tile.addEventListener('dragend', () => {
        IsDragging = false;
        tile.classList.remove('is-dragging');

        // Extract new order directly from the DOM order of tiles
        const tiles = Array.from(grid.querySelectorAll('.notes-group-grid-tile'));
        const newOrder = tiles.map(t => t.dataset.group).filter(g => g && g !== 'ALL');

        if (!state.folders) state.folders = [];
        state.folders = newOrder;
        DraggedGroup = null;
        TemporaryOrder = null;
        SaveNotesState();
        RenderGroupsDropdownGrid(state, onGroupSelect, onOrderUpdate);
        if (onOrderUpdate) onOrderUpdate(state.folders);
      });
    }
  });
}

// Initializes open/close dropdown logic, outside click dismissal, drag-and-drop reordering, and column layout controls
function InitGroupFilter(state, onGroupSelect, onOrderUpdate) {
  const toggleBtn = document.getElementById('notes-groups-dropdown-toggle');
  const dropdownWindow = document.getElementById('notes-groups-dropdown-window');
  const closeBtn = document.getElementById('notes-close-groups-dropdown');
  const searchInput = document.getElementById('notes-group-search-input');
  const colDecBtn = document.getElementById('notes-col-dec-btn');
  const colIncBtn = document.getElementById('notes-col-inc-btn');

  if (toggleBtn && dropdownWindow) {
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownWindow.classList.toggle('hidden');
      if (!dropdownWindow.classList.contains('hidden')) {
        RenderGroupsDropdownGrid(state, onGroupSelect, onOrderUpdate);
        searchInput?.focus();
      }
    });
  }

  if (closeBtn && dropdownWindow) {
    closeBtn.addEventListener('click', () => {
      dropdownWindow.classList.add('hidden');
    });
  }

  document.addEventListener('click', (e) => {
    if (dropdownWindow && !dropdownWindow.contains(e.target) && toggleBtn && !toggleBtn.contains(e.target)) {
      dropdownWindow.classList.add('hidden');
    }
  });

  if (searchInput) {
    searchInput.addEventListener('input', () => {
      RenderGroupsDropdownGrid(state, onGroupSelect, onOrderUpdate);
    });
  }

  if (colDecBtn && colIncBtn) {
    colDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (DropdownCols > 1) {
        DropdownCols--;
        RenderGroupsDropdownGrid(state, onGroupSelect, onOrderUpdate);
      }
    });

    colIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const allNotes = (state && Array.isArray(state.notes)) ? state.notes : [];
      const currentList = Array.from(new Set(['ALL', ...(state.folders || []), ...allNotes.map(n => n.folder || 'General')]));
      const tileWidth = ComputeUniformTileWidth(currentList);
      const maxCols = GetMaxPossibleColumns(tileWidth);

      if (DropdownCols < maxCols) {
        DropdownCols++;
        RenderGroupsDropdownGrid(state, onGroupSelect, onOrderUpdate);
      }
    });
  }

  window.addEventListener('resize', () => {
    if (dropdownWindow && !dropdownWindow.classList.contains('hidden')) {
      RenderGroupsDropdownGrid(state, onGroupSelect, onOrderUpdate);
    }
  });

  RenderGroupsDropdownGrid(state, onGroupSelect, onOrderUpdate);
}

let SearchQuery = '';
let DebounceTimer = null;

// Returns the current raw search query string
function GetSearchQuery() {
  return SearchQuery;
}

// Filters notes array matching query against title, folder, tags, description, and block contents
function FilterNotesByQuery(notes = [], query = null) {
  const q = (query !== null ? query : SearchQuery || '').toLowerCase().trim();
  if (!q) return Array.isArray(notes) ? notes : [];

  return (notes || []).filter(n => {
    if (!n) return false;
    const titleMatch = (n.title || '').toLowerCase().includes(q);
    const folderMatch = (n.folder || '').toLowerCase().includes(q);
    const tagsMatch = (n.tags || []).some(t => (t || '').toLowerCase().includes(q));
    const descMatch = (n.description || '').toLowerCase().includes(q);
    const flashcardMatch = n.flashcard && (
      (n.flashcard.front || '').toLowerCase().includes(q) ||
      (n.flashcard.back || '').toLowerCase().includes(q)
    );
    const contentMatch = (n.blocks || []).some(b => 
      (b.content || '').toLowerCase().includes(q) ||
      (b.title || '').toLowerCase().includes(q) ||
      (b.tex || '').toLowerCase().includes(q)
    );
    return titleMatch || folderMatch || tagsMatch || descMatch || flashcardMatch || contentMatch;
  });
}

// Listens for text input, Escape key, and clear clicks with debounced search callbacks
function InitSearchBar(onSearch) {
  const input = document.getElementById('notes-main-search-input');
  const clearBtn = document.getElementById('notes-search-clear-btn');
  if (!input) return;

  const handleClear = (shouldFocus = true) => {
    input.value = '';
    SearchQuery = '';
    if (clearBtn) clearBtn.style.display = 'none';
    clearTimeout(DebounceTimer);
    if (onSearch) onSearch('');
    if (shouldFocus) input.focus();
  };

  input.addEventListener('input', () => {
    SearchQuery = input.value;
    const trimmed = SearchQuery.trim();

    if (clearBtn) {
      clearBtn.style.display = trimmed ? 'flex' : 'none';
    }

    // Debounce callback to avoid layout thrashing on fast keystrokes
    clearTimeout(DebounceTimer);
    DebounceTimer = setTimeout(() => {
      if (onSearch) onSearch(trimmed);
    }, 180);
  });

  // Escape key cancels/clears search and unfocuses
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      handleClear(false);
      input.blur();
    }
  });

  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      handleClear(true);
    });
  }
}

// Returns the Set of currently selected note IDs

// Clears all selected note IDs and resets delete button state
function ClearSelectedNotes() {
  SelectedNoteIds.clear();
  UpdateDeleteButtonState();
}

// Adds or removes a note ID from selection Set and updates delete button UI
function ToggleNoteSelection(noteId, isChecked) {
  if (isChecked) {
    SelectedNoteIds.add(noteId);
  } else {
    SelectedNoteIds.delete(noteId);
  }
  UpdateDeleteButtonState();
