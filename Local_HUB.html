        },
        {
          "id": "b_lat_t1",
          "type": "text",
          "content": "- [x] **Full KaTeX Math Engine**: Fast client-side compilation of standard LaTeX math (`$...$` inline and `$$...$$` display).\n- [x] **AMS-LaTeX Environments**: `equation*`, `align*`, `aligned`, `gather*`, `gathered`, `cases`, `dcases`, `rcases`, `matrix`, `pmatrix`, `bmatrix`, `Bmatrix`, `vmatrix`, `Vmatrix`, `array`, `split`.\n- [x] **Delimiters & Bracing**: Dynamic `\\left ... \\right`, manual `\\bigl`, `\\Bigl`, `\\biggl`, `\\Biggl`, horizontal braces `\\underbrace{...}_{...}`, `\\overbrace{...}^{...}`.\n- [x] **Calculus, Summations & Operators**: Integrals `\\int`, `\\iint`, `\\iiint`, `\\oint`, summations `\\sum`, products `\\prod`, limits `\\lim`, differentials `\\mathrm{d}x`, partials `\\partial`, vector del `\\nabla`.\n- [x] **Mathematical Fonts**: `\\mathbb{R}`, `\\mathbf{x}`, `\\boldsymbol{v}`, `\\mathrm{d}`, `\\mathit{x}`, `\\mathcal{L}`, `\\mathscr{E}`, `\\mathfrak{g}`, `\\mathsf{T}`, `\\mathtt{x}`.\n- [x] **Text & Color Formatting**: `\\textcolor{#hex}{...}`, `\\colorbox{...}{...}`, `\\boxed{...}`, `\\cancel{...}`, `\\underline{...}`.\n- [x] **TikZ Diagrams**: Full vector TikZ graphics compiled natively in browser via TikZJax (`\\begin{tikzpicture} ... \\end{tikzpicture}`).\n- [x] **Interactive Markdown Features**: Razor-sharp vector task checkboxes (`- [ ]`, `- [x]`), bullet lists, bold `**...**`, italic `*...*`, strikethrough `~~...~~`, and bidirectional `[[WikiLinks]]`.\n\n### What CANNOT Be Used (Browser-Side Limitations):\n- [ ] **External LaTeX CLI Packages**: Cannot load arbitrary server-side `.sty` files requiring `pdflatex` / `xelatex` (e.g. `\\usepackage{microtype}`, `\\usepackage{pgfplots}` with external gnuplot, or raw `pythontex`).\n- [ ] **Low-Level TeX Primitives**: Low-level TeX engine macro programming (`\\catcode`, `\\expandafter`, `\\csname`, `\\def\\temp`) are not supported in KaTeX.\n- [ ] **External BibTeX Files**: Cannot load external `.bib` files directly via `\\bibliography{...}` (use direct references or WikiLinks `[[...]]`).\n- [ ] **Multi-Page Float Layout Engines**: Page-break engines (`\\clearpage`, float-page repositioning) are handled by clean fluid web layouts rather than fixed DVI pagination."

          "id": "b_lat_t2",
          "type": "text",
          "content": "- **Inline Math**: `$f(x) = \\frac{1}{x}$` renders inline with surrounding text: $f(x) = \\frac{1}{x}$.\n- **Display Math**: `$$\\int_a^b f(x) \\, \\mathrm{d}x$$` renders on its own centered line:\n$$\\int_a^b f(x) \\, \\mathrm{d}x$$\n- **Style Specifiers**:\n  - `\\displaystyle \\sum_{k=1}^n k`: Forces full display height $\\displaystyle \\sum_{k=1}^n k$.\n  - `\\textstyle \\frac{a}{b}`: Forces inline size $\\textstyle \\frac{a}{b}$.\n  - `\\scriptstyle x`: First-level index size $\\scriptstyle x$.\n  - `\\scriptscriptstyle x`: Nested script size $\\scriptscriptstyle x$."

          "id": "b_lat_eq3",

          "tex": "\\begin{pmatrix} a & b \\\\ c & d \\end{pmatrix}, \\quad\n\\begin{bmatrix} 1 & 0 & 0 \\\\ 0 & 1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}, \\quad\n\\begin{vmatrix} x_1 & y_1 \\\\ x_2 & y_2 \\end{vmatrix}, \\quad\n\\begin{Bmatrix} \\alpha & \\beta \\\\ \\gamma & \\delta \\end{Bmatrix}, \\quad\n\\begin{Vmatrix} A_{11} & A_{12} \\\\ A_{21} & A_{22} \\end{Vmatrix}"

        {
          "id": "b_lat_h3_4",
          "type": "heading",
          "level": "h2",
          "title": "Nested Sub-Derivations (Array inside Aligned)"
        },
        {
          "id": "b_lat_eq3_4",
          "type": "equation",
          "tex": "\\begin{aligned}\n\\int x^2 e^{-x^2} \\, \\mathrm{d}x &= \\int x \\cdot \\left( x e^{-x^2} \\right) \\mathrm{d}x \\\\\n  &\\quad \\left[\n    \\begin{array}{ll}\n      \\text{Integration by Parts:} & \\\\\n      u = x & \\implies \\mathrm{d}u = \\mathrm{d}x \\\\\n      \\mathrm{d}v = x e^{-x^2} \\mathrm{d}x & \\implies v = -\\frac{1}{2} e^{-x^2}\n    \\end{array}\n  \\right] \\\\\n  &= u v - \\int v \\, \\mathrm{d}u \\\\\n  &= -\\frac{1}{2} x e^{-x^2} - \\int \\left( -\\frac{1}{2} e^{-x^2} \\right) \\mathrm{d}x \\\\\n  &= -\\frac{1}{2} x e^{-x^2} + \\frac{1}{2} \\int e^{-x^2} \\, \\mathrm{d}x + C\n\\end{aligned}"
        },
        {
          "id": "b_lat_t3_4",
          "type": "text",
          "content": "- **Outer `aligned`**: Aligns the primary mathematical derivation sequence at `&=`.\n- **Inner `array`**: Nests side calculations, substitution tables, or coordinate transforms (`\\begin{array}{ll} ... \\end{array}`) with their own internal `&` and `\\\\` delimiters without breaking outer derivation alignment."
        },

          "id": "b_lat_h4",
          "type": "heading",
          "level": "h1",
          "title": "Delimiters, Braces & Scaled Enclosures"

          "id": "b_lat_eq4",
          "type": "equation",
          "tex": "\\left( \\frac{\\sum_{i=1}^n x_i^2}{\\sqrt[3]{1 + \\frac{a}{b}}} \\right) = \\underbrace{a_1 + a_2 + \\cdots + a_k}_{\\text{Sum of } k \\text{ terms}} + \\overbrace{b_1 + b_2 + \\cdots + b_m}^{\\text{Sum of } m \\text{ terms}}"
        },
        {
          "id": "b_lat_t4",
          "type": "text",
          "content": "- **Auto-sizing Delimiters**: `\\left( ... \\right)`, `\\left[ ... \\right]`, `\\left\\{ ... \\right\\}`, `\\left| ... \\right|`, `\\left\\| ... \\right\\|`, `\\left\\langle ... \\right\\rangle`, `\\left\\lfloor ... \\right\\rfloor`, `\\left\\lceil ... \\right\\rceil`.\n- **Evaluated-at Bar**: `\\left. \\frac{\\mathrm{d}f}{\\mathrm{d}x} \\right|_{x=0}` produces $\\left. \\frac{\\mathrm{d}f}{\\mathrm{d}x} \\right|_{x=0}$.\n- **Manual Sizing Scale**: `\\bigl( \\dots \\bigr) < \\Bigl( \\dots \\Bigr) < \\biggl( \\dots \\biggr) < \\Biggl( \\dots \\Biggr)`."

        {

ract hierarchy\n% --------------------------------------------------------------------\n\\node[hierarchy=blue!12, text width=39mm] (vector) at (4.18,3.25)\n      {\\textbf{Vector space}\\\\[-1pt]\n       addition and scalar multiplication};\n\\node[hierarchy=blue!11] (normed) at (2.25,1.65)\n      {\\textbf{Normed space}\\\\ length $\\|u\\|$};\n\\node[hierarchy=orange!13] (inner) at (6.10,1.65)\n      {\\textbf{Inner-product space}\\\\ angle $\\langle u,v\\rangle$};\n\\node[hierarchy=blue!24] (banach) at (2.25,-0.15)\n      {\\textbf{BANACH}\\\\ normed $+$ complete};\n\\node[hierarchy=orange!32] (hilbert) at (6.10,-0.15)\n      {\\textbf{HILBERT}\\\\ inner product $+$ complete};\n\\draw[flow] (vector.south) -- ++(0,-0.25) -| (normed.north);\n\\draw[flow] (vector.south) -- ++(0,-0.25) -| (inner.north);\n\\draw[flow] (normed) -- (banach);\n\\draw[flow] (inner) -- (hilbert);\n% FIXED: changed \\node to node\n\\draw[link] (hilbert.north west) to[bend right=16] (banach.north east)\n      node[midway, above=1pt, fill=white, inner sep=1.5pt,\n           font=\\sffamily\\tiny\\bfseries, text=orange!65!black]\n      {Hilbert $\\Longrightarrow$ Banach};\n\\node[note, draw=blue!45, fill=blue!4, text width=31mm]\n      (banachex) at (2.25,-2.05)\n      {Typical Banach examples\\\\[1pt]\n       $L^p(\\Omega)$ for $p\\ne2$\\\\\n       $C^0$ with the supremum norm};\n\\node[note, draw=orange!55, fill=orange!5, text width=31mm]\n      (hilbertex) at (6.10,-2.05)\n      {Typical Hilbert examples\\\\[1pt]\n       $L^2(\\Omega)$ and $H^k(\\Omega)$\\\\\n       with their standard inner products};\n\\draw[flow, draw=blue!55!black] (banach) -- (banachex);\n\\draw[flow, draw=orange!65!black] (hilbert) -- (hilbertex);\n\\node[note, fill=blue!3, text width=61mm] at (4.18,-3.75)\n      {\\textbf{Completeness:} every Cauchy sequence converges to an element\n       of the same space---there are no missing limit points.};\n% --------------------------------------------------------------------\n% Shared conclusion\n% --------------------------------------------------------------------\n\\node[rounded corners=5pt, draw=orange!60!black, fill=orange!10,\n      line width=0.8pt, minimum width=15.25cm, minimum height=9mm,\n      align=center, font=\\sffamily\\scriptsize, text=black!78]\n      at (0,-5.35)\n      {\\textbf{Key relation (for bounded $\\Omega$):}\\quad\n       $C^\\infty(\\overline\\Omega)\\subset H^2(\\Omega)\\subset H^1(\\Omega)\n       \\subset L^2(\\Omega)\\subset L^1(\\Omega)$.\\quad\n       In particular, $L^2$ and the Sobolev spaces $H^k$ are Hilbert spaces.};\n\\end{tikzpicture}",

-----\n\\node[space=teal!9, minimum width=6.45cm, minimum height=7.10cm]\n      (Lone) at (-4.15,-0.05) {};\n\\node[space=cyan!13, minimum width=5.30cm, minimum height=5.75cm]\n      (Ltwo) at (-4.15,-0.52) {};\n\\node[space=orange!18, minimum width=4.10cm, minimum height=4.35cm]\n      (Hone) at (-4.15,-0.96) {};\n\\node[space=orange!32, minimum width=2.75cm, minimum height=2.60cm]\n      (Htwo) at (-4.15,-1.38) {};\n\\node[space=orange!55, minimum width=1.55cm, minimum height=0.80cm]\n      (Cinf) at (-4.15,-1.78) {$C^\\infty(\\overline\\Omega)$};\n\\node[caption, text=teal!45!black] at (-4.15,3.10)\n      {\\textbf{$L^1(\\Omega)$}\\quad $\\displaystyle\\int_\\Omega |u| \\,\\mathrm d x<\\infty$};\n\\node[caption, text=cyan!35!black] at (-4.15,1.95)\n      {\\textbf{$L^2(\\Omega)$}\\quad\n       $\\langle u,v\\rangle_{L^2}=\\displaystyle\\int_\\Omega uv\\,\\mathrm d x$};\n\\node[caption, text=orange!55!black] at (-4.15,0.72)\n      {\\textbf{$H^1(\\Omega)$}\\quad\n       $\\displaystyle\\int_\\Omega\\bigl(|u|^2+|nabla u|^2\\bigr)\\,\\mathrm d x<\\infty$};\n\\node[caption, text=orange!65!black] at (-4.15,-0.48)\n      {\\textbf{$H^2(\\Omega)$}\\quad weak derivatives through order $2$};\n\\draw[flow, draw=teal!55!black] (-7.32,2.55) -- (-7.32,-2.45);\n\\node[rotate=90, font=\\sffamily\\tiny\\bfseries, text=teal!55!black]\n      at (-7.55,0.05) {INCREASING REGULARITY};\n\\node[note, draw=orange!50, fill=orange!6, text width=34mm]\n      (velocity) at (-5.15,-4.03)\n      {$\\star$ The velocity $V$ belongs to $H^1(\\Omega)$ in the model.};\n\\draw[link] (velocity.north) to[bend left=12] (Hone.248);\n\\node[note, dashed, draw=purple!55, fill=purple!4, text width=25mm]\n      (Hneg) at (-1.95,-4.03)\n      {$H^{-1}(\\Omega)=(H_0^1(\\Omega))'$\\\\[-1pt]\n       dual / rough-data space};\n\\draw[flow, dashed, draw=purple!65!black]\n      (Hneg.north west) to[bend right=16] (Hone.325);\n% --------------------------------------------------------------------\n% Right panel: abstract hierarchy\n% --------------------------------------------------------------------\n\\node[hierarchy=blue!12, text width=39mm] (vector) at (4.18,3.25)\n      {\\textbf{Vector space}\\\\[-1pt]\n       addition and scalar multiplication};\n\\node[hierarchy=blue!11] (normed) at (2.25,1.65)\n      {\\textbf{Normed space}\\\\ length $\\|u\\|$};\n\\node[hierarchy=orange!13] (inner) at (6.10,1.65)\n      {\\textbf{Inner-product space}\\\\ angle $\\langle u,v\\rangle$};\n\\node[hierarchy=blue!24] (banach) at (2.25,-0.15)\n      {\\textbf{BANACH}\\\\ normed $+$ complete};\n\\node[hierarchy=orange!32] (hilbert) at (6.10,-0.15)\n      {\\textbf{HILBERT}\\\\ inner product $+$ complete};\n\\draw[flow] (vector.south) -- ++(0,-0.25) -| (normed.north);\n\\draw[flow] (vector.south) -- ++(0,-0.25) -| (inner.north);\n\\draw[flow] (normed) -- (banach);\n\\draw[flow] (inner) -- (hilbert);\n% FIXED: changed \\node to node\n\\draw[link] (hilbert.north west) to[bend right=16] (banach.north east)\n      node[midway, above=1pt, fill=white, inner sep=1.5pt,\n           font=\\sffamily\\tiny\\bfseries, text=orange!65!black]\n      {Hilbert $\\Longrightarrow$ Banach};\n\\node[note, draw=blue!45, fill=blue!4, text width=31mm]\n      (banachex) at (2.25,-2.05)\n      {Typical Banach examples\\\\[1pt]\n       $L^p(\\Omega)$ for $p\\ne2$\\\\\n       $C^0$ with the supremum norm};\n\\node[note, draw=orange!55, fill=orange!5, text width=31mm]\n      (hilbertex) at (6.10,-2.05)\n      {Typical Hilbert examples\\\\[1pt]\n       $L^2(\\Omega)$ and $H^k(\\Omega)$\\\\\n       with their standard inner products};\n\\draw[flow, draw=blue!55!black] (banach) -- (banachex);\n\\draw[flow, draw=orange!65!black] (hilbert) -- (hilbertex);\n\\node[note, fill=blue!3, text width=61mm] at (4.18,-3.75)\n      {\\textbf{Completeness:} every Cauchy sequence converges to an element\n       of the same space---there are no missing limit points.};\n% -------------------------------------------------------------------         {
          "id": "b_fas_t2",
          "type": "text",
          "content": "- **Nested Regularity Inclusion (Bounded $\\Omega$)**:\n  $$\n  C^\\infty(\\overline\\Omega) \\subset H^2(\\Omega) \\subset H^1(\\Omega) \\subset L^2(\\Omega) \\subset L^1(\\Omega)\n  $$\n- **Sobolev Spaces as Hilbert Spaces**:\n  - The space $L^2(\\Omega)$ is a Hilbert space equipped with inner product $\\langle u, v \\rangle_{L^2} = \\int_\\Omega uv \\, \\mathrm{d}x$.\n  - Sobolev spaces $H^k(\\Omega) = W^{k,2}(\\Omega)$ are Hilbert spaces under the inner product $\\langle u, v \\rangle_{H^k} = \\sum_{|\\alpha| \\le k} \\int_\\Omega D^\\alpha u D^\\alpha v \\, \\mathrm{d}x$.\n- **Banach vs. Hilbert**:\n  - Every Hilbert space is automatically a Banach space (its norm is induced by the inner product via $\\|u\\| = \\sqrt{\\langle u, u \\rangle}$).\n  - $L^p(\\Omega)$ for $p \\neq 2$ is a Banach space, but **not** a Hilbert space (it fails the parallelogram law)."
        }

// InitThemeToggleLogic(): Change the Theme on click and Update the storage.
function InitThemeToggleLogic() {
  const btn = document.getElementById('theme-toggle-btn');

  // Load saved theme or default to dark
  const savedTheme = localStorage.getItem('lh_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);

  if (btn) {
    btn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';

      // Option A: Clean, Instant Theme Switch (disable transitions during theme flip)
      document.documentElement.classList.add('theme-switching');
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('lh_theme', next);

      // Re-enable transitions on the next animation frame for normal hover effects
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove('theme-switching');
        });
      });
    });
  }
}

// GetScrollbarStyles: HTML and CSS for ultra-thin (4px) for scrollbars Theme Changable
function GetScrollbarStyles() {
  return `
    <style id="universal-scrollbar-styles">
      /* Universal Thin Opposite-Theme Scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 234, 242, 0.45) transparent;
      }

      [data-theme="light"] *,
      [data-theme="light"] *::before,
      [data-theme="light"] *::after {
        scrollbar-color: rgba(26, 29, 46, 0.45) transparent;
      }

      /* WebKit & Chromium Horizontal & Vertical Scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }

      ::-webkit-scrollbar-track {
        background: transparent !important;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(232, 234, 242, 0.42);
        border-radius: 9999px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.85);
      }

      [data-theme="light"] ::-webkit-scrollbar-thumb {
        background: rgba(26, 29, 46, 0.42);
      }

      [data-theme="light"] ::-webkit-scrollbar-thumb:hover {
        background: rgba(0, 0, 0, 0.85);
      }

      ::-webkit-scrollbar-corner {
        background: transparent !important;
      }
    </style>
  `;
}

// InitScrollbar: Checks if the style tag already exists in <head>, and if not, appends it so all containers throughout the app get thin scrollbars
function InitScrollbar() {
  if (typeof document !== 'undefined' && !document.getElementById('universal-scrollbar-styles')) {
    const temp = document.createElement('div');
    temp.innerHTML = GetScrollbarStyles();
    const styleEl = temp.querySelector('style');
    if (styleEl) {
      document.head.appendChild(styleEl);
    }
  }
}

function sanitizeImportedNote(n, idx = 0) {
  if (!n || typeof n !== 'object') {
    return {
      id: `note_${Date.now()}_${idx}`,
      title: 'Untitled Note',
      folder: 'General',
      tags: [],
      blocks: [],
      macros: { equation: '', tikz: '' },
      meta: { created: new Date().toISOString().slice(0, 10), author: 'User' }
    };
  }
  return {
    id: n.id || `note_${Date.now()}_${idx}`,
    slug: n.slug || (n.title ? n.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') : `note-${idx}`),
    title: n.title || 'Untitled Note',
    folder: n.folder || 'General',
    tags: Array.isArray(n.tags) ? n.tags : [],
    description: n.description || '',
    meta: n.meta || { created: new Date().toISOString().slice(0, 10), author: 'User' },
    flashcard: n.flashcard || null,
    blocks: Array.isArray(n.blocks) ? n.blocks : [],
    autoNumbering: n.autoNumbering || { h1: 'numeric', h2: 'numeric', h3: 'numeric' },
    logo: n.logo || null,
    macros: (n.macros && typeof n.macros === 'object') ? {
      equation: n.macros.equation || '',
      tikz: n.macros.tikz || ''
    } : { equation: '', tikz: '' }
  };
}

// Logic For Universal Self-Healing Import
function TriggerImport(onSuccess = null) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const importedData = JSON.parse(event.target.result);
        if (!importedData || typeof importedData !== 'object') {
          throw new Error('Imported file does not contain a valid JSON object.');
        }

        const now = Date.now();
        let masterBlocks = {};

        // 1. Identify format: Master multi-tab container vs Single-tab direct payload
        if (importedData.LandingPageData || importedData.Bookmarks || importedData.NotesData) {
          masterBlocks = importedData;
        } else if (Array.isArray(importedData.notes) || importedData.vaultMeta) {
          masterBlocks['NotesData'] = importedData;
        } else if (Array.isArray(importedData.bookmarks) || importedData.sectionOrder) {
          masterBlocks['Bookmarks'] = importedData;
        } else if (Array.isArray(importedData.tabs)) {
          masterBlocks['LandingPageData'] = importedData;
        } else {
          // Generic master dictionary
          masterBlocks = importedData;
        }

        // 2. Universally sanitize, auto-create missing fields, and sync to DOM & localStorage
        for (const [id, rawData] of Object.entries(masterBlocks)) {
          if (!rawData || typeof rawData !== 'object') continue;

          let cleanData = JSON.parse(JSON.stringify(rawData));
          delete cleanData._unsaved;
          delete cleanData._savedAt;

          // Auto-create missing parts for NotesData
          if (id === 'NotesData' || Array.isArray(cleanData.notes) || cleanData.vaultMeta) {
            cleanData.vaultMeta = cleanData.vaultMeta || { title: "My Research & Notes Vault", version: "1.0.0" };
            cleanData.vaultMeta.lastSaved = now;
            cleanData.globalMacros = cleanData.globalMacros || { ...DEFAULT_MACROS };
            cleanData.tableTemplates = Array.isArray(cleanData.tableTemplates) ? cleanData.tableTemplates : [];
            cleanData.tikzTemplates = Array.isArray(cleanData.tikzTemplates) ? cleanData.tikzTemplates : [];
            cleanData.notes = Array.isArray(cleanData.notes) ? cleanData.notes.map(sanitizeImportedNote) : [];
            cleanData.folders = Array.isArray(cleanData.folders) && cleanData.folders.length > 0 
              ? cleanData.folders 
              : Array.from(new Set(cleanData.notes.map(n => n.folder || 'General').filter(Boolean)));
            cleanData.tags = Array.isArray(cleanData.tags) && cleanData.tags.length > 0 
              ? cleanData.tags 
              : Array.from(new Set(cleanData.notes.flatMap(n => n.tags || []).filter(Boolean)));
          }
          // Auto-create missing parts for Bookmarks
          else if (id === 'Bookmarks' || Array.isArray(cleanData.bookmarks)) {
            cleanData.bookmarks = Array.isArray(cleanData.bookmarks) ? cleanData.bookmarks : [];
            cleanData.sectionOrder = Array.isArray(cleanData.sectionOrder) ? cleanData.sectionOrder : ['ALL'];
            if (!cleanData.sectionOrder.includes('ALL')) cleanData.sectionOrder.unshift('ALL');
            cleanData._lastSaved = now;
          }
          // Auto-create missing parts for LandingPageData
          else if (id === 'LandingPageData' || Array.isArray(cleanData.tabs)) {
            cleanData.tabs = Array.isArray(cleanData.tabs) ? cleanData.tabs : [];
            cleanData._lastSaved = now;
          } else {
            cleanData._lastSaved = now;
          }

          // A. Update or create DOM <script type="application/json" id="...">
          let scriptBlock = document.getElementById(id);
          if (!scriptBlock) {
            scriptBlock = document.createElement('script');
            scriptBlock.type = 'application/json';
            scriptBlock.id = id;
            document.head.appendChild(scriptBlock);
          }
          scriptBlock.textContent = JSON.stringify(cleanData, null, 2);

          // B. Update in-memory window state objects if present
          if (typeof window !== 'undefined') {
            if (id === 'NotesData' && window.NotesState) Object.assign(window.NotesState, cleanData);
            if (id === 'Bookmarks' && window.BookmarkState) Object.assign(window.BookmarkState, cleanData);
            if (id === 'LandingPageData' && window.AppState) Object.assign(window.AppState, cleanData);
            if (window[id + 'State']) Object.assign(window[id + 'State'], cleanData);
            if (window[id]) Object.assign(window[id], cleanData);
          }

          // C. Save to LocalStorage with _unsaved: true and _savedAt: now
          // This guarantees that after page reload, each state module detects fresh uncommitted edits and restores them!
          try {
            if (typeof localStorage !== 'undefined') {
              const cachePayload = {
                ...cleanData,
                _unsaved: true,
                _savedAt: now
              };
              localStorage.setItem(id + '_Local_Cache', JSON.stringify(cachePayload));
            }
          } catch (err) {
            console.warn(`[Import] Failed to cache ${id} in localStorage:`, err);
          }
        }

        alert('Data imported successfully! All missing fields were automatically structured. Remember to click SAVE to make it permanent in your HTML.');

        if (onSuccess) {
          onSuccess(masterBlocks);
        } else {
          window.location.reload();
        }
      } catch (err) {
        alert('Invalid JSON file: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Logic For Universal Dynamic Export
function TriggerExport() {
  const masterBackup = {};
  const scripts = document.querySelectorAll('script[type="application/json"][id]');
  scripts.forEach(script => {
    const id = script.id;
    let foundData = null;

    // Check live in-memory window state matching id first
    const candidateKeys = [
      id,
      id + 'State',
      id.replace(/Data$/, '') + 'State',
      'App' + id,
      'AppState',
      'BookmarkState',
      'NotesState'
    ];

    for (const key of candidateKeys) {
      if (typeof window !== 'undefined' && window[key] && typeof window[key] === 'object' && Object.keys(window[key]).length > 0) {
        if (
          key === id ||
          key === id + 'State' ||
          key === id.replace(/Data$/, '') + 'State' ||
          (id === 'LandingPageData' && key === 'AppState') ||
          (id === 'Bookmarks' && key === 'BookmarkState') ||
          (id === 'NotesData' && key === 'NotesState')
        ) {
          foundData = window[key];
          break;
        }
      }
    }

    if (!foundData) {
      try {
        foundData = JSON.parse(script.textContent);
      } catch (e) { }
    }

    if (foundData) {
      const cleanData = JSON.parse(JSON.stringify(foundData));
      delete cleanData._unsaved;
      delete cleanData._savedAt;
      masterBackup[id] = cleanData;
    }
  });

  const dataStr = JSON.stringify(masterBackup, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Local_HUB_DATA.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Automatically syncs all DOM <script type="application/json"> blocks with live window states and localStorage caches
function syncAllStatesToDOM(doc) {
  if (typeof window === 'undefined') return;

  const now = Date.now();
  const dataScripts = doc.querySelectorAll('script[type="application/json"][id]');
  dataScripts.forEach(script => {
    const id = script.id;
    let foundData = null;

    // 1. Check window state matching id (e.g. window.BookmarkState, window.NotesState, window.AppState, window[id])
    const candidateKeys = [
      id,
      id + 'State',
      id.replace(/Data$/, '') + 'State',
      'App' + id,
      'AppState',
      'BookmarkState',
      'NotesState'
    ];

    for (const key of candidateKeys) {
      if (window[key] && typeof window[key] === 'object' && Object.keys(window[key]).length > 0) {
        if (
          key === id ||
          key === id + 'State' ||
          key === id.replace(/Data$/, '') + 'State' ||
          (id === 'LandingPageData' && key === 'AppState') ||
          (id === 'Bookmarks' && key === 'BookmarkState') ||
          (id === 'NotesData' && key === 'NotesState')
        ) {
          foundData = window[key];
          break;
        }
      }
    }

    // 2. Check localStorage cache for latest edits only if not found in live window state
    if (!foundData) {
      const cacheKeys = [id + '_Local_Cache', id.replace(/Data$/, '') + '_Local_Cache', id];
      for (const ck of cacheKeys) {
        try {
          const cached = localStorage.getItem(ck);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed && typeof parsed === 'object') {
              foundData = parsed;
              break;
            }
          }
        } catch (e) { }
      }
    }

    if (foundData) {
      try {
        // Deep clone to sanitize and set lastSaved
        const cleanData = JSON.parse(JSON.stringify(foundData));
        delete cleanData._unsaved;
        delete cleanData._savedAt;

        if (id === 'NotesData') {
          if (!cleanData.vaultMeta) cleanData.vaultMeta = {};
          cleanData.vaultMeta.lastSaved = now;
          if (window.NotesState && window.NotesState.vaultMeta) {
            window.NotesState.vaultMeta.lastSaved = now;
          }
        } else {
          cleanData._lastSaved = now;
          if (id === 'Bookmarks' && window.BookmarkState) {
            window.BookmarkState._lastSaved = now;
          } else if (id === 'LandingPageData' && window.AppState) {
            window.AppState._lastSaved = now;
          }
        }

        script.textContent = JSON.stringify(cleanData, null, 2);

        // Also update live in-memory document script tag
        if (typeof document !== 'undefined') {
          const liveScript = document.getElementById(id);
          if (liveScript && liveScript !== script) {
            liveScript.textContent = JSON.stringify(cleanData, null, 2);
          }
        }
      } catch (e) { }
    }
  });
}

// Clears all unsaved local cache keys from browser localStorage
function ClearAllLocalCaches() {
  if (typeof localStorage === 'undefined') return;
  // 1. Clear known tab cache keys based on DOM data blocks
  if (typeof document !== 'undefined') {
    const dataScripts = document.querySelectorAll('script[type="application/json"][id]');
    dataScripts.forEach(s => {
      try {
        localStorage.removeItem(s.id + '_Local_Cache');
        localStorage.removeItem(s.id.replace(/Data$/, '') + '_Local_Cache');
        localStorage.removeItem(s.id);
      } catch (e) { }
    });
  }
  // 2. Also sweep any key in localStorage ending with _Local_Cache
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const key = localStorage.key(i);
      if (key && (key.endsWith('_Local_Cache') || key.includes('_Cache'))) {
        localStorage.removeItem(key);
      }
    }
  } catch (e) { }
  console.log('[Save] All unsaved local caches flushed successfully.');
}

/**
 * 00_Components/06_Color_Selector.js
 * Universal Dual-Theme Color Selector Component [ + | ○ Light | ○ Dark ].
 * Supports:
 * - Dual-color specification: Light Mode Hex & Dark Mode Hex (#Light|#Dark)
 * - Dynamic theme detection (observes [data-theme="light"] vs default dark)
 * - Clickable color swatches with native <input type="color">
 * - Active swatch highlighting according to current system/app theme
 * - Shared helper resolveThemeColors() to translate #Light|#Dark into current theme hex
 */

let activeLightColor = '#dc2626'; // Default red for light mode
let activeDarkColor = '#f87171';  // Default bright coral for dark mode

/**
 * Resolves dual-theme color syntax #LightHex|#DarkHex into a single valid hex code
 * based on the active theme.
 * Also handles \textcolor{#Light|#Dark}{...}
 */
function resolveThemeColors(text, isDarkMode = null) {
  if (!text || typeof text !== 'string') return text || '';
  const isDark = (isDarkMode !== null)
    ? isDarkMode
    : (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme') !== 'light');

  // Replace #light|#dark with active theme hex
  return text.replace(/#([0-9a-fA-F]{3,8})\|#([0-9a-fA-F]{3,8})/g, (_, light, dark) => {
    return isDark ? `#${dark}` : `#${light}`;
  });
}

/**
 * Returns currently active color pair
 */
function getCurrentColorPair() {
  return {
    light: activeLightColor,
    dark: activeDarkColor,
    dual: `${activeLightColor}|${activeDarkColor}`,
    activeHex: (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme') === 'light')
      ? activeLightColor
      : activeDarkColor
  };
}

/**
 * Sets current active colors programmatically
 */
function setCurrentColorPair(light, dark) {
  if (light) activeLightColor = light;
  if (dark) activeDarkColor = dark;
}

/**
 * Creates a DOM node for the [ + | ○ Light | ○ Dark ] component.
 */
function CreateColorSelector({
  defaultLight = activeLightColor,
  defaultDark = activeDarkColor,
  onApply = null,        // Called when [+] is clicked: ({ light, dark, dual, activeHex })
  onColorChange = null,  // Called when either light or dark color is adjusted
  btnTitle = "Insert color code at cursor",
  className = ""
} = {}) {
  let light = defaultLight || activeLightColor;
  let dark = defaultDark || activeDarkColor;

  const container = document.createElement('div');
  container.className = `color-selector-widget inline-flex items-center rounded-md border border-[var(--border)] bg-[var(--surface)] h-7 overflow-hidden flex-shrink-0 shadow-xs select-none transition-all ${className}`;

  container.innerHTML = `
    <!-- Plus / Apply Button -->
    <button type="button" class="btn-color-apply px-2 h-full text-xs font-bold hover:bg-[var(--card-hover)] active:scale-95 transition-all flex items-center justify-center text-[var(--text)] cursor-pointer" title="${btnTitle}">
      <span class="text-sm font-bold leading-none select-none">+</span>
    </button>

    <div class="w-[1px] h-3.5 bg-[var(--border)] flex-shrink-0"></div>

    <!-- Light Mode Swatch (Sun Icon / L) -->
    <label class="swatch-label swatch-light px-1.5 h-full flex items-center justify-center cursor-pointer hover:bg-[var(--card-hover)] transition-all relative flex-shrink-0" title="Light Theme Color (Click to change)">
      <span class="swatch-dot swatch-dot-light w-3 h-3 rounded-full border border-black/25 shadow-xs inline-block transition-transform hover:scale-110" style="background-color: ${light};"></span>
      <span class="absolute bottom-0.5 right-0.5 w-1 h-1 rounded-full bg-amber-400 opacity-80 pointer-events-none" title="Light mode"></span>
      <input type="color" class="input-color-light absolute inset-0 opacity-0 cursor-pointer w-full h-full" value="${light}" />
    </label>

    <div class="w-[1px] h-3.5 bg-[var(--border)] flex-shrink-0"></div>

    <!-- Dark Mode Swatch (Moon Icon / D) -->
    <label class="swatch-label swatch-dark px-1.5 h-full flex items-center justify-center cursor-pointer hover:bg-[var(--card-hover)] transition-all relative flex-shrink-0" title="Dark Theme Color (Click to change)">
      <span class="swatch-dot swatch-dot-dark w-3 h-3 rounded-full border border-white/30 shadow-xs inline-block transition-transform hover:scale-110" style="background-color: ${dark};"></span>
      <span class="absolute bottom-0.5 right-0.5 w-1 h-1 rounded-full bg-indigo-400 opacity-80 pointer-events-none" title="Dark mode"></span>
      <input type="color" class="input-color-dark absolute inset-0 opacity-0 cursor-pointer w-full h-full" value="${dark}" />
    </label>
  `;

  const btnApply = container.querySelector('.btn-color-apply');
  const inputLight = container.querySelector('.input-color-light');
  const dotLight = container.querySelector('.swatch-dot-light');
  const labelLight = container.querySelector('.swatch-light');

  const inputDark = container.querySelector('.input-color-dark');
  const dotDark = container.querySelector('.swatch-dot-dark');
  const labelDark = container.querySelector('.swatch-dark');

  // Update theme highlight on swatches
  function updateThemeHighlight() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) {
      labelLight.classList.add('bg-amber-500/20');
      labelDark.classList.remove('bg-indigo-500/20');
    } else {
      labelDark.classList.add('bg-indigo-500/20');
      labelLight.classList.remove('bg-amber-500/20');
    }
  }
  updateThemeHighlight();

  // Watch for theme changes
  const observer = new MutationObserver(() => {
    updateThemeHighlight();
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // Light color input change
  inputLight.addEventListener('input', (e) => {
    light = e.target.value;
    activeLightColor = light;
    dotLight.style.backgroundColor = light;
    if (onColorChange) onColorChange({ light, dark, dual: `${light}|${dark}` });
  });

  // Dark color input change
  inputDark.addEventListener('input', (e) => {
    dark = e.target.value;
    activeDarkColor = dark;
    dotDark.style.backgroundColor = dark;
    if (onColorChange) onColorChange({ light, dark, dual: `${light}|${dark}` });
  });

  // Apply button clicked
  btnApply.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const activeHex = isLight ? light : dark;
    if (onApply) {
      onApply({
        light,
        dark,
        dual: `${light}|${dark}`,
        activeHex,
        latexCommand: `\\textcolor{${light}|${dark}}{}`
      });
    }
  });

  return container;
}

function LoadLandingPage() {

/* --- 01_Landing_Page/00_State.js --- */
// AppState is a variable that stores the Tab Data
let AppState = { tabs: [] };

// Reads and parses JSON from #LandingPageData, updates AppState and window.AppState.
function LoadLandingState() {
  const dataBlock = typeof document !== 'undefined' ? document.getElementById('LandingPageData') : null;
  let domState = null;

  if (dataBlock && dataBlock.textContent.trim()) {
    try {
      domState = JSON.parse(dataBlock.textContent);
    } catch (e) {
      console.error("Failed to parse LandingPageData:", e);
    }
  }

  // 1. Check if browser Local Storage has an active unsaved crash recovery buffer
  try {
    const cached = typeof localStorage !== 'undefined' ? localStorage.getItem('LandingPageData_Local_Cache') : null;
    if (cached) {
      const parsedCache = JSON.parse(cached);
      const domTimestamp = domState?._lastSaved || 0;
      const cacheTimestamp = parsedCache?._savedAt || 0;

      // Only restore from cache if it represents active unsaved edits newer than the HTML file
      if (parsedCache && parsedCache._unsaved === true && cacheTimestamp > domTimestamp && Array.isArray(parsedCache.tabs)) {
        console.log('[LandingState] Recovering uncommitted tab edits from local cache...');
        AppState = {
          tabs: parsedCache.tabs,
          _lastSaved: cacheTimestamp
        };
        if (dataBlock) dataBlock.textContent = JSON.stringify(AppState, null, 2);
        if (typeof window !== 'undefined') window.AppState = AppState;
        return AppState;
      }
    }
  } catch (e) {
    console.warn('Could not read LandingPageData_Local_Cache:', e);
  }

  // 2. Pure, clean load directly from HTML data vault (#LandingPageData)
  if (domState) {
    AppState = {
      tabs: Array.isArray(domState.tabs) ? domState.tabs : [],
      _lastSaved: domState._lastSaved || 0
    };
    if (typeof window !== 'undefined') window.AppState = AppState;
    return AppState;
  }

  // 3. Default fallback
  AppState = { tabs: [], _lastSaved: 0 };
  if (typeof window !== 'undefined') window.AppState = AppState;
  return AppState;
}

// Runs on startup to read existing data from HTML into JavaScript memory (AppState).
LoadLandingState();

// Serializes AppState into #LandingPageData and unsaved localStorage cache
function SaveLandingState() {
  const dataBlock = typeof document !== 'undefined' ? document.getElementById('LandingPageData') : null;
  if (dataBlock) {
    dataBlock.textContent = JSON.stringify(AppState, null, 2);
  }
  if (typeof window !== 'undefined') {
    window.AppState = AppState;
  }

  try {
    if (typeof localStorage !== 'undefined') {
      const cachePayload = {
        ...AppState,
        _unsaved: true,
        _savedAt: Date.now()
      };
      localStorage.setItem('LandingPageData_Local_Cache', JSON.stringify(cachePayload));
    }
  } catch (e) {
    console.warn('Failed to save LandingPageData to localStorage:', e);
  }
}

// Function to empty/clear unsaved cache after downloading / saving standalone HTML
function ClearLandingLocalCache() {
  try {
    if (typeof localStorage !== 'undefined') {
      localStorage.removeItem('LandingPageData_Local_Cache');
    }
  } catch (e) {
    console.warn('Failed to clear LandingPageData_Local_Cache:', e);
  }
}

// Builds interactive 3D floating tab orbs with physics, particle clusters, shaders, and drag/click navigation using Three.js

const BallGeo = new THREE.SphereGeometry(0.16, 8, 8);
const ShellGeoTab = new THREE.IcosahedronGeometry(4.0, 2);

function MakeLabel(Text, Color) {
  const Cv = document.createElement('canvas');
  Cv.width = 1024; Cv.height = 256;
  const Cx = Cv.getContext('2d');
  const Hex = '#' + new THREE.Color(Color).getHexString();
  Cx.textAlign = 'center'; Cx.textBaseline = 'middle';

  let Fs = 140;
  Cx.font = `700 ${Fs}px "JetBrains Mono", monospace`;
  while (Cx.measureText(Text).width > Cv.width * 0.80 && Fs > 40) {
    Fs -= 4;
    Cx.font = `700 ${Fs}px "JetBrains Mono", monospace`;
  }

  Cx.fillStyle = Hex;
  Cx.shadowColor = Hex;
  Cx.shadowBlur = 28;
  Cx.fillText(Text, 512, 128);
  Cx.shadowBlur = 18;
  Cx.fillText(Text, 512, 128);

  Cx.shadowColor = '#000000';
  Cx.shadowBlur = 6;
  Cx.lineWidth = 14;
  Cx.strokeStyle = '#000000';
  Cx.lineJoin = 'round';
  Cx.miterLimit = 2;
  Cx.strokeText(Text, 512, 128);

  Cx.shadowBlur = 0;
  Cx.fillStyle = '#ffffff';
  Cx.fillText(Text, 512, 128);

  const Tex = new THREE.CanvasTexture(Cv);
  Tex.minFilter = THREE.LinearFilter;
  const Mat = new THREE.SpriteMaterial({ map: Tex, transparent: true, depthTest: false, depthWrite: false, opacity: 0.95 });
  const S = new THREE.Sprite(Mat);
  // Change the set.(Width, Height, Depth) for the Tab Name
  S.scale.set(7, 1.75, 1);
  return S;
}
class Orb {
  constructor(Tab, Index, Total, Scene) {
    this.Tab = Tab;
    this.Index = Index;
    this.Color = new THREE.Color(Tab.Color);

    const Ang = (Index / Total) * Math.PI * 2 - Math.PI / 2;
    const Hr = 10;
    this.Pos = new THREE.Vector3(Math.cos(Ang) * Hr, Math.sin(Ang) * Hr + 3, 0);
    this.Vel = new THREE.Vector3((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.4, 0);
    this.Radius = 3.5;
    // Scaling The Orb When Hovering
    this.MaxScale = 1.5;

    this.Group = new THREE.Group();
    this.Group.position.copy(this.Pos);
    Scene.add(this.Group);

    this.Shell = new THREE.Mesh(ShellGeoTab, new THREE.MeshBasicMaterial({
      color: this.Color, wireframe: true, transparent: true, opacity: 0.22, depthWrite: false
    }));
    this.Group.add(this.Shell);

    this.ClusterGroup = new THREE.Group();
    this.Group.add(this.ClusterGroup);
    this.Balls = [];
    const BallMat = new THREE.MeshBasicMaterial({ color: this.Color, transparent: true, opacity: 0.55 });

    for (let I = 0; I < 14; I++) {
      const Ball = new THREE.Mesh(BallGeo, BallMat);
      const Th = Math.random() * Math.PI * 2;
      const Ph = Math.acos(Math.random() * 2 - 1);
      const R = this.Radius * (0.35 + Math.random() * 0.5);
      const Bp = new THREE.Vector3(R * Math.sin(Ph) * Math.cos(Th), R * Math.cos(Ph), R * Math.sin(Ph) * Math.sin(Th));
      Ball.position.copy(Bp);
      Ball.scale.setScalar(0.6 + Math.random() * 0.9);
      Ball.userData = { BasePos: Bp.clone(), Phase: Math.random() * Math.PI * 2, Speed: 0.4 + Math.random() * 0.8, Amp: 0.08 + Math.random() * 0.14 };
      this.ClusterGroup.add(Ball);
      this.Balls.push(Ball);
    }

    const MaxB = 14 * 13 / 2;
    this.BondPos = new Float32Array(MaxB * 6);
    this.BondGeo = new THREE.BufferGeometry();
    this.BondGeo.setAttribute('position', new THREE.BufferAttribute(this.BondPos, 3));
    this.BondGeo.setDrawRange(0, 0);
    this.Bonds = new THREE.LineSegments(this.BondGeo, new THREE.LineBasicMaterial({
      color: this.Color, transparent: true, opacity: 0.15, depthWrite: false
    }));
    this.ClusterGroup.add(this.Bonds);

    this.Core = new THREE.Mesh(
      new THREE.SphereGeometry(this.Radius * 0.28, 16, 16),
      new THREE.MeshBasicMaterial({ color: this.Color, transparent: true, opacity: 0.3, depthWrite: false, blending: THREE.AdditiveBlending })
    );
    this.Group.add(this.Core);

    this.Halo = new THREE.Mesh(
      new THREE.SphereGeometry(this.Radius * 1.4, 20, 20),
      new THREE.ShaderMaterial({
        uniforms: { UColor: { value: this.Color.clone() }, UHover: { value: 0 } },
        vertexShader: `varying vec3 vN; void main(){ vN = normalize(normalMatrix*normal); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `uniform vec3 UColor; uniform float UHover; varying vec3 vN; void main(){ float i = pow(0.7 - dot(vN, vec3(0,0,1)), 2.4); gl_FragColor = vec4(UColor, 1.0) * i * (0.16 + UHover * 0.35); }`,
        blending: THREE.AdditiveBlending, transparent: true, side: THREE.BackSide, depthWrite: false
      })
    );
    this.Group.add(this.Halo);

    this.HitSphere = new THREE.Mesh(
      new THREE.SphereGeometry(this.Radius * 1.5, 10, 10),
      new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
    );
    this.Group.add(this.HitSphere);

    this.Label = MakeLabel(Tab.Name, Tab.Color);
    this.Label.position.set(0, 0, 0); // Put it back perfectly in the center
    this.Label.renderOrder = 999;     // Force Three.js to draw this LAST (always on top)
    this.Group.add(this.Label);

    this.HoverT = 0;
    this.TargetHoverT = 0;
    this.IsDragging = false;
    this.DragOffset = new THREE.Vector3();
  }

  Update(Dt, Time, Orbs, Viewport) {
    // --- Responsive Scaling Logic ---
    const maxWindowW = 1024; // Width where laptop size starts
    const minWindowW = 400;  // Width where phone size starts
    const minOrbScale = 0.5; // 50% size on phones
    const maxOrbScale = 1.0; // 100% size on laptops
    
    let progress = (window.innerWidth - minWindowW) / (maxWindowW - minWindowW);
    progress = Math.max(0, Math.min(1, progress)); // Clamp between 0 and 1
    this.ResponsiveScale = minOrbScale + progress * (maxOrbScale - minOrbScale);
    
    // Update the physics radius dynamically
    this.Radius = 3.5 * this.ResponsiveScale;

    if (!this.IsDragging) {
      for (const Other of Orbs) {
        if (Other === this) continue;
        const Dx = this.Pos.x - Other.Pos.x;
        const Dy = this.Pos.y - Other.Pos.y;
        const D = Math.sqrt(Dx * Dx + Dy * Dy);
        
        // Scale the gap between orbs as well
        const ScaledGap = 1.5 * this.ResponsiveScale;
        const MinD = (this.Radius + Other.Radius + ScaledGap) * 3;
        
        if (D < MinD && D > 0.01) {
          const F = (MinD - D) / MinD * 0.28;
          this.Vel.x += (Dx / D) * F;
          this.Vel.y += (Dy / D) * F;
        }
      }

      const WallMargin = this.Radius * 4.0;
      const WallForce = 0.5;

      const LeftDist = this.Pos.x - Viewport.MinX;
      if (LeftDist < WallMargin) { this.Vel.x += (WallMargin - LeftDist) / WallMargin * WallForce; }
      const RightDist = Viewport.MaxX - this.Pos.x;
      if (RightDist < WallMargin) { this.Vel.x -= (WallMargin - RightDist) / WallMargin * WallForce; }
      const TopDist = Viewport.MaxY - this.Pos.y;
      if (TopDist < WallMargin) { this.Vel.y -= (WallMargin - TopDist) / WallMargin * WallForce * 0.5; } // Reduced top repulsion
      const BotDist = this.Pos.y - Viewport.MinY;
      if (BotDist < WallMargin) { this.Vel.y += (WallMargin - BotDist) / WallMargin * WallForce * 5.0; }

      // Center Attraction (Gravity moved upward to protect the footer)
      const CenterPull = 0.004; 
      const CenterY = 5.0; // The cluster will now naturally hover 5 units above the dead center
      this.Vel.x += (0 - this.Pos.x) * CenterPull;
      this.Vel.y += (CenterY - this.Pos.y) * CenterPull;

      this.Vel.x += (Math.random() - 0.5) * 0.008;
      this.Vel.y += (Math.random() - 0.5) * 0.008;

      this.Vel.multiplyScalar(0.93);
      this.Pos.add(this.Vel);

      const Hard = this.Radius * 1.0;
      if (this.Pos.x < Viewport.MinX + Hard) { this.Pos.x = Viewport.MinX + Hard; this.Vel.x = Math.abs(this.Vel.x) * 0.3; }
      if (this.Pos.x > Viewport.MaxX - Hard) { this.Pos.x = Viewport.MaxX - Hard; this.Vel.x = -Math.abs(this.Vel.x) * 0.3; }
      if (this.Pos.y < Viewport.MinY + Hard) { this.Pos.y = Viewport.MinY + Hard; this.Vel.y = Math.abs(this.Vel.y) * 0.3; }
      if (this.Pos.y > Viewport.MaxY - Hard) { this.Pos.y = Viewport.MaxY - Hard; this.Vel.y = -Math.abs(this.Vel.y) * 0.3; }
    } else {
      this.Vel.set(0, 0, 0);
    }
    this.Group.position.copy(this.Pos);

    for (const Ball of this.Balls) {
      const U = Ball.userData;
      Ball.position.x = U.BasePos.x + Math.sin(Time * U.Speed + U.Phase) * U.Amp;
      Ball.position.y = U.BasePos.y + Math.cos(Time * U.Speed * 1.3 + U.Phase) * U.Amp;
      Ball.position.z = U.BasePos.z + Math.sin(Time * U.Speed * 0.7 + U.Phase * 2) * U.Amp;
    }
    this.ClusterGroup.rotation.y += Dt * (0.15 + this.HoverT * 0.8);

    let Bi = 0;
    const Thr = 2.0;
    for (let I = 0; I < this.Balls.length; I++) {
      for (let J = I + 1; J < this.Balls.length; J++) {
        const P1 = this.Balls[I].position, P2 = this.Balls[J].position;
        if (P1.distanceTo(P2) < Thr) {
          this.BondPos[Bi * 6] = P1.x; this.BondPos[Bi * 6 + 1] = P1.y; this.BondPos[Bi * 6 + 2] = P1.z;
          this.BondPos[Bi * 6 + 3] = P2.x; this.BondPos[Bi * 6 + 4] = P2.y; this.BondPos[Bi * 6 + 5] = P2.z;
          Bi++;
        }
      }
    }
    this.BondGeo.setDrawRange(0, Bi * 2);
    this.BondGeo.attributes.position.needsUpdate = true;

    this.HoverT += (this.TargetHoverT - this.HoverT) * 0.12;
    const H = this.HoverT;
    
    // Apply the responsive scale on top of the hover scale!
    const Sc = this.ResponsiveScale * (1 + H * (this.MaxScale - 1));
    this.Group.scale.setScalar(Sc);
    
    this.Shell.rotation.y += Dt * (0.5 + H * 0.2);
    this.Shell.rotation.x += Dt * (0.5 + H * 0.2);
    this.Shell.material.opacity = 0.22 + H * 0.3;
    this.Core.material.opacity = 0.3 + H * 0.25;
    this.Halo.material.uniforms.UHover.value = H;
    this.ClusterGroup.scale.setScalar(1 + H * 0.15);
    this.Bonds.material.opacity = 0.15 + H * 0.2;
    this.Label.material.opacity = 0.95;
  }
}
function SetupInputs(Renderer, Camera, Orbs, Viewport) {
  const Raycaster = new THREE.Raycaster();
  const MouseNdc = new THREE.Vector2();
  const PlaneZ0 = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

  let DraggingOrb = null;
  const MouseDownScreen = new THREE.Vector2();
  const TouchStartScreen = new THREE.Vector2();

  function ScreenToWorld(Sx, Sy) {
    MouseNdc.x = (Sx / window.innerWidth) * 2 - 1;
    MouseNdc.y = -(Sy / window.innerHeight) * 2 + 1;
    Raycaster.setFromCamera(MouseNdc, Camera);
    const Hit = new THREE.Vector3();
    Raycaster.ray.intersectPlane(PlaneZ0, Hit);
    return Hit;
  }

  function GetHoveredOrb(Cx, Cy) {
    MouseNdc.x = (Cx / window.innerWidth) * 2 - 1;
    MouseNdc.y = -(Cy / window.innerHeight) * 2 + 1;
    Raycaster.setFromCamera(MouseNdc, Camera);
    const Targets = Orbs.map(O => O.HitSphere);
    const Hits = Raycaster.intersectObjects(Targets, false);
    if (Hits.length > 0) return Orbs.findIndex(O => O.HitSphere === Hits[0].object);
    return -1;
  }

  Renderer.domElement.addEventListener('mousedown', (E) => {
    MouseDownScreen.set(E.clientX, E.clientY);
    const Idx = GetHoveredOrb(E.clientX, E.clientY);
    if (Idx >= 0) {
      DraggingOrb = Orbs[Idx];
      DraggingOrb.IsDragging = true;
      const Wp = ScreenToWorld(E.clientX, E.clientY);
      DraggingOrb.DragOffset.copy(Wp).sub(DraggingOrb.Pos);
      document.body.style.cursor = 'grabbing';
    }
  });

  window.addEventListener('mousemove', (E) => {
    if (DraggingOrb) {
      const Wp = ScreenToWorld(E.clientX, E.clientY);
      DraggingOrb.Pos.copy(Wp).sub(DraggingOrb.DragOffset);
      const Hard = DraggingOrb.Radius * 1.0;
      DraggingOrb.Pos.x = Math.max(Viewport.MinX + Hard, Math.min(Viewport.MaxX - Hard, DraggingOrb.Pos.x));
      DraggingOrb.Pos.y = Math.max(Viewport.MinY + Hard, Math.min(Viewport.MaxY - Hard, DraggingOrb.Pos.y));
    } else {
      const Idx = GetHoveredOrb(E.clientX, E.clientY);
      Orbs.forEach((O, I) => O.TargetHoverT = (I === Idx) ? 1 : 0);
      document.body.style.cursor = Idx >= 0 ? 'pointer' : 'default';
    }
  });

  window.addEventListener('mouseup', (E) => {
    if (DraggingOrb) {
      const Moved = Math.hypot(E.clientX - MouseDownScreen.x, E.clientY - MouseDownScreen.y);
      DraggingOrb.IsDragging = false;
      if (Moved < 5) {
        const targetUrl = DraggingOrb.Tab.Url || '';
        if (targetUrl.startsWith('#')) {
          window.location.hash = targetUrl;
        } else {
          window.open(targetUrl, '_blank');
        }
      }
      DraggingOrb = null;
    }
    document.body.style.cursor = 'default';
  });

  Renderer.domElement.addEventListener('touchstart', (E) => {
    if (E.touches.length !== 1) return;
    const T = E.touches[0];
    TouchStartScreen.set(T.clientX, T.clientY);
    MouseDownScreen.set(T.clientX, T.clientY);
    const Idx = GetHoveredOrb(T.clientX, T.clientY);
    if (Idx >= 0) {
      DraggingOrb = Orbs[Idx];
      DraggingOrb.IsDragging = true;
      const Wp = ScreenToWorld(T.clientX, T.clientY);
      DraggingOrb.DragOffset.copy(Wp).sub(DraggingOrb.Pos);
    }
  }, { passive: true });

  Renderer.domElement.addEventListener('touchmove', (E) => {
    if (E.touches.length !== 1 || !DraggingOrb) return;
    const T = E.touches[0];
    const Wp = ScreenToWorld(T.clientX, T.clientY);
    DraggingOrb.Pos.copy(Wp).sub(DraggingOrb.DragOffset);
    const Hard = DraggingOrb.Radius * 1.0;
    DraggingOrb.Pos.x = Math.max(Viewport.MinX + Hard, Math.min(Viewport.MaxX - Hard, DraggingOrb.Pos.x));
    DraggingOrb.Pos.y = Math.max(Viewport.MinY + Hard, Math.min(Viewport.MaxY - Hard, DraggingOrb.Pos.y));
  }, { passive: true });

  Renderer.domElement.addEventListener('touchend', (E) => {
    if (DraggingOrb) {
      const T = E.changedTouches[0];
      const Moved = Math.hypot(T.clientX - TouchStartScreen.x, T.clientY - TouchStartScreen.y);
      DraggingOrb.IsDragging = false;
      if (Moved < 10) {
        const targetUrl = DraggingOrb.Tab.Url || '';
        if (targetUrl.startsWith('#')) {
          window.location.hash = targetUrl;
        } else {
          window.open(targetUrl, '_blank');
        }
      }
      DraggingOrb = null;
    }
  });
}
function InitOrbs(container, state) {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const ambientLight = new THREE.AmbientLight(0x0a1a14, 0.35);
  scene.add(ambientLight);

  const orbs = [];
  if (state.tabs && state.tabs.length > 0) {
    state.tabs.forEach((tab, index) => {
      orbs.push(new Orb(tab, index, state.tabs.length, scene));
    });
  }

  const CamZ = 40;
  camera.position.z = CamZ;

  let Viewport = { MinX: -35, MaxX: 35, MinY: -20, MaxY: 20 };
  function UpdateViewport() {
    const FovRad = THREE.MathUtils.degToRad(camera.fov);
    const Vh = 2 * CamZ * Math.tan(FovRad / 2);
    const Vw = Vh * camera.aspect;
    Viewport.MinX = -Vw / 2; Viewport.MaxX = Vw / 2;
    Viewport.MinY = -Vh / 2; Viewport.MaxY = Vh / 2;
  }
  UpdateViewport();

  SetupInputs(renderer, camera, orbs, Viewport);

  const clock = new THREE.Clock();

  function animate() {
    if (!container || !container.isConnected) return;
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    const time = clock.getElapsedTime();

    orbs.forEach(orb => orb.Update(dt, time, orbs, Viewport));

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    UpdateViewport();
  });
}

function LoadBookmarkPage() {

/* --- 02_Bookmarks/00_State.js --- */
let BookmarkState = {
  bookmarks: [],
  sectionOrder: ['ALL']
};
function LoadBookmarkState() {
  const dataBlock = typeof document !== 'undefined' ? document.getElementById('Bookmarks') : null;
  let domState = null;

  if (dataBlock && dataBlock.textContent.trim()) {
    try {
      const parsed = JSON.parse(dataBlock.textContent);
      if (parsed && typeof parsed === 'object') {
        const bms = parsed.bookmarks || parsed.bookmark || [];
        let secOrder = parsed.sectionOrder || [];
        if (!secOrder.includes('ALL')) secOrder.unshift('ALL');
        domState = {
          bookmarks: bms,
          sectionOrder: secOrder,
          _lastSaved: parsed._lastSaved || 0
        };
      }
    } catch (e) {
      console.error('Failed to parse Bookmarks JSON data block:', e);
    }
  }

  // 1. Check if browser Local Storage has an active unsaved crash recovery buffer
  try {
    const cached = typeof localStorage !== 'undefined' ? localStorage.getItem('Bookmarks_Local_Cache') : null;
    if (cached) {
      const parsedCache = JSON.parse(cached);
      const domTimestamp = domState?._lastSaved || 0;
      const cacheTimestamp = parsedCache?._savedAt || 0;

      // Only restore from cache if it represents active unsaved edits newer than the HTML file
      if (parsedCache && parsedCache._unsaved === true && cacheTimestamp > domTimestamp && Array.isArray(parsedCache.bookmarks)) {
        console.log('[BookmarkState] Recovering uncommitted bookmark edits from local cache...');
        BookmarkState = {
          bookmarks: parsedCache.bookmarks,
          sectionOrder: Array.isArray(parsedCache.sectionOrder) ? parsedCache.sectionOrder : ['ALL'],
          _lastSaved: cacheTimestamp
        };
        if (dataBlock) dataBlock.textContent = JSON.stringify(BookmarkState, null, 2);
        if (typeof window !== 'undefined') window.BookmarkState = BookmarkState;
        return BookmarkState;
      }
    }
  } catch (e) {
    console.warn('Could not read Bookmarks_Local_Cache:', e);
  }

  // 2. Pure, clean load directly from HTML data vault (#Bookmarks)
  if (domState) {
    BookmarkState = {
      bookmarks: domState.bookmarks,
      sectionOrder: domState.sectionOrder,
      _lastSaved: domState._lastSaved || 0
    };
    if (typeof window !== 'undefined') window.BookmarkState = BookmarkState;
    return BookmarkState;
  }

  // 3. Default empty state
  BookmarkState = { bookmarks: [], sectionOrder: ['ALL'], _lastSaved: 0 };
  if (typeof window !== 'undefined') window.BookmarkState = BookmarkState;
  return BookmarkState;
}
function SaveBookmarkState(newState = null) {
  if (newState) BookmarkState = newState;

  const dataBlock = typeof document !== 'undefined' ? document.getElementById('Bookmarks') : null;
  if (dataBlock) dataBlock.textContent = JSON.stringify(BookmarkState, null, 2);

  if (typeof window !== 'undefined') window.BookmarkState = BookmarkState;

  // Persist to browser Local Storage as active unsaved working buffer
  try {
    if (typeof localStorage !== 'undefined') {
      const cachePayload = {
        ...BookmarkState,
        _unsaved: true,
        _savedAt: Date.now()
      };
      localStorage.setItem('Bookmarks_Local_Cache', JSON.stringify(cachePayload));
    }
  } catch (e) {
    console.warn('Failed to save Bookmarks to localStorage:', e);
  }
}

// Function to empty/clear unsaved cache after downloading / saving standalone HTML
function ClearBookmarkLocalCache() {
  try {
    if (typeof localStorage !== 'undefined') {
      localStorage.removeItem('Bookmarks_Local_Cache');
    }
  } catch (e) {
    console.warn('Failed to clear Bookmarks_Local_Cache:', e);
  }
}

      dropdownWindow.classList.toggle('hidden');
      if (!dropdownWindow.classList.contains('hidden')) {
        RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
        searchInput?.focus();
      }
    });
  }

  if (closeBtn && dropdownWindow) {
    closeBtn.addEventListener('click', () => {
      dropdownWindow.classList.add('hidden');
    });
  }

  document.addEventListener('click', (e) => {
    if (dropdownWindow && !dropdownWindow.contains(e.target) && toggleBtn && !toggleBtn.contains(e.target)) {
      dropdownWindow.classList.add('hidden');
    }
  });

  if (searchInput) {
    searchInput.addEventListener('input', () => {
      RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
    });
  }

  if (colDecBtn && colIncBtn) {
    colDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (ColumnCount > 1) {
        ColumnCount--;
        RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
      }
    });

    colIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const currentList = state.sectionOrder || ['ALL'];
      const tileWidth = ComputeUniformTileWidth(currentList);
      const maxCols = GetMaxPossibleColumns(tileWidth);

      if (ColumnCount < maxCols) {
        ColumnCount++;
        RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
      }
    });
  }

  // Handle window resizing dynamically
  window.addEventListener('resize', () => {
    if (dropdownWindow && !dropdownWindow.classList.contains('hidden')) {
      RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
    }
  });

  RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
}

// Calculate the uniform tile width based on the longest group name
function ComputeUniformTileWidth(groups) {
  let maxCharLength = 0;
  groups.forEach(g => {
    if (g && g.length > maxCharLength) maxCharLength = g.length;
  });

  const computed = Math.ceil(maxCharLength * 8.5) + 68;
  return Math.min(280, Math.max(150, computed));
}

// Calculate the maximum number of columns that can fit without horizontal overflow
function GetMaxPossibleColumns(tileWidth) {
  const windowPadding = 28;
  const gap = 8;
  const viewportMax = Math.min(window.innerWidth - 20, 780);
  const maxCols = Math.floor((viewportMax - windowPadding + gap) / (tileWidth + gap));
  return Math.max(1, maxCols);
}

// Renders interactive drag-and-drop grid inside dropdown to reorder bookmark groups.
function RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate) {
  const grid = document.getElementById('sections-grid-container');
  const dropdownWindow = document.getElementById('sections-dropdown-window');
  if (!grid || !dropdownWindow) return;

  const searchInput = document.getElementById('section-search-input');
  const searchVal = (searchInput?.value || '').toLowerCase().trim();
  const colValEl = document.getElementById('col-count-val');
  const colDecBtn = document.getElementById('col-dec-btn');
  const colIncBtn = document.getElementById('col-inc-btn');

  const counts = {};
  (state.bookmarks || []).forEach(b => {
    counts[b.group] = (counts[b.group] || 0) + 1;
  });
  counts['ALL'] = (state.bookmarks || []).length;

  const rawOrder = state.sectionOrder && state.sectionOrder.length > 0
    ? state.sectionOrder
    : ['ALL', ...Object.keys(counts).filter(k => k !== 'ALL')];

  if (!rawOrder.includes('ALL')) {
    rawOrder.unshift('ALL');
  }

  const currentList = TemporaryOrder || rawOrder;
  const tileWidth = ComputeUniformTileWidth(currentList);
  const maxPossibleCols = GetMaxPossibleColumns(tileWidth);

  // Clamp ColumnCount to prevent horizontal overflow
  if (ColumnCount > maxPossibleCols) {
    ColumnCount = maxPossibleCols;
  }
  if (colValEl) colValEl.textContent = ColumnCount;
  if (colDecBtn) colDecBtn.disabled = ColumnCount <= 1;
  if (colIncBtn) colIncBtn.disabled = ColumnCount >= maxPossibleCols;

  // Window Width Sizing:
  // When ColumnCount is 1: window width is set to exactly 250px
  // When ColumnCount > 1: window expands to max-content (enveloping multi-column grid)
  if (ColumnCount === 1) {
    dropdownWindow.style.width = '250px';
    grid.style.gridTemplateColumns = '1fr';
  } else {
    dropdownWindow.style.width = 'max-content';
    grid.style.gridTemplateColumns = `repeat(${ColumnCount}, ${tileWidth}px)`;
  }

  const filtered = currentList.filter(s => !searchVal || s.toLowerCase().includes(searchVal));

  grid.innerHTML = filtered.map(s => `
    <div class="section-grid-tile ${ActiveSection === s ? 'active' : ''} ${DraggedSection === s ? 'is-dragging' : ''}"
         data-section="${s}"
         draggable="${s !== 'ALL' ? 'true' : 'false'}"
         style="${ColumnCount === 1 ? 'width: 100%;' : `width: ${tileWidth}px;`}">
      <span class="section-tile-title">${s}</span>
      <span class="count-badge">${counts[s] || 0}</span>
    </div>
  `).join('');

  // Attach click selection and Animated Drag & Drop
  grid.querySelectorAll('.section-grid-tile').forEach(tile => {
    const sectionName = tile.dataset.section;

    tile.addEventListener('click', (e) => {
      e.stopPropagation();
      ActiveSection = sectionName;
      const label = document.getElementById('current-section-label');
      if (label) label.textContent = ActiveSection;
      RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
      if (onSectionSelect) onSectionSelect(ActiveSection);
      document.getElementById('sections-dropdown-window')?.classList.add('hidden');
    });

    if (sectionName !== 'ALL') {
      tile.addEventListener('dragstart', (e) => {
        IsDragging = true;
        DraggedSection = sectionName;
        TemporaryOrder = [...currentList];
        tile.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', sectionName);
      });

      tile.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';

        if (!IsDragging || !DraggedSection || DraggedSection === sectionName) return;

        const srcIdx = TemporaryOrder.indexOf(DraggedSection);
        const tgtIdx = TemporaryOrder.indexOf(sectionName);

        if (srcIdx !== -1 && tgtIdx !== -1 && srcIdx !== tgtIdx) {
          // Record old positions for FLIP animation
          const oldPositions = new Map();
          grid.querySelectorAll('.section-grid-tile').forEach(el => {
            oldPositions.set(el.dataset.section, el.getBoundingClientRect());
          });

          // Reorder temporary array
          const [item] = TemporaryOrder.splice(srcIdx, 1);
          TemporaryOrder.splice(tgtIdx, 0, item);

          // Re-render DOM with temporary order
          RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);

          // Animate the shifting tiles smoothly
          grid.querySelectorAll('.section-grid-tile').forEach(el => {
            const sec = el.dataset.section;
            if (sec === DraggedSection) return;

            const oldPos = oldPositions.get(sec);
            if (oldPos) {
              const newPos = el.getBoundingClientRect();
              const dx = oldPos.left - newPos.left;
              const dy = oldPos.top - newPos.top;

              if (dx !== 0 || dy !== 0) {
                el.style.transform = `translate(${dx}px, ${dy}px)`;
                el.style.transition = 'none';

                requestAnimationFrame(() => {
                  el.style.transition = 'transform 0.24s cubic-bezier(0.2, 0, 0, 1)';
                  el.style.transform = '';
                });
              }
            }
          });
        }
      });

      tile.addEventListener('dragend', () => {
        IsDragging = false;
        tile.classList.remove('is-dragging');

        if (TemporaryOrder) {
          state.sectionOrder = [...TemporaryOrder];
          TemporaryOrder = null;
          DraggedSection = null;
          SaveBookmarkState();
          RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
          if (onOrderUpdate) onOrderUpdate(state.sectionOrder);
        }
      });
    }
  });
}

// Helper to extract favicon.ico URL from a domain
function ExtractFaviconUrl(urlStr) {
  if (!urlStr) return '';
  try {
    let clean = urlStr.trim();
    if (!/^https?:\/\//i.test(clean)) {
      clean = 'https://' + clean;
    }
    const parsed = new URL(clean);
    return `${parsed.origin}/favicon.ico`;
  } catch (e) {
    return '';
  }
}

// Collect non-favicon.ico custom icon URLs used across bookmarks
function GetNonFaviconIcons(state) {
  const set = new Set();
  (state.bookmarks || []).forEach(b => {
    if (b.customIcon && typeof b.customIcon === 'string') {
      const lower = b.customIcon.toLowerCase().trim();
      if (!lower.endsWith('/favicon.ico')) {
        set.add(b.customIcon.trim());
      }
    }
  });
  return Array.from(set);
}

function PopulateCustomIconPalette(state, selectedUrl = '') {
  const pal = document.getElementById('bm-logo-palette');
  if (!pal) return;

  const icons = GetNonFaviconIcons(state);
  pal.innerHTML = icons.map(url => `
    <img src="${url}" class="logo-palette-img ${selectedUrl === url ? 'selected' : ''}" data-url="${url}" alt="" onerror="this.style.display='none'"/>
  `).join('');

  pal.querySelectorAll('.logo-palette-img').forEach(img => {
    img.addEventListener('click', () => {
      const iconIn = document.getElementById('bm-icon-url');
      const titleLogoCb = document.getElementById('bm-title-logo-cb');

      StoredIconUrl = img.dataset.url;
      if (iconIn) iconIn.value = StoredIconUrl;
      if (titleLogoCb) {
        titleLogoCb.checked = false;
        SetLetterLogoActiveState(false);
      }

      HighlightSelectedPalette(StoredIconUrl);
    });
  });
}

function HighlightSelectedPalette(url) {
  const pal = document.getElementById('bm-logo-palette');
  if (!pal) return;
  pal.querySelectorAll('.logo-palette-img').forEach(img => {
    img.classList.toggle('selected', img.dataset.url === url);
  });
}

// Controls greyed-out uneditable state of Icon URL and Palette when Letter Logo is active
function SetLetterLogoActiveState(isLetterLogo) {
  const iconIn = document.getElementById('bm-icon-url');
  const paletteEl = document.getElementById('bm-logo-palette');

  if (iconIn) {
    if (isLetterLogo) {
      if (iconIn.value) StoredIconUrl = iconIn.value;
      iconIn.disabled = true;
      iconIn.classList.add('disabled-icon-input');
      iconIn.value = '';
      iconIn.placeholder = 'Letter logo enabled';
    } else {
      iconIn.disabled = false;
      iconIn.classList.remove('disabled-icon-input');
      iconIn.placeholder = 'https://.../favicon.ico';
      iconIn.value = StoredIconUrl || '';
    }
  }

  if (paletteEl) {
    paletteEl.classList.toggle('palette-disabled', isLetterLogo);
    if (isLetterLogo) {
      HighlightSelectedPalette('');
    } else {
      HighlightSelectedPalette(StoredIconUrl);
    }
  }
}

function RenderSectionCombobox(state) {
  const secIn = document.getElementById('bm-section');
  const secDropdown = document.getElementById('bm-section-dropdown');
  if (!secIn || !secDropdown) return;

  const val = secIn.value.toLowerCase().trim();
  const groups = (state.sectionOrder || []).filter(s => s !== 'ALL');
  const filtered = groups.filter(g => g.toLowerCase().includes(val));

  let html = filtered.map(g => `
    <div class="combobox-item" data-value="${g}">${g}</div>
  `).join('');

  if (!html) {
    html = `<div style="padding:6px 10px; font-size:11px; color:var(--text-secondary, #a0a4b8);">No matching groups</div>`;
  }

  secDropdown.innerHTML = html;

  secDropdown.querySelectorAll('.combobox-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      secIn.value = item.dataset.value;
      secDropdown.classList.add('hidden');
    });
  });
}
function OpenBookmarkModal(b = null, state) {
  EditingId = b ? b.id : null;
  const modal = document.getElementById('bookmark-modal');
  const nameIn = document.getElementById('bm-name');
  const urlIn = document.getElementById('bm-url');
  const secIn = document.getElementById('bm-section');
  const titleLogoCb = document.getElementById('bm-title-logo-cb');
  const iconIn = document.getElementById('bm-icon-url');
  const titleEl = document.getElementById('bookmark-modal-title');

  if (!modal) return;

  if (titleEl) titleEl.textContent = b ? 'Edit Bookmark' : 'Add Bookmark';
  if (nameIn) nameIn.value = b ? b.name : '';
  if (urlIn) urlIn.value = b ? b.url : '';

  const activeSec = GetActiveSection();
  if (secIn) {
    secIn.value = b ? b.group : (activeSec !== 'ALL' ? activeSec : '');
  }

  const useTitle = b ? (b.useTitleLogo === true) : false;
  if (titleLogoCb) titleLogoCb.checked = useTitle;

  StoredIconUrl = '';
  if (b) {
    if (b.customIcon) StoredIconUrl = b.customIcon;
    else if (!b.useTitleLogo && b.url) StoredIconUrl = ExtractFaviconUrl(b.url);
  }

  if (iconIn) {
    iconIn.value = StoredIconUrl;
  }

  PopulateCustomIconPalette(state, StoredIconUrl);
  SetLetterLogoActiveState(useTitle);

  modal.classList.remove('hidden');
  if (nameIn) nameIn.focus();
}
function CloseBookmarkModal() {
  const modal = document.getElementById('bookmark-modal');
  const secDropdown = document.getElementById('bm-section-dropdown');
  if (modal) modal.classList.add('hidden');
  if (secDropdown) secDropdown.classList.add('hidden');
  EditingId = null;
  StoredIconUrl = '';
}
function DeleteBookmark(id, state, onUpdate, showToast) {
  const b = state.bookmarks.find(x => x.id === id);
  if (!b) return;
  if (confirm(`Delete bookmark "${b.name}"?`)) {
    state.bookmarks = state.bookmarks.filter(x => x.id !== id);
    SaveBookmarkState();
    if (onUpdate) onUpdate();
    if (showToast) showToast('Bookmark deleted');
  }
}
function InitModal(state, onUpdate, showToast) {
  OnModalUpdate = onUpdate;
  ShowToastFn = showToast;

  const closeBtn = document.getElementById('close-bookmark-modal');
  const cancelBtn = document.getElementById('cancel-bookmark-modal');
  const saveBtn = document.getElementById('save-bookmark-modal-btn');
  const titleLogoCb = document.getElementById('bm-title-logo-cb');
  const urlIn = document.getElementById('bm-url');
  const iconIn = document.getElementById('bm-icon-url');
  const secIn = document.getElementById('bm-section');
  const secDropdown = document.getElementById('bm-section-dropdown');

  if (closeBtn) closeBtn.addEventListener('click', CloseBookmarkModal);
  if (cancelBtn) cancelBtn.addEventListener('click', CloseBookmarkModal);

  // Auto-extract favicon when typing / pasting URL
  if (urlIn) {
    urlIn.addEventListener('input', () => {
      const autoFav = ExtractFaviconUrl(urlIn.value);
      if (autoFav) {
        StoredIconUrl = autoFav;
        if (titleLogoCb && !titleLogoCb.checked && iconIn) {
          iconIn.value = autoFav;
          HighlightSelectedPalette(autoFav);
        }
      }
    });
  }

  // Update Icon URL field manually if edited
  if (iconIn) {
    iconIn.addEventListener('input', () => {
      StoredIconUrl = iconIn.value.trim();
      HighlightSelectedPalette(StoredIconUrl);
    });
  }

  // Toggle Letter Logo checkbox: grey-out and make uneditable
  if (titleLogoCb) {
    titleLogoCb.addEventListener('change', () => {
      SetLetterLogoActiveState(titleLogoCb.checked);
      if (!titleLogoCb.checked && (!StoredIconUrl || StoredIconUrl.endsWith('/favicon.ico'))) {
        if (urlIn && urlIn.value) {
          StoredIconUrl = ExtractFaviconUrl(urlIn.value);
          if (iconIn) iconIn.value = StoredIconUrl;
        }
      }
    });
  }

  // Group combobox interactions
  if (secIn && secDropdown) {
    secIn.addEventListener('focus', () => {
      RenderSectionCombobox(state);
      secDropdown.classList.remove('hidden');
    });
    secIn.addEventListener('input', () => {
      RenderSectionCombobox(state);
      secDropdown.classList.remove('hidden');
    });
    document.addEventListener('click', (e) => {
      const wrapper = document.getElementById('bm-section-combobox');
      if (wrapper && !wrapper.contains(e.target)) {
        secDropdown.classList.add('hidden');
      }
    });
  }

  // Save Bookmark
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const nameIn = document.getElementById('bm-name');
      const name = nameIn ? nameIn.value.trim() : '';
      const url = urlIn ? urlIn.value.trim() : '';
      const group = (secIn && secIn.value.trim()) ? secIn.value.trim() : '';
      const useTitleLogo = titleLogoCb ? (titleLogoCb.checked === true) : false;
      const rawIcon = StoredIconUrl || (iconIn ? iconIn.value.trim() : '') || ExtractFaviconUrl(url);

      if (!name || !url || !group) {
        if (ShowToastFn) ShowToastFn('Please enter title, URL, and group');
        return;
      }

      if (group.toUpperCase() === 'ALL') {
        if (ShowToastFn) ShowToastFn('"ALL" is reserved. Please use another group name.');
        if (secIn) secIn.focus();
        return;
      }

      // Add new group to sectionOrder if not already present
      if (!state.sectionOrder.includes(group)) {
        state.sectionOrder.push(group);
      }

      const customIcon = rawIcon;

      if (EditingId) {
        const b = state.bookmarks.find(x => x.id === EditingId);
        if (b) {
          b.name = name;
          b.url = url;
          b.group = group;
          b.customIcon = customIcon;
          b.useTitleLogo = useTitleLogo;
        }
      } else {
        state.bookmarks.push({
          id: 'b_' + Date.now(),
          name,
          url,
          group,
          customIcon,
          useTitleLogo
        });
      }

      SaveBookmarkState();
      CloseBookmarkModal();
      if (OnModalUpdate) OnModalUpdate();
      if (ShowToastFn) ShowToastFn(EditingId ? 'Bookmark updated' : 'Bookmark added');
    });
  }
}
