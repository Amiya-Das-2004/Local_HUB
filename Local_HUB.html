// Enables/disables trash button, expands label with count, and updates the badge
function UpdateDeleteButtonState() {
  const delBtn = document.getElementById('notes-delete-btn');
  const countBadge = document.getElementById('notes-selected-count-badge');
  const btnLabel = document.getElementById('notes-delete-btn-label');
  if (!delBtn) return;

  const count = SelectedNoteIds.size;
  if (count > 0) {
    delBtn.removeAttribute('disabled');

    delBtn.title = `Delete ${count} selected note${count > 1 ? 's' : ''}`;
    if (btnLabel) {
      btnLabel.textContent = `Delete (${count})`;
      btnLabel.style.display = 'inline-block';
    }
    if (countBadge) {
      countBadge.textContent = count;
      countBadge.style.display = 'inline-flex';
    }
  } else {
    delBtn.setAttribute('disabled', 'true');
    delBtn.classList.remove('active');
    delBtn.title = 'Delete selected notes (Check a card to activate)';
    if (btnLabel) {
      btnLabel.textContent = '';
      btnLabel.style.display = 'none';

    if (countBadge) {
      countBadge.style.display = 'none';
    }
  }
}

// Deletes an individual note by ID with warning confirmation, updates state, saves, and executes callback
function DeleteNoteById(delNoteId, onDeleted) {
  if (!delNoteId) return false;
  const allNotes = NotesState.notes || [];
  const target = allNotes.find(n => n.id === delNoteId);
  const name = target ? target.title : 'this note';

  const warning = `⚠️ WARNING: Are you sure you want to permanently delete "${name}"?\n\nThis action cannot be undone.`;
  if (!confirm(warning)) {
    return false;
  }

  NotesState.notes = allNotes.filter(n => n.id !== delNoteId);
  if (SelectedNoteIds.has(delNoteId)) {
    SelectedNoteIds.delete(delNoteId);
  }
  UpdateDeleteButtonState();

  SaveNotesState();
  if (onDeleted) onDeleted(delNoteId);
  return true;
}

// Deletes all currently selected notes with warning confirmation, updates state, saves, and executes callback
function DeleteSelectedNotes(onDeleted) {
  const count = SelectedNoteIds.size;
  if (count === 0) return false;

  const warning = `⚠️ WARNING: You have selected ${count} note${count > 1 ? 's' : ''} for deletion.\n\nAre you sure you want to permanently delete ${count > 1 ? 'these ' + count + ' notes' : 'this note'}?\nThis action cannot be undone.`;
  if (!confirm(warning)) {
    return false;
  }

  const idSet = new Set(SelectedNoteIds);
  NotesState.notes = (NotesState.notes || []).filter(n => !idSet.has(n.id));
  ClearSelectedNotes();
  SaveNotesState();

  if (onDeleted) onDeleted(Array.from(idSet));
  return true;
}

// Renders the interactive combo dropdown for folder/group selection
function renderFolderComboDropdown(filterText = '') {
  const dropdown = document.getElementById('notes-modal-folder-dropdown');
  const folderInput = document.getElementById('notes-modal-folder-input');
  if (!dropdown || !folderInput) return;

  const allFolders = getAvailableFolders(NotesState);
  const q = (filterText || '').toLowerCase().trim();
  const filtered = q ? allFolders.filter(f => f.toLowerCase().includes(q)) : allFolders;

  dropdown.innerHTML = '';
  if (filtered.length === 0) {
    const emptyEl = document.createElement('div');
    emptyEl.className = 'notes-folder-dropdown-item';
    emptyEl.style.opacity = '0.6';
    emptyEl.style.cursor = 'default';
    emptyEl.textContent = 'Create new folder: "' + filterText + '"';
    dropdown.appendChild(emptyEl);
    return;
  }

  filtered.forEach(f => {
    const item = document.createElement('div');
    item.className = `notes-folder-dropdown-item ${folderInput.value.trim() === f ? 'selected' : ''}`;
    item.innerHTML = `<span>📁</span> <span>${escapeHtml(f)}</span>`;
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      folderInput.value = f;
      dropdown.classList.add('hidden');
    });
    dropdown.appendChild(item);
  });
}

// Opens the note modal prefilled with existing note data for editing or empty for creating a new note
function OpenNoteModal(note = null) {
  EditingNoteId = note ? note.id : null;
  const modal = document.getElementById('notes-add-edit-modal');
  const titleText = document.getElementById('notes-modal-title-text');
  const titleInput = document.getElementById('notes-modal-title-input');
  const folderInput = document.getElementById('notes-modal-folder-input');
  const tagsInput = document.getElementById('notes-modal-tags-input');
  const descMount = document.getElementById('notes-modal-desc-mount');

  if (!modal) return;

  // Extract description using shared helper
  const rawDesc = note ? getNoteRawDescription(note) : '';
  CurrentModalDescription = rawDesc;

  // Set values
  if (titleText) titleText.textContent = note ? 'Edit Note Card' : 'Add Note Card';
  if (titleInput) {
    titleInput.value = note ? (note.title || '') : '';
    titleInput.style.borderColor = '';
  }
  if (folderInput) {
    folderInput.value = note ? (note.folder || 'General') : 'General';
    renderFolderComboDropdown(folderInput.value);
  }
  if (tagsInput) tagsInput.value = note ? (note.tags || []).join(', ') : '';

  // Mount in-place Obsidian live editor
  if (descMount) {
    descMount.innerHTML = '';
    const tempBlock = { type: 'text', content: rawDesc, bulletStyle: 'disc' };
    const textBlockEl = renderTextBlock(
      tempBlock,
      true,
      (updated) => {
        CurrentModalDescription = updated.content;
      },
      NotesState.notes || []
    );
    descMount.appendChild(textBlockEl);
  }

  modal.classList.remove('hidden');
  if (titleInput) {
    titleInput.focus();
    if (note) titleInput.select();
  }
}

// Closes and hides the note add/edit modal and resets active editing ID
function CloseNoteModal() {
  const modal = document.getElementById('notes-add-edit-modal');
  if (modal) modal.classList.add('hidden');
  const folderDropdown = document.getElementById('notes-modal-folder-dropdown');
  if (folderDropdown) folderDropdown.classList.add('hidden');
  EditingNoteId = null;
}

// Binds event listeners for modal controls, live in-place Obsidian surface, and note save
function InitNoteModal(onUpdate) {
  OnModalUpdate = onUpdate;

  const modal = document.getElementById('notes-add-edit-modal');
  const closeBtn = document.getElementById('notes-modal-close-btn');
  const saveBtn = document.getElementById('notes-modal-save-btn');
  const folderInput = document.getElementById('notes-modal-folder-input');
  const folderDropdown = document.getElementById('notes-modal-folder-dropdown');

  if (closeBtn) closeBtn.addEventListener('click', CloseNoteModal);

  // Group dropdown open/filter listeners
  if (folderInput && folderDropdown) {
    folderInput.addEventListener('focus', () => {
      renderFolderComboDropdown(folderInput.value);
      folderDropdown.classList.remove('hidden');
    });
    folderInput.addEventListener('click', (e) => {
      e.stopPropagation();
      renderFolderComboDropdown(folderInput.value);
      folderDropdown.classList.remove('hidden');
    });
    folderInput.addEventListener('input', () => {
      renderFolderComboDropdown(folderInput.value);
      folderDropdown.classList.remove('hidden');
    });
    document.addEventListener('click', (e) => {
      if (!folderDropdown.contains(e.target) && e.target !== folderInput) {
        folderDropdown.classList.add('hidden');
      }
    });
  }

  // Keyboard shortcut: Ctrl+Enter / Cmd+Enter to save (closing is strictly restricted to clicking the cross button)
  document.addEventListener('keydown', (e) => {
    if (modal && !modal.classList.contains('hidden')) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        saveBtn?.click();
      }
    }
  });

  // Save Note logic
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const titleIn = document.getElementById('notes-modal-title-input');
      const folderIn = document.getElementById('notes-modal-folder-input');
      const tagsIn = document.getElementById('notes-modal-tags-input');

      const title = titleIn ? titleIn.value.trim() : '';
      const folder = (folderIn && folderIn.value.trim()) ? folderIn.value.trim() : 'General';
      const tags = tagsIn ? tagsIn.value.split(',').map(t => t.trim()).filter(Boolean) : [];

      // Extract description directly from in-place Obsidian surface
      const liveSurface = document.querySelector('#notes-modal-desc-mount .obsidian-live-surface');
      const description = liveSurface ? serializeElement(liveSurface).trim() : (CurrentModalDescription || '').trim();

      if (!title) {
        if (titleIn) {
          titleIn.style.borderColor = '#ef4444';
          titleIn.focus();
        }
        alert('Please enter a note title.');
        return;
      }

      // Add folder to folders list if new
      if (!NotesState.folders) NotesState.folders = [];
      if (!NotesState.folders.includes(folder)) {
        NotesState.folders.push(folder);
      }

      if (!NotesState.notes) NotesState.notes = [];

      if (EditingNoteId) {
        // Update existing note (preserves blocks untouched)
        const existing = NotesState.notes.find(n => n.id === EditingNoteId);
        if (existing) {
          existing.title = title;
          existing.folder = folder;
          existing.tags = tags;
          existing.description = description;
          existing.flashcard = {
            isFlashcard: true,
            front: description.slice(0, 120),
            back: description
          };
          if (!existing.macros) existing.macros = { equation: '', tikz: '' };
          if (!existing.blocks) existing.blocks = [];
        }
      } else {
        // Create new note with complete schema matching 00_State.js
        const newId = 'note_' + Date.now();
        const newNote = {
          id: newId,
          slug: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          title: title,
          folder: folder,
          tags: tags,
          description: description,
          meta: {
            created: new Date().toISOString().slice(0, 10),
            author: 'User'
          },
          flashcard: {
            isFlashcard: true,
            front: description.slice(0, 120),
            back: description
          },
          blocks: [],
          autoNumbering: { h1: 'numeric', h2: 'numeric', h3: 'numeric' },
          logo: null,
          macros: { equation: '', tikz: '' }
        };
        NotesState.notes.unshift(newNote);
      }

      SaveNotesState();
      CloseNoteModal();
      if (OnModalUpdate) OnModalUpdate();
    });
  }
}

// Creates interactive note card DOM element
function CreateCardElement(note, { isSelected = false, onRefresh = null } = {}) {
  const card = document.createElement('div');
  card.dataset.id = note.id;
  card.dataset.folder = note.folder || 'General';

  // Extract raw text for description using shared helper
  const rawDescription = getNoteRawDescription(note);

  const descHtml = formatNoteDescription(rawDescription);
  const hasDesc = Boolean(descHtml);

  // Tags rendered in UPPERCASE; footer omitted if no tags exist
  const validTags = (note.tags || []).filter(t => typeof t === 'string' && t.trim().length > 0);
  const hasFooter = validTags.length > 0;

  card.className = `note-card ${isSelected ? 'is-selected' : ''} ${hasDesc ? 'has-desc' : ''} ${hasFooter ? 'has-footer' : ''}`;

  let descMarkup = '';
  if (hasDesc) {
    descMarkup = `<div class="note-card-description">${descHtml}</div>`;
  }

  let footerMarkup = '';
  if (hasFooter) {
    footerMarkup = `
      <div class="note-card-footer">
        <div style="display:flex;gap:5px;flex-wrap:wrap;">
          ${validTags.map(t => `<span class="note-card-tag">${escapeHtml(t.trim().toUpperCase())}</span>`).join('')}
        </div>
      </div>
    `;
  }

  card.innerHTML = `
    <!-- Header: Checkbox + Title + Action Buttons -->
    <div class="note-card-header-row">
      <div class="note-card-title-group">
        <div class="note-card-checkbox-wrap ${isSelected ? 'show' : ''}">
          <input type="checkbox" class="note-card-checkbox" ${isSelected ? 'checked' : ''} title="Select note" />
        </div>
        <h3 class="note-card-title">${escapeHtml(note.title || 'Untitled Note')}</h3>
      </div>

      <div class="note-card-actions">
        <button class="note-card-action-btn edit-btn" type="button" title="Edit note card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
          </svg>
        </button>
        <button class="note-card-action-btn delete-btn" type="button" title="Delete note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Description (Omitted if empty) -->
    ${descMarkup}

    <!-- Footer (Omitted if no tags exist) -->
    ${footerMarkup}
  `;

  // Sync Task Checkboxes with Note State
  card.querySelectorAll('.note-task-checkbox').forEach((taskCb) => {
    taskCb.addEventListener('click', (e) => {
      e.stopPropagation();
      const taskIndex = parseInt(taskCb.dataset.taskIndex, 10);
      const isChecked = taskCb.checked;

      const currentDesc = note.description || rawDescription;
      const updatedDesc = toggleTaskInRawText(currentDesc, taskIndex, isChecked);
      note.description = updatedDesc;

      if (note.flashcard) {
        note.flashcard.back = toggleTaskInRawText(note.flashcard.back || '', taskIndex, isChecked);
      }

      SaveNotesState();
    });
  });

  // Checkbox Event (Directly updates selection state)
  const checkbox = card.querySelector('.note-card-checkbox');
  if (checkbox) {
    checkbox.addEventListener('click', (e) => {
      e.stopPropagation();
      const checked = checkbox.checked;
      card.classList.toggle('is-selected', checked);
      ToggleNoteSelection(note.id, checked);
    });
  }

  // Edit Action (Directly Opens Modal from 05_Add_Edit_Button.js)
  const editBtn = card.querySelector('.note-card-action-btn.edit-btn');
  if (editBtn) {
    editBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      OpenNoteModal(note);
    });
  }

  // Delete Action (Directly calls DeleteNoteById from 04_Delete_Button.js)
  const delBtn = card.querySelector('.note-card-action-btn.delete-btn');
  if (delBtn) {
    delBtn.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      DeleteNoteById(note.id, onRefresh);
    });
  }

  // Card click navigation (Opens LaTeX Editor View)
  card.addEventListener('click', (e) => {
    if (
      e.target.closest('.note-card-action-btn') ||
      e.target.closest('.note-card-checkbox') ||
      e.target.closest('.note-task-checkbox') ||
      e.target.closest('.note-task-item')
    ) return;
    window.location.hash = `#Notes?id=${encodeURIComponent(note.id)}`;
  });

  return card;
}

// Groups, searches, filters, and renders note cards into grid or list sections with empty state handling
function RenderNotesGrid(container, state) {
  if (!container) {
    container = document.getElementById('notes-cards-container');
  }
  if (!container) return;

  container.innerHTML = '';

  const activeGroup = GetActiveGroup();
  const searchQuery = GetSearchQuery();
  const currentView = GetCurrentView();
  const selectedIds = GetSelectedNoteIds();

  const allNotes = state.notes || [];

  // Filter notes by search query
  const searchFilteredNotes = FilterNotesByQuery(allNotes, searchQuery);

  // Extract relevant groups/folders strictly from notes containing cards, sorted according to state.folders
  const folderOrder = (state && Array.isArray(state.folders)) ? state.folders : [];
  const discoveredGroups = Array.from(new Set(
    searchFilteredNotes.map(n => n.folder || 'General').filter(Boolean)
  ));
  discoveredGroups.sort((a, b) => {
    const idxA = folderOrder.indexOf(a);
    const idxB = folderOrder.indexOf(b);
    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
    if (idxA !== -1) return -1;
    if (idxB !== -1) return 1;
    return a.localeCompare(b);
  });

  const groupsToRender = (activeGroup === 'ALL')
    ? discoveredGroups
    : [activeGroup];

  let totalRenderedNotes = 0;

  groupsToRender.forEach(groupName => {
    const groupNotes = searchFilteredNotes.filter(n => (n.folder || 'General') === groupName);
    if (groupNotes.length === 0 && activeGroup === 'ALL') return;

    totalRenderedNotes += groupNotes.length;

    const sectionEl = document.createElement('div');
    sectionEl.className = 'notes-group-section';

    // Section Title with Count Pill
    const titleEl = document.createElement('div');
    titleEl.className = 'notes-group-section-title';
    titleEl.innerHTML = `📁 ${escapeHtml(groupName)} <span class="count-pill">${groupNotes.length}</span>`;
    sectionEl.appendChild(titleEl);

    // Cards Grid / List wrapper
    const gridEl = document.createElement('div');
    const isList = (currentView === 'List_Card_View');
    const isSingle = (groupNotes.length === 1);
    gridEl.className = isList
      ? 'notes-grid List_Card_View'
      : `notes-grid Grid_Card_View ${isSingle ? 'single-card' : ''}`;
    gridEl.dataset.group = groupName;

    groupNotes.forEach(note => {
      const isSelected = selectedIds.has(note.id);
      const cardEl = CreateCardElement(note, {
        isSelected: isSelected,
        onRefresh: () => RenderNotesGrid(container, state)
      });

      gridEl.appendChild(cardEl);
    });

    sectionEl.appendChild(gridEl);
    container.appendChild(sectionEl);
  });

  // Empty state if no notes found
  if (totalRenderedNotes === 0) {
    const emptyState = document.createElement('div');
    emptyState.className = 'notes-empty-state';
    emptyState.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
      <div class="empty-title">${searchQuery ? 'No matching notes found' : 'No notes in this group'}</div>
      <div class="empty-desc">${searchQuery ? 'Try clearing or changing your search query.' : 'Click the "+" button in the toolbar to create a note.'}</div>
    `;
    container.appendChild(emptyState);
  }
}

// Renders and initializes the complete Notes Card View inside target container
function RenderNotesCardView(mainContainer, state) {
  if (!mainContainer) return;

  const deckWrapper = document.createElement('div');
  deckWrapper.innerHTML = GetNotesCardViewHTML();
  mainContainer.appendChild(deckWrapper);

  const navbarMount = document.getElementById('navbar-mount');
  const cardsMount = document.getElementById('cards-mount');

  if (navbarMount) navbarMount.innerHTML = GetNavbarHTML();
  if (cardsMount) cardsMount.innerHTML = GetNotesCardsContainerHTML();

  function RefreshCardsView() {
    const container = document.getElementById('notes-cards-container');
    RenderNotesGrid(container, state);
  }

  // Ensure exactly one note modal exists in the document
  if (!document.getElementById('notes-add-edit-modal')) {
    const modalContainer = document.createElement('div');
    modalContainer.id = 'notes-modal-standalone-mount';
    modalContainer.innerHTML = GetNoteModalHTML();
    document.body.appendChild(modalContainer);
  }

  InitNoteModal(() => {
    RefreshCardsView();
  });

  InitNavbar(state, {
    onViewChange: () => {
      RefreshCardsView();
    },
    onGroupSelect: () => {
      RefreshCardsView();
    },
    onOrderUpdate: () => {
      RefreshCardsView();
    },
    onSearch: () => {
      RefreshCardsView();
    },
    onDeleteSelected: () => {
      RefreshCardsView();
    },
    onAddClick: () => {
      OpenNoteModal(null);
    }
  });

  RefreshCardsView();
}

function renderGraphView() {
  const container = document.createElement('div');
  container.className = 'relative w-full h-[calc(100vh-140px)] min-h-[450px] rounded-2xl border border-[var(--border)] bg-[var(--surface)] overflow-hidden';

  const notes = NotesState.notes || [];
  const { nodes, links } = buildGraphData(notes);

  if (nodes.length === 0) {
    container.innerHTML = `
      <div class="flex flex-col items-center justify-center w-full h-full p-8 text-center">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="w-12 h-12 text-gray-500 mb-3"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        <div class="text-xl font-bold">Knowledge Graph is Empty</div>
        <div class="text-sm text-gray-500 mt-1">Create notes and link them using [[Note Title]] to explore graph connections.</div>
      </div>
    `;
    return container;
  }

  const canvas = document.createElement('canvas');
  canvas.className = 'w-full h-full cursor-grab block';
  container.appendChild(canvas);

  const controls = document.createElement('div');
  controls.className = 'absolute bottom-4 right-4 flex gap-2 z-10';
  controls.innerHTML = `
    <button class="notes-ghost-btn text-xs w-8 h-8 p-0 flex items-center justify-center font-bold" id="zoomInBtn" title="Zoom In">+</button>
    <button class="notes-ghost-btn text-xs w-8 h-8 p-0 flex items-center justify-center font-bold" id="zoomOutBtn" title="Zoom Out">&minus;</button>
    <button class="notes-ghost-btn text-xs w-8 h-8 p-0 flex items-center justify-center" id="resetGraphBtn" title="Reset View">⟲</button>
  `;
  container.appendChild(controls);

  const nodeMap = new Map();
  nodes.forEach((n) => {
    n.x = (Math.random() - 0.5) * 400;
    n.y = (Math.random() - 0.5) * 400;
    n.vx = 0;
    n.vy = 0;
    n.radius = Math.max(12, Math.min(24, (n.val || 10) * 1.4));
    nodeMap.set(n.id, n);
  });

  const graphLinks = links.map(l => ({
    source: nodeMap.get(l.source),
    target: nodeMap.get(l.target)
  })).filter(l => l.source && l.target);

  let transform = { x: 0, y: 0, scale: 1 };
  let isDraggingCanvas = false;
  let draggedNode = null;
  let hoveredNode = null;
  let startPan = { x: 0, y: 0 };
  let animId = null;

  function resize() {
    canvas.width = container.clientWidth * (window.devicePixelRatio || 1);
    canvas.height = container.clientHeight * (window.devicePixelRatio || 1);
    transform.x = canvas.width / 2;
    transform.y = canvas.height / 2;
  }

  function stepPhysics() {
    const repulsion = 1400;
    const springLen = 140;
    const springK = 0.04;
    const damping = 0.88;

    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const n1 = nodes[i];
        const n2 = nodes[j];
        const dx = n2.x - n1.x;
        const dy = n2.y - n1.y;
        const distSq = dx * dx + dy * dy || 1;
        const dist = Math.sqrt(distSq);

        if (dist < 450) {
          const force = repulsion / distSq;
          const fx = (dx / dist) * force;
          const fy = (dy / dist) * force;
          n1.vx -= fx;
          n1.vy -= fy;
          n2.vx += fx;
          n2.vy += fy;
        }
      }
    }

    graphLinks.forEach(l => {
      const dx = l.target.x - l.source.x;
      const dy = l.target.y - l.source.y;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;
      const force = (dist - springLen) * springK;
      const fx = (dx / dist) * force;
      const fy = (dy / dist) * force;

      l.source.vx += fx;
      l.source.vy += fy;
      l.target.vx -= fx;
      l.target.vy -= fy;
    });

    nodes.forEach(n => {
      if (n === draggedNode) return;
      n.vx -= n.x * 0.008;
      n.vy -= n.y * 0.008;
      n.vx *= damping;
      n.vy *= damping;
      n.x += n.vx;
      n.y += n.vy;
    });
  }

  function draw() {
    if (!canvas || typeof canvas.getContext !== 'function') return;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const dpr = window.devicePixelRatio || 1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(transform.x, transform.y);
    ctx.scale(transform.scale * dpr, transform.scale * dpr);

    // Links
    graphLinks.forEach(l => {
      const isConnected = hoveredNode && (hoveredNode === l.source || hoveredNode === l.target);
      ctx.strokeStyle = isConnected ? '#8b6dff' : '#4a516d';
      ctx.lineWidth = isConnected ? 2.5 : 1.2;
      ctx.beginPath();
      ctx.moveTo(l.source.x, l.source.y);
      ctx.lineTo(l.target.x, l.target.y);
      ctx.stroke();
    });

    // Nodes
    nodes.forEach(n => {
      const isHovered = (n === hoveredNode);
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.radius + (isHovered ? 4 : 0), 0, Math.PI * 2);
      ctx.fillStyle = isHovered ? '#a78bfa' : '#8b6dff';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.font = `${isHovered ? 'bold 13px' : '11px'} system-ui, sans-serif`;
      ctx.fillStyle = '#e8eaf2';
      ctx.textAlign = 'center';
      ctx.fillText(n.title, n.x, n.y + n.radius + 14);
    });

    ctx.restore();
  }

  function loop() {
    stepPhysics();
    draw();
    animId = requestAnimationFrame(loop);
  }

  function getGraphCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    const dpr = window.devicePixelRatio || 1;

    const screenX = (clientX - rect.left) * dpr;
    const screenY = (clientY - rect.top) * dpr;

    const worldX = (screenX - transform.x) / (transform.scale * dpr);
    const worldY = (screenY - transform.y) / (transform.scale * dpr);
    return { worldX, worldY, clientX, clientY };
  }

  function findNodeUnder(worldX, worldY) {
    for (let i = nodes.length - 1; i >= 0; i--) {
      const n = nodes[i];
      const dx = worldX - n.x;
      const dy = worldY - n.y;
      if (dx * dx + dy * dy <= (n.radius + 6) * (n.radius + 6)) {
        return n;
      }
    }
    return null;
  }

  canvas.addEventListener('mousedown', (e) => {
    const { worldX, worldY, clientX, clientY } = getGraphCoords(e);
    const hitNode = findNodeUnder(worldX, worldY);

    if (hitNode) {
      draggedNode = hitNode;
    } else {
      isDraggingCanvas = true;
      startPan = { x: clientX - transform.x, y: clientY - transform.y };
    }
  });

  window.addEventListener('mousemove', (e) => {
    const { worldX, worldY, clientX, clientY } = getGraphCoords(e);

    if (draggedNode) {
      draggedNode.x = worldX;
      draggedNode.y = worldY;
      draggedNode.vx = 0;
      draggedNode.vy = 0;
    } else if (isDraggingCanvas) {
      transform.x = clientX - startPan.x;
      transform.y = clientY - startPan.y;
    } else {
      hoveredNode = findNodeUnder(worldX, worldY);
      canvas.style.cursor = hoveredNode ? 'pointer' : 'grab';
    }
  });

  window.addEventListener('mouseup', (e) => {
    const { worldX, worldY } = getGraphCoords(e);
    if (draggedNode) {
      const hitNode = findNodeUnder(worldX, worldY);
      if (hitNode === draggedNode) {
        window.location.hash = `#Notes?id=${encodeURIComponent(hitNode.id)}`;
      }
    }
    draggedNode = null;
    isDraggingCanvas = false;
  });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
    transform.scale = Math.max(0.3, Math.min(3.5, transform.scale * zoomFactor));
  });

  controls.querySelector('#zoomInBtn').addEventListener('click', () => {
    transform.scale = Math.min(3.5, transform.scale * 1.2);
  });
  controls.querySelector('#zoomOutBtn').addEventListener('click', () => {
    transform.scale = Math.max(0.3, transform.scale * 0.8);
  });
  controls.querySelector('#resetGraphBtn').addEventListener('click', () => {
    transform = { x: canvas.width / 2, y: canvas.height / 2, scale: 1 };
  });

  window.addEventListener('resize', resize);
  setTimeout(() => {
    resize();
    loop();
  }, 30);

  return container;
}

function handleRoute() {
  const currentHash = (window.location.hash || '').trim();
  const lowerHash = currentHash.toLowerCase();
  const root = document.getElementById('root');
  if (root) root.innerHTML = '';

  if (lowerHash.startsWith('#bookmarks')) {
    LoadBookmarkPage();
  } else if (lowerHash.startsWith('#notes')) {
    LoadNotesPage();
  } else {
    LoadLandingPage();
  }
}
