function RenderBookmarksGrid(container, state, { onEdit, onDelete }) {
  if (!container) return;
  container.innerHTML = '';

  const activeSection = GetActiveSection();
  const groups = activeSection === 'ALL'
    ? (state.sectionOrder ? state.sectionOrder.filter(s => s !== 'ALL') : [])
    : [activeSection];

  const savedView = localStorage.getItem('lh_bookmark_view') || 'grid';

  groups.forEach(groupName => {
    const groupBookmarks = (state.bookmarks || []).filter(b => b.group === groupName);
    if (groupBookmarks.length === 0 && activeSection === 'ALL') return;

    const secEl = document.createElement('div');
    secEl.className = 'bookmark-section';

    const titleEl = document.createElement('div');
    titleEl.className = 'section-title';
    titleEl.innerHTML = `${groupName} <span class="count-pill">${groupBookmarks.length}</span>`;
    secEl.appendChild(titleEl);

    const gridEl = document.createElement('div');
    gridEl.className = savedView === 'list' ? 'group-grid view-list' : 'group-grid view-grid';
    gridEl.dataset.group = groupName;

    groupBookmarks.forEach(b => {
      const card = document.createElement('a');
      card.className = 'bookmark-card';
      card.href = b.url;
      card.target = '_blank';
      card.rel = 'noopener';
      card.draggable = true;
      card.dataset.id = b.id;
      card.dataset.group = b.group;

      let domain = b.url;
      try {
        domain = new URL(b.url).hostname.replace(/^www\./, '');
      } catch (e) {}

      let iconHtml = '';
      if (b.useTitleLogo) {
        const letter = (b.name || '?').charAt(0).toUpperCase();
        let hash = 0;
        const str = b.name || '';
        for (let i = 0; i < str.length; i++) {
          hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        const hue = Math.abs(hash) % 360;
        iconHtml = `<div class="favicon" style="background: hsl(${hue}, 75%, 45%); color: #ffffff; font-weight: 800; border-radius: 10px; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.3); text-shadow: 0 1px 2px rgba(0,0,0,0.4); flex-shrink: 0;">${letter}</div>`;
      } else if (b.customIcon && b.customIcon.trim()) {
        iconHtml = `<div class="favicon"><img src="${b.customIcon.trim()}" alt="" onerror="this.src='https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64'"/></div>`;
      } else {
        iconHtml = `<div class="favicon"><img src="https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64" alt="" /></div>`;
      }

      card.innerHTML = `
        <div class="card-main-info">
          ${iconHtml}
          <div class="card-text">
            <span class="title">${b.name || 'Untitled'}</span>
            <span class="url-domain">${domain}</span>
          </div>
        </div>

        <div class="card-actions">
          <div class="action-icon edit" title="Edit bookmark">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </div>
          <div class="action-icon delete" title="Delete bookmark">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </div>
        </div>
      `;

      // Event handlers for Edit and Delete
      const editBtn = card.querySelector('.action-icon.edit');
      if (editBtn) {
        editBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (onEdit) onEdit(b);
        });
      }

      const delBtn = card.querySelector('.action-icon.delete');
      if (delBtn) {
        delBtn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (onDelete) onDelete(b.id);
        });
      }

      // Smooth FLIP Animated Drag and Drop within section
      card.addEventListener('dragstart', (e) => {
        CardDraggedId = b.id;
        CardDraggedGroup = b.group;
        TemporaryGroupCards = [...groupBookmarks];
        card.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', b.id);
      });

      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';

        if (!CardDraggedId || CardDraggedGroup !== b.group || CardDraggedId === b.id) return;
        if (!TemporaryGroupCards) return;

        const srcIdx = TemporaryGroupCards.findIndex(bm => bm.id === CardDraggedId);
        const tgtIdx = TemporaryGroupCards.findIndex(bm => bm.id === b.id);

        if (srcIdx !== -1 && tgtIdx !== -1 && srcIdx !== tgtIdx) {
          // 1. Record First bounding boxes before DOM reordering
          const oldPositions = new Map();
          gridEl.querySelectorAll('.bookmark-card').forEach(el => {
            oldPositions.set(el.dataset.id, el.getBoundingClientRect());
          });

          // 2. Reorder temporary array
          const [moved] = TemporaryGroupCards.splice(srcIdx, 1);
          TemporaryGroupCards.splice(tgtIdx, 0, moved);

          // 3. Reorder DOM elements inside gridEl
          TemporaryGroupCards.forEach(bm => {
            const el = gridEl.querySelector(`.bookmark-card[data-id="${bm.id}"]`);
            if (el) gridEl.appendChild(el);
          });

          // 4. Animate shifting cards smoothly (Last, Invert, Play)
          gridEl.querySelectorAll('.bookmark-card').forEach(el => {
            const id = el.dataset.id;
            if (id === CardDraggedId) return;

            const oldPos = oldPositions.get(id);
            if (oldPos) {
              const newPos = el.getBoundingClientRect();
              const dx = oldPos.left - newPos.left;
              const dy = oldPos.top - newPos.top;

              if (dx !== 0 || dy !== 0) {
                el.style.transform = `translate(${dx}px, ${dy}px)`;
                el.style.transition = 'none';

                requestAnimationFrame(() => {
                  el.style.transition = 'transform 0.24s cubic-bezier(0.2, 0, 0, 1)';
                  el.style.transform = '';
                });
              }
            }
          });
        }
      });

      card.addEventListener('dragend', () => {
        card.classList.remove('is-dragging');

        if (TemporaryGroupCards && CardDraggedGroup) {
          // Commit new order to persistent state
          const otherBookmarks = state.bookmarks.filter(bm => bm.group !== CardDraggedGroup);
          state.bookmarks = [...otherBookmarks, ...TemporaryGroupCards];
          SaveBookmarkState(state);

          TemporaryGroupCards = null;
          CardDraggedId = null;
          CardDraggedGroup = null;

          RenderBookmarksGrid(container, state, { onEdit, onDelete });
        }
      });

      gridEl.appendChild(card);
    });

    secEl.appendChild(gridEl);
    container.appendChild(secEl);
  });
}

// Loads notes from HTML vault (#NotesData) and optionally recovers uncommitted edits from localStorage
function LoadNotesState() {
  const dataBlock = typeof document !== 'undefined' ? document.getElementById('NotesData') : null;
  let domState = null;

  if (dataBlock && dataBlock.textContent.trim()) {
    try {
      const parsedDom = JSON.parse(dataBlock.textContent);
      if (parsedDom && typeof parsedDom === 'object') {
        domState = {
          vaultMeta: parsedDom.vaultMeta || { title: "My Research & Notes Vault", version: "1.0.0", lastSaved: 0 },
          globalMacros: parsedDom.globalMacros || { ...DEFAULT_GLOBAL_MACROS },
          tableTemplates: Array.isArray(parsedDom.tableTemplates) ? parsedDom.tableTemplates : [],
          tikzTemplates: Array.isArray(parsedDom.tikzTemplates) ? parsedDom.tikzTemplates : [],
          folders: Array.isArray(parsedDom.folders) ? parsedDom.folders : [],
          tags: Array.isArray(parsedDom.tags) ? parsedDom.tags : [],
          notes: Array.isArray(parsedDom.notes) ? parsedDom.notes.map(sanitizeNote) : []
        };
      }
    } catch (e) {
      console.warn('Could not parse DOM NotesData from HTML:', e);
    }
  }

  // 1. Check if browser Local Storage has an active unsaved crash recovery buffer
  try {
    const cached = typeof localStorage !== 'undefined' ? localStorage.getItem('NotesData_Local_Cache') : null;
    if (cached) {
      const parsedCache = JSON.parse(cached);
      const domTimestamp = domState?.vaultMeta?.lastSaved || 0;
      const cacheTimestamp = parsedCache?._savedAt || 0;

      // Only restore from cache if it represents active unsaved edits newer than the HTML file's last saved date
      if (parsedCache && parsedCache._unsaved === true && cacheTimestamp > domTimestamp && Array.isArray(parsedCache.notes)) {
        console.log('[NotesState] Recovering uncommitted working edits from local cache...');
        const cachedNotes = parsedCache.notes.map(sanitizeNote);
        const allFolders = Array.from(new Set(cachedNotes.map(n => n.folder || 'General').filter(Boolean)));
        const allTags = Array.from(new Set(cachedNotes.flatMap(n => n.tags || []).filter(Boolean)));

        Object.assign(NotesState, {
          vaultMeta: parsedCache.vaultMeta || domState?.vaultMeta || { title: "My Research & Notes Vault", version: "1.0.0", lastSaved: cacheTimestamp },
          globalMacros: parsedCache.globalMacros || domState?.globalMacros || { ...DEFAULT_GLOBAL_MACROS },
          tableTemplates: parsedCache.tableTemplates || domState?.tableTemplates || [],
          tikzTemplates: parsedCache.tikzTemplates || domState?.tikzTemplates || [],
          folders: allFolders,
          tags: allTags,
          notes: cachedNotes
        });

        if (dataBlock) dataBlock.textContent = JSON.stringify(NotesState, null, 2);
        if (typeof window !== 'undefined') window.NotesState = NotesState;
        return NotesState;
      }
    }
  } catch (e) {
    console.warn('Could not read NotesData_Local_Cache from localStorage:', e);
  }

  // 2. Pure, clean load directly from HTML data vault (#NotesData)
  if (domState) {
    Object.assign(NotesState, {
      vaultMeta: domState.vaultMeta,
      globalMacros: domState.globalMacros || { ...DEFAULT_GLOBAL_MACROS },
      tableTemplates: domState.tableTemplates || [],
      tikzTemplates: domState.tikzTemplates || [],
      folders: domState.folders.length > 0 ? domState.folders : Array.from(new Set(domState.notes.map(n => n.folder || 'General').filter(Boolean))),
      tags: domState.tags.length > 0 ? domState.tags : Array.from(new Set(domState.notes.flatMap(n => n.tags || []).filter(Boolean))),
      notes: domState.notes
    });
    if (typeof window !== 'undefined') window.NotesState = NotesState;
    return NotesState;
  }

  // 3. Clean default fallback
  Object.assign(NotesState, {
    vaultMeta: { title: "My Research & Notes Vault", version: "1.0.0", lastSaved: 0 },
    globalMacros: { ...DEFAULT_GLOBAL_MACROS },
    tableTemplates: [],
    tikzTemplates: [],
    folders: [],
    tags: [],
    notes: []
  });
  if (typeof window !== 'undefined') window.NotesState = NotesState;
  return NotesState;
}

// Persists active notes, syncs folder/tag lists, and updates HTML vault & unsaved localStorage cache
function SaveNotesState(newState = null) {
  if (newState) NotesState = newState;

  // Sync folders and tags to currently active notes
  if (Array.isArray(NotesState.notes)) {
    NotesState.folders = Array.from(new Set(NotesState.notes.map(n => n.folder || 'General').filter(Boolean)));
    NotesState.tags = Array.from(new Set(NotesState.notes.flatMap(n => n.tags || []).filter(Boolean)));
  }

  // 1. Write to DOM <script id="NotesData">
  const dataBlock = typeof document !== 'undefined' ? document.getElementById('NotesData') : null;
  if (dataBlock) {
    dataBlock.textContent = JSON.stringify(NotesState, null, 2);
  }

  // 2. Keep window.NotesState in sync
  if (typeof window !== 'undefined') {
    window.NotesState = NotesState;
  }

  // 3. Persist to browser Local Storage as active unsaved working buffer
  try {
    if (typeof localStorage !== 'undefined') {
      const cachePayload = {
        ...NotesState,
        _unsaved: true,
        _savedAt: Date.now()
      };
      localStorage.setItem('NotesData_Local_Cache', JSON.stringify(cachePayload));
    }
  } catch (err) {
    console.warn('Failed to save NotesData to localStorage:', err);
  }
}

/**
 * 03_Notes/02_Utils.js
 * Universal utilities for 03_Notes:
 * - HTML string escaping (XSS & markup protection)
 * - Markdown task checkbox toggling
 * - Rich note description formatting (Markdown & LaTeX Math)

// Sanitizes raw strings by escaping HTML special characters to prevent XSS and layout breaks
function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Toggles completion state of a markdown checkbox at a specific index in raw text
function toggleTaskInRawText(rawText, targetIndex, isChecked) {
  if (!rawText) return rawText;
  let count = 0;
  return rawText.replace(/(^|\n)(\s*(?:[-*]\s*)?\[)([ xX])?(\]\s*)/g, (match, prefix, before, currentCheck, after) => {
    if (count === targetIndex) {
      count++;
      return `${prefix}${before}${isChecked ? 'x' : ' '}${after}`;
    }
    count++;
    return match;
  });
}

// Formats markdown/math note description with optional placeholder fallback for live preview
function formatNoteDescription(rawText, { fallbackText = '' } = {}) {
  const clean = (rawText || '').trim();
  if (!clean) {
    return fallbackText || '';
  }
  return formatRichTextWithMath(clean);
}

// Extracts the plain text or markdown representation of a note's description or blocks
function getNoteRawDescription(note) {
  if (!note) return '';
  if (typeof note.description === 'string' && note.description.trim()) {
    return note.description;
  }
  if (note.flashcard && note.flashcard.back) {
    return (note.flashcard.front ? note.flashcard.front + '\n' : '') + note.flashcard.back;
  }
  if (note.blocks && Array.isArray(note.blocks) && note.blocks.length > 0) {
    const textBlocks = note.blocks.filter(b => b.type === 'text' || b.type === 'equation' || b.type === 'block' || b.type === 'theorem');
    if (textBlocks.length > 0) {
      return textBlocks.map(b => b.content || b.tex || '').filter(Boolean).join('\n');
    }
    const nonHeading = note.blocks.filter(b => b.type !== 'heading');
    if (nonHeading.length > 0) {
      return nonHeading.map(b => b.content || b.tex || '').filter(Boolean).join('\n');
    }
    return note.blocks[0].content || '';
  }
  return '';
}

// Extracts unique list of available folder/group names from state and notes
function getAvailableFolders(state) {
  const folders = (state && Array.isArray(state.folders)) ? [...state.folders] : [];
  const notes = (state && Array.isArray(state.notes)) ? state.notes : [];
  notes.forEach(n => {
    const folder = (n && n.folder) ? n.folder.trim() : 'General';
    if (folder && !folders.includes(folder)) {
      folders.push(folder);
    }
  });
  if (!folders.includes('General')) {
    folders.unshift('General');
  }
  return Array.from(new Set(folders.filter(Boolean)));
}

/**
 * 03_Notes/Writing_Engine/Bullet_Engine.js
 * Bullet & List Management Engine:
 * - Built-in presets (Obsidian disc, dash, arrow, star, diamond, numbered, checkbox)
 * - Globally persisted custom LaTeX bullets (via localStorage['notes_custom_bullets'])
 * - Synchronous and on-demand KaTeX bullet compilation
 */
const BULLET_PRESETS = [
  { id: 'disc', label: '• Disc (Obsidian Default)', symbol: '•', type: 'symbol' },
  { id: 'dash', label: '– Dash', symbol: '–', type: 'symbol' },
  { id: 'arrow', label: '➔ Arrow', symbol: '➔', type: 'symbol' },
  { id: 'star', label: '✦ Star', symbol: '✦', type: 'symbol' },
  { id: 'diamond', label: '◆ Diamond', symbol: '◆', type: 'symbol' },
  { id: 'numbered', label: '1. Numbered List', symbol: '1.', type: 'numbered' },
  { id: 'checkbox', label: '☐ Task Checkbox', symbol: '[ ]', type: 'task' }
];

const STORAGE_KEY = 'notes_custom_bullets';

/**
 * Returns list of globally saved custom LaTeX bullets.
 * Default starting seeds include useful mathematical bullet points.
 */
function getCustomBullets() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return parsed;
    }
  } catch (e) {
    console.warn('Failed to read custom bullets from localStorage:', e);
  }
  // Default seeds if none stored yet
  const defaults = ['\\blacksquare', '\\Rightarrow', '\\star', '\\circ'];
  saveCustomBullets(defaults);
  return defaults;
}

/**
 * Saves custom bullets array to localStorage.
 */
function saveCustomBullets(bullets) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(new Set(bullets))));
  } catch (e) {
    console.warn('Failed to save custom bullets to localStorage:', e);
  }
}

/**
 * Adds a new custom LaTeX bullet to global storage.
 */
function addCustomBullet(latexCode) {
  const clean = (latexCode || '').trim();
  if (!clean) return false;
  const current = getCustomBullets();
  if (!current.includes(clean)) {
    current.push(clean);
    saveCustomBullets(current);
  }
  return true;
}

/**
 * Deletes a custom LaTeX bullet from global storage.
 */
function removeCustomBullet(latexCode) {
  const current = getCustomBullets().filter(b => b !== latexCode);
  saveCustomBullets(current);
}

/**
 * Renders a bullet marker given a bullet style key or LaTeX string.
 */
function renderBulletMarker(bulletStyle = 'disc') {
  if (!bulletStyle || bulletStyle === 'disc') {
    return `<span class="bullet-marker text-purple-400 select-none mr-2 font-bold">•</span>`;
  }
  if (bulletStyle === 'dash') {
    return `<span class="bullet-marker text-purple-400 select-none mr-2 font-bold">–</span>`;
  }
  if (bulletStyle === 'arrow') {
    return `<span class="bullet-marker text-purple-400 select-none mr-2 font-bold">➔</span>`;
  }
  if (bulletStyle === 'star') {
    return `<span class="bullet-marker text-purple-400 select-none mr-2 font-bold">✦</span>`;
  }
  if (bulletStyle === 'diamond') {
    return `<span class="bullet-marker text-purple-400 select-none mr-2 font-bold">◆</span>`;
  }

  // Custom LaTeX Bullet (starts with backslash or has LaTeX macro)
  if (bulletStyle.startsWith('\\') || bulletStyle.includes('\\')) {

    return `<span class="bullet-marker text-purple-400 select-none mr-2 inline-flex items-center justify-center text-xs leading-none">${renderedMath}</span>`;
  }

  // Fallback symbol
  return `<span class="bullet-marker text-purple-400 select-none mr-2 font-bold">${escapeHtml(bulletStyle)}</span>`;
}

/**

 * If targetIndex is -1, null, or out of range, appends to the end.
 * Returns the index where the block was inserted.
 */
function insertBlockAt(blocks = [], newBlock, targetIndex = -1) {
  if (!Array.isArray(blocks)) return 0;
  if (targetIndex < 0 || targetIndex >= blocks.length) {
    blocks.push(newBlock);
    return blocks.length - 1;
  }
  blocks.splice(targetIndex, 0, newBlock);
  return targetIndex;

/* --- 03_Notes/Writing_Engine/Numbering_Engine.js --- */
/**
 * 03_Notes/04_Engine/Numbering_Engine.js
 * Hierarchical section auto-numbering engine supporting:
 * - Numeric (1, 1.1, 1.1.1)
 * - Roman Upper (I, II, III...) & Lower (i, ii, iii...)
 * - Alphabetic Upper (A, B, C...) & Lower (a, b, c...)
 * - Per-level overrides and toggleable numbering.
 */
function toRoman(num, upper = false) {
  if (!num || num < 1) return '';
  const map = [
    [1000, 'm'], [900, 'cm'], [500, 'd'], [400, 'cd'],
    [100, 'c'], [90, 'xc'], [50, 'l'], [40, 'xl'],
    [10, 'x'], [9, 'ix'], [5, 'v'], [4, 'iv'], [1, 'i']
  ];
  let result = '';
  let n = num;
  for (const [v, r] of map) {
    while (n >= v) {
      result += r;
      n -= v;
    }
  }
  return upper ? result.toUpperCase() : result;
}
function toAlpha(num, upper = false) {
  if (!num || num < 1) return '';
  let result = '';
  let n = num;
  while (n > 0) {
    const mod = (num - 1) % 26;
    result = String.fromCharCode(65 + mod) + result;
    n = Math.floor((n - 1) / 26);
  }
  return upper ? result.toUpperCase() : result.toLowerCase();
}
function formatSingleNumber(num, style) {
  if (!style || style === 'none' || style === 'off') return '';
  if (style === 'roman' || style === 'roman_lower') return toRoman(num, false);
  if (style === 'roman_upper') return toRoman(num, true);
  if (style === 'alpha_upper' || style === 'upper_alphabetic') return toAlpha(num, true);
  if (style === 'alpha_lower' || style === 'lower_alphabetic') return toAlpha(num, false);
  return String(num); // default 'numeric'
}

/**
 * Calculates prefixes for all heading blocks in a note based on per-level config and pattern inheritance.
 * Rules:
 * 1. If a level's style is 'none' or 'off', it has no prefix.
 * 2. Section (H1): prefix = format(h1Count, h1Style) + '. '
 * 3. Sub-Section (H2):
 *    - If h1Style is active AND h1Style === h2Style: prefix = `${format(h1Count, h1Style)}.${format(h2Count, h2Style)}. ` (e.g. 1.1., i.i., A.A.)
 *    - Otherwise: prefix = `${format(h2Count, h2Style)}. ` (e.g. i., A., 1.)
 * 4. Sub-Sub-Section (H3):
 *    - If h1Style, h2Style, h3Style all active AND h1Style === h2Style && h2Style === h3Style:
 *      prefix = `${format(h1Count, h1Style)}.${format(h2Count, h2Style)}.${format(h3Count, h3Style)}. ` (e.g. 1.1.1.)
 *    - Else if h2Style is active AND h2Style === h3Style:
 *      prefix = `${format(h2Count, h2Style)}.${format(h3Count, h3Style)}. `
 *    - Otherwise:
 *      prefix = `${format(h3Count, h3Style)}. ` (e.g. i., a., 1.)
 */
function computeHeadingPrefixes(blocks = [], autoNumberingConfig = null) {
  const config = autoNumberingConfig || {
    h1: 'numeric',
    h2: 'numeric',
    h3: 'numeric'
  };

  const prefixMap = new Map();

  let h1Count = 0;
  let h2Count = 0;
  let h3Count = 0;

  const h1Style = config.h1 || 'numeric';
  const h2Style = config.h2 || 'numeric';
  const h3Style = config.h3 || 'numeric';

  const isH1Active = h1Style !== 'none' && h1Style !== 'off';
  const isH2Active = h2Style !== 'none' && h2Style !== 'off';
  const isH3Active = h3Style !== 'none' && h3Style !== 'off';

  blocks.forEach((block, idx) => {
    if (block.type !== 'heading') return;

    const level = block.level || 'h1';
    let prefix = '';

    if (level === 'h1') {
      h1Count++;
      h2Count = 0;
      h3Count = 0;

      if (isH1Active) {
        const n1 = formatSingleNumber(h1Count, h1Style);
        if (n1) prefix = `${n1}. `;
      }
    } else if (level === 'h2') {
      h2Count++;
      h3Count = 0;

      if (isH2Active) {
        const n2 = formatSingleNumber(h2Count, h2Style);
        if (isH1Active && h1Style === h2Style && h1Count > 0) {
          const n1 = formatSingleNumber(h1Count, h1Style);
          prefix = `${n1}.${n2}. `;
        } else if (n2) {
          prefix = `${n2}. `;
        }
      }
    } else if (level === 'h3') {
      h3Count++;

      if (isH3Active) {
        const n3 = formatSingleNumber(h3Count, h3Style);
        if (isH1Active && isH2Active && h1Style === h2Style && h2Style === h3Style && h1Count > 0 && h2Count > 0) {
          const n1 = formatSingleNumber(h1Count, h1Style);
          const n2 = formatSingleNumber(h2Count, h2Style);
          prefix = `${n1}.${n2}.${n3}. `;
        } else if (isH2Active && h2Style === h3Style && h2Count > 0) {
          const n2 = formatSingleNumber(h2Count, h2Style);
          prefix = `${n2}.${n3}. `;
        } else if (n3) {
          prefix = `${n3}. `;
        }
      }
    }

    prefixMap.set(block.id || idx, prefix);
  });

  return prefixMap;
}

/**
 * Calculates sequential figure numbers across Image and TikZ blocks,
 * creating both a block-to-figure metadata map and a tag/label citation lookup map.
 */
function computeFigureNumbers(blocks = []) {
  const figureMap = new Map(); // (block.id || idx) -> { figNumber, prefix, tag, allowNumbering }
  const tagMap = new Map();    // normalizedTag -> figNumber
  let currentFig = 0;

  const processBlock = (block, fallbackKey) => {
    if (!block || typeof block !== 'object') return;
    if (block.type === 'columns' || block.type === 'multicolumn' || block.type === 'multi-column') {
      (block.cols || []).forEach((child, cIdx) => {
        processBlock(child, `${block.id || fallbackKey}_col_${cIdx}`);
      });
      return;
    }

    if (block.type === 'image' || block.type === 'tikz') {
      const isNumberingAllowed = block.allowNumbering !== false;
      const rawTag = (block.tag || '').trim();
      const normalizedTag = rawTag.toLowerCase();

      if (isNumberingAllowed) {
        currentFig++;
        const figNumber = currentFig;
        const tag = rawTag || `fig${figNumber}`;

        figureMap.set(block.id || fallbackKey, {
          figNumber: figNumber,
          prefix: `Fig: ${figNumber}: `,
          tag: tag,
          allowNumbering: true
        });

        if (normalizedTag) {
          tagMap.set(normalizedTag, figNumber);
        }
        tagMap.set(String(figNumber), figNumber);
      } else {
        figureMap.set(block.id || fallbackKey, {
          figNumber: null,
          prefix: '',
          tag: rawTag,
          allowNumbering: false
        });
        if (normalizedTag) {
          tagMap.set(normalizedTag, null);
        }
      }
    }
  };

  blocks.forEach((block, idx) => {
    processBlock(block, idx);
  });

  return { figureMap, tagMap };
}

/**
 * Parses \newcommand, \renewcommand, and \def macros into a KaTeX macros dictionary
 */
function parseLatexMacrosIntoObject(macroString, targetMacros = {}) {
  if (!macroString || typeof macroString !== 'string') return targetMacros;
  const resolved = resolveThemeColors(macroString);

  // Match: \newcommand{\name}[num]{expansion} or \renewcommand{\name}[num]{expansion}
  const cmdWithArgs = /\\(?:newcommand|renewcommand)\s*\{\\([a-zA-Z]+)\}\s*\[(\d+)\]\s*\{((?:[^{}]|\{[^{}]*\})*)\}/g;
  let match;
  while ((match = cmdWithArgs.exec(resolved)) !== null) {
    targetMacros[`\\${match[1]}`] = match[3];
  }

  // Match: \newcommand{\name}{expansion} or \renewcommand{\name}{expansion}
  const cmdNoArgs = /\\(?:newcommand|renewcommand)\s*\{\\([a-zA-Z]+)\}\s*\{((?:[^{}]|\{[^{}]*\})*)\}/g;
  while ((match = cmdNoArgs.exec(resolved)) !== null) {
    if (!targetMacros[`\\${match[1]}`]) {
      targetMacros[`\\${match[1]}`] = match[2];
    }

  s = s.replace(/`([^`]+)`/g, '<code class="note-inline-code">$1</code>');
  return s;

function ensureTikzJaxLoaded(callback) {

    const link = document.createElement('link');
    link.id = 'tikzjax-css';
    link.rel = 'stylesheet';
    link.href = 'https://tikzjax.com/v1/fonts.css';

    script.id = 'tikzjax-js';
    script.src = 'https://tikzjax.com/v1/tikzjax.js';

    script.onload = () => {

      if (typeof window.onload === 'function') {
        window.__tikzjax_runner = window.onload;
      }
      if (callback) callback();
    };

    script.onerror = (e) => {
      console.error('Failed to load TikZJax script from CDN:', e);
    };

    document.head.appendChild(script);

    let attempts = 0;

        clearInterval(checkInterval);
        if (callback) callback();
      } else if (typeof window.onload === 'function') {
        window.__tikzjax_runner = window.onload;
        clearInterval(checkInterval);
        if (callback) callback();
      } else if (attempts > 40) {
        clearInterval(checkInterval);
        if (callback) callback();
      }
    }, 80);
  }

        isSettled = true;

        resolve(svg);
      }

    observer.observe(targetContainer, { childList: true, subtree: true });

        observer.disconnect();
        return;

      const svg = targetContainer.querySelector('svg');

      if (el.innerHTML && (/&#124;|\||&#8741;|\u2225/.test(el.innerHTML) || /\||\u2225/.test(el.textContent || ''))) {
        el.innerHTML = el.innerHTML
          .replace(/&#124;|\|/g, '&#106;')
          .replace(/&#8741;|\u2225/g, '&#107;');
      }
    }
  });
}

/**
 * Compiles TikZ code into SVG inside targetContainer without whole-page refresh.
 * @param {string} tikzCode - The raw TikZ LaTeX code.
 * @param {HTMLElement} targetContainer - Target DOM element to render the diagram.
 * @param {Function} [onComplete] - Callback receiving (success, error).
 * @param {Object} [noteContext] - Optional note object containing local macros.
 */
function renderTikzToElement(tikzCode, targetContainer, onComplete = null, noteContext = null) {
  if (!targetContainer) return;

  targetContainer.__lastTikzCode = tikzCode;
  targetContainer.__lastTikzOnComplete = onComplete;
  targetContainer.__lastTikzNoteContext = noteContext;
  activeTikzContainers.add(targetContainer);

  const rawClean = (tikzCode || '').trim();
  if (!rawClean) {
    targetContainer.innerHTML = '<div class="text-xs text-[var(--text-secondary,#a0a4b8)] italic p-4 text-center select-none">Empty TikZ diagram</div>';
    if (onComplete) onComplete(true);
    return;
  }

  // 1. Instant Bi-Theme Cache Check
  const isLight = (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme') === 'light');
  const currentTheme = isLight ? 'light' : 'dark';
  const cacheKey = `${currentTheme}:::${rawClean}`;

  if (tikzSvgCache.has(cacheKey)) {
    targetContainer.innerHTML = tikzSvgCache.get(cacheKey);
    if (onComplete) onComplete(true);
    return;
  }

  const currentRenderId = (targetContainer.__tikzRenderId || 0) + 1;
  targetContainer.__tikzRenderId = currentRenderId;

  // 1. Auto-heal common typo: missing backslash before draw, node, path, fill, clip
  const healedCode = healTikzCode(rawClean);

  // 2. Resolve dual-theme colors (#Light|#Dark)
  const resolvedCode = resolveThemeColors(healedCode);
  const basePreamble = resolveThemeColors(getActiveTikzPreamble(noteContext));

  // 3. Translate any raw #HEX colors to valid TikZ \definecolor names
  // In LaTeX/TikZ, raw '#' causes "Illegal parameter number in definition of \pgfkeyscurrentkey"
  const colorMap = new Map();
  const tikzSafeCode = resolvedCode.replace(/#([0-9a-fA-F]{3,8})\b/g, (match, hex) => {
    let fullHex = hex;
    if (hex.length === 3) fullHex = hex.split('').map(c => c + c).join('');
    if (fullHex.length === 6) {
      const colorName = `col_${fullHex.toLowerCase()}`;
      if (!colorMap.has(colorName)) {
        colorMap.set(colorName, `\\definecolor{${colorName}}{HTML}{${fullHex.toUpperCase()}}`);
      }
      return colorName;
    }
    return match;
  });

  const dynamicColorPreamble = Array.from(colorMap.values()).join('\n');
  const fullPreamble = [basePreamble, dynamicColorPreamble].filter(Boolean).join('\n');

  let fullTikzScript = '';
  if (tikzSafeCode.includes('\\begin{tikzpicture}')) {
    fullTikzScript = `${fullPreamble}\n${tikzSafeCode}`;
  } else {
    fullTikzScript = `${fullPreamble}\n\\begin{tikzpicture}\n${tikzSafeCode}\n\\end{tikzpicture}`;
  }

  // Temporary compiling indicator
  targetContainer.innerHTML = `
    <div class="tikz-compiling-indicator flex items-center justify-center gap-2.5 p-4 text-xs font-medium text-[var(--text-secondary,#a0a4b8)] select-none">
      <svg class="animate-spin h-4 w-4 text-[var(--accent,#8b6dff)]" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      <span>Compiling TikZ diagram...</span>
    </div>
  `;

  whenConnected(targetContainer, () => {
    if (targetContainer.__tikzRenderId !== currentRenderId || !targetContainer.isConnected) return;

    ensureTikzJaxLoaded(async () => {
      if (targetContainer.__tikzRenderId !== currentRenderId || !targetContainer.isConnected) return;

      try {
        targetContainer.innerHTML = '';
        const scriptEl = document.createElement('script');
        scriptEl.type = 'text/tikz';
        scriptEl.textContent = fullTikzScript;
        targetContainer.appendChild(scriptEl);

        const runner = window.__tikzjax_runner || (typeof window.onload === 'function' ? window.onload : null);
        let runnerPromise = null;
        if (typeof runner === 'function') {
          window.__tikzjax_runner = runner;
          try {
            runnerPromise = runner();
          } catch (e) {
            runnerPromise = Promise.reject(e);
          }
        }

        // Asynchronously wait for TikzJax to finish compilation and mount the SVG,
        // or fail fast if the runner throws an error instead of waiting 20s
        const svgEl = await Promise.race([
          waitForTikzSvg(targetContainer, currentRenderId, 20000),
          (async () => {
            if (runnerPromise) {
              try {
                await runnerPromise;
              } catch (err) {
                throw new Error(`TikZ compilation failed in TeX engine: ${err?.message || err}`);
              }
            }
            await new Promise(r => setTimeout(r, 600));
            if (!targetContainer.querySelector('svg') && targetContainer.__tikzRenderId === currentRenderId) {
              throw new Error('TikZ compilation completed without producing an SVG. Check syntax and missing semicolons.');
            }
            return new Promise(() => {});
          })()
        ]);
        if (targetContainer.__tikzRenderId !== currentRenderId) return;

        if (svgEl) {
          // Fix BaKoMa font glyph mismatch (e.g. |u| rendering as clubs ♣ and ||u|| missing)
          fixTikzSvgGlyphs(targetContainer);

          // 1. Unlock all parent wrappers injected by TikzJax (n and .page) so height expands naturally
          let parent = svgEl.parentElement;
          while (parent && parent !== targetContainer) {
            parent.style.width = '100%';
            parent.style.maxWidth = '100%';
            parent.style.height = 'auto';
            parent.style.minHeight = '0';
            parent.style.position = 'relative';
            parent.style.display = 'flex';
            parent.style.flexDirection = 'column';
            parent.style.alignItems = 'center';
            parent.style.justifyContent = 'center';
            parent.style.overflow = 'visible';
            parent = parent.parentElement;
          }

          // 2. Parse natural dimensions from viewBox for exact aspect ratio
          const vb = svgEl.getAttribute('viewBox');
          let naturalWidth = null;
          let naturalHeight = null;
          if (vb) {
            const parts = vb.trim().split(/\s+/).map(Number);
            if (parts.length === 4 && parts[2] > 0 && parts[3] > 0) {
              naturalWidth = parts[2];
              naturalHeight = parts[3];
            }
          }

          // 3. Style SVG: width is dominant, centered, height automatically scales with aspect ratio
          svgEl.style.position = 'relative';
          svgEl.style.display = 'block';
          svgEl.style.margin = '0 auto';
          svgEl.style.overflow = 'visible';

          if (naturalWidth && naturalHeight) {
            svgEl.style.aspectRatio = `${naturalWidth} / ${naturalHeight}`;
            svgEl.style.maxWidth = `${naturalWidth}pt`;
            svgEl.style.width = '100%';
            svgEl.style.height = 'auto';
          } else {
            svgEl.style.maxWidth = '100%';
            svgEl.style.height = 'auto';
          }

          // Cache the fully rendered and responsive container HTML for this theme and code
          tikzSvgCache.set(cacheKey, targetContainer.innerHTML);

          if (onComplete) onComplete(true);
        }
      } catch (err) {
        if (targetContainer.__tikzRenderId !== currentRenderId) return;
        console.error('TikzJax compilation error:', err);
        targetContainer.innerHTML = `
          <div class="p-3 text-xs text-red-400 bg-red-950/20 border border-red-800/40 rounded-lg select-text text-center">
            <strong>TikZ Compilation Failed:</strong> ${err.message || 'Check syntax and semicolons.'}
          </div>
        `;
        if (onComplete) onComplete(false, err);
      }
    });
  });
}

/**

let isHljsLoading = false;
let isHljsReady = typeof window.hljs !== 'undefined';

const HLJS_DARK_THEME = 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.8.0/build/styles/atom-one-dark.min.css';
const HLJS_LIGHT_THEME = 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.8.0/build/styles/atom-one-light.min.css';
function syncHighlightTheme() {
  if (typeof document === 'undefined') return;
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  const targetUrl = isLight ? HLJS_LIGHT_THEME : HLJS_DARK_THEME;

  let link = document.getElementById('hljs-css');
  if (!link) {
    link = document.createElement('link');
    link.id = 'hljs-css';
    link.rel = 'stylesheet';
    link.href = targetUrl;

    link.setAttribute('href', targetUrl);

  if (!document.getElementById('hljs-transparent-style')) {

      pre code.hljs,

        padding: 0 !important;
      }
    `;
    document.head.appendChild(style);
  }

// Automatically react to theme toggle on <html>
if (typeof document !== 'undefined') {
  const themeObserver = new MutationObserver(() => {
    syncHighlightTheme();

  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
function ensureHighlightJsLoaded(callback) {
  syncHighlightTheme();

  if (isHljsReady) {
    if (callback) callback();
    return;
  }
  if (isHljsLoading) return;
  isHljsLoading = true;

  if (!document.getElementById('hljs-js')) {
    const script = document.createElement('script');
    script.id = 'hljs-js';
    script.src = 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.8.0/build/highlight.min.js';
    script.onload = () => {

      isHljsLoading = false;

  }
}

  ensureHighlightJsLoaded();
  if (typeof window.hljs !== 'undefined') {
    try {
      if (language && window.hljs.getLanguage(language)) {
        return window.hljs.highlight(code, { language }).value;
      }
      return window.hljs.highlightAuto(code).value;
    } catch (e) {
      return escapeHtml(code);
    }
  }
  return escapeHtml(code);
}
function createHighlightedCodeBlock(code, language = 'javascript', title = '') {
  const container = document.createElement('div');
  container.className = 'my-1 rounded-lg overflow-hidden border border-[var(--border)] bg-[#1e2233] text-xs font-mono';

  const header = document.createElement('div');
  header.className = 'flex justify-between items-center px-3 py-1.5 bg-[#181b27] border-b border-[var(--border)] text-gray-400 select-none';
  header.innerHTML = `
    <span class="font-bold uppercase tracking-wider text-[10px] text-purple-400">${escapeHtml(title || language)}</span>
    <button class="copy-btn hover:text-white transition-colors" type="button" title="Copy code">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
  `;

  const pre = document.createElement('pre');

  codeEl.className = `language-${language}`;
  codeEl.innerHTML = highlightCode(code, language);

}

/**
 * 03_Notes/04_Engine/Link_Parser.js
 * Parses [[Note Title]] WikiLinks and extracts Knowledge Graph edges.
 */
function parseWikiLinks(text = '', allNotes = []) {
  if (!text) return '';

  return text.replace(/\[\[([^\]]+)\]\]/g, (match, targetTitle) => {
    const target = (allNotes || []).find(n =>
      (n.title && n.title.toLowerCase() === targetTitle.toLowerCase()) ||
      n.id === targetTitle ||
      (n.slug && n.slug.toLowerCase() === targetTitle.toLowerCase())
    );

    if (target) {
      return `<a href="#Notes?id=${encodeURIComponent(target.id)}" class="notes-wikilink text-purple-400 hover:text-purple-300 font-semibold underline decoration-dotted decoration-purple-500">${escapeHtml(targetTitle)}</a>`;
    }
    return `<span class="notes-wikilink-unresolved text-gray-400 italic" title="Note does not exist yet">${escapeHtml(targetTitle)}</span>`;
  });
}
function extractOutgoingLinks(note) {
  const outgoing = [];
  const linkRegex = /\[\[([^\]]+)\]\]/g;

  (note.blocks || []).forEach(block => {
    const textToScan = (block.content || '') + ' ' + (block.title || '');
    let match;
    while ((match = linkRegex.exec(textToScan)) !== null) {
      outgoing.push(match[1].trim());
    }
  });

  return Array.from(new Set(outgoing));
}
function buildGraphData(allNotes = []) {
  const nodes = allNotes.map(n => ({
    id: n.id,
    title: n.title || 'Untitled',
    folder: n.folder || 'General',
    tags: n.tags || [],
    val: (n.blocks || []).length + 2
  }));

  const links = [];
  const titleToIdMap = new Map();
  allNotes.forEach(n => {
    if (n.title) titleToIdMap.set(n.title.toLowerCase(), n.id);
    if (n.slug) titleToIdMap.set(n.slug.toLowerCase(), n.id);
    titleToIdMap.set(n.id, n.id);
  });

  allNotes.forEach(n => {
    const targets = extractOutgoingLinks(n);
    targets.forEach(targetTitle => {
      const targetId = titleToIdMap.get(targetTitle.toLowerCase());
      if (targetId && targetId !== n.id) {
        links.push({
          source: n.id,
          target: targetId
        });
      }
    });
  });

  return { nodes, links };
}


/* --- 03_Notes/Writing_Engine/Highlight_Sync.js --- */
/**
 * 03_Notes/04_Engine/Highlight_Sync.js
 * Master AST-Aware Bidirectional Highlight Synchronization Module.
 * 
 * - Unified Fraction Handling:
 *   Double-clicking on numerator, denominator, fraction bar, or \frac selects the entire \frac{...}{...} code
 *   block in the editor and highlights the entire .mfrac element in the live preview.
 * - Unified Styled Macros:
 *   Double-clicking \mathbf{B}, \vec{v}, \hat{x}, \dot{x}, \mathbb{R}, etc., anywhere on the letter or macro
 *   selects the full macro in the editor and highlights the styled symbol in the live preview.
 * - Unified Roots:
 *   Double-clicking \sqrt{...} selects the entire radical expression and highlights the root element.
 * - Occurrence-Aware Multi-Line Token Precision:
 *   Maps repeated symbols (e.g. \nabla, E, B, =, + across multiple lines in Maxwell equations) to their exact line.
 * - Text Selection I-Beam Cursor:
 *   Enforces cursor: text on all math and preview elements.
 */
const LATEX_SYMBOL_MAP = {
  // Greek Lowercase
  'α': '\\alpha', 'β': '\\beta', 'γ': '\\gamma', 'δ': '\\delta', 'ε': '\\varepsilon', 'ϵ': '\\epsilon',
  'ζ': '\\zeta', 'η': '\\eta', 'θ': '\\theta', 'ϑ': '\\vartheta', 'ι': '\\iota', 'κ': '\\kappa',
  'λ': '\\lambda', 'μ': '\\mu', 'ν': '\\nu', 'ξ': '\\xi', 'π': '\\pi', 'ϖ': '\\varpi',
  'ρ': '\\rho', 'ϱ': '\\varrho', 'σ': '\\sigma', 'ς': '\\varsigma', 'τ': '\\tau', 'υ': '\\upsilon',
  'ϕ': '\\phi', 'φ': '\\varphi', 'χ': '\\chi', 'ψ': '\\psi', 'ω': '\\omega',

  // Greek Uppercase
  'Γ': '\\Gamma', 'Δ': '\\Delta', 'Θ': '\\Theta', 'Λ': '\\Lambda', 'Ξ': '\\Xi',
  'Π': '\\Pi', 'Σ': '\\Sigma', 'Υ': '\\Upsilon', 'Φ': '\\Phi', 'Ψ': '\\Psi', 'Ω': '\\Omega',

  // Operators & Calculus
  '∇': '\\nabla', '∂': '\\partial', '∑': '\\sum', '∏': '\\prod', '∫': '\\int', '∬': '\\iint',
  '∭': '\\iiint', '∮': '\\oint', 'lim': '\\lim', '∞': '\\infty', '√': '\\sqrt',

  // Binary Operators & Relations
  '±': '\\pm', '∓': '\\mp', '×': '\\times', '÷': '\\div', '·': '\\cdot', '∘': '\\circ',
  '≠': '\\neq', '≤': '\\le', '≥': '\\ge', '≪': '\\ll', '≫': '\\gg', '≈': '\\approx',
  '≡': '\\equiv', '∼': '\\sim', '∝': '\\propto', '→': '\\to', '←': '\\leftarrow',
  '⇒': '\\implies', '⇐': '\\impliedby', '⇔': '\\iff', '↦': '\\mapsto',

  // Set Theory & Logic
  '∈': '\\in', '∉': '\\notin', '∋': '\\ni', '⊂': '\\subset', '⊆': '\\subseteq',
  '⊄': '\\not\\subset', '∪': '\\cup', '∩': '\\cap', '∅': '\\emptyset', '∀': '\\forall',
  '∃': '\\exists', '∄': '\\nexists', '¬': '\\neg', '∧': '\\land', '∨': '\\lor'
};
const REVERSE_SYMBOL_MAP = Object.fromEntries(
  Object.entries(LATEX_SYMBOL_MAP).map(([sym, macro]) => [macro, sym])

/**
 * Matches balanced curly braces: { ... }
 */
function getBalancedBraces(str, openIdx) {
  if (!str || str[openIdx] !== '{') return null;
  let depth = 0;
  for (let i = openIdx; i < str.length; i++) {
    if (str[i] === '{') depth++;
    else if (str[i] === '}') {
      depth--;
      if (depth === 0) {
        return { start: openIdx, end: i + 1, content: str.substring(openIdx + 1, i) };
      }
    }
  }
  return null;
}

/**
 * Finds all fraction blocks in LaTeX: \frac{num}{den}, \dfrac, \cfrac
 */
function findAllFractions(rawVal) {
  const fracs = [];
  const matches = [...rawVal.matchAll(/\\(d|c)?frac/g)];
  for (const m of matches) {
    const start = m.index;
    let idx = start + m[0].length;
    while (idx < rawVal.length && /\s/.test(rawVal[idx])) idx++;
    const num = getBalancedBraces(rawVal, idx);
    if (!num) continue;
    idx = num.end;
    while (idx < rawVal.length && /\s/.test(rawVal[idx])) idx++;
    const den = getBalancedBraces(rawVal, idx);
    if (!den) continue;
    fracs.push({ start, end: den.end, numContent: num.content, denContent: den.content });
  }
  return fracs;
}

/**
 * Finds all square root blocks: \sqrt{...} or \sqrt[n]{...}
 */
function findAllSqrts(rawVal) {
  const sqrts = [];
  const matches = [...rawVal.matchAll(/\\sqrt(?:\[[^\]]*\])?/g)];
  for (const m of matches) {
    const start = m.index;
    let idx = start + m[0].length;
    while (idx < rawVal.length && /\s/.test(rawVal[idx])) idx++;
    const arg = getBalancedBraces(rawVal, idx);
    if (!arg) continue;
    sqrts.push({ start, end: arg.end, content: arg.content });
  }
  return sqrts;
}

/**
 * Finds all styled/accented macro units: \mathbf{E}, \vec{v}, \hat{x}, \mathbb{R}, \dot{x}, \dddot{x}, etc.
 */
function findAllStyledMacros(rawVal) {
  const macros = [];
  const regex = /\\(mathbf|boldsymbol|mathbb|mathcal|mathscr|mathfrak|mathsf|mathrm|mathit|mathtt|vec|hat|widehat|bar|overline|tilde|widetilde|dot|ddot|dddot|ddddot|boxed|textcolor\{[^\}]+\})\s*\{([^\}]+)\}/g;
  const matches = [...rawVal.matchAll(regex)];
  for (const m of matches) {
    macros.push({ start: m.index, end: m.index + m[0].length, macro: m[1], inner: m[2], full: m[0] });
  }
  return macros;
}

/**
 * Returns all leaf elements with text in document order within a container.
 */
function getLeafNodes(container) {
  const allElements = Array.from(container.querySelectorAll('.mord, .mrel, .mbin, .mop, .minner, .msupsub span, span, code, em, strong, a, p, li'));
  return allElements.filter(el => el.children.length === 0 && (el.textContent || '').trim().length > 0);
}

/**
 * Computes which occurrence index the clicked leaf node is among leaves with identical text.
 */
function getLeafOccurrence(previewEl, targetLeaf) {
  const leaves = getLeafNodes(previewEl);
  const targetText = (targetLeaf.textContent || '').trim();
  let occ = 0;

  for (const leaf of leaves) {
    if (leaf === targetLeaf) {
      return { occ, targetText, leaf };
    }
    if ((leaf.textContent || '').trim() === targetText) {
      occ++;
    }
  }

  return { occ: 0, targetText, leaf: targetLeaf };
}

/**
 * Finds the exact nth occurrence range [start, end] of a target symbol/token in the textarea.
 */
function findNthOccurrenceInTextarea(rawVal, targetText, occIndex) {
  if (!rawVal || !targetText) return null;

  // 1. Math Macro search (e.g. ∇ -> \nabla, ρ -> \rho, etc.)
  if (LATEX_SYMBOL_MAP[targetText]) {
    const macro = LATEX_SYMBOL_MAP[targetText];
    const escaped = macro.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const matches = [...rawVal.matchAll(new RegExp(escaped, 'g'))];
    if (matches.length > 0) {
      const chosen = matches[Math.min(occIndex, matches.length - 1)];
      return { start: chosen.index, end: chosen.index + chosen[0].length };
    }
  }

  // 2. Alphanumeric character (e.g. E, B, x, y, 2)
  if (targetText.length === 1 && /[a-zA-Z0-9]/.test(targetText)) {
    const regex = new RegExp(`(\\\\[a-zA-Z]+\\{${targetText}\\}|\\b${targetText}\\b|${targetText})`, 'g');
    const matches = [...rawVal.matchAll(regex)];
    if (matches.length > 0) {
      const chosen = matches[Math.min(occIndex, matches.length - 1)];
      return { start: chosen.index, end: chosen.index + chosen[0].length };
    }
  }

  // 3. Mathematical operators (=, +, -, /, *, etc.) or words
  const escaped = targetText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const matches = [...rawVal.matchAll(new RegExp(escaped, 'g'))];
  if (matches.length > 0) {
    const chosen = matches[Math.min(occIndex, matches.length - 1)];
    return { start: chosen.index, end: chosen.index + chosen[0].length };
  }

  // 4. Word Token Fallback
  const cleanWord = targetText.replace(/[^a-zA-Z0-9_\\]/g, '');
  if (cleanWord) {
    const wordMatches = [...rawVal.matchAll(new RegExp(cleanWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'))];
    if (wordMatches.length > 0) {
      const chosen = wordMatches[Math.min(occIndex, wordMatches.length - 1)];
      return { start: chosen.index, end: chosen.index + chosen[0].length };
    }
  }

  return null;
}

/**
 * Attaches robust, occurrence-aware double-click highlight synchronization.
 */
function attachHighlightSync(previewEl, textareaEl) {
  if (!previewEl || !textareaEl) return;

  // Apply I-Beam text cursor to all preview elements
  previewEl.style.cursor = 'text';
  previewEl.style.userSelect = 'text';

  let activeHighlightTimer = null;

  function clearPreviewHighlights() {
    previewEl.querySelectorAll('.highlight-sync-active').forEach(el => {
      el.classList.remove('highlight-sync-active', 'ring-2', 'ring-purple-400', 'bg-purple-500/35', 'rounded', 'rounded-md', 'shadow-xs', 'transition-all');
    });
  }

  function highlightPreviewNode(targetNode) {
    if (!targetNode) return;
    clearPreviewHighlights();

    targetNode.classList.add('highlight-sync-active', 'ring-2', 'ring-purple-400', 'bg-purple-500/35', 'rounded', 'rounded-md', 'shadow-xs', 'transition-all');
    targetNode.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

    clearTimeout(activeHighlightTimer);
    activeHighlightTimer = setTimeout(() => {
      clearPreviewHighlights();
    }, 2800);
  }

  function selectTextareaToken(startIndex, endIndex) {
    if (startIndex < 0 || endIndex <= startIndex) return;
    textareaEl.focus();
    textareaEl.setSelectionRange(startIndex, endIndex);

    // Scroll textarea so selection is vertically centered in view
    const textBefore = textareaEl.value.substring(0, startIndex);
    const lineNum = textBefore.split('\n').length;
    const lineHeight = 19;
    textareaEl.scrollTop = Math.max(0, (lineNum - 2) * lineHeight);
  }

  // =========================================================================
  // 1. DOUBLE-CLICK IN PREVIEW -> SELECT EXACT ATOMIC UNIT IN TEXTAREA
  // =========================================================================
  previewEl.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    const rawVal = textareaEl.value;
    const target = e.target;
    if (!target || target === previewEl) return;

    // A. FRACTION CHECK: Any click inside .mfrac -> highlights entire fraction
    const clickedFrac = target.closest('.mfrac');
    if (clickedFrac) {
      const allMfracs = Array.from(previewEl.querySelectorAll('.mfrac'));
      const fracIdx = allMfracs.indexOf(clickedFrac);
      const fracs = findAllFractions(rawVal);

      if (fracs.length > 0) {
        const chosenFrac = fracs[Math.min(fracIdx >= 0 ? fracIdx : 0, fracs.length - 1)];
        selectTextareaToken(chosenFrac.start, chosenFrac.end);
        highlightPreviewNode(clickedFrac);
        return;
      }
    }

    // B. SQUARE ROOT CHECK: Any click inside .sqrt -> highlights entire root
    const clickedSqrt = target.closest('.sqrt, .msqrt');
    if (clickedSqrt) {
      const allSqrts = Array.from(previewEl.querySelectorAll('.sqrt, .msqrt'));
      const sqrtIdx = allSqrts.indexOf(clickedSqrt);
      const sqrts = findAllSqrts(rawVal);

      if (sqrts.length > 0) {
        const chosenSqrt = sqrts[Math.min(sqrtIdx >= 0 ? sqrtIdx : 0, sqrts.length - 1)];
        selectTextareaToken(chosenSqrt.start, chosenSqrt.end);
        highlightPreviewNode(clickedSqrt);
        return;
      }
    }

    // C. STYLED MACRO / LEAF SYMBOL CHECK
    const mathLeaf = target.closest('.mord, .mrel, .mbin, .mop, .minner, .msupsub span, span') || target;
    const { occ, targetText, leaf } = getLeafOccurrence(previewEl, mathLeaf);
    if (!targetText) return;

    // Check if this leaf is part of a styled macro in rawVal (e.g. \mathbf{B})
    const styledMacros = findAllStyledMacros(rawVal).filter(m => m.inner.trim() === targetText);
    if (styledMacros.length > 0) {
      const chosen = styledMacros[Math.min(occ, styledMacros.length - 1)];
      selectTextareaToken(chosen.start, chosen.end);
      highlightPreviewNode(leaf);
      return;
    }

    // Standard Math Symbol or Word Match (e.g. \nabla, \rho, =, +)
    const matchRange = findNthOccurrenceInTextarea(rawVal, targetText, occ);
    if (matchRange) {
      selectTextareaToken(matchRange.start, matchRange.end);
      highlightPreviewNode(leaf);
    }
  });

  // =========================================================================
  // 2. DOUBLE-CLICK IN TEXTAREA -> HIGHLIGHT EXACT ATOMIC ELEMENT IN PREVIEW
  // =========================================================================
  textareaEl.addEventListener('dblclick', () => {
    const rawVal = textareaEl.value;
    const pos = textareaEl.selectionStart;

    // A. FRACTION CHECK: Cursor anywhere inside \frac{num}{den}
    const fracs = findAllFractions(rawVal);
    const containingFrac = fracs.find(f => pos >= f.start && pos <= f.end);
    if (containingFrac) {
      const fracIdx = fracs.indexOf(containingFrac);
      const allMfracs = Array.from(previewEl.querySelectorAll('.mfrac'));
      if (allMfracs[fracIdx]) {
        selectTextareaToken(containingFrac.start, containingFrac.end);
        highlightPreviewNode(allMfracs[fracIdx]);
        return;
      }
    }

    // B. SQUARE ROOT CHECK: Cursor anywhere inside \sqrt{...}
    const sqrts = findAllSqrts(rawVal);
    const containingSqrt = sqrts.find(s => pos >= s.start && pos <= s.end);
    if (containingSqrt) {
      const sqrtIdx = sqrts.indexOf(containingSqrt);
      const allSqrts = Array.from(previewEl.querySelectorAll('.sqrt, .msqrt'));
      if (allSqrts[sqrtIdx]) {
        selectTextareaToken(containingSqrt.start, containingSqrt.end);
        highlightPreviewNode(allSqrts[sqrtIdx]);
        return;
      }
    }

    // C. STYLED MACRO CHECK: Cursor on \mathbf{B}, \vec{v}, \hat{x}, etc.
    const styledMacros = findAllStyledMacros(rawVal);
    const containingStyled = styledMacros.find(m => pos >= m.start && pos <= m.end);
    if (containingStyled) {
      selectTextareaToken(containingStyled.start, containingStyled.end);
      const targetSym = containingStyled.inner.trim();
      const styledOcc = styledMacros.filter(m => m.inner.trim() === targetSym && m.start <= containingStyled.start).length - 1;

      const leaves = getLeafNodes(previewEl).filter(l => (l.textContent || '').trim() === targetSym);
      if (leaves[styledOcc]) {
        highlightPreviewNode(leaves[styledOcc]);
        return;
      } else if (leaves.length > 0) {
        highlightPreviewNode(leaves[0]);
        return;
      }
    }

    // D. STANDARD TOKEN / MACRO (e.g. \nabla, \rho, =, +, word)
    let start = textareaEl.selectionStart;
    let end = textareaEl.selectionEnd;

    // Expand leading backslash if present
    if (start > 0 && rawVal[start - 1] === '\\') {
      start = start - 1;
    }
    // Expand adjacent argument braces if present
    while (end < rawVal.length && /[a-zA-Z0-9_\}]/.test(rawVal[end]) && !/\s/.test(rawVal[end])) {
      if (rawVal[end] === '}') {
        end++;
        break;
      }
      end++;
    }

    const selectedToken = rawVal.substring(start, end).trim();
    if (!selectedToken) return;

    selectTextareaToken(start, end);

    let targetSym = selectedToken;
    if (REVERSE_SYMBOL_MAP[selectedToken]) {
      targetSym = REVERSE_SYMBOL_MAP[selectedToken];
    } else {
      const innerMatch = selectedToken.match(/\{([^}]+)\}/);
      if (innerMatch) {
        targetSym = innerMatch[1];
      } else {
        targetSym = selectedToken.replace(/^\\[a-zA-Z]+/, '').trim() || selectedToken.replace(/[\$\{\}\\\^_\s]/g, '').trim();
      }
    }

    // Occurrence count in textarea before 'start'
    const tokenRegex = new RegExp(selectedToken.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    const matchesBefore = [...rawVal.substring(0, start).matchAll(tokenRegex)];
    const occIndex = matchesBefore.length;

    // Find matching leaf nodes in preview
    const leaves = getLeafNodes(previewEl);
    const matchingLeaves = leaves.filter(leaf => {
      const text = (leaf.textContent || '').trim();
      return text === targetSym || (targetSym && text.includes(targetSym));
    });

    if (matchingLeaves.length > 0) {
      const targetLeaf = matchingLeaves[Math.min(occIndex, matchingLeaves.length - 1)];
      highlightPreviewNode(targetLeaf);
    } else {
      // Fallback text node search
      const walker = document.createTreeWalker(previewEl, NodeFilter.SHOW_TEXT, null);
      let textNode;
      while ((textNode = walker.nextNode())) {
        if (textNode.nodeValue && textNode.nodeValue.includes(targetSym)) {
          highlightPreviewNode(textNode.parentElement);
          break;
        }
      }
    }
  });
}


/* --- 03_Notes/Writing_Engine/Table_Parser.js --- */
/**
 * 03_Notes/Writing_Engine/Table_Parser.js
 * Advanced LaTeX Tabular & Markdown Table Parser & Compiler.
 * Supports standard LaTeX \begin{tabular} & \begin{table}, \multicolumn, \multirow,
 * \hline, \cline, Booktabs rules (\toprule, \midrule, \bottomrule),
 * \rowcolor, \cellcolor, KaTeX math expressions, and Markdown tables fallback.
 */


/**
 * Resolves LaTeX colors (hex, named, or tint e.g. purple!15)
 * @param {string} col - LaTeX color string
 * @returns {string} CSS color string
 */
function resolveLatexColor(col) {
  if (!col) return '';
  col = col.trim();
  if (col.startsWith('#')) return col;
  if (/^[0-9a-fA-F]{6}$/.test(col)) return '#' + col;

  const tintMatch = col.match(/^([a-zA-Z]+)!(\d+)$/);
  if (tintMatch) {
    const base = tintMatch[1].toLowerCase();
    const pct = parseInt(tintMatch[2], 10) / 100;
    const palette = {
      purple: [168, 85, 247],
      blue: [59, 130, 246],
      red: [239, 68, 68],
      green: [34, 197, 94],
      yellow: [234, 179, 8],
      gray: [156, 163, 175],
      cyan: [6, 182, 212],
      orange: [249, 115, 22]
    };
    if (palette[base]) {
      return `rgba(${palette[base].join(',')}, ${pct})`;
    }
  }

  const named = {
    lightgray: 'rgba(200, 200, 200, 0.15)',
    gray: 'rgba(150, 150, 150, 0.2)',
    darkgray: 'rgba(50, 50, 50, 0.3)',
    red: 'rgba(239, 68, 68, 0.15)',
    green: 'rgba(34, 197, 94, 0.15)',
    blue: 'rgba(59, 130, 246, 0.15)',
    purple: 'rgba(168, 85, 247, 0.15)',
    yellow: 'rgba(234, 179, 8, 0.15)'
  };
  return named[col.toLowerCase()] || col;
}

/**
 * Parses LaTeX column specification, e.g. {|l|c|r|}, *{3}{|c}, or |p{120px}|
 * @param {string} rawSpec - LaTeX column alignment specification
 * @returns {Array<Object>} Parsed column specifications
 */
function parseColSpec(rawSpec) {
  let spec = (rawSpec || '').trim();
  while (/\*\{(\d+)\}\{([^{}]+)\}/.test(spec)) {
    spec = spec.replace(/\*\{(\d+)\}\{([^{}]+)\}/g, (_, n, s) => s.repeat(Number(n)));
  }

  const cols = [];
  let i = 0;
  let currentBorderLeft = 0;

  while (i < spec.length) {
    const ch = spec[i];
    if (ch === ' ' || ch === '\t') {
      i++;
      continue;
    }
    if (ch === '|') {
      currentBorderLeft++;
      i++;
      continue;
    }
    if (ch === '@') {
      i++;
      if (spec[i] === '{') {
        const close = spec.indexOf('}', i);
        if (close !== -1) i = close + 1;
      }
      continue;
    }
    if (ch === 'l' || ch === 'c' || ch === 'r') {
      const alignMap = { l: 'left', c: 'center', r: 'right' };
      cols.push({
        align: alignMap[ch],
        width: null,
        borderLeft: currentBorderLeft,
        borderRight: 0
      });
      currentBorderLeft = 0;
      i++;
      continue;
    }
    if (ch === 'p' || ch === 'm' || ch === 'b') {
      let width = null;
      i++;
      if (spec[i] === '{') {
        const close = spec.indexOf('}', i);
        if (close !== -1) {
          width = spec.slice(i + 1, close).trim();
          i = close + 1;
        }
      }
      cols.push({
        align: 'left',
        width: width,
        borderLeft: currentBorderLeft,
        borderRight: 0
      });
      currentBorderLeft = 0;
      continue;
    }
    i++;
  }

  if (cols.length > 0 && currentBorderLeft > 0) {
    cols[cols.length - 1].borderRight = currentBorderLeft;
  }

  return cols;
}

/**
 * Splits rows by \\ while respecting curly braces and math mode delimiters ($...$)
 * @param {string} tabularBody - Inside of tabular environment
 * @returns {Array<string>} Array of row strings
 */
function splitTabularRows(tabularBody) {
  const rawRows = [];
  let cur = '';
  let braceDepth = 0;
  let inMath = false;
  let mathChar = '';
  let i = 0;

  while (i < tabularBody.length) {
    const ch = tabularBody[i];
    const next = tabularBody[i + 1];

    if (ch === '$' && (i === 0 || tabularBody[i - 1] !== '\\')) {
      if (!inMath) {
        inMath = true;
        mathChar = '$';
      } else if (mathChar === '$') {
        inMath = false;
      }
      cur += ch;
      i++;
      continue;
    }

    if (!inMath) {
      if (ch === '{' && (i === 0 || tabularBody[i - 1] !== '\\')) {
        braceDepth++;
      } else if (ch === '}' && (i === 0 || tabularBody[i - 1] !== '\\')) {
        if (braceDepth > 0) braceDepth--;
      }

      if (ch === '\\' && next === '\\' && braceDepth === 0) {
        i += 2;
        if (tabularBody[i] === '[') {
          const closeBracket = tabularBody.indexOf(']', i);
          if (closeBracket !== -1) i = closeBracket + 1;
        }
        rawRows.push(cur);
        cur = '';
        continue;
      }
    }

    cur += ch;
    i++;
  }
  if (cur.trim()) {
    rawRows.push(cur);
  }
  return rawRows;
}

/**
 * Splits cells in a row by & while respecting curly braces and math mode delimiters ($...$)
 * @param {string} rowStr - Single row string
 * @returns {Array<string>} Array of cell strings
 */
function splitRowCells(rowStr) {
  const cells = [];
  let cur = '';
  let braceDepth = 0;
  let inMath = false;
  let mathChar = '';
  let i = 0;

  while (i < rowStr.length) {
    const ch = rowStr[i];

    if (ch === '$' && (i === 0 || rowStr[i - 1] !== '\\')) {
      if (!inMath) {
        inMath = true;
        mathChar = '$';
      } else if (mathChar === '$') {
        inMath = false;
      }
      cur += ch;
      i++;
      continue;
    }

    if (!inMath) {
      if (ch === '{' && (i === 0 || rowStr[i - 1] !== '\\')) {
        braceDepth++;
      } else if (ch === '}' && (i === 0 || rowStr[i - 1] !== '\\')) {
        if (braceDepth > 0) braceDepth--;
      }

      if (ch === '&' && braceDepth === 0) {
        cells.push(cur.trim());
        cur = '';
        i++;
        continue;
      }
    }

    cur += ch;
    i++;
  }
  cells.push(cur.trim());
  return cells;
}

/**
 * Parses standard LaTeX \begin{tabular} and \begin{table} into a responsive HTML table
 * @param {string} input - Raw LaTeX table string
 * @returns {string|null} Compiled HTML table or null if not a LaTeX tabular
 */
function parseLatexTabular(input) {
  if (!input || !input.trim()) return '';

  // 1. Caption
  let caption = null;
  const captionMatch = input.match(/\\caption\{((?:[^{}]|\{[^{}]*\})*)\}/);
  if (captionMatch) {
    caption = captionMatch[1].trim();
  }

  // 2. Tabular Environment
  let tabularMatch = input.match(/\\begin\{tabular\*?\}\s*(?:\[[^\]]*\])?\s*\{([^}]+)\}([\s\S]*?)\\end\{tabular\*?\}/);
  let rawColSpec = '';
  let tabularBody = '';

  if (tabularMatch) {
    rawColSpec = tabularMatch[1];
    tabularBody = tabularMatch[2];
  } else if (input.includes('&') && input.includes('\\\\')) {
    // Implicit tabular code without explicit \begin{tabular}
    tabularBody = input;
    rawColSpec = '*{12}{c}';
  } else {
    return null; // Not a LaTeX tabular
  }

  const colDefinitions = parseColSpec(rawColSpec);
  const totalCols = colDefinitions.length || 1;

  // 3. Tokenize rows
  const rawRowStrings = splitTabularRows(tabularBody);
  const parsedRows = [];

  let pendingTopRules = {
    topRule: false,
    midRule: false,
    bottomRule: false,
    hline: 0,
    clines: []
  };

  for (let rIdx = 0; rIdx < rawRowStrings.length; rIdx++) {
    let rStr = rawRowStrings[rIdx].trim();
    if (!rStr) continue;

    // Check for rowcolor
    let rowColor = null;
    const rcMatch = rStr.match(/\\rowcolor\s*(?:\[([^\]]+)\])?\s*\{([^}]+)\}/);
    if (rcMatch) {
      rowColor = resolveLatexColor(rcMatch[2]);
      rStr = rStr.replace(rcMatch[0], '').trim();
    }

    // Extract horizontal rules
    let hasTopRule = false;
    let hasMidRule = false;
    let hasBottomRule = false;
    let hlineCount = 0;
    const clines = [];

    let ruleMatched = true;
    while (ruleMatched) {
      ruleMatched = false;
      if (rStr.startsWith('\\toprule')) {
        hasTopRule = true;
        rStr = rStr.slice(8).trim();
        ruleMatched = true;
      } else if (rStr.startsWith('\\midrule')) {
        hasMidRule = true;
        rStr = rStr.slice(8).trim();
        ruleMatched = true;
      } else if (rStr.startsWith('\\bottomrule')) {
        hasBottomRule = true;
        rStr = rStr.slice(11).trim();
        ruleMatched = true;
      } else if (rStr.startsWith('\\hline')) {
        hlineCount++;
        rStr = rStr.slice(6).trim();
        ruleMatched = true;
      } else {
        const clineM = rStr.match(/^\\(?:cline|cmidrule(?:\([^\)]*\))?)\s*\{(\d+)\s*-\s*(\d+)\}/);
        if (clineM) {
          clines.push({ start: parseInt(clineM[1], 10) - 1, end: parseInt(clineM[2], 10) - 1 });
          rStr = rStr.slice(clineM[0].length).trim();
          ruleMatched = true;
        }
      }
    }

    // Check trailing rules
    while (/\\(hline|toprule|midrule|bottomrule)$/.test(rStr) || /\\(?:cline|cmidrule(?:\([^\)]*\))?)\s*\{\d+\s*-\s*\d+\}$/.test(rStr)) {
      if (rStr.endsWith('\\toprule')) {
        hasTopRule = true;
        rStr = rStr.slice(0, -8).trim();
      } else if (rStr.endsWith('\\midrule')) {
        hasMidRule = true;
        rStr = rStr.slice(0, -8).trim();
      } else if (rStr.endsWith('\\bottomrule')) {
        hasBottomRule = true;
        rStr = rStr.slice(0, -11).trim();
      } else if (rStr.endsWith('\\hline')) {
        hlineCount++;
        rStr = rStr.slice(0, -6).trim();
      } else {
        const trailingCline = rStr.match(/\\(?:cline|cmidrule(?:\([^\)]*\))?)\s*\{(\d+)\s*-\s*(\d+)\}$/);
        if (trailingCline) {
          clines.push({ start: parseInt(trailingCline[1], 10) - 1, end: parseInt(trailingCline[2], 10) - 1 });
          rStr = rStr.slice(0, -trailingCline[0].length).trim();
        } else {
          break;
        }
      }
    }

    // Pure rule line handling
    if (!rStr) {
      if (parsedRows.length > 0) {
        const prev = parsedRows[parsedRows.length - 1];
        if (hasTopRule) prev.hasTopRule = true;
        if (hasMidRule) prev.hasMidRule = true;
        if (hasBottomRule) prev.hasBottomRule = true;
        if (hlineCount > 0) prev.hlineBottom = (prev.hlineBottom || 0) + hlineCount;
        if (clines.length > 0) prev.clinesBottom = (prev.clinesBottom || []).concat(clines);
      } else {
        if (hasTopRule) pendingTopRules.topRule = true;
        if (hasMidRule) pendingTopRules.midRule = true;
        if (hasBottomRule) pendingTopRules.bottomRule = true;
        pendingTopRules.hline += hlineCount;
        pendingTopRules.clines = pendingTopRules.clines.concat(clines);
      }
      continue;
    }

    const cells = splitRowCells(rStr);
    parsedRows.push({
      cells,
      rowColor,
      hasTopRule: hasTopRule || pendingTopRules.topRule,
      hasMidRule: hasMidRule || pendingTopRules.midRule,
      hasBottomRule: hasBottomRule || pendingTopRules.bottomRule,
      hlineTop: pendingTopRules.hline,
      hlineBottom: hlineCount,
      clinesTop: pendingTopRules.clines,
      clinesBottom: clines
    });

    pendingTopRules = { topRule: false, midRule: false, bottomRule: false, hline: 0, clines: [] };
  }

  // 4. Build 2D Grid with Rowspan/Colspan
  const maxRows = parsedRows.length;
  const occupied = Array.from({ length: maxRows + 20 }, () => Array(totalCols + 20).fill(false));
  const finalRowsHtml = [];

  for (let r = 0; r < parsedRows.length; r++) {
    const row = parsedRows[r];
    const rawCells = row.cells;
    let cellIdx = 0;
    const cellsHtml = [];

    let trStyle = '';
    if (row.rowColor) {
      trStyle += `background-color: ${row.rowColor};`;
    }

    for (let c = 0; c < totalCols; c++) {
      if (occupied[r][c]) {
        if (cellIdx < rawCells.length && rawCells[cellIdx].trim() === '') {
          cellIdx++;
        }
        continue;
      }

      if (cellIdx >= rawCells.length) {
        cellsHtml.push(`<td class="px-3 py-2 border border-[var(--border)]"></td>`);
        continue;
      }

      let cellRaw = rawCells[cellIdx++];
      let colspan = 1;
      let rowspan = 1;
      let cellAlign = colDefinitions[c]?.align || 'left';
      let cellWidth = colDefinitions[c]?.width || null;
      let borderLeft = colDefinitions[c]?.borderLeft || 0;
      let borderRight = colDefinitions[c]?.borderRight || 0;
      let cellBg = '';

      // Check cellcolor
      const ccMatch = cellRaw.match(/\\cellcolor\s*(?:\[([^\]]+)\])?\s*\{([^}]+)\}/);
      if (ccMatch) {
        cellBg = resolveLatexColor(ccMatch[2]);
        cellRaw = cellRaw.replace(ccMatch[0], '').trim();
      }

      // Check multicolumn
      const mcMatch = cellRaw.match(/\\multicolumn\s*\{(\d+)\}\s*\{([^}]+)\}\s*\{((?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*)\}/);
      if (mcMatch) {
        colspan = parseInt(mcMatch[1], 10);
        const subSpec = parseColSpec(mcMatch[2]);
        if (subSpec.length > 0) {
          cellAlign = subSpec[0].align;
          borderLeft = subSpec[0].borderLeft;
          borderRight = subSpec[subSpec.length - 1].borderRight;
        }
        cellRaw = mcMatch[3];
      }

      // Check multirow
      const mrMatch = cellRaw.match(/\\multirow\s*\{(\d+)\}\s*\{([^}]+)\}\s*\{((?:[^{}]|\{(?:[^{}]|\{[^{}]*\})*\})*)\}/);
      if (mrMatch) {
        rowspan = parseInt(mrMatch[1], 10);
        if (mrMatch[2] && mrMatch[2] !== '*') {
          cellWidth = mrMatch[2];
        }
        cellRaw = mrMatch[3];
      }

      // Mark occupied in grid
      for (let dr = 0; dr < rowspan; dr++) {
        for (let dc = 0; dc < colspan; dc++) {
          occupied[r + dr][c + dc] = true;
        }
      }

      const cellStyles = [];
      if (cellBg) cellStyles.push(`background-color: ${cellBg};`);
      if (cellWidth) cellStyles.push(`width: ${cellWidth}; min-width: ${cellWidth};`);

      const alignClass = cellAlign === 'center' ? 'text-center' : (cellAlign === 'right' ? 'text-right' : 'text-left');

      if (borderLeft > 0) {
        cellStyles.push(`border-left: ${borderLeft > 1 ? '3px double' : '1px solid'} var(--border);`);
      }
      if (borderRight > 0) {
        cellStyles.push(`border-right: ${borderRight > 1 ? '3px double' : '1px solid'} var(--border);`);
      }

      if (row.hasTopRule) {
        cellStyles.push(`border-top: 2px solid var(--text-secondary, #94a3b8);`);
      } else if (row.hasMidRule) {
        cellStyles.push(`border-top: 1.5px solid var(--border, #475569);`);
      } else if (row.hlineTop > 0) {
        cellStyles.push(`border-top: ${row.hlineTop > 1 ? '3px double' : '1px solid'} var(--border);`);
      }

      if (row.hasBottomRule) {
        cellStyles.push(`border-bottom: 2px solid var(--text-secondary, #94a3b8);`);
      } else if (row.hlineBottom > 0) {
        cellStyles.push(`border-bottom: ${row.hlineBottom > 1 ? '3px double' : '1px solid'} var(--border);`);
      }

      if (row.clinesBottom && row.clinesBottom.length > 0) {
        for (const cl of row.clinesBottom) {
          if (c >= cl.start && c <= cl.end) {
            cellStyles.push(`border-bottom: 1px solid var(--border);`);
            break;
          }
        }
      }

      let content = cellRaw.trim();
      const hasExplicitBold = content.includes('\\textbf{');

      content = content.replace(/\\textbf\{((?:[^{}]|\{[^{}]*\})*)\}/g, '**$1**');
      content = content.replace(/\\textit\{((?:[^{}]|\{[^{}]*\})*)\}/g, '*$1*');

      let formattedContent = formatRichTextWithMath(content, { allowBlockMath: false });
      formattedContent = formattedContent.replace(/^<p[^>]*>/, '').replace(/<\/p>$/, '');

      const spanAttrs = [];
      if (colspan > 1) spanAttrs.push(`colspan="${colspan}"`);
      if (rowspan > 1) spanAttrs.push(`rowspan="${rowspan}"`);

      // Determine <th> vs <td>
      const isHeader = (r === 0 || row.hasMidRule || hasExplicitBold);
      const tag = isHeader ? 'th' : 'td';
      const baseClass = tag === 'th'
        ? `px-3 py-2 text-xs font-bold tracking-wide text-[var(--text)] ${alignClass}`
        : `px-3 py-2 text-sm text-[var(--text)] leading-relaxed ${alignClass}`;

      cellsHtml.push(`<${tag} class="${baseClass}" ${spanAttrs.join(' ')} style="${cellStyles.join(' ')}">${formattedContent}</${tag}>`);

      c += (colspan - 1);
    }

    finalRowsHtml.push(`<tr class="hover:bg-[var(--surface-hover)]/40 transition-colors" style="${trStyle}">${cellsHtml.join('')}</tr>`);
  }

  const captionHtml = caption
    ? `<caption class="text-xs font-semibold text-[var(--text-secondary)] tracking-wide pb-2 text-center select-text">${formatRichTextWithMath(caption)}</caption>`
    : '';

  return `
    <div class="notes-table-scroll-container w-full overflow-x-auto my-1" style="scrollbar-width: thin;">
      <table class="notes-latex-table w-full border-collapse select-text my-0.5" style="border-spacing: 0;">
        ${captionHtml}
        <tbody>
          ${finalRowsHtml.join('\n')}
        </tbody>
      </table>
    </div>
  `;
}

/**
 * Fallback parser for standard Markdown tables
 * @param {string} markdown - Raw markdown table
 * @returns {string} Compiled HTML table
 */
function parseMarkdownTable(markdown) {
  const lines = markdown.trim().split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) return '';

  const parseRow = (line) => {
    let clean = line;
    if (clean.startsWith('|')) clean = clean.slice(1);
    if (clean.endsWith('|')) clean = clean.slice(0, -1);
    return clean.split('|').map(c => c.trim());
  };

  const headers = parseRow(lines[0]);
  const aligns = parseRow(lines[1]).map(sep => {
    if (sep.startsWith(':') && sep.endsWith(':')) return 'text-center';
    if (sep.endsWith(':')) return 'text-right';
    return 'text-left';
  });

  const theadHtml = `
    <thead class="bg-[var(--surface-hover)] font-semibold text-[var(--text)]">
      <tr>
        ${headers.map((h, i) => {
          let c = formatRichTextWithMath(h).replace(/^<p[^>]*>/, '').replace(/<\/p>$/, '');
          return `<th class="px-3 py-2 text-xs uppercase tracking-wider border-b border-[var(--border)] ${aligns[i] || 'text-left'}">${c}</th>`;
        }).join('')}
      </tr>
    </thead>
  `;

  const rows = lines.slice(2);
  const tbodyHtml = `
    <tbody>
      ${rows.map(rowLine => {
        const cells = parseRow(rowLine);
        return `
          <tr class="hover:bg-[var(--surface-hover)]/40 border-b border-[var(--border)] transition-colors">
            ${cells.map((cell, i) => {
              let c = formatRichTextWithMath(cell).replace(/^<p[^>]*>/, '').replace(/<\/p>$/, '');
              return `<td class="px-3 py-2 text-sm text-[var(--text)] ${aligns[i] || 'text-left'}">${c}</td>`;
            }).join('')}
          </tr>
        `;
      }).join('')}
    </tbody>
  `;

  return `
    <div class="notes-table-scroll-container w-full overflow-x-auto my-1" style="scrollbar-width: thin;">
      <table class="notes-markdown-table w-full border-collapse select-text my-0.5" style="border-spacing: 0;">
        ${theadHtml}
        ${tbodyHtml}
      </table>
    </div>
  `;
}

/**
 * Attaches event handlers to the action buttons inside parentEl.
 * 
 * @param {HTMLElement} parentEl - Parent element containing the buttons
 * @param {Object} handlers
 * @param {Function} [handlers.onDone=null]
 * @param {Function} [handlers.onMoveUp=null]
 * @param {Function} [handlers.onMoveDown=null]
 * @param {Function} [handlers.onDelete=null]
 * @param {Function} [handlers.onInsertBelow=null]
 * @param {number} [handlers.index=0]
 */
function initBlockActions(parentEl, { onDone = null, onMoveUp = null, onMoveDown = null, onDelete = null, onInsertBelow = null, index = 0 } = {}) {
  if (!parentEl) return;

  const doneBtn = parentEl.querySelector('.done-btn');
  if (doneBtn && onDone) {
    doneBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      onDone();
    });
  }

  const upBtn = parentEl.querySelector('.up-btn');
  if (upBtn && onMoveUp) {
    upBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      onMoveUp();
    });
  }

  const downBtn = parentEl.querySelector('.down-btn');
  if (downBtn && onMoveDown) {
    downBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      onMoveDown();
    });
  }

  const addBelowBtn = parentEl.querySelector('.add-below-btn');
  if (addBelowBtn && onInsertBelow) {
    addBelowBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      onInsertBelow(index);
    });
  }

  const delBtn = parentEl.querySelector('.del-btn');
  if (delBtn && onDelete) {
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      onDelete();
    });
  }
}
