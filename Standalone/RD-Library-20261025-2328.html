// Click on Logo takes you back to the hub:
//  - shells that define window.__LOCALHUB_HUB_URL__ navigate to that hub file;
//  - everywhere else (Index.html and the all-in-one Local_HUB.html) the
//    "clear the hash" SPA navigation is used to return to the Landing Page.
function InitLogoLogic() {
  const logoBtn = document.getElementById('logo-btn');
  if (logoBtn) {
    logoBtn.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('#notes-text-floating-dock').forEach(el => {
        if (typeof el.__cleanup === 'function') el.__cleanup();
        el.remove();
      });

      const currentHash = (typeof window !== 'undefined' && window.location.hash) || '';
      const lowerHash = currentHash.toLowerCase();
      // Level 1: If inside a note (#Notes?id=... or contains ?id=), navigate back to Notes deck overview
      const isInsideNote = lowerHash.includes('?id=') || (lowerHash.startsWith('#notes') && lowerHash.includes('id='));
      if (isInsideNote) {
        window.location.hash = '#Notes';
        return;
      }

      // Level 2: If already on Notes deck or other tab overview, navigate back to Landing Page
      const hubUrl = (typeof window !== 'undefined' && window.__LOCALHUB_HUB_URL__) || '';
      if (hubUrl) {
        window.location.href = hubUrl;
      } else {
        // Navigate back to the Landing Page by clearing hash
        if (window.location.hash && window.location.hash !== '#') {
          window.location.hash = '';
        } else {
          // If hash is already empty or '#', dispatch hashchange so router re-evaluates
          window.location.hash = '#';
          try {
            window.dispatchEvent(new HashChangeEvent('hashchange'));
          } catch (_) {
            window.dispatchEvent(new Event('hashchange'));
          }
        }
      }
    });
  }
}

// InitThemeToggleLogic(): Change the Theme on click and Update the storage.
function InitThemeToggleLogic() {
  const btn = document.getElementById('theme-toggle-btn');

  // Load saved theme or default to dark
  const savedTheme = localStorage.getItem('lh_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeToggleButtons(savedTheme);

  if (btn && !btn.__themeToggleBound) {
    /* Guard against double-binding: InitThemeToggleLogic runs on every
       InitHeader (per tab boot / re-entry), and a duplicated listener would
       make one click flip the theme twice — the button then looks dead. */
    btn.__themeToggleBound = true;
    btn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';

      // Option A: Clean, Instant Theme Switch (disable transitions during theme flip)
      document.documentElement.classList.add('theme-switching');
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('lh_theme', next);
      updateThemeToggleButtons(next);

      // Re-enable transitions on the next animation frame for normal hover effects
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove('theme-switching');
        });
      });
    });
  }
}

    if (document.getElementById('NotesData') && !document.getElementById('LandingPageData') && !document.getElementById('Bookmarks') && !document.getElementById('RDData')) {
      return 'notes';

    if (document.getElementById('Bookmarks') && !document.getElementById('LandingPageData') && !document.getElementById('NotesData') && !document.getElementById('RDData')) {

    if (document.getElementById('RDData') && !document.getElementById('LandingPageData') && !document.getElementById('NotesData') && !document.getElementById('Bookmarks')) {

      if (h.startsWith('#bookmarks')) return 'bookmarks';

}

function sanitizeImportedNote(n, idx = 0) {
  if (!n || typeof n !== 'object') {
    return {
      id: `note_${Date.now()}_${idx}`,
      title: 'Untitled Note',
      folder: 'General',
      tags: [],
      blocks: [],
      macros: { equation: '', tikz: '' },
      meta: { created: new Date().toISOString().slice(0, 10), author: 'User' }
    };
  }
  return {
    id: n.id || `note_${Date.now()}_${idx}`,
    slug: n.slug || (n.title ? n.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') : `note-${idx}`),
    title: n.title || 'Untitled Note',
    folder: n.folder || 'General',
    tags: Array.isArray(n.tags) ? n.tags : [],
    description: n.description || '',
    meta: n.meta || { created: new Date().toISOString().slice(0, 10), author: 'User' },
    flashcard: n.flashcard || null,
    blocks: Array.isArray(n.blocks) ? n.blocks : [],
    autoNumbering: n.autoNumbering || { h1: 'numeric', h2: 'numeric', h3: 'numeric' },
    logo: n.logo || null,
    macros: (n.macros && typeof n.macros === 'object') ? {
      equation: n.macros.equation || '',
      tikz: n.macros.tikz || ''
    } : { equation: '', tikz: '' }
  };
}

// Logic For Universal Self-Healing Import
function TriggerImport(onSuccess = null) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const importedData = JSON.parse(event.target.result);
        if (!importedData || typeof importedData !== 'object') {
          throw new Error('Imported file does not contain a valid JSON object.');
        }

        const now = Date.now();
        const activeTab = getActiveTabPage();

        // ========================================================
        // INDIVIDUAL TAB MODE: Isolated to active tab only
        // ========================================================
        if (activeTab === 'notes') {
          let targetData = null;
          if (importedData.NotesData && typeof importedData.NotesData === 'object') {
            targetData = importedData.NotesData;
          } else if (Array.isArray(importedData.notes) || importedData.vaultMeta) {
            targetData = importedData;
          } else {
            throw new Error('No notes data found in this file.');
          }

          let cleanData = JSON.parse(JSON.stringify(targetData));
          delete cleanData._unsaved;
          delete cleanData._savedAt;

          cleanData.vaultMeta = cleanData.vaultMeta || { title: "My Research & Notes Vault", version: "1.0.0" };
          cleanData.vaultMeta.lastSaved = now;
          cleanData.globalMacros = cleanData.globalMacros || { ...DEFAULT_MACROS };
          cleanData.tableTemplates = Array.isArray(cleanData.tableTemplates) ? cleanData.tableTemplates : [];
          cleanData.tikzTemplates = Array.isArray(cleanData.tikzTemplates) ? cleanData.tikzTemplates : [];
          cleanData.bibliography = Array.isArray(cleanData.bibliography) ? cleanData.bibliography : [];
          cleanData.citationStyle = typeof cleanData.citationStyle === 'string' ? cleanData.citationStyle : 'numeric';
          cleanData.notes = Array.isArray(cleanData.notes) ? cleanData.notes.map(sanitizeImportedNote) : [];
          cleanData.folders = Array.isArray(cleanData.folders) && cleanData.folders.length > 0 
            ? cleanData.folders 
            : Array.from(new Set(cleanData.notes.map(n => n.folder || 'General').filter(Boolean)));
          cleanData.tags = Array.isArray(cleanData.tags) && cleanData.tags.length > 0 
            ? cleanData.tags 
            : Array.from(new Set(cleanData.notes.flatMap(n => n.tags || []).filter(Boolean)));

          // Update DOM script block
          let scriptBlock = document.getElementById('NotesData');
          if (!scriptBlock) {
            scriptBlock = document.createElement('script');
            scriptBlock.type = 'application/json';
            scriptBlock.id = 'NotesData';
            document.head.appendChild(scriptBlock);
          }
          scriptBlock.textContent = JSON.stringify(cleanData, null, 2);

          // Update live memory
          if (typeof window !== 'undefined' && window.NotesState) {
            Object.assign(window.NotesState, cleanData);
          }

          // Update localStorage cache
          try {
            if (typeof localStorage !== 'undefined') {
              const cachePayload = {
                ...cleanData,
                _unsaved: true,
                _savedAt: now
              };
              localStorage.setItem('NotesData_Local_Cache', JSON.stringify(cachePayload));
            }
          } catch (err) {
            console.warn('[Notes Import] Failed to cache in localStorage:', err);
          }

          // Mark unsaved changes
          if (typeof window !== 'undefined' && typeof window.MarkUnsavedChanges === 'function') {
            window.MarkUnsavedChanges(true);
          }

          alert('Notes imported successfully! Remember to click SAVE to make it permanent in your HTML.');
          if (onSuccess) {
            onSuccess(cleanData);
          } else if (typeof window !== 'undefined' && typeof window.initNotesApp === 'function') {
            window.initNotesApp();
          } else if (typeof window !== 'undefined' && typeof window.handleLocalHubRoute === 'function') {
            window.handleLocalHubRoute();
          } else {
            if (typeof window !== 'undefined') window.__SUPPRESS_BEFOREUNLOAD__ = true;
            window.location.reload();
          }
          return;
        }

        if (activeTab === 'bookmarks') {
          let targetData = null;
          if (importedData.Bookmarks && typeof importedData.Bookmarks === 'object') {
            targetData = importedData.Bookmarks;
          } else if (Array.isArray(importedData.bookmarks) || importedData.sectionOrder) {
            targetData = importedData;
          } else {
            throw new Error('No bookmarks data found in this file.');
          }

          let cleanData = JSON.parse(JSON.stringify(targetData));
          delete cleanData._unsaved;
          delete cleanData._savedAt;
          cleanData.bookmarks = Array.isArray(cleanData.bookmarks) ? cleanData.bookmarks : [];
          cleanData.sectionOrder = Array.isArray(cleanData.sectionOrder) ? cleanData.sectionOrder : ['ALL'];
          if (!cleanData.sectionOrder.includes('ALL')) cleanData.sectionOrder.unshift('ALL');
          cleanData._lastSaved = now;

          let scriptBlock = document.getElementById('Bookmarks');
          if (!scriptBlock) {
            scriptBlock = document.createElement('script');
            scriptBlock.type = 'application/json';
            scriptBlock.id = 'Bookmarks';
            document.head.appendChild(scriptBlock);
          }
          scriptBlock.textContent = JSON.stringify(cleanData, null, 2);

          if (typeof window !== 'undefined' && window.BookmarkState) {
            Object.assign(window.BookmarkState, cleanData);
          }

          try {
            if (typeof localStorage !== 'undefined') {
              const cachePayload = {
                ...cleanData,
                _unsaved: true,
                _savedAt: now
              };
              localStorage.setItem('Bookmarks_Local_Cache', JSON.stringify(cachePayload));
            }
          } catch (err) {
            console.warn('[Bookmarks Import] Failed to cache in localStorage:', err);
          }

          // Mark unsaved changes
          if (typeof window !== 'undefined' && typeof window.MarkUnsavedChanges === 'function') {
            window.MarkUnsavedChanges(true);
          }

          alert('Bookmarks imported successfully! Remember to click SAVE to make it permanent in your HTML.');
          if (onSuccess) {
            onSuccess(cleanData);
          } else if (typeof window !== 'undefined' && typeof window.initBookmarksApp === 'function') {
            window.initBookmarksApp();
          } else if (typeof window !== 'undefined' && typeof window.handleLocalHubRoute === 'function') {
            window.handleLocalHubRoute();
          } else {
            if (typeof window !== 'undefined') window.__SUPPRESS_BEFOREUNLOAD__ = true;
            window.location.reload();
          }
          return;
        }

        // ========================================================
        // GLOBAL HUB MODE: Master multi-tab container & single payloads
        // ========================================================
        let masterBlocks = {};
        if (importedData.LandingPageData || importedData.Bookmarks || importedData.NotesData || importedData.ProfessorsData || importedData.RDData) {
          masterBlocks = importedData;
        } else if (Array.isArray(importedData.notes) || importedData.vaultMeta) {
          masterBlocks['NotesData'] = importedData;
        } else if (Array.isArray(importedData.bookmarks) || importedData.sectionOrder) {
          masterBlocks['Bookmarks'] = importedData;
        } else if (Array.isArray(importedData.professors)) {
          masterBlocks['ProfessorsData'] = importedData;
        } else if (Array.isArray(importedData.items) || importedData.groupOrder || importedData.links) {
          masterBlocks['RDData'] = importedData;
        } else if (importedData.rd && typeof importedData.rd === 'object' &&
                   (Array.isArray(importedData.rd.items) || importedData.rd.groupOrder || importedData.rd.links)) {
          /* R&D's own backup shape ({ rd: <library> } — RD_DATA.json /
             rd-library-backup-*.json). Without this branch it fell through to
             the generic loop, wrote a dead `#rd` script block and was lost. */
          masterBlocks['RDData'] = importedData.rd;
        } else if (Array.isArray(importedData.tabs)) {
          masterBlocks['LandingPageData'] = importedData;
        } else {
          masterBlocks = importedData;
        }

        // Universally sanitize, auto-create missing fields, and sync to DOM & localStorage
        for (const [id, rawData] of Object.entries(masterBlocks)) {
          if (!rawData || typeof rawData !== 'object') continue;

          let cleanData = JSON.parse(JSON.stringify(rawData));
          delete cleanData._unsaved;
          delete cleanData._savedAt;

          // Auto-create missing parts for NotesData
          if (id === 'NotesData' || Array.isArray(cleanData.notes) || cleanData.vaultMeta) {
            cleanData.vaultMeta = cleanData.vaultMeta || { title: "My Research & Notes Vault", version: "1.0.0" };
            cleanData.vaultMeta.lastSaved = now;
            cleanData.globalMacros = cleanData.globalMacros || { ...DEFAULT_MACROS };
            cleanData.tableTemplates = Array.isArray(cleanData.tableTemplates) ? cleanData.tableTemplates : [];
            cleanData.tikzTemplates = Array.isArray(cleanData.tikzTemplates) ? cleanData.tikzTemplates : [];
            cleanData.bibliography = Array.isArray(cleanData.bibliography) ? cleanData.bibliography : [];
            cleanData.citationStyle = typeof cleanData.citationStyle === 'string' ? cleanData.citationStyle : 'numeric';
            cleanData.notes = Array.isArray(cleanData.notes) ? cleanData.notes.map(sanitizeImportedNote) : [];
            cleanData.folders = Array.isArray(cleanData.folders) && cleanData.folders.length > 0 
              ? cleanData.folders 
              : Array.from(new Set(cleanData.notes.map(n => n.folder || 'General').filter(Boolean)));
            cleanData.tags = Array.isArray(cleanData.tags) && cleanData.tags.length > 0 
              ? cleanData.tags 
              : Array.from(new Set(cleanData.notes.flatMap(n => n.tags || []).filter(Boolean)));
          }
          // Auto-create missing parts for Bookmarks
          else if (id === 'Bookmarks' || Array.isArray(cleanData.bookmarks)) {
            cleanData.bookmarks = Array.isArray(cleanData.bookmarks) ? cleanData.bookmarks : [];
            cleanData.sectionOrder = Array.isArray(cleanData.sectionOrder) ? cleanData.sectionOrder : ['ALL'];
            if (!cleanData.sectionOrder.includes('ALL')) cleanData.sectionOrder.unshift('ALL');
            cleanData._lastSaved = now;
          }
          // Auto-create missing parts for ProfessorsData
          else if (id === 'ProfessorsData' || Array.isArray(cleanData.professors)) {
            cleanData.version = cleanData.version || 1;
            cleanData.updatedAt = new Date().toISOString();
            cleanData.professors = Array.isArray(cleanData.professors) ? cleanData.professors : [];
            try {
              if (typeof localStorage !== 'undefined') {
                localStorage.setItem('profftrack:v1', JSON.stringify(cleanData));
              }
            } catch (err) {
              console.warn('[Import] Failed to save profftrack:v1 in localStorage:', err);
            }
          }
          // Auto-create missing parts for RDData
          else if (id === 'RDData' || Array.isArray(cleanData.items)) {
            cleanData.version = cleanData.version || 1;
            cleanData.updatedAt = new Date().toISOString();
            cleanData.items = Array.isArray(cleanData.items) ? cleanData.items : [];
            cleanData.groups = Array.isArray(cleanData.groups) ? cleanData.groups : [];
            cleanData.groupOrder = Array.isArray(cleanData.groupOrder) ? cleanData.groupOrder : [];
            cleanData.itemOrder = Array.isArray(cleanData.itemOrder) ? cleanData.itemOrder : [];
            cleanData.links = Array.isArray(cleanData.links) ? cleanData.links : [];
            try {
              if (typeof localStorage !== 'undefined') {
                localStorage.setItem('rd_library_v1', JSON.stringify({ rd: cleanData }));
              }
            } catch (err) {
              console.warn('[Import] Failed to save rd_library_v1 in localStorage:', err);
            }
          }
          // Auto-create missing parts for LandingPageData
          else if (id === 'LandingPageData' || Array.isArray(cleanData.tabs)) {
            cleanData.tabs = Array.isArray(cleanData.tabs) ? cleanData.tabs : [];
            cleanData._lastSaved = now;
          } else {
            cleanData._lastSaved = now;
          }

          // A. Update or create DOM <script type="application/json" id="...">
          let scriptBlock = document.getElementById(id);
          if (!scriptBlock) {
            scriptBlock = document.createElement('script');
            scriptBlock.type = 'application/json';
            scriptBlock.id = id;
            document.head.appendChild(scriptBlock);
          }
          scriptBlock.textContent = JSON.stringify(cleanData, null, 2);

          // B. Update in-memory window state objects if present
          if (typeof window !== 'undefined') {
            if (id === 'NotesData' && window.NotesState) Object.assign(window.NotesState, cleanData);
            if (id === 'Bookmarks' && window.BookmarkState) Object.assign(window.BookmarkState, cleanData);
            if (id === 'LandingPageData' && window.AppState) Object.assign(window.AppState, cleanData);
            if (id === 'ProfessorsData') {
              if (window.ProfessorsState) Object.assign(window.ProfessorsState, cleanData);
              if (typeof window.replaceState === 'function') window.replaceState(cleanData);
            }
            if (id === 'RDData') {
              /* Route through the R&D module hook: NormalizeState + persist +
                 full re-render. A raw Object.assign bypassed normalization and
                 left the running UI showing stale data. */
              if (window.RD && typeof window.RD.ReplaceAll === 'function') {
                window.RD.ReplaceAll(cleanData);
              } else if (window.RDState) {
                Object.assign(window.RDState, { rd: cleanData });
              }
            }
            if (window[id + 'State']) Object.assign(window[id + 'State'], cleanData);
            if (window[id]) Object.assign(window[id], cleanData);
          }

          // C. Save to LocalStorage with _unsaved: true and _savedAt: now
          try {
            if (typeof localStorage !== 'undefined') {
              const cachePayload = {
                ...cleanData,
                _unsaved: true,
                _savedAt: now
              };
              localStorage.setItem(id + '_Local_Cache', JSON.stringify(cachePayload));
            }
          } catch (err) {
            console.warn(`[Import] Failed to cache ${id} in localStorage:`, err);
          }
        }

        // Mark unsaved changes
        if (typeof window !== 'undefined' && typeof window.MarkUnsavedChanges === 'function') {
          window.MarkUnsavedChanges(true);
        }

        alert('Data imported successfully! All missing fields were automatically structured. Remember to click SAVE to make it permanent in your HTML.');

        if (onSuccess) {
          onSuccess(masterBlocks);
        } else if (typeof window !== 'undefined' && typeof window.handleLocalHubRoute === 'function') {
          window.handleLocalHubRoute();
        } else {
          if (typeof window !== 'undefined') window.__SUPPRESS_BEFOREUNLOAD__ = true;
          window.location.reload();
        }
      } catch (err) {
        alert('Invalid JSON file: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Logic For Universal Dynamic Export
function TriggerExport() {
  if (typeof window !== 'undefined' && typeof window.flushNotesSave === 'function') {
    try { window.flushNotesSave(); } catch (e) { }
  }

  const activeTab = getActiveTabPage();
  const now = Date.now();

  // ========================================================
  // INDIVIDUAL TAB MODE: Isolated to active tab only
  // ========================================================
  if (activeTab === 'notes') {
    let foundData = null;
    if (typeof window !== 'undefined' && window.NotesState && typeof window.NotesState === 'object') {
      foundData = window.NotesState;
    }
    if (!foundData) {
      const script = document.getElementById('NotesData');
      if (script && script.textContent.trim()) {
        try { foundData = JSON.parse(script.textContent); } catch (e) { }
      }
    }
    if (!foundData) {
      try {
        const cached = typeof localStorage !== 'undefined' ? localStorage.getItem('NotesData_Local_Cache') : null;
        if (cached) foundData = JSON.parse(cached);
      } catch (e) { }
    }

    const cleanData = JSON.parse(JSON.stringify(foundData || {}));
    delete cleanData._unsaved;
    delete cleanData._savedAt;

    cleanData.vaultMeta = cleanData.vaultMeta || { title: "My Research & Notes Vault", version: "1.0.0" };
    cleanData.vaultMeta.lastSaved = now;
    cleanData.globalMacros = cleanData.globalMacros || { ...DEFAULT_MACROS };
    cleanData.tableTemplates = Array.isArray(cleanData.tableTemplates) ? cleanData.tableTemplates : [];
    cleanData.tikzTemplates = Array.isArray(cleanData.tikzTemplates) ? cleanData.tikzTemplates : [];
    cleanData.bibliography = Array.isArray(cleanData.bibliography) ? cleanData.bibliography : [];
    cleanData.citationStyle = typeof cleanData.citationStyle === 'string' ? cleanData.citationStyle : 'numeric';
    cleanData.notes = Array.isArray(cleanData.notes) ? cleanData.notes.map(sanitizeImportedNote) : [];
    cleanData.folders = Array.isArray(cleanData.folders) && cleanData.folders.length > 0
      ? cleanData.folders
      : Array.from(new Set(cleanData.notes.map(n => n.folder || 'General').filter(Boolean)));
    cleanData.tags = Array.isArray(cleanData.tags) && cleanData.tags.length > 0
      ? cleanData.tags
      : Array.from(new Set(cleanData.notes.flatMap(n => n.tags || []).filter(Boolean)));

    const dataStr = JSON.stringify(cleanData, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Notes_DATA.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    return;
  }

  if (activeTab === 'bookmarks') {
    let foundData = null;
    if (typeof window !== 'undefined' && window.BookmarkState && typeof window.BookmarkState === 'object') {
      foundData = window.BookmarkState;
    }
    if (!foundData) {
      const script = document.getElementById('Bookmarks');
      if (script && script.textContent.trim()) {
        try { foundData = JSON.parse(script.textContent); } catch (e) { }
      }
    }
    if (!foundData) {
      try {
        const cached = typeof localStorage !== 'undefined' ? localStorage.getItem('Bookmarks_Local_Cache') : null;
        if (cached) foundData = JSON.parse(cached);
      } catch (e) { }
    }

    const cleanData = JSON.parse(JSON.stringify(foundData || {}));
    delete cleanData._unsaved;
    delete cleanData._savedAt;
    cleanData.bookmarks = Array.isArray(cleanData.bookmarks) ? cleanData.bookmarks : [];
    cleanData.sectionOrder = Array.isArray(cleanData.sectionOrder) ? cleanData.sectionOrder : ['ALL'];
    if (!cleanData.sectionOrder.includes('ALL')) cleanData.sectionOrder.unshift('ALL');
    cleanData._lastSaved = now;

    const dataStr = JSON.stringify(cleanData, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Bookmarks_DATA.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    return;
  }

  if (activeTab === 'rd') {
    let foundData = null;
    if (typeof window !== 'undefined' && window.RDState && typeof window.RDState === 'object') {
      foundData = window.RDState.rd || window.RDState;
    }
    if (!foundData) {
      const script = document.getElementById('RDData');
      if (script && script.textContent.trim()) {
        try {
          const parsed = JSON.parse(script.textContent);
          foundData = (parsed && parsed.rd) ? parsed.rd : parsed;
        } catch (e) { }
      }
    }
    if (!foundData) {
      try {
        const cached = typeof localStorage !== 'undefined' ? localStorage.getItem('rd_library_v1') : null;
        if (cached) {
          const parsed = JSON.parse(cached);
          foundData = (parsed && parsed.rd) ? parsed.rd : parsed;
        }
      } catch (e) { }
    }
    const cleanData = (foundData && typeof foundData === 'object') ? JSON.parse(JSON.stringify(foundData)) : {};
    if (!Array.isArray(cleanData.items)) cleanData.items = [];
    cleanData._lastSaved = now;

    const dataStr = JSON.stringify({ rd: cleanData }, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'RD_DATA.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    return;
  }

  // ========================================================
  // GLOBAL HUB MODE: Master multi-tab container export
  // ========================================================
  const masterBackup = {};
  const scripts = document.querySelectorAll('script[type="application/json"][id]');
  scripts.forEach(script => {
    const id = script.id;
    let foundData = null;

    if (id === 'RDData') {
      if (typeof window !== 'undefined' && window.RD && typeof window.RD.state === 'function') {
        foundData = window.RD.state();
      } else if (typeof window !== 'undefined' && window.RDState) {
        foundData = window.RDState.rd || window.RDState;
      }
    }

    const candidateKeys = [
      id,
      id + 'State',
      id.replace(/Data$/, '') + 'State',
      'App' + id,
      'AppState',
      'BookmarkState',
      'NotesState',
      'ProfessorsState',
      'RDState'
    ];

    if (!foundData) {
      for (const key of candidateKeys) {
        if (typeof window !== 'undefined' && window[key] && typeof window[key] === 'object' && Object.keys(window[key]).length > 0) {
          if (
            key === id ||
            key === id + 'State' ||
            key === id.replace(/Data$/, '') + 'State' ||
            (id === 'LandingPageData' && key === 'AppState') ||
            (id === 'Bookmarks' && key === 'BookmarkState') ||
            (id === 'NotesData' && key === 'NotesState') ||
            (id === 'ProfessorsData' && key === 'ProfessorsState') ||
            (id === 'RDData' && key === 'RDState')
          ) {
            foundData = (id === 'RDData' && window[key].rd) ? window[key].rd : window[key];
            break;
          }
        }
      }
    }

    if (!foundData) {
      try {
        foundData = JSON.parse(script.textContent);
      } catch (e) { }
    }

    if ((!foundData || !foundData.professors || foundData.professors.length === 0) && id === 'ProfessorsData') {
      try {
        const stored = typeof localStorage !== 'undefined' ? localStorage.getItem('profftrack:v1') : null;
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && Array.isArray(parsed.professors) && parsed.professors.length > 0) {
            foundData = parsed;
          }
        }
      } catch (e) { }
    }

    if ((!foundData || !foundData.items || foundData.items.length === 0) && id === 'RDData') {
      try {
        const stored = typeof localStorage !== 'undefined' ? localStorage.getItem('rd_library_v1') : null;
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && typeof parsed === 'object') {
            foundData = parsed.rd || parsed;
          }
        }
      } catch (e) { }
    }

    if (foundData) {
      const cleanData = JSON.parse(JSON.stringify(foundData));
      delete cleanData._unsaved;
      delete cleanData._savedAt;
      masterBackup[id] = cleanData;
    }
  });

  const dataStr = JSON.stringify(masterBackup, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Local_HUB_DATA.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

    const id = script.id;
    let foundData = null;

    // 1. Check window state matching id (e.g. window.BookmarkState, window.NotesState, window.AppState, window.RD, window[id])
    if (id === 'RDData') {
      if (window.RD && typeof window.RD.state === 'function') {
        foundData = window.RD.state();
      } else if (window.RDState) {
        foundData = window.RDState.rd || window.RDState;
      }
    }

    const candidateKeys = [
      id,
      id + 'State',
      id.replace(/Data$/, '') + 'State',
      'App' + id,
      'AppState',
      'BookmarkState',
      'NotesState',
      'ProfessorsState',
      'RDState'
    ];

    if (!foundData) {
      for (const key of candidateKeys) {
        if (window[key] && typeof window[key] === 'object' && Object.keys(window[key]).length > 0) {
          if (
            key === id ||
            key === id + 'State' ||
            key === id.replace(/Data$/, '') + 'State' ||
            (id === 'LandingPageData' && key === 'AppState') ||
            (id === 'Bookmarks' && key === 'BookmarkState') ||
            (id === 'NotesData' && key === 'NotesState') ||
            (id === 'ProfessorsData' && key === 'ProfessorsState') ||
            (id === 'RDData' && key === 'RDState')
          ) {
            foundData = (id === 'RDData' && window[key].rd) ? window[key].rd : window[key];
            break;
          }
        }
      }
    }

    // 2. Fallback to this file's path-scoped recovery snapshot (sessionStorage)
    //    only if not found in live window state. The old shared localStorage
    //    keys are NOT read here anymore — they leaked data between different
    //    LocalHUB files sharing one origin.
    if (!foundData) {
      const snap = ReadRecoverySnapshot(id);
      if (snap && snap.data && typeof snap.data === 'object') {
        foundData = (id === 'RDData' && snap.data.rd) ? snap.data.rd : snap.data;
      }
      if (!foundData && id === 'RDData') {
        try {
          const rdRaw = localStorage.getItem('rd_library_v1');
          if (rdRaw) {
            const parsed = JSON.parse(rdRaw);
            if (parsed && typeof parsed === 'object') {
              foundData = parsed.rd ? parsed.rd : parsed;
            }
          }
        } catch (e) { }
      }
    }

    if (foundData) {
      try {
        // Deep clone to sanitize and set lastSaved
        const cleanData = JSON.parse(JSON.stringify(foundData));
        delete cleanData._unsaved;
        delete cleanData._savedAt;

        if (id === 'NotesData') {
          if (!cleanData.vaultMeta) cleanData.vaultMeta = {};
          cleanData.vaultMeta.lastSaved = now;
          if (window.NotesState && window.NotesState.vaultMeta) {
            window.NotesState.vaultMeta.lastSaved = now;
          }
        } else if (id === 'RDData') {
          cleanData.updatedAt = new Date().toISOString();
        } else {
          cleanData._lastSaved = now;
          if (id === 'Bookmarks' && window.BookmarkState) {
            window.BookmarkState._lastSaved = now;
          } else if (id === 'LandingPageData' && window.AppState) {
            window.AppState._lastSaved = now;
          }
        }

        // \u003c-escape `<` so vault data (note content can contain markup)
        // can never close the host <script> block in the standalone file.
        const safeJson = JSON.stringify(cleanData, null, 2).replace(/</g, '\\u003c');

        script.textContent = safeJson;

        // Also update live in-memory document script tag
        if (typeof document !== 'undefined') {
          const liveScript = document.getElementById(id);
          if (liveScript && liveScript !== script) {
            liveScript.textContent = safeJson;
          }
        }
      } catch (e) { }
    }
  });
}

// Save & Download Standalone App
async function SaveAndDownloadApp() {
  const DocClone = document.documentElement.cloneNode(true);

  // 1. Auto-sync all data blocks from in-memory / localStorage
  syncAllStatesToDOM(DocClone);

  // 2. Check if running in standalone mode
  const isStandalone = typeof window !== 'undefined' && window.__IS_STANDALONE__ === true;

    async function bundleFile(filePath) {
      try {
        const cleanPath = filePath.endsWith('.js') ? filePath : filePath + '.js';
        const resolvedUrl = new URL('../' + cleanPath, import.meta.url).href;
        const res = await fetch(resolvedUrl);
        if (!res.ok) {
          console.warn(`[Bundler] Skipping unavailable file: ${cleanPath} (${res.status})`);
          return '';
        }
        let code = await res.text();
        if (!code || !code.trim()) return '';

        // Strip module imports/exports for flat bundle embedding
        code = code.replace(/^\s*import\s+[\s\S]*?from\s+['"][^'"]+['"];?\s*$/gm, '');
        code = code.replace(/^\s*import\s+['"][^'"]+['"];?\s*$/gm, '');
        code = code.replace(/^\s*export\s+\*[\s\S]*?from\s+['"][^'"]+['"];?\s*$/gm, '');
        code = code.replace(/^\s*export\s*\{[\s\S]*?\}\s*from\s+['"][^'"]+['"];?\s*$/gm, '');
        code = code.replace(/^\s*export\s*\{[\s\S]*?\};?\s*$/gm, '');
        code = code.replace(/^\s*export\s+default\s+/gm, '');
        code = code.replace(/^\s*export\s+(async\s+)?(function|const|let|var|class)/gm, (m, p1, p2) => (p1 || '') + p2);
        // Escape literal script-closers so embedded sources (templates in
        // 04_Professors/Professors.js, the per-tab Data_IO builders, …) cannot
        // terminate the host <script> block of the generated standalone.
        // Source-level escape only: `\/` evaluates to `/`, so runtime strings
        // and the per-tab builders' own generated HTML stay byte-identical.
        code = code.replace(/<\/script/gi, '<\\/script');
        return `\n/* --- ${cleanPath} --- */\n${code}\n`;

// Global unsaved changes state tracker
let isAppDirty = false;
let appUnsavedCount = 0;
function HasUnsavedChanges() {
  if (typeof window !== 'undefined') {
    let hasProvider = false;
    let anyDirty = false;

    if (typeof window.HasUnsavedBookmarkChanges === 'function') {
      hasProvider = true;
      if (window.HasUnsavedBookmarkChanges()) anyDirty = true;
    } else if (typeof window.__BOOKMARKS_UNSAVED__ === 'boolean') {
      hasProvider = true;
      if (window.__BOOKMARKS_UNSAVED__) anyDirty = true;
    }

    if (typeof window.HasUnsavedNotesChanges === 'function') {
      hasProvider = true;
      if (window.HasUnsavedNotesChanges()) anyDirty = true;
    } else if (typeof window.__NOTES_UNSAVED__ === 'boolean') {
      hasProvider = true;
      if (window.__NOTES_UNSAVED__) anyDirty = true;
    }

    if (hasProvider) {
      return anyDirty;
    }

    if (typeof window.__HAS_UNSAVED_CHANGES__ === 'boolean') {
      return window.__HAS_UNSAVED_CHANGES__;
    }
  }
  return isAppDirty;
}
function GetUnsavedChangesCount() {
  if (typeof window !== 'undefined') {
    let total = 0;
    let hasProvider = false;

    if (typeof window.GetBookmarksUnsavedChangesCount === 'function') {
      total += window.GetBookmarksUnsavedChangesCount();
      hasProvider = true;
    } else if (typeof window.__BOOKMARKS_UNSAVED_COUNT__ === 'number') {
      total += window.__BOOKMARKS_UNSAVED_COUNT__;
      hasProvider = true;
    }

    if (typeof window.GetNotesUnsavedChangesCount === 'function') {
      total += window.GetNotesUnsavedChangesCount();
      hasProvider = true;
    } else if (typeof window.__NOTES_UNSAVED_COUNT__ === 'number') {
      total += window.__NOTES_UNSAVED_COUNT__;
      hasProvider = true;
    }

    if (hasProvider) {
      return total;
    }
  }
  return appUnsavedCount;
}
function MarkUnsavedChanges(isDirty = true, count = null) {
  isAppDirty = Boolean(isDirty);
  if (typeof count === 'number') {
    appUnsavedCount = Math.max(0, count);
  } else if (!isAppDirty) {
    appUnsavedCount = 0;
  } else {
    appUnsavedCount = GetUnsavedChangesCount();
    if (appUnsavedCount === 0 && isAppDirty) {
      appUnsavedCount = 1;
    }
  }

  if (typeof window !== 'undefined') {
    window.__HAS_UNSAVED_CHANGES__ = isAppDirty;
    window.__APP_UNSAVED_COUNT__ = appUnsavedCount;
  }

  const saveBtn = typeof document !== 'undefined' ? document.getElementById('save-btn') : null;
  if (saveBtn) {
    const badge = saveBtn.querySelector('.save-badge');
    if (isAppDirty && appUnsavedCount > 0) {
      saveBtn.classList.add('has-unsaved');
      if (badge) {
        badge.textContent = appUnsavedCount > 99 ? '99+' : String(appUnsavedCount);
        badge.style.display = 'flex';
      }
      const changeText = appUnsavedCount === 1 ? '1 unsaved change' : `${appUnsavedCount} unsaved changes`;
      saveBtn.title = `SAVE APPLICATION (${changeText})`;
    } else {
      saveBtn.classList.remove('has-unsaved');
      if (badge) {
        badge.textContent = '';
        badge.style.display = 'none';
      }
      saveBtn.title = 'SAVE APPLICATION';
    }
  }
}

if (typeof window !== 'undefined') {
  window.HasUnsavedChanges = HasUnsavedChanges;
  window.GetUnsavedChangesCount = GetUnsavedChangesCount;
  window.MarkUnsavedChanges = MarkUnsavedChanges;
}

// preserveRecovery=true (boot sweep only) keeps the path-scoped sessionStorage
// recovery snapshots alive — they must survive exits/reloads to be offerable;
// the save flow (preserveRecovery=false default) clears them because the
// edits are now permanent inside the downloaded file.
function ClearAllLocalCaches(preserveRecovery = false) {
  if (typeof localStorage === 'undefined') return;
  // 1. Clear known tab cache keys based on DOM data blocks
  if (typeof document !== 'undefined') {
    const dataScripts = document.querySelectorAll('script[type="application/json"][id]');
    dataScripts.forEach(s => {
      try {
        localStorage.removeItem(s.id + '_Local_Cache');
        localStorage.removeItem(s.id.replace(/Data$/, '') + '_Local_Cache');
        localStorage.removeItem(s.id);
      } catch (e) { }
    });
  }

  // 2. Clear known specific tab storage keys
  try {
    localStorage.removeItem('profftrack:v1');
    localStorage.removeItem('rd_library_v1');
    localStorage.removeItem('PapersData_Local_Cache');
    localStorage.removeItem('NotesData_Local_Cache');
    localStorage.removeItem('Bookmarks_Local_Cache');
    localStorage.removeItem('LandingPageData_Local_Cache');
  } catch (e) { }

  // 3. Also sweep any key in localStorage ending with _Local_Cache or containing _Cache
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const key = localStorage.key(i);
      if (key && (key.endsWith('_Local_Cache') || key.includes('_Cache'))) {
        localStorage.removeItem(key);
      }
    }
  } catch (e) { }

  // 4. Clear per-block undo/redo history stacks from memory
  if (typeof window !== 'undefined' && window.__blockHistories) {
    try {
      window.__blockHistories.clear();
    } catch (e) { }
  }

  // 5. Reset unsaved changes flag and baseline
  isAppDirty = false;
  appUnsavedCount = 0;
  if (typeof window !== 'undefined') {
    window.__HAS_UNSAVED_CHANGES__ = false;
    window.__NOTES_UNSAVED__ = false;
    window.__BOOKMARKS_UNSAVED__ = false;
    window.__BOOKMARKS_UNSAVED_COUNT__ = 0;
    if (!preserveRecovery) {
      // Full clear (post-save): recovery snapshots die too — the downloaded
      // file now contains the edits. The boot sweep (preserveRecovery=true)
      // must NOT touch them.
      if (typeof window.ClearNotesLocalCache === 'function') {
        try { window.ClearNotesLocalCache(); } catch (e) { }
      }
      if (typeof window.ClearBookmarkLocalCache === 'function') {
        try { window.ClearBookmarkLocalCache(); } catch (e) { }
      }
    }
  }
  const saveBtn = typeof document !== 'undefined' ? document.getElementById('save-btn') : null;
  if (saveBtn) {
    saveBtn.classList.remove('has-unsaved');
    const badge = saveBtn.querySelector('.save-badge');
    if (badge) {
      badge.textContent = '';
      badge.style.display = 'none';
    }
    saveBtn.title = 'SAVE APPLICATION';
  }

  console.log('[Save] All unsaved local caches flushed successfully.');
}

// Button Click & Lifecycle Guard Logic
function InitSaveButtonLogic() {
  const btn = document.getElementById('save-btn');
  if (btn) {
    btn.addEventListener('click', () => {
      SaveAndDownloadApp();
    });
  }

  // Restore unsaved indicator & badge if changes exist in active session
  if (HasUnsavedChanges()) {
    MarkUnsavedChanges(true, GetUnsavedChangesCount());
  } else {
    MarkUnsavedChanges(false, 0);
  }

  // Install navigation guards once per window
  if (typeof window !== 'undefined' && !window.__UNSAVED_GUARD_INSTALLED__) {
    window.__UNSAVED_GUARD_INSTALLED__ = true;

    // Prompt on tab close / browser reload
    window.addEventListener('beforeunload', (e) => {
      if (window.__SUPPRESS_BEFOREUNLOAD__) return;
      if (HasUnsavedChanges()) {
        e.preventDefault();
        e.returnValue = '';
        return '';
      }
    });

    // NOTE: no pagehide wipe — sessionStorage recovery snapshots are per-tab
    // and path-scoped, so they can never leak into another file, and wiping
    // on exit destroyed the crash-recovery data right when it was needed.
    // Legacy localStorage keys are purged on load by each tab's state module.

    // Clean sweep on initial startup to ensure no stale cache from other files
    // contaminates this session (recovery snapshots preserved)
    ClearAllLocalCaches(true);
  }
}

/* --- 00_Components/06_Color_Selector.js --- */
/**
 * 00_Components/06_Color_Selector.js
 * Universal Dual-Theme Color Selector Component [ + | ○ Light | ○ Dark ].
 * Supports:
 * - Dual-color specification: Light Mode Hex & Dark Mode Hex (#Light|#Dark)
 * - Dynamic theme detection (observes [data-theme="light"] vs default dark)
 * - Clickable color swatches with native <input type="color">
 * - Active swatch highlighting according to current system/app theme
 * - Shared helper resolveThemeColors() to translate #Light|#Dark into current theme hex
 */

let activeLightColor = '#dc2626'; // Default red for light mode
let activeDarkColor = '#f87171';  // Default bright coral for dark mode

/**
 * Resolves dual-theme color syntax #LightHex|#DarkHex into a single valid hex code
 * based on the active theme.
 * Also handles \textcolor{#Light|#Dark}{...}
 */
function resolveThemeColors(text, isDarkMode = null) {
  if (!text || typeof text !== 'string') return text || '';
  const isDark = (isDarkMode !== null)
    ? isDarkMode
    : (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme') !== 'light');

  // Replace #light|#dark with active theme hex
  return text.replace(/#([0-9a-fA-F]{3,8})\|#([0-9a-fA-F]{3,8})/g, (_, light, dark) => {
    return isDark ? `#${dark}` : `#${light}`;
  });
}

/**
 * Returns currently active color pair
 */
function getCurrentColorPair() {
  return {
    light: activeLightColor,
    dark: activeDarkColor,
    dual: `${activeLightColor}|${activeDarkColor}`,
    activeHex: (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme') === 'light')
      ? activeLightColor
      : activeDarkColor
  };
}

/**
 * Sets current active colors programmatically
 */
function setCurrentColorPair(light, dark) {
  if (light) activeLightColor = light;
  if (dark) activeDarkColor = dark;
}

/**
 * Creates a DOM node for the [ + | ○ Light | ○ Dark ] component.
 */
function CreateColorSelector({
  defaultLight = activeLightColor,
  defaultDark = activeDarkColor,
  onApply = null,        // Called when [+] is clicked: ({ light, dark, dual, activeHex })
  onColorChange = null,  // Called when either light or dark color is adjusted
  btnTitle = "Insert color code at cursor",
  className = ""
} = {}) {
  let light = defaultLight || activeLightColor;
  let dark = defaultDark || activeDarkColor;

  const container = document.createElement('div');
  container.className = `color-selector-widget inline-flex items-center rounded-md border border-[var(--border)] bg-[var(--surface)] h-7 overflow-hidden flex-shrink-0 shadow-xs select-none transition-all ${className}`;

  container.innerHTML = `
    <!-- Plus / Apply Button -->
    <button type="button" class="btn-color-apply px-2 h-full text-xs font-bold hover:bg-[var(--card-hover)] active:scale-95 transition-all flex items-center justify-center text-[var(--text)] cursor-pointer" title="${btnTitle}">
      <span class="text-sm font-bold leading-none select-none">+</span>
    </button>

    <div class="w-[1px] h-3.5 bg-[var(--border)] flex-shrink-0"></div>

    <!-- Light Mode Swatch (Sun Icon / L) -->
    <label class="swatch-label swatch-light px-1.5 h-full flex items-center justify-center cursor-pointer hover:bg-[var(--card-hover)] transition-all relative flex-shrink-0" title="Light Theme Color (Click to change)">
      <span class="swatch-dot swatch-dot-light w-3 h-3 rounded-full border border-black/25 shadow-xs inline-block transition-transform hover:scale-110" style="background-color: ${light};"></span>
      <span class="absolute bottom-0.5 right-0.5 w-1 h-1 rounded-full bg-amber-400 opacity-80 pointer-events-none" title="Light mode"></span>
      <input type="color" class="input-color-light absolute inset-0 opacity-0 cursor-pointer w-full h-full" value="${light}" />
    </label>

    <div class="w-[1px] h-3.5 bg-[var(--border)] flex-shrink-0"></div>

    <!-- Dark Mode Swatch (Moon Icon / D) -->
    <label class="swatch-label swatch-dark px-1.5 h-full flex items-center justify-center cursor-pointer hover:bg-[var(--card-hover)] transition-all relative flex-shrink-0" title="Dark Theme Color (Click to change)">
      <span class="swatch-dot swatch-dot-dark w-3 h-3 rounded-full border border-white/30 shadow-xs inline-block transition-transform hover:scale-110" style="background-color: ${dark};"></span>
      <span class="absolute bottom-0.5 right-0.5 w-1 h-1 rounded-full bg-indigo-400 opacity-80 pointer-events-none" title="Dark mode"></span>
      <input type="color" class="input-color-dark absolute inset-0 opacity-0 cursor-pointer w-full h-full" value="${dark}" />
    </label>
  `;

  const btnApply = container.querySelector('.btn-color-apply');
  const inputLight = container.querySelector('.input-color-light');
  const dotLight = container.querySelector('.swatch-dot-light');
  const labelLight = container.querySelector('.swatch-light');

  const inputDark = container.querySelector('.input-color-dark');
  const dotDark = container.querySelector('.swatch-dot-dark');
  const labelDark = container.querySelector('.swatch-dark');

  // Update theme highlight on swatches
  function updateThemeHighlight() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) {
      labelLight.classList.add('bg-amber-500/20');
      labelDark.classList.remove('bg-indigo-500/20');
    } else {
      labelDark.classList.add('bg-indigo-500/20');
      labelLight.classList.remove('bg-amber-500/20');
    }
  }
  updateThemeHighlight();

  // Watch for theme changes
  const observer = new MutationObserver(() => {
    updateThemeHighlight();
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // Light color input change
  inputLight.addEventListener('input', (e) => {
    light = e.target.value;
    activeLightColor = light;
    dotLight.style.backgroundColor = light;
    if (onColorChange) onColorChange({ light, dark, dual: `${light}|${dark}` });
  });

  // Dark color input change
  inputDark.addEventListener('input', (e) => {
    dark = e.target.value;
    activeDarkColor = dark;
    dotDark.style.backgroundColor = dark;
    if (onColorChange) onColorChange({ light, dark, dual: `${light}|${dark}` });
  });

  // Apply button clicked
  btnApply.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const activeHex = isLight ? light : dark;
    if (onApply) {
      onApply({
        light,
        dark,
        dual: `${light}|${dark}`,
        activeHex,
        latexCommand: `\\textcolor{${light}|${dark}}{}`
      });
    }
  });

  return container;
}


/* --- 00_Components/07_Blob_Store.js --- */
/**
 * 07_Blob_Store.js — IndexedDB binary vault for Local_HUB.
 *
 * Stores large binary payloads (PDF attachments, images, …) OUTSIDE the HTML
 * data vaults so `<script type="application/json">` blocks stay featherweight.
 * IndexedDB is bound to the browser profile/origin and does NOT travel inside
 * a saved .html file — callers must keep a pointer (`blobKey`, `pdfUrl`, DOI)
 * in the JSON vault and offer the Archive Export path for device migration.
 *
 * All symbols are strictly `BlobStore_`/`BLOBSTORE_` prefixed to guarantee
 * zero top-level identifier collisions in the flat standalone bundle.
 * If IndexedDB is unavailable (private mode, blocked storage), a best-effort
 * in-memory fallback keeps the session functional for small payloads.
 */

const BLOBSTORE_DB_NAME = 'LocalHUB_Blobs';
const BLOBSTORE_DB_VERSION = 1;
const BLOBSTORE_STORE = 'files';

const BLOBSTORE_MEM = new Map();
let BLOBSTORE_DB_PROMISE = null;
let BLOBSTORE_WARNED = false;

function BlobStore_WarnFallback(err) {
  if (BLOBSTORE_WARNED) return;
  BLOBSTORE_WARNED = true;
  console.warn('[BlobStore] IndexedDB unavailable, falling back to in-memory storage (lost on reload).', err);
}

function BlobStore_Open() {
  if (typeof indexedDB === 'undefined' || indexedDB === null) {
    return Promise.reject(new Error('IndexedDB unavailable'));
  }
  if (BLOBSTORE_DB_PROMISE) return BLOBSTORE_DB_PROMISE;
  BLOBSTORE_DB_PROMISE = new Promise((resolve, reject) => {
    const req = indexedDB.open(BLOBSTORE_DB_NAME, BLOBSTORE_DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(BLOBSTORE_STORE)) {
        db.createObjectStore(BLOBSTORE_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
    req.onblocked = () => reject(new Error('IndexedDB open blocked by another tab'));
  });
  return BLOBSTORE_DB_PROMISE;
}

async function BlobStore_Store(mode) {
  const db = await BlobStore_Open();
  return db.transaction(BLOBSTORE_STORE, mode).objectStore(BLOBSTORE_STORE);
}

function BlobStore_Request(store, method, ...args) {
  return new Promise((resolve, reject) => {
    const req = store[method](...args);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

/**
 * Persist a binary payload under a stable key.
 * @param {string} key  e.g. `blob_pap_lx2abc123`
 * @param {Blob} blob
 * @param {{name?:string, type?:string, size?:number}} [meta]
 * @returns {Promise<{key:string, name:string, type:string, size:number, savedAt:number}>}
 */
async function BlobStore_Put(key, blob, meta = {}) {
  if (!key) throw new Error('[BlobStore] Put requires a key');
  const record = {
    key,
    blob,
    name: meta.name || (blob && blob.name) || key,
    type: meta.type || (blob && blob.type) || 'application/octet-stream',
    size: meta.size != null ? Number(meta.size) : (blob ? blob.size : 0),
    savedAt: Date.now()
  };
  try {
    const store = await BlobStore_Store('readwrite');
    await BlobStore_Request(store, 'put', record, key);
  } catch (err) {
    BlobStore_WarnFallback(err);
    BLOBSTORE_MEM.set(key, record);
  }
  return record;
}

/**
 * Decode a legacy base64 data URL and persist it as a real Blob.
 * Used by migrations that strip `attachment.data` out of JSON vaults.
 */
async function BlobStore_PutDataUrl(key, dataUrl, meta = {}) {
  if (!dataUrl || typeof dataUrl !== 'string') throw new Error('[BlobStore] PutDataUrl requires a data URL string');
  const match = /^data:([^;,]+)?(;base64)?,(.*)$/s.exec(dataUrl);
  if (!match) throw new Error('[BlobStore] Unrecognized data URL');
  const type = meta.type || match[1] || 'application/octet-stream';
  const isBase64 = !!match[2];
  const payload = match[3];
  let blob;
  if (isBase64) {
    const bin = atob(payload);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    blob = new Blob([bytes], { type });
  } else {
    blob = new Blob([decodeURIComponent(payload)], { type });
  }
  return BlobStore_Put(key, blob, { ...meta, type });
}

/** Fetch a stored record: `{ blob, name, type, size, savedAt }` or `null`. */
async function BlobStore_Get(key) {
  if (!key) return null;
  try {
    const store = await BlobStore_Store('readonly');
    const record = await BlobStore_Request(store, 'get', key);
    return record || null;
  } catch (err) {
    BlobStore_WarnFallback(err);
    return BLOBSTORE_MEM.get(key) || null;
  }
}
async function BlobStore_Has(key) {
  if (!key) return false;
  try {
    const store = await BlobStore_Store('readonly');
    const found = await BlobStore_Request(store, 'getKey', key);
    return found != null;
  } catch (err) {
    BlobStore_WarnFallback(err);
    return BLOBSTORE_MEM.has(key);
  }
}
async function BlobStore_Delete(key) {
  if (!key) return false;
  BLOBSTORE_MEM.delete(key);
  try {
    const store = await BlobStore_Store('readwrite');
    await BlobStore_Request(store, 'delete', key);
    return true;
  } catch (err) {
    BlobStore_WarnFallback(err);
    return BLOBSTORE_MEM.has(key) === false;
  }
}
async function BlobStore_AllKeys() {
  try {
    const store = await BlobStore_Store('readonly');
    return (await BlobStore_Request(store, 'getAllKeys')) || [];
  } catch (err) {
    BlobStore_WarnFallback(err);
    return Array.from(BLOBSTORE_MEM.keys());
  }
}

/** Browser storage estimate, falling back to a sum of known record sizes. */
async function BlobStore_Usage() {
  try {
    if (navigator.storage && typeof navigator.storage.estimate === 'function') {
      const est = await navigator.storage.estimate();
      return { usage: est.usage || 0, quota: est.quota || null, source: 'estimate' };
    }
  } catch (e) { /* fall through */ }
  let usage = 0;
  try {
    const store = await BlobStore_Store('readonly');
    const records = (await BlobStore_Request(store, 'getAll')) || [];
    records.forEach(r => { usage += r.size || 0; });
  } catch (err) {
    BlobStore_WarnFallback(err);
    BLOBSTORE_MEM.forEach(r => { usage += r.size || 0; });
  }
  return { usage, quota: null, source: 'records' };
}

/** Convenience: resolve a stored blob into a temporary object URL (or null). */
async function BlobStore_ObjectURL(key) {
  const record = await BlobStore_Get(key);
  if (!record || !record.blob) return null;
  return URL.createObjectURL(record.blob);
}

/** True when IndexedDB is usable (no in-memory fallback required). */
function BlobStore_Available() {
  try {
    return typeof indexedDB !== 'undefined' && indexedDB !== null;
  } catch (e) {
    return false;
  }
}


/* --- 00_Components/08_Research_Library.js --- */
/**
 * 08_Research_Library.js — Canonical cross-tab research registry for Local_HUB.
 *
 * Single source of truth for papers, books, theses, preprints and misc
 * scholarly items. Every tab (R&D, ProffTrack, Notes Library, future tabs)
 * reads/writes through this component so an item is stored exactly once in
 * the shared `<script type="application/json" id="PapersData">` vault,
 * regardless of which tab it was added from.
 *
 * Storage contract:
 *  - The vault holds METADATA ONLY (~1 KB/item). Binary attachments live in
 *    IndexedDB via 07_Blob_Store.js under `attachment.blobKey`.
 *  - `window.PapersState` mirrors the live state (Prompt.md convention).
 *  - IMPORT SAFETY: `RL_MergePapers()` / `RL_ImportSlice()` are strictly
 *    additive, id-based upserts. No code path may blind-replace `PapersData`,
 *    because single-tab exports carry only a SUBSET of the library.
 *  - CASCADE: `RL_Delete()` dispatches `localhub:paper-deleted` so R&D can
 *    purge orphan links/queue entries and ProffTrack can purge paperRefs.
 *    `RL_Upsert()` dispatches `localhub:paper-upserted` for live sync.
 *
 * All symbols are strictly `RL_` prefixed to guarantee zero top-level
 * identifier collisions with `05_R&D/00_State.js` in the flat bundle.
 */

const RL_VAULT_ID = 'PapersData';
const RL_CACHE_KEY = 'PapersData_Local_Cache';
const RL_SCHEMA_VERSION = 1;
const RL_MIGRATION_VERSION = 0; // bumped as legacy migrations ship in later phases

const RL_TYPES = ['paper', 'book', 'thesis', 'preprint', 'misc', 'software', 'web'];
const RL_STATUSES = ['wishlist', 'reading', 'read'];

const RL_State = {
  schema: RL_SCHEMA_VERSION,
  migration: 0,
  items: [],
  loaded: false
};
if (typeof window !== 'undefined') window.PapersState = RL_State;

/* ------------------------------------------------------------------ */
/* Identity & normalization helpers                                    */
/* ------------------------------------------------------------------ */
function RL_NewId() {
  return 'pap_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

/** Dedupe fingerprint: lowercase alphanumeric-only title. */
function RL_NormalizeTitle(title) {
  return String(title || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
}

/** Canonical DOI: trims resolver prefixes, lowercases. */
function RL_NormalizeDOI(doi) {
  let d = String(doi || '').trim().toLowerCase();
  d = d.replace(/^https?:\/\/(dx\.)?doi\.org\//, '');
  d = d.replace(/^doi:\s*/, '');
  return d;
}

/** Coerce any raw/imported object into a valid registry item (never throws). */
function RL_NormalizeItem(raw) {
  if (!raw || typeof raw !== 'object') return null;
  const num = v => (Number.isFinite(Number(v)) ? Number(v) : null);
  const type = RL_TYPES.includes(raw.type) ? raw.type : 'paper';
  const status = RL_STATUSES.includes(raw.status) ? raw.status : 'wishlist';
  const attachment = (raw.attachment && typeof raw.attachment === 'object')
    ? {
        name: String(raw.attachment.name || ''),
        size: Number(raw.attachment.size) || 0,
        type: String(raw.attachment.type || ''),
        blobKey: String(raw.attachment.blobKey || ''),
        // legacy base64 payloads are preserved untouched until migration moves
        // them into IndexedDB (later phases); never write new ones.
        data: typeof raw.attachment.data === 'string' ? raw.attachment.data : undefined
      }
    : null;
  const item = {
    id: String(raw.id || RL_NewId()),
    type,
    title: String(raw.title || '').trim() || 'Untitled',
    authors: Array.isArray(raw.authors) ? raw.authors.map(a => String(a)).filter(Boolean) : [],
    year: num(raw.year),
    venue: String(raw.venue || ''),
    doi: RL_NormalizeDOI(raw.doi),
    arxivId: String(raw.arxivId || ''),
    isbn: String(raw.isbn || ''),
    url: String(raw.url || ''),
    pdfUrl: String(raw.pdfUrl || ''),
    status,
    progress: Math.max(0, Math.min(100, num(raw.progress) || 0)),
    rating: num(raw.rating),
    starred: !!raw.starred,
    tags: Array.isArray(raw.tags) ? raw.tags.map(t => String(t)).filter(Boolean) : [],
    summary: String(raw.summary || ''),
    citeKey: String(raw.citeKey || ''),
    bibtex: String(raw.bibtex || ''),
    attachment,
    origin: ['rd', 'professors', 'notes'].includes(raw.origin) ? raw.origin : 'rd',
    // research-workflow fields (spec §17-18): the canonical paper carries the
    // full reading lifecycle; professors reference it via paperRefs.
    professorId: String(raw.professorId || ''),
    startedOn: String(raw.startedOn || ''),
    finishedOn: String(raw.finishedOn || ''),
    rereads: Array.isArray(raw.rereads) ? raw.rereads.map(x => String(x)).filter(Boolean) : [],
    createdAt: num(raw.createdAt) || Date.now(),
    updatedAt: num(raw.updatedAt) || Date.now()
  };
  // attachment record is dropped entirely when completely empty
  if (item.attachment && !item.attachment.blobKey && !item.attachment.data &&
      !item.attachment.name && !item.attachment.size) item.attachment = null;
  return item;
}

/* ------------------------------------------------------------------ */
/* Boot: vault load & sync                                             */
/* ------------------------------------------------------------------ */

/** Read `#PapersData` vault (embedded HTML is single source of truth). Idempotent. */
function RL_Load() {
  let payload = null;
  const tag = (typeof document !== 'undefined') ? document.getElementById(RL_VAULT_ID) : null;
  if (tag && tag.textContent) {
    try { payload = JSON.parse(tag.textContent); }
    catch (e) { console.warn('[ResearchLibrary] Vault parse failed.', e); }
  }

  // Wipe any stale leftover cache from previous files or sessions
  try {
    if (typeof localStorage !== 'undefined') {
      localStorage.removeItem(RL_CACHE_KEY);
    }
  } catch (e) { }

  RL_State.items = ((payload && Array.isArray(payload.items)) ? payload.items : [])
    .map(RL_NormalizeItem).filter(Boolean);
  RL_State.schema = (payload && payload.schema) || RL_SCHEMA_VERSION;
  RL_State.migration = (payload && typeof payload.migration === 'number') ? payload.migration : 0;
  RL_State.loaded = true;
  return RL_State;
}
function RL_EnsureLoaded() {
  if (!RL_State.loaded) RL_Load();
  return RL_State;
}

/** Serialize live state into the DOM vault + localStorage cache and mark unsaved changes. */
function RL_SyncVault() {
  const payload = JSON.stringify({
    schema: RL_State.schema,
    migration: RL_State.migration,
    items: RL_State.items
  });
  if (typeof document !== 'undefined') {
    let tag = document.getElementById(RL_VAULT_ID);
    if (!tag) {
      tag = document.createElement('script');
      tag.type = 'application/json';
      tag.id = RL_VAULT_ID;
      (document.head || document.documentElement).appendChild(tag);
    }
    tag.textContent = payload;
  }
  if (typeof window !== 'undefined') {
    window.PapersState = RL_State;
    if (typeof window.MarkUnsavedChanges === 'function') {
      window.MarkUnsavedChanges(true);
    }
  }

  catch (e) { console.warn('[ResearchLibrary] localStorage cache write failed:', e); }

}

    if (typeof localStorage !== 'undefined') {
      localStorage.removeItem(RL_CACHE_KEY);
    }
  } catch (e) { }
}

function RL_Emit(name, detail) {
  if (typeof window === 'undefined' || typeof window.dispatchEvent !== 'function') return;
  try { window.dispatchEvent(new CustomEvent('localhub:' + name, { detail })); }
  catch (e) { console.warn('[ResearchLibrary] Event dispatch failed:', e); }

/* Reads                                                               */
/* ------------------------------------------------------------------ */
function RL_All() {
  RL_EnsureLoaded();
  return RL_State.items;
}
function RL_Get(id) {
  RL_EnsureLoaded();
  return RL_State.items.find(i => i.id === id) || null;
}
function RL_FindByDOI(doi) {
  const d = RL_NormalizeDOI(doi);
  if (!d) return null;
  RL_EnsureLoaded();
  return RL_State.items.find(i => i.doi && i.doi === d) || null;
}
function RL_FindByISBN(isbn) {
  const k = String(isbn || '').replace(/[^0-9Xx]/g, '');
  if (!k) return null;
  RL_EnsureLoaded();
  return RL_State.items.find(i => i.isbn && i.isbn.replace(/[^0-9Xx]/g, '') === k) || null;
}
function RL_FindByTitle(title) {
  const t = RL_NormalizeTitle(title);
  if (!t) return null;
  RL_EnsureLoaded();
  return RL_State.items.find(i => RL_NormalizeTitle(i.title) === t) || null;
}
function RL_FindByKey(citeKey) {
  const k = String(citeKey || '').trim();
  if (!k) return null;
  RL_EnsureLoaded();
  return RL_State.items.find(i => i.citeKey && i.citeKey.toLowerCase() === k.toLowerCase()) || null;
}

/** Lightweight substring search across title/authors/tags/citeKey. */
function RL_Search(query) {
  const q = String(query || '').trim().toLowerCase();
  RL_EnsureLoaded();
  if (!q) return RL_State.items.slice();
  return RL_State.items.filter(i => {
    const hay = [i.title, i.citeKey, i.venue, (i.authors || []).join(' '), (i.tags || []).join(' ')]
      .join(' ').toLowerCase();
    return hay.includes(q);
  });
}

/* ------------------------------------------------------------------ */
/* Writes — always merge-safe, never blind-replace                     */
/* ------------------------------------------------------------------ */

function RL_SuggestCiteKey(item) {
  const first = (item.authors && item.authors[0]) ? String(item.authors[0]) : '';
  const surname = (first.split(/\s+/).pop() || 'anon').toLowerCase().replace(/[^a-z]/g, '') || 'anon';
  const year = item.year || 'nd';
  const word = (String(item.title || 'untitled').toLowerCase().replace(/[^a-z0-9 ]/g, '')
    .split(/\s+/).filter(Boolean)[0]) || 'untitled';
  return `${surname}${year}${word}`;
}

/** Guarantee a citeKey that is unique across the library (mutates item). */
function RL_EnsureUniqueCiteKey(item) {
  RL_EnsureLoaded();
  if (!item.citeKey) item.citeKey = RL_SuggestCiteKey(item);
  let base = item.citeKey;
  let n = 1;
  while (RL_State.items.some(i => i.id !== item.id &&
      i.citeKey && i.citeKey.toLowerCase() === item.citeKey.toLowerCase())) {
    n += 1;
    item.citeKey = `${base}_${n}`;
  }
  return item.citeKey;
}

/**
 * Insert or merge ONE item. Identity resolution: id → DOI → citeKey, so a
 * paper re-added from any tab MERGES into the existing entry instead of
 * duplicating it. Incoming defined fields win; `tags` are unioned.
 * @returns {{item: object, created: boolean}}
 */
function RL_Upsert(item, { origin, deferSync = false } = {}) {
  RL_EnsureLoaded();
  const norm = RL_NormalizeItem(item);
  if (!norm) throw new Error('[ResearchLibrary] Upsert requires an object');
  if (origin && ['rd', 'professors', 'notes'].includes(origin)) norm.origin = origin;
  const idx = RL_State.items.findIndex(i =>
    i.id === norm.id ||
    (norm.doi && i.doi && i.doi === norm.doi) ||
    (norm.citeKey && i.citeKey && i.citeKey.toLowerCase() === norm.citeKey.toLowerCase())
  );
  let created = false;
  let merged;
  if (idx >= 0) {
    const existing = RL_State.items[idx];
    merged = { ...existing };
    Object.keys(norm).forEach(k => {
      if (norm[k] !== undefined && norm[k] !== null && norm[k] !== '' && k !== 'id' && k !== 'createdAt') {
        merged[k] = norm[k];
      }
    });
    // union tags, keep earliest createdAt, refresh updatedAt
    merged.tags = Array.from(new Set([...(existing.tags || []), ...(norm.tags || [])]));
    merged.createdAt = existing.createdAt;
    merged.updatedAt = Date.now();
    if (existing.citeKey) merged.citeKey = existing.citeKey; // identity stays stable on merge
    if (!merged.attachment && norm.attachment) merged.attachment = norm.attachment;
    RL_State.items[idx] = RL_NormalizeItem(merged);
  } else {
    created = true;
    RL_EnsureUniqueCiteKey(norm);
    RL_State.items.push(norm);
    merged = norm;
  }
  if (!deferSync) RL_SyncVault();
  RL_Emit('paper-upserted', { id: merged.id, item: merged, created });
  return { item: merged, created };
}

/**
 * Merge an ARRAY of incoming items (the ONLY sanctioned import path).
 * Matching priority: id → DOI → citeKey (plus normalized title when opted in).
 * Never removes or truncates existing entries, so single-tab subsets cannot
 * erase the master library.
 * @param {object[]} incoming
 * @param {{byTitle?:boolean}} [opts]  also merge on normalized title (opt-in)
 * @returns {{added:number, updated:number, total:number}}
 */
function RL_MergePapers(incoming, { byTitle = false } = {}) {
  RL_EnsureLoaded();
  const stats = { added: 0, updated: 0, total: 0 };
  if (!Array.isArray(incoming)) return stats;
  incoming.forEach(raw => {
    const norm = RL_NormalizeItem(raw);
    if (!norm) return;
    stats.total += 1;
    const titleMatch = byTitle ? RL_FindByTitle(norm.title) : null;
    const result = RL_Upsert(titleMatch ? { ...norm, id: titleMatch.id } : norm, { deferSync: true });
    if (result.created) stats.added += 1;
    else stats.updated += 1;
  });
  RL_SyncVault();
  return stats;
}
function RL_Delete(id) {
  RL_EnsureLoaded();
  const idx = RL_State.items.findIndex(i => i.id === id);
  if (idx < 0) return false;
  const removed = RL_State.items[idx];
  RL_State.items.splice(idx, 1);
  RL_SyncVault();
  RL_Emit('paper-deleted', { id, item: removed });
  return true;
}

/** Explicit full reset — callers MUST confirm with the user first. */
function RL_ResetLibrary() {
  RL_EnsureLoaded();
  RL_State.items = [];
  RL_SyncVault();
  RL_Emit('paper-deleted', { id: '*', item: null });
}

/* ------------------------------------------------------------------ */
/* Import/Export slices (consumed by 04_Import_Export.js in Phase 4)   */
/* ------------------------------------------------------------------ */
function RL_ExportSlice() {
  RL_EnsureLoaded();
  return JSON.parse(JSON.stringify({ schema: RL_State.schema, migration: RL_State.migration, items: RL_State.items }));
}

/** Merge-safe import of a `Papers` slice from any JSON envelope. */
function RL_ImportSlice(slice, opts = {}) {
  if (!slice || !Array.isArray(slice.items)) return { added: 0, updated: 0, total: 0 };
  return RL_MergePapers(slice.items, opts);
}

}

/**
 * SVG-only icon button / anchor with tooltip.
 * @param {object} opts
 *  - id {string}          optional element id
 *  - icon {string}        SVG markup
 *  - tip {string}         tooltip text + aria-label (required)
 *  - variant {'ghost'|'accent'}  visual style
 *  - active {boolean}     active-state treatment (renders disabled button)
 *  - disabled {boolean}
 *  - tipSide {'top'|'left'|'right'}
 *  - href {string}        renders an <a> instead of <button>
 *  - cls {string}         extra classes
 *  - attrs {string}       raw extra attributes (data-action, data-tab, …)
 */
function GetIconButtonHTML(opts = {}) {
  EnsureIconButtonStyles();
  const {
    id = '', icon = '', tip = '', variant = 'ghost',
    active = false, disabled = false, tipSide = 'top',
    href = '', cls = '', attrs = ''
  } = opts;
  if (!tip) console.warn('[IconButton] missing tooltip — icon-only controls must be labelled');
  const classes = [
    'icb-btn',
    variant === 'accent' ? 'icb-accent' : '',
    active ? 'icb-active' : '',
    tipSide !== 'top' ? 'icb-tip-' + tipSide : '',
    cls
  ].filter(Boolean).join(' ');
  const idAttr = id ? ` id="${id}"` : '';
  const tipAttr = tip ? ` data-tip="${tip}" aria-label="${tip}"` : ' aria-label="button"';
  const stateAttrs = `${active ? ' aria-current="page"' : ''}${disabled ? ' disabled' : ''}`;
  if (href && !active && !disabled) {
    return `<a class="${classes}"${idAttr}${tipAttr} href="${href}" ${attrs}>${icon}</a>`;
  }
  return `<button type="button" class="${classes}"${idAttr}${tipAttr}${stateAttrs} ${attrs}>${icon}</button>`;
}

const ICB_NAV_TARGETS = {
  hub: null, // resolved dynamically (back to hub)
  bookmarks: '#Bookmarks',
  notes: '#Notes',
  professors: '#Professors',
  rd: '#RD'
};

/** Resolve a nav target href for the current shell context. */
function GlobalNavHref(target) {
  if (typeof window === 'undefined') return '#';
  const inTabPage = !!(window.__LOCALHUB_PAGE__ && window.__LOCALHUB_HUB_URL__);
  if (target === 'hub') return inTabPage ? window.__LOCALHUB_HUB_URL__ : '#';
  const hash = ICB_NAV_TARGETS[target] || '#';
  if (inTabPage) return window.__LOCALHUB_HUB_URL__ + hash;
  return hash;
}

/**
 * Shared global navigation cluster (Hub · Bookmarks · Notes · ProfessorTrack · R&D).
 * @param {object} opts
 *  - active {'hub'|'bookmarks'|'notes'|'professors'|'rd'|null}
 *  - accent {string} optional CSS color for --icb-accent in this cluster
 *  - cls {string} extra classes on the <nav>
 */
function GlobalNavHTML(opts = {}) {
  EnsureIconButtonStyles();
  const { active = null, accent = '', cls = '' } = opts;
  const items = [
    { key: 'hub', tip: 'Local HUB — Landing', svg: HUB_NAV_SVG, brand: true },
    { key: 'bookmarks', tip: 'Bookmarks', svg: BOOKMARK_NAV_SVG },
    { key: 'notes', tip: 'Notes', svg: NOTE_NAV_SVG },
    { key: 'professors', tip: 'ProfessorTrack', svg: SCHOLAR_CAP_SVG },
    { key: 'rd', tip: 'Research & Development', svg: FLASK_SVG }
  ];
  const styleAttr = accent ? ` style="--icb-accent:${accent}"` : '';
  const inner = items.map(it => {
    if (it.key === active) {
      // active tab: guaranteed no-op (disabled button + active treatment)
      return GetIconButtonHTML({
        icon: it.svg, tip: it.tip, active: true, disabled: true,
        cls: it.brand ? 'icb-brand' : ''
      });
    }
    return GetIconButtonHTML({
      icon: it.svg, tip: it.tip, href: GlobalNavHref(it.key),
      cls: it.brand ? 'icb-brand' : ''
    });
  }).join('');
  return `<nav class="icb-global-nav ${cls}" aria-label="Global navigation"${styleAttr}>${inner}</nav>`;
}

if (typeof window !== 'undefined') {
  window.ICB = { GetIconButtonHTML, GlobalNavHTML, GlobalNavHref, EnsureIconButtonStyles };
}
