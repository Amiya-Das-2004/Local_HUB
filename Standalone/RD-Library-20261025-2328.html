function OpenItemModal(mode, itemId, prefill) {
  const root = document.getElementById('rd-modal-root');
  if (!root) return;
  ModalCtx = { mode: mode || 'add', itemId: itemId || null, busy: false, pendingEntries: [], dupWarned: false };
  const item = itemId ? GetItem(itemId) : null;
  const fields = item ? { ...item } : Object.assign({ type: 'paper', status: 'unread', authors: [], tags: [] }, prefill || {});
  root.innerHTML = GetItemModalHTML(ModalCtx.mode, fields);
  PaintProgressSlider();
  const titleInput = document.getElementById('rd-f-title');
  if (titleInput) {
    titleInput.focus();
    if (!fields.title) titleInput.placeholder = 'Required — paste a DOI or BibTeX above to autofill, or type here';
  }
  const slider = document.getElementById('rd-f-progress');
  if (slider) {
    slider.addEventListener('input', () => {
      const pv = document.getElementById('rd-progress-val');
      if (pv) pv.textContent = slider.value + '%';
      PaintProgressSlider();
    });
  }
  if (!item && prefill && prefill.doi) {
    FetchDoiIntoModal();
  }
  const browseBtn = document.getElementById('rd-browse-local-btn');
  if (browseBtn) {
    browseBtn.addEventListener('click', async () => {
      try {
        if (typeof window.showOpenFilePicker === 'function') {
          const [handle] = await window.showOpenFilePicker();
          if (handle && handle.name) {
            const pathInp = document.getElementById('rd-f-localpath');
            if (pathInp) pathInp.value = handle.name;
          }
        } else if (typeof window.showDirectoryPicker === 'function') {
          const dirHandle = await window.showDirectoryPicker();
          if (dirHandle && dirHandle.name) {
            const pathInp = document.getElementById('rd-f-localpath');
            if (pathInp) pathInp.value = dirHandle.name;
          }
        } else {
          ShowToast('info', 'Local Path', 'Paste the full path to your local folder/file into the input field.');
        }
      } catch (e) { /* cancelled */ }
    });
  }
}
function CloseItemModal() {
  const root = document.getElementById('rd-modal-root');
  if (root) root.innerHTML = '';
  ModalCtx = { mode: 'add', itemId: null, busy: false, pendingEntries: [], dupWarned: false };
}
function ShowImportAlert(kind, html) {
  const alertEl = document.getElementById('rd-import-alert');
  if (!alertEl) return;
  alertEl.className = 'rd-alert ' + kind;
  alertEl.innerHTML = (kind === 'success' ? ICONS.check : kind === 'error' ? ICONS.alert : ICONS.info) + '<span>' + html + '</span>';
}
function FillModalFields(fields) {
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
  set('rd-f-title', fields.title || '');
  set('rd-f-type', fields.type || 'paper');
  set('rd-f-status', fields.status || 'unread');
  set('rd-f-authors', (fields.authors || []).join('; '));
  set('rd-f-journal', fields.journal || '');
  set('rd-f-volume', fields.volume || '');
  set('rd-f-issue', fields.issue || '');
  set('rd-f-pages', fields.pages || '');
  set('rd-f-year', fields.year || '');
  set('rd-f-publisher', fields.publisher || '');
  set('rd-f-doi', fields.doi || '');
  set('rd-f-tags', (fields.tags || []).join(', '));
  set('rd-f-institution', fields.institution || '');
  set('rd-f-advisor', fields.advisor || '');
  set('rd-f-localpath', fields.localPath || '');
  set('rd-f-progress', (typeof fields.progress === 'number' ? fields.progress : 0));
  const pv = document.getElementById('rd-progress-val');

}
async function FetchDoiIntoModal() {
  const doiInput = document.getElementById('rd-doi-input');
  const btn = document.getElementById('rd-fetch-doi-btn');
  if (!doiInput || ModalCtx.busy) return;
  const raw = doiInput.value.trim();
  if (!raw) {
    ShowImportAlert('error', 'Type a DOI first (e.g. 10.1002/0470841559.ch1).');
    return;
  }
  ModalCtx.busy = true;
  const oldHtml = btn.innerHTML;
  btn.innerHTML = '<span class="spin" style="display:inline-block;width:13px;height:13px;border:2px solid var(--border-light);border-top-color:var(--accent);border-radius:50%;"></span> Fetching';
  btn.disabled = true;
  try {
    const res = await LookupDOI(raw);
    FillModalFields(res.fields);
    const doiField = document.getElementById('rd-f-doi');
    if (doiField) doiField.value = res.fields.doi || raw;
    ShowImportAlert('success', '<b>Metadata loaded from ' + esc(res.source) + '.</b> Review the fields below and edit anything before saving.');
  } catch (err) {
    ShowImportAlert('error', '<b>' + esc(err.message || 'Lookup failed.') + '</b>');
  } finally {
    ModalCtx.busy = false;
    btn.disabled = false;
    btn.innerHTML = oldHtml;
  }
}
function ParseBibtexIntoModal() {
  const ta = document.getElementById('rd-bibtex-input');
  if (!ta) return;
  const text = ta.value.trim();
  if (!text) {
    ShowImportAlert('error', 'Paste a BibTeX entry first, then press Parse.');
    return;
  }
  const all = ParseBibtexAll(text);
  if (!all.length) {
    ShowImportAlert('error', 'Could not parse any BibTeX entry. Check that the text starts with @article{...}, @book{...} or @phdthesis{...}.');
    return;
  }
  FillModalFields(all[0]);
  ModalCtx.pendingEntries = all.slice(1);
  if (ModalCtx.pendingEntries.length) {
    ShowImportAlert('info', '<b>' + all.length + ' entries found.</b> The first one fills the form below; the other ' +
      ModalCtx.pendingEntries.length + ' will be imported together when you press Save.');
  } else {
    ShowImportAlert('info', '<b>BibTeX parsed.</b> Review the fields below — everything stays editable.');
  }
}
function CollectModalFields() {
  const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const authors = val('rd-f-authors')
    .split(/;|\band\b/i)
    .map((a) => a.trim()).filter(Boolean);
  const tags = val('rd-f-tags').split(',').map((t) => t.trim()).filter(Boolean);
  return {
    title: val('rd-f-title'),
    type: val('rd-f-type') || 'paper',
    status: val('rd-f-status') || 'unread',
    progress: Number(val('rd-f-progress')) || 0,
    authors,
    journal: val('rd-f-journal'),
    publisher: val('rd-f-publisher'),
    volume: val('rd-f-volume'),
    issue: val('rd-f-issue'),
    pages: val('rd-f-pages'),
    year: val('rd-f-year') ? Number(val('rd-f-year')) : null,
    doi: val('rd-f-doi'),
    tags,
    institution: val('rd-f-institution'),
    advisor: val('rd-f-advisor'),
    localPath: val('rd-f-localpath'),
    groupId: val('rd-f-group') || null
  };
}
function SaveItemFromModal() {
  const fields = CollectModalFields();
  const titleEl = document.getElementById('rd-f-title');
  if (!fields.title) {
    if (titleEl) {
      titleEl.classList.add('error');
      titleEl.focus();
      setTimeout(() => titleEl.classList.remove('error'), 1600);
    }
    ShowImportAlert('error', '<b>Paper Title is required.</b> All other fields are optional.');
    return;
  }

  // Non-blocking duplicate warning: first Save click warns, second click proceeds.
  const dups = FindDuplicates(fields, ModalCtx.itemId);
  if (dups.length && !ModalCtx.dupWarned) {
    ModalCtx.dupWarned = true;
    const names = dups.slice(0, 2).map((d) => '“' + (d.title.length > 46 ? d.title.slice(0, 46) + '…' : d.title) + '”').join(', ');
    ShowImportAlert('error', '<b>Possible duplicate:</b> ' + esc(names) + (dups.length > 2 ? ' and ' + (dups.length - 2) + ' more' : '') +
      (dups.length === 1 ? ' is already' : ' are already') + ' in your library. Press <b>' + (ModalCtx.mode === 'edit' ? 'Save Changes' : 'Save Paper') + '</b> again to add it anyway.');
    const saveBtn = document.querySelector('[data-action=save-item]');
    if (saveBtn) saveBtn.textContent = 'Save Anyway';
    return;
  }

  // ensure a clean citation key
  const RD = state.rd;
  const usedKeys = new Set(RD.items.map((i) => i.bibtexKey).filter(Boolean));
  if (ModalCtx.itemId) {
    const existing = GetItem(ModalCtx.itemId);
    if (existing && existing.bibtexKey) usedKeys.delete(existing.bibtexKey);
  }
  if (!fields.bibtexKey) fields.bibtexKey = GenerateCitationKey(fields, usedKeys);

  let extraCount = 0;
  if (ModalCtx.mode === 'edit' && ModalCtx.itemId) {
    UpdateItem(ModalCtx.itemId, fields);
    ShowToast('success', 'Paper updated', fields.title);
  } else {
    AddItem(fields, { groupId: fields.groupId });
    ShowToast('success', 'Paper added to library', fields.title);
  }
  // bulk entries parsed from a multi-entry BibTeX paste
  if (ModalCtx.pendingEntries && ModalCtx.pendingEntries.length) {
    const used = new Set(state.rd.items.map((i) => i.bibtexKey).filter(Boolean));
    const extras = ModalCtx.pendingEntries.filter((pe) => {
      if (pe.title && FindDuplicates({ doi: pe.doi, title: pe.title }).length) return false;
      return true;
    });
    extras.forEach((pe) => { if (!pe.bibtexKey) pe.bibtexKey = GenerateCitationKey(pe, used); });
    if (extras.length) {
      AddItems(extras);
      extraCount = extras.length;
      ShowToast('info', extraCount + ' extra BibTeX entr' + (extraCount === 1 ? 'y' : 'ies') + ' imported', 'Parsed from the same paste.');
    }
  }
  CloseItemModal();
  if (window.RDUI && typeof window.RDUI.RenderAll === 'function') {
    window.RDUI.RenderAll();
  }
}
async function CopyBibtexFromModal() {
  const fields = CollectModalFields();
  if (!fields.title) {
    ShowToast('error', 'Nothing to copy', 'Enter at least a title before generating BibTeX.');
    return;
  }
  const bib = ItemToBibtex(fields);
  const ok = await CopyToClipboard(bib);
  if (ok) ShowToast('success', 'BibTeX copied', fields.bibtexKey || fields.title);
  else ShowToast('error', 'Copy failed', 'Browser blocked clipboard access.');
}

if (typeof window !== 'undefined') {
  window.RDItemModal = {
    GetItemModalHTML,
    OpenItemModal,
    CloseItemModal,
    FetchDoiIntoModal,
    ParseBibtexIntoModal,
    SaveItemFromModal,
    CopyBibtexFromModal,
    PaintProgressSlider
  };
}

function OpenDrawer(id) {

    const backdrop = root.querySelector('.rd-drawer-backdrop');

function CloseDrawer() {

  if (!root || !root.innerHTML) return;
  const backdrop = root.querySelector('.rd-drawer-backdrop');
  const panel = root.querySelector('.rd-drawer');

  if (panel) panel.classList.remove('show');

function RefreshDrawer() {
  if (!DrawerItemId) return;
  const item = GetItem(DrawerItemId);

  if (!item || !root) {
    DrawerItemId = null;
    if (window.RDDrawer) window.RDDrawer.DrawerItemId = null;

    return;
  }
  root.innerHTML = GetDrawerHTML(item);

function WireDrawer(id) {
  const input = document.getElementById('rd-drawer-tag-input');
  if (input) {
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const tag = input.value.trim().replace(/^#/, '');
      if (!tag) return;
      const item = GetItem(id);
      if (!item) return;
      const tags = Array.from(new Set([...(item.tags || []), tag]));
      UpdateItem(id, { tags });
      if (window.RDUI && typeof window.RDUI.RenderAll === 'function') window.RDUI.RenderAll();
      RefreshDrawer();
      const ni = document.getElementById('rd-drawer-tag-input');
      if (ni) ni.focus();
    });
  }
  const slider = document.getElementById('rd-drawer-progress');
  if (slider) {
    slider.addEventListener('input', () => {
      const v = document.getElementById('rd-drawer-progress-val');
      if (v) v.textContent = slider.value + '%';
      slider.style.setProperty('--fill', slider.value + '%');
    });
    slider.addEventListener('change', () => {
      const p = Number(slider.value);
      const patch = { progress: p };
      if (p >= 100) patch.status = 'read';
      else if (p > 0 && GetItem(id) && GetItem(id).status === 'unread') patch.status = 'reading';
      UpdateItem(id, patch);
      if (window.RDUI && typeof window.RDUI.RenderAll === 'function') window.RDUI.RenderAll();
      RefreshDrawer();
    });
  }
  // local notes: debounced auto-save that does NOT re-render (keeps caret)
  const notes = document.getElementById('rd-drawer-notes');
  if (notes) {
    let timer = null;
    const statusEl = document.getElementById('rd-drawer-notes-status');
    const countEl = document.getElementById('rd-drawer-notes-count');
    const setSaved = () => { if (statusEl) { statusEl.textContent = 'Saved ✓'; statusEl.classList.add('saved'); } };
    notes.addEventListener('input', () => {
      if (statusEl) { statusEl.textContent = 'Saving…'; statusEl.classList.remove('saved'); }
      if (countEl) countEl.textContent = notes.value.length + ' chars';
      clearTimeout(timer);
      timer = setTimeout(() => {
        const it = GetItem(id);
        if (!it) return;
        it.notes = notes.value;
        it.updatedAt = new Date().toISOString();
        SaveQuiet();
        setSaved();
      }, 500);
    });
    notes.addEventListener('blur', () => {
      clearTimeout(timer);
      const it = GetItem(id);
      if (it && it.notes !== notes.value) {
        it.notes = notes.value;
        it.updatedAt = new Date().toISOString();
        SaveQuiet();
      }
      setSaved();
    });
  }
}

if (typeof window !== 'undefined') {
  window.RDDrawer = {
    DrawerItemId,
    GetDrawerHTML,
    OpenDrawer,
    CloseDrawer,
    RefreshDrawer,
    WireDrawer,
    HandleNotesOpen
  };
}

  if (!root) return;

  root.innerHTML = GetQueueHTML();
}
function InitQueueDnD() {
  const root = document.getElementById('rd-queue-root');
  if (!root) return;
  let draggedId = null;
  root.addEventListener('dragstart', (e) => {
    const row = e.target.closest('[data-queue-drag]');
    if (!row) return;
    draggedId = row.dataset.queueDrag;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', 'q:' + draggedId);
  });
  root.addEventListener('dragend', () => {
    root.querySelectorAll('.dragging, .drop-before, .drop-after').forEach((el) => {
      el.classList.remove('dragging', 'drop-before', 'drop-after');
    });
    draggedId = null;
  });
  root.addEventListener('dragover', (e) => {
    if (!draggedId) return;
    const row = e.target.closest('[data-queue-drag]');
    if (row && row.dataset.queueDrag !== draggedId) {
      e.preventDefault();
      const r = row.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height / 2;
      row.classList.toggle('drop-after', after);
      row.classList.toggle('drop-before', !after);
    }
  });
  root.addEventListener('dragleave', (e) => {
    const row = e.target.closest && e.target.closest('[data-queue-drag]');
    if (row) row.classList.remove('drop-before', 'drop-after');
  });
  root.addEventListener('drop', (e) => {
    if (!draggedId) return;
    e.preventDefault();
    const row = e.target.closest('[data-queue-drag]');
    if (row && row.dataset.queueDrag !== draggedId) {
      const current = QueueItems().map((i) => i.id);
      const order = current.filter((id) => id !== draggedId);
      const tIdx = order.indexOf(row.dataset.queueDrag);
      const r = row.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height / 2;
      order.splice(after ? tIdx + 1 : tIdx, 0, draggedId);
      SetQueueOrder(order);
      RenderQueue();
    }
  });
}
function InitQueue() {
  InitQueueDnD();
}

if (typeof window !== 'undefined') {
  window.RDQueuePanel = {
    GetQueueHTML,
    ToggleQueue,
    CloseQueue,
    RenderQueue,
    InitQueueDnD,
    InitQueue
  };
}

function DonutSVG(stats) {
  const total = stats.total || 1;
  const segs = [
    { n: stats.read, color: 'var(--green)' },
    { n: stats.reading, color: 'var(--yellow)' },
    { n: stats.unread, color: 'var(--text-dim)' }
  ].filter((s) => s.n > 0);
  const C = 2 * Math.PI * 15.9155;
  let offset = 25; // start at 12 o'clock
  const circles = segs.map((s) => {
    const frac = s.n / total;
    const dash = `${frac * C} ${C - frac * C}`;
    const el = `<circle class="donut-seg" r="15.9155" cx="21" cy="21" fill="none" stroke="${s.color}" stroke-width="5.5"
         stroke-dasharray="${dash}" stroke-dashoffset="${offset}" stroke-linecap="butt"><title>${s.n} item(s)</title></circle>`;
    offset -= frac * 100;
    return el;
  }).join(' ');
  return `<svg class="rd-stats-donut" viewBox="0 0 42 42" width="120" height="120" role="img" aria-label="Reading status donut">
    <circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--border)" stroke-width="5.5"></circle>
    ${circles}
    <text x="21" y="20" class="donut-num">${stats.total}</text>
    <text x="21" y="26" class="donut-cap">items</text>
  </svg>`;
}
function GetStatsPopoverHTML() {
  const items = GetAllItems();
  const stats = Stats();
  const legend = [
    { label: 'Read', n: stats.read, cls: 'read' },
    { label: 'Reading', n: stats.reading, cls: 'reading' },
    { label: 'Unread', n: stats.unread, cls: 'unread' }
  ].map((l) => `<span class="rd-stats-legend-item"><span class="rd-status-dot ${l.cls}"></span>${l.label}<b>${l.n}</b></span>`).join('');

  const maxType = Math.max(1, stats.papers, stats.books, stats.theses);
  const typeBars = [
    { label: 'Papers', n: stats.papers, icon: ICONS.file },
    { label: 'Books', n: stats.books, icon: ICONS.book },
    { label: 'Thesis', n: stats.theses, icon: ICONS.grad }
  ].map((t) => `<div class="rd-stats-bar-row" title="${t.n} ${t.label.toLowerCase()}">
      <span class="rd-stats-bar-label">${t.icon}${t.label}</span>
      <span class="rd-stats-bar-track"><span class="rd-stats-bar-fill" style="width:${Math.round((t.n / maxType) * 100)}%"></span></span>
      <b class="rd-stats-bar-n">${t.n}</b>
    </div>`).join('');

  // top tags
  const tagCount = new Map();
  items.forEach((it) => (it.tags || []).forEach((t) => tagCount.set(t, (tagCount.get(t) || 0) + 1)));
  const topTags = Array.from(tagCount.entries()).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const tagChips = topTags.length
    ? topTags.map(([t, n]) => `<button class="rd-tag-pill" data-action="filter-tag" data-tag="${esc(t)}" title="Show items tagged “${esc(t)}”">#${esc(t)}<b>${n}</b></button>`).join('')
    : '<span class="rd-stats-empty">No tags yet</span>';

  // year histogram
  const yearCount = new Map();
  items.forEach((it) => {
    const y = it.year || '????';
    yearCount.set(y, (yearCount.get(y) || 0) + 1);
  });
  const years = Array.from(yearCount.entries()).sort((a, b) => {
    /* Unknown-year bucket ('????') sorts last so it can neither appear as the
       newest year nor displace a real year from the recent-12 window. */
    const ya = a[0] === '????' ? Infinity : Number(a[0]);
    const yb = b[0] === '????' ? Infinity : Number(b[0]);
    return (ya - yb) || String(a[0]).localeCompare(String(b[0]));
  }).slice(-12);
  const maxY = Math.max(1, ...years.map(([, n]) => n));
  const histogram = years.map(([y, n]) =>
    `<div class="rd-stats-year" title="${y}: ${n} item(s)">
      <span class="rd-stats-year-bar" style="height:${Math.max(8, Math.round((n / maxY) * 46))}px"></span>
      <span class="rd-stats-year-label">${esc(String(y))}</span>
    </div>`).join('');

  return `
    <div class="rd-stats-popover" role="dialog" aria-label="Library statistics">
      <div class="rd-stats-head">Library statistics</div>
      <div class="rd-stats-grid">
        <div class="rd-stats-cell">
          ${DonutSVG(stats)}
          <div class="rd-stats-legend">${legend}</div>
        </div>
        <div class="rd-stats-cell">
          <div class="rd-stats-cell-title">By type</div>

          <div class="rd-stats-cell-title" style="margin-top:14px;">Avg progress</div>

      ${years.length ? `<div class="rd-stats-cell-title" style="margin-top:10px;">Published per year</div><div class="rd-stats-years">${histogram}</div>` : ''}
    </div>`;
}

function GetMergeHTML() {
  const FIELDS = [
    ['title', 'Title'], ['authors', 'Authors'], ['type', 'Type'], ['journal', 'Journal / venue'],
    ['volume', 'Volume'], ['issue', 'Issue'], ['pages', 'Pages'], ['year', 'Year'],
    ['publisher', 'Publisher'], ['doi', 'DOI'], ['url', 'URL'], ['bibtexKey', 'Citation key']
  ];
  const primary = GetItem(MergeCtx.primaryId);
  const secondaries = MergeCtx.secondaryIds.map((id) => GetItem(id)).filter(Boolean);
  if (!primary || !secondaries.length) return '';
  const participants = [primary].concat(secondaries);
  const fmt = (v) => {
    if (Array.isArray(v)) return v.join('; ');
    if (v === null || v === undefined || v === '') return '<i class="dup-empty">empty</i>';
    return esc(String(v));
  };
  const nonEmpty = (v) => v !== null && v !== undefined && String(v) !== '' && !(Array.isArray(v) && !v.length);
  const shortName = (it, idx) => idx === 0 ? 'Survivor' : 'Alt ' + idx + ' — ' + (String(it.title).length > 22 ? String(it.title).slice(0, 22) + '…' : it.title);

  const chips = participants.map((it, idx) => `
    <div class="merge-chip ${idx === 0 ? 'winner' : ''}">
      <span class="merge-side">${idx === 0 ? 'Survivor' : 'Merged'}</span>
      <span class="merge-chip-title" title="${esc(it.title)}">${esc(it.title)}</span>
      <span class="merge-chip-meta">${esc([(it.authors || []).slice(0, 1).join('; '), it.year || ''].filter(Boolean).join(' · '))}</span>
      ${idx > 0 ? `<button class="merge-chip-x" data-action="merge-drop" data-id="${it.id}" title="Keep this paper out of the merge" aria-label="Exclude ${esc(it.title)}">${ICONS.x}</button>` : ''}
    </div>`).join('');

  const fieldRows = FIELDS.map(([key, label]) => {
    const vals = participants.map((p) => JSON.stringify(p[key] ?? null));
    const allSame = vals.every((x) => x === vals[0]);
    if (allSame && !nonEmpty(participants[0][key])) return ''; // all empty — skip
    if (allSame) return `<div class="merge-row same"><span class="merge-label">${label}</span><span class="merge-val full">${fmt(participants[0][key])}</span></div>`;
    let defIdx = participants.findIndex((p) => nonEmpty(p[key]));
    if (defIdx === -1) defIdx = 0;
    const opts = participants.map((p, idx) =>
      `<option value="${idx === 0 ? 'primary' : 'sec:' + p.id}" ${idx === defIdx ? 'selected' : ''}>${esc(shortName(p, idx))}: ${esc(Array.isArray(p[key]) ? p[key].join('; ') : String(p[key] ?? ''))}</option>`).join('');
    return `
      <div class="merge-row">
        <span class="merge-label">${label}</span>
        <select class="rd-select merge-select" name="mf-${key}">${opts}</select>
      </div>`;
  }).join('');

  const statVal = (it) => (STATUS_LABEL[it.status] || 'Unread') + ' · ' + (it.progress || 0) + '%';
  const statusAllSame = participants.every((p) => p.status === primary.status && (p.progress || 0) === (primary.progress || 0));
  const statusRow = statusAllSame
    ? `<div class="merge-row status"><span class="merge-label">Reading status</span><span class="merge-val full">${statVal(primary)}</span></div>`
    : (() => {
        const rank = { read: 2, reading: 1, unread: 0 };
        let defIdx = 0, best = -1;
        participants.forEach((p, idx) => { const s = (rank[p.status] || 0) * 1000 + (p.progress || 0); if (s > best) { best = s; defIdx = idx; } });
        const opts = participants.map((p, idx) =>
          `<option value="${idx === 0 ? 'primary' : 'sec:' + p.id}" ${idx === defIdx ? 'selected' : ''}>${esc(shortName(p, idx))}: ${esc(statVal(p))}</option>`).join('');
        return `<div class="merge-row status"><span class="merge-label">Reading status</span><select class="rd-select merge-select" name="mf-status">${opts}</select></div>`;
      })();

  const allTags = (() => {
    const seen = new Map();
    participants.forEach((i) => (i.tags || []).forEach((t) => { const k = String(t).toLowerCase(); if (!seen.has(k)) seen.set(k, t); }));
    return [...seen.values()];
  })();

  const notesRows = secondaries.filter((s) => String(s.notes || '').trim())
    .map((s) => `
      <label class="merge-notes-row">
        <input type="checkbox" data-notes-for="${s.id}" checked />
        <span>Append notes from <b>${esc(String(s.title).length > 34 ? String(s.title).slice(0, 34) + '…' : s.title)}</b> <span class="merge-notes-sub">(rule-separated — nothing is deleted)</span></span>
      </label>`).join('');

  return `
    <div class="modal-overlay" id="rd-merge-modal">
      <div class="modal-card merge" role="dialog" aria-modal="true" aria-label="Merge duplicate papers">
        <div class="modal-header">
          <h3>${ICONS.link} Merge ${participants.length} papers</h3>
          <button class="icon-btn" data-action="close-modal" title="Close">&times;</button>
        </div>
        <div class="modal-body">
          <p class="dup-intro">One card survives — it keeps its id, group and mind-map links. Pick a source per field; tags are combined; notes are appended, never deleted. <b>Undo</b> is one click away.</p>
          <div class="merge-chips">${chips}</div>
          <div class="merge-fields">${fieldRows}</div>
          ${statusRow}
          <div class="merge-extras">
            <div class="merge-tags-row"><span class="merge-label">Tags</span><span class="merge-tags">${allTags.map((t) => `<span class="rd-tag-pill">#${esc(t)}</span>`).join('') || '<i class="dup-empty">none</i>'}</span></div>
            ${notesRows}
          </div>
        </div>
        <div class="modal-footer">
          <button class="ghost-btn" data-action="close-modal">Cancel</button>
          <button class="primary-btn" data-action="merge-confirm">${ICONS.link}<span>Merge ${participants.length} → 1</span></button>
        </div>
      </div>
    </div>
  `;
}

/* Dispatch a delegated action even when its footer button no longer exists:
   the hub dispatcher handles it directly, and the tab shell's capture-phase
   override (Tab_Import_Export_Handler) still gets to intercept it. */
function DispatchAction(action) {
  const existing = document.querySelector(`[data-action="${action}"]`);
  if (existing) { existing.click(); return; }
  const tmp = document.createElement('button');
  tmp.type = 'button';
  tmp.setAttribute('data-action', action);
  tmp.style.display = 'none';
  document.body.appendChild(tmp);
  tmp.click();
  tmp.remove();
}

}
function BuildPaletteEntries(query) {
  const q = String(query || '').trim().toLowerCase();
  const norm = (s) => String(s || '').toLowerCase();
  const score = (hay) => {
    if (!q) return 1;
    const idx = norm(hay).indexOf(q);
    if (idx === -1) {
      let i = 0;
      const h = norm(hay);
      for (const c of q) { i = h.indexOf(c, i); if (i === -1) return -1; i++; }
      return 0.4;
    }
    return idx === 0 ? 1 : 0.7;
  };
  const actions = PaletteActions()
    .map((a) => ({ kind: 'action', icon: a.icon, label: a.label, hint: a.hint, kbd: a.kbd, run: a.run, _s: score(a.label) }))
    .filter((a) => a._s >= 0)
    .sort((a, b) => b._s - a._s)
    .slice(0, q ? 6 : 10);
  const items = GetAllItems()
    .map((it) => {
      const hay = it.title + ' ' + (it.authors || []).join(' ') + ' ' + (it.journal || '') + ' #' + (it.tags || []).join(' #');
      const s = score(it.title) * 2 + score(hay);
      return { kind: 'item', id: it.id, icon: TYPE_ICON[it.type] || 'file', label: it.title, hint: [it.year || '', STATUS_LABEL[it.status]].filter(Boolean).join(' · '), run: () => OpenDrawer(it.id), _s: s };
    })
    .filter((e) => e._s > 0)
    .sort((a, b) => b._s - a._s)
    .slice(0, q ? 8 : 6);
  return actions.concat(items);
}
function RenderPalette() {
  const root = document.getElementById('rd-palette-root');
  if (!root) return;
  if (!PaletteState.open) { root.innerHTML = ''; return; }
  PaletteState.entries = BuildPaletteEntries(PaletteState.query);
  if (PaletteState.active >= PaletteState.entries.length) PaletteState.active = Math.max(0, PaletteState.entries.length - 1);
  if (PaletteState.active < 0) PaletteState.active = 0;
  let lastKind = null;
  const rows = PaletteState.entries.map((en, i) => {
    const groupHead = en.kind !== lastKind
      ? `<div class="pal-group-head">${en.kind === 'action' ? 'Actions' : 'Jump to a paper'}</div>`
      : '';
    lastKind = en.kind;
    return groupHead + `
      <button class="pal-row ${i === PaletteState.active ? 'active' : ''}" data-pal-idx="${i}" type="button">
        <span class="pal-icon">${ICONS[en.icon] || ICONS.info}</span>
        <span class="pal-label">${esc(en.label)}</span>
        ${en.hint ? `<span class="pal-hint">${esc(en.hint)}</span>` : ''}
        ${en.kbd ? `<kbd class="pal-kbd">${esc(en.kbd)}</kbd>` : ''}
      </button>`;
  }).join('');
  root.innerHTML = `
    <div class="pal-overlay" data-action="close-palette">
      <div class="pal-panel" role="dialog" aria-modal="true" aria-label="Command palette">
        <div class="pal-input-row">
          ${ICONS.search}
          <input id="pal-input" type="text" placeholder="Search papers, run a command…" autocomplete="off" spellcheck="false"
                 value="${esc(PaletteState.query)}" />
          <kbd class="pal-kbd esc">esc</kbd>
        </div>
        <div class="pal-list" id="pal-list">
          ${rows || '<div class="pal-empty">Nothing matches “' + esc(PaletteState.query) + '”</div>'}
        </div>
        <div class="pal-foot">
          <span><kbd class="pal-kbd">↑</kbd><kbd class="pal-kbd">↓</kbd> navigate</span>
          <span><kbd class="pal-kbd">↵</kbd> run</span>
          <span><kbd class="pal-kbd">esc</kbd> close</span>
          <span class="pal-brand">R&amp;D command palette</span>
        </div>
      </div>
    </div>
  `;
  const input = document.getElementById('pal-input');
  if (input) {
    input.addEventListener('input', () => {
      PaletteState.query = input.value;
      PaletteState.active = 0;

    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowDown') { e.preventDefault(); PaletteState.active = Math.min(PaletteState.entries.length - 1, PaletteState.active + 1); RenderPalette(); FocusPaletteActive(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); PaletteState.active = Math.max(0, PaletteState.active - 1); RenderPalette(); FocusPaletteActive(); }
      else if (e.key === 'Enter') { e.preventDefault(); PaletteRun(PaletteState.active); }
      else if (e.key === 'Escape') { e.preventDefault(); ClosePalette(); }
    });

  }
  root.querySelectorAll('.pal-row').forEach((row) => {
    row.addEventListener('mouseenter', () => {
      const idx = Number(row.dataset.palIdx);
      if (idx !== PaletteState.active) {
        PaletteState.active = idx;

  });
}

function PaletteRun(idx) {

function OpenPalette() {

/* Global keydown binds once per page load — initRDApp re-runs on every tab
   re-entry, and duplicated handlers made Ctrl+K open-then-close the palette.
   Flag on window: standalone bundles re-declare module lets per route change. */
function InitGlobalKeys() {
  if (typeof window === 'undefined' || window.__RD_GLOBAL_KEYS_BOUND__) return;
  window.__RD_GLOBAL_KEYS_BOUND__ = true;
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      e.stopPropagation();
      if (PaletteState.open) ClosePalette(); else OpenPalette();
      return;
    }
    if (e.key === 'Escape') {
      if (PaletteState.open) { ClosePalette(); return; }
      const overlayOpen = !!document.querySelector('#rd-modal-root .modal-overlay, #rd-confirm-root .modal-overlay');
      const drawerOpen = !!document.querySelector('#rd-drawer-root .rd-drawer-backdrop');
      if (window.RDUI && window.RDUI.SelectedIds && window.RDUI.SelectedIds.size && !overlayOpen && !drawerOpen) {
        if (typeof window.RDUI.ClearSelection === 'function') {
          window.RDUI.ClearSelection();
          return;
        }
      }
      CloseItemModal();
      SettleConfirm(false);
      CloseDrawer();
      CloseQueue();
      CloseStatsPopover();
      CloseHelpPanel(false);
      CloseGoalModal();
      CloseLinkFloatingPanel();
      const dd = document.getElementById('sections-dropdown-window');
      if (dd) dd.classList.add('hidden');
      return;
    }
    const t = e.target;
    const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
    if (e.key === '/' && !e.metaKey && !e.ctrlKey && !typing) {
      e.preventDefault();
      const s = document.getElementById('rd-search-input');
      if (s) s.focus();
      return;
    }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Enter' && t && t.closest) {
      const card = t.closest('.rd-item-card, .rd-node-card');
      if (card && card.dataset.itemId) {
        e.preventDefault();
        OpenDrawer(card.dataset.itemId);
        return;
      }
    }
    if (e.key === 'n' || e.key === 'N') {
      e.preventDefault();
      OpenItemModal('add');
      return;
    }
    if (e.key === 'q' || e.key === 'Q') {
      e.preventDefault();
      ToggleQueue();
      return;
    }
    if (e.key === 'f' || e.key === 'F') {
      const tab = (window.RDUI && window.RDUI.CurrentTabName) ? window.RDUI.CurrentTabName() : 'list';
      if (tab === 'timeline' || tab === 'map' || tab === 'group') {
        e.preventDefault();
        if (window.RDUI && typeof window.RDUI.FitView === 'function') window.RDUI.FitView(tab);
      }
      return;
    }
    if (e.key === 'm' || e.key === 'M') {
      const tab = (window.RDUI && window.RDUI.CurrentTabName) ? window.RDUI.CurrentTabName() : 'list';
      if (tab === 'timeline' || tab === 'map' || tab === 'group') {
        e.preventDefault();
        if (window.RDUI && typeof window.RDUI.ToggleMinimap === 'function') window.RDUI.ToggleMinimap(tab);
      }
      return;
    }
    if (e.key === 'h' || e.key === 'H') {
      e.preventDefault();
      OpenHealthModal('ALL');
      return;
    }
    const tabIndex = { '1': 'list', '2': 'timeline', '3': 'map' }[e.key]; /* group view was removed — key 4 intentionally unbound */
    if (tabIndex) {
      e.preventDefault();
      if (window.RDUI && typeof window.RDUI.SwitchTab === 'function') window.RDUI.SwitchTab(tabIndex);
      return;
    }
    if (e.key === '?') {
      e.preventDefault();
      ShowHelpPanel();
    }
  });
}

if (typeof window !== 'undefined') {

function renderMathPreview(text) {
  if (!text) return '';
  let rendered = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  if (typeof window.katex !== 'undefined') {
    // 1. Block Display Math $$$$ ... $$$$
    rendered = rendered.replace(/\$\$\$\$([\s\S]+?)\$\$\$\$/g, (m, expr) => {
      try { return window.katex.renderToString(expr.trim(), { displayMode: true, throwOnError: false }); }
      catch (e) { return `<div>${expr.trim()}</div>`; }
    });
    // 2. Inline Math $$ ... $$
    rendered = rendered.replace(/\$\$([\s\S]+?)\$\$/g, (m, expr) => {
      try { return window.katex.renderToString(expr.trim(), { displayMode: false, throwOnError: false }); }
      catch (e) { return `<span>${expr.trim()}</span>`; }
    });
    // 3. Single $ ... $ Inline Math
    rendered = rendered.replace(/\$([^\$]+)\$/g, (m, expr) => {
      try { return window.katex.renderToString(expr.trim(), { displayMode: false, throwOnError: false }); }
      catch (e) { return `<span>${expr.trim()}</span>`; }
    });
  }
  return rendered;
}

      dot.style.cursor = 'pointer';
      dot.title = c;
      dot.onclick = () => {

        saveRealtime();

}
function CloseLinkFloatingPanel() {
  const panel = document.getElementById('rdLinkFloatingWindow');
  if (panel) panel.classList.add('hidden');
  currentLinkId = null;
}
function InitLinkModal() {
  const panel = document.getElementById('rdLinkFloatingWindow');
  if (!panel) return;

  const btnCurve = document.getElementById('btnLinkStyleCurve');
  if (btnCurve) {
    btnCurve.onclick = () => {
      currentStyle = 'curve';
      updateUIState();
      saveRealtime();
    };
  }

  const btnStraight = document.getElementById('btnLinkStyleStraight');
  if (btnStraight) {
    btnStraight.onclick = () => {
      currentStyle = 'straight';
      updateUIState();
      saveRealtime();
    };
  }

  document.querySelectorAll('#rdLinkFloatingWindow [data-dir]').forEach((btn) => {
    btn.onclick = () => {
      currentDirection = btn.dataset.dir;
      updateUIState();
      saveRealtime();
    };
  });

  document.querySelectorAll('#rdLinkFloatingWindow .shape-opt-btn').forEach((btn) => {
    btn.onclick = () => {
      currentShape = btn.dataset.shape;
      updateUIState();
      saveRealtime();
    };
  });

  const labelInput = document.getElementById('rdLinkLabelInput');
  const labelPreview = document.getElementById('rdLinkLabelPreview');
  if (labelInput) {
    labelInput.oninput = (e) => {
      autoGrowTextarea(e.target);
      if (labelPreview) labelPreview.innerHTML = renderMathPreview(e.target.value);
      saveRealtime();
    };
  }

  const doneBtn = document.getElementById('rdLinkPanelDone');
  if (doneBtn) {
    doneBtn.onclick = () => {
      saveRealtime();
      CloseLinkFloatingPanel();
      ShowToast('success', 'Link updated', 'Settings and note saved to mind map.');
    };
  }

  const closeBtn = document.getElementById('rdLinkPanelClose');
  if (closeBtn) {
    closeBtn.onclick = () => {
      CloseLinkFloatingPanel();
    };
  }

  const deleteBtn = document.getElementById('rdLinkPanelDelete');
  if (deleteBtn) {
    deleteBtn.onclick = () => {
      if (!currentLinkId) return;
      if (confirm('Delete this connection between papers?')) {
        DeleteLink(currentLinkId);
        CloseLinkFloatingPanel();
        RenderMap();
        ShowToast('info', 'Link deleted', 'Connection removed.');
      }
    };
  }

  // Draggable header
  const header = document.getElementById('rdLinkPanelHeader');
  if (header) {
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;

    header.onmousedown = (e) => {
      if (e.target.closest('button')) return;
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      const rect = panel.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;
      panel.style.right = 'auto';
      panel.style.left = initialLeft + 'px';
      panel.style.top = initialTop + 'px';

      const onMouseMove = (ev) => {
        if (!isDragging) return;
        const dx = ev.clientX - startX;
        const dy = ev.clientY - startY;
        panel.style.left = (initialLeft + dx) + 'px';
        panel.style.top = (initialTop + dy) + 'px';
      };

      const onMouseUp = () => {
        isDragging = false;
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
      };

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    };
  }
}

    InitLinkModal,

  };
  window.openLinkFloatingPanel = OpenLinkFloatingPanel;

}

function StripModuleSyntax(code) {
  code = code.replace(/^\s*import\s+[\s\S]*?from\s+['"][^'"]+['"];?\s*$/gm, '');
  code = code.replace(/^\s*import\s+['"][^'"]+['"];?\s*$/gm, '');
  code = code.replace(/^\s*export\s+\*[\s\S]*?from\s+['"][^'"]+['"];?\s*$/gm, '');
  code = code.replace(/^\s*export\s*\{[\s\S]*?\}\s*from\s+['"][^'"]+['"];?\s*$/gm, '');
  code = code.replace(/^\s*export\s*\{[\s\S]*?\};?\s*$/gm, '');
  code = code.replace(/^\s*export\s+default\s+/gm, '');
  code = code.replace(/^\s*export\s+(async\s+)?(function|const|let|var|class)/gm, (m, p1, p2) => (p1 || '') + p2);
  code = code.replace(/<\/script/gi, '<\\/script');
  return code;
}

async function FetchBundle(files) {
  let out = '';
  for (const f of files) {
    try {
      const res = await fetch(new URL('../../' + f, import.meta.url).href);
      if (!res.ok) { console.warn('[R&D builder] missing ' + f + ' (' + res.status + ')'); continue; }
      const code = await res.text();
      if (!code.trim()) continue;
      out += '\n/* --- ' + f + ' --- */\n' + StripModuleSyntax(code) + '\n';
    } catch (e) {
      console.warn('[R&D builder] fetch failed for ' + f + ':', e);
    }
  }
  return out;
}

async function DownloadStandaloneHTML() {
  const rd = state.rd;
  rd.meta.exportedAt = new Date().toISOString();
  rd.meta.exportCount = (rd.meta.exportCount || 0) + 1;

  ShowToast('info', 'Building standalone HTML', 'Bundling app + CSS + modules + your data…');

    const a = document.createElement('a');
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    a.href = url;
    a.download = 'RD-Library-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    ShowToast('success', 'Standalone HTML saved', 'One file: app + library. Open it anywhere, keep editing, export again.');
  } catch (err) {
    console.error('[R&D] standalone export failed:', err);
    ShowToast('error', 'Export failed', err.message || 'Could not bundle application sources.');
  }
}

function DownloadTextFile(filename, text, mime) {
  const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function DownloadBibtexFile(opts) {
  try {
    const mode = (opts && opts.mode) || 'all';
    let items;
    let label;
    if (mode === 'ids') {
      const ids = (opts && opts.ids) || [];
      items = GetAllItems().filter((i) => ids.indexOf(i.id) !== -1);
      label = 'selection';
    } else if (mode === 'visible') {
      items = VisibleItems();
      label = 'current filters';
    } else {
      items = GetAllItems();
      label = 'library';
    }
    if (!items.length) {
      ShowToast('error', 'Nothing to export', mode === 'all' ? 'Add some papers first.' : 'No items match — loosen the filters first.');
      return;
    }
    const body = ItemsToBibtexFile(items);
    const header = '% R&D Library — exported ' + new Date().toISOString().slice(0, 10) +
      '\n% ' + items.length + ' entr' + (items.length === 1 ? 'y' : 'ies') + ' (' + label + ')\n\n';
    const suffix = mode === 'all' ? '' : '-filtered';
    DownloadTextFile('rd-library' + suffix + '.bib', header + body + '\n', 'text/x-bibtex;charset=utf-8');
    ShowToast('success', 'BibTeX file saved', items.length + ' entr' + (items.length === 1 ? 'y' : 'ies') + ' (' + label + ') → rd-library' + suffix + '.bib');
  } catch (err) {
    ShowToast('error', 'BibTeX export failed', err.message);
  }
}
function CopyBibtexForSelection(ids) {
  const items = GetAllItems().filter((i) => (ids || []).indexOf(i.id) !== -1);
  if (!items.length) {
    ShowToast('error', 'Nothing selected', 'Select some cards first, then copy their citations.');
    return Promise.resolve(false);
  }
  EnsureKeys(items);
  items.forEach((it) => { if (it.bibtexKey) UpdateItem(it.id, { bibtexKey: it.bibtexKey }, { silent: true }); });
  const text = ItemsToBibtexFile(items);
  return CopyToClipboard(text).then((ok) => {
    if (ok) ShowToast('success', items.length + ' citation' + (items.length === 1 ? '' : 's') + ' copied', 'BibTeX for the whole selection is on your clipboard.');
    else ShowToast('error', 'Copy failed', 'Your browser blocked clipboard access — try again or use the per-item copy button.');
    return ok;
  });
}
function DownloadJSON() {
  try {
    state.rd.meta.exportedAt = new Date().toISOString();
    state.rd.meta.exportCount = (state.rd.meta.exportCount || 0) + 1;
    persist(true);
    const json = ExportSnapshot();
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'rd-library-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    ShowToast('success', 'JSON backup saved');
  } catch (err) {
    ShowToast('error', 'JSON export failed', err.message);
  }
}

let ImportCtx = null;
function GetImportPreviewHTML(entries, fileName) {
  const RD = state.rd;
  const base = String(fileName || '').replace(/\.bib$/i, '').replace(/[_-]+/g, ' ').trim();
  const groupOptions = ['<option value="">— Unsorted —</option>']
    .concat(RD.groupOrder.map((gid) => {
      const g = GetGroup(gid);
      return g ? `<option value="${g.id}">${esc(g.name)}</option>` : '';
    }))
    .concat(`<option value="__NEW__">${base ? '+ New group "' + esc(base) + '"' : '+ New group from file name'}</option>`)
    .join('');

  const rows = entries.map((en, i) => {
    const dup = !!en.__dup;
    const dupKey = !dup && !!en.__dupKey;
    const metaParts = [];
    if ((en.authors || []).length) metaParts.push(esc(en.authors.slice(0, 2).join('; ')) + (en.authors.length > 2 ? ' et al.' : ''));
    if (en.year) metaParts.push(esc(String(en.year)));
    if (en.journal) metaParts.push(esc(en.journal));
    const typeVal = ['paper', 'book', 'thesis'].indexOf(en.type) !== -1 ? en.type : 'paper';
    const rowGroup = ['<option value="" title="Use the destination chosen at the bottom of this dialog">file target</option>']
      .concat(RD.groupOrder.map((gid) => {
        const g = GetGroup(gid);
        return g ? `<option value="${g.id}" ${en.__group === g.id ? 'selected' : ''}>${esc(g.name)}</option>` : '';
      })).join('');

    return `
      <label class="ip-row${dup ? ' dup' : ''}${dupKey ? ' dupkey' : ''}">
        <input type="checkbox" class="ip-check" data-ip-check="${i}" ${dup ? 'disabled' : 'checked'} />
        <select class="rd-select sm ip-type" data-ip-type="${i}" title="Treat this entry as" ${dup ? 'disabled' : ''} onclick="event.stopPropagation()">
          <option value="paper" ${typeVal === 'paper' ? 'selected' : ''}>Paper</option>
          <option value="book" ${typeVal === 'book' ? 'selected' : ''}>Book</option>
          <option value="thesis" ${typeVal === 'thesis' ? 'selected' : ''}>Thesis</option>
        </select>
        <select class="rd-select sm ip-group" data-ip-group="${i}" title="Destination group for this entry (default: the file target)" ${dup ? 'disabled' : ''} onclick="event.stopPropagation()">
          ${rowGroup}
        </select>
        <span class="ip-body">
          <span class="ip-title">${esc(en.title || '(no title)')}</span>
          <span class="ip-meta">${metaParts.join(' &middot; ')}</span>
        </span>
        ${dup ? '<span class="ip-dup-badge">in library</span>' : dupKey
          ? `<span class="ip-dup-badge key" title="Another entry already uses the citation key “${esc(en.bibtexKey)}” — importing may create a key clash">key used</span><span class="ip-key">${esc(en.bibtexKey || '')}</span>`
          : `<span class="ip-key">${esc(en.bibtexKey || '')}</span>`}
      </label>`;
  }).join('');

  return `
    <div class="modal-overlay" id="rd-import-modal">
      <div class="modal-card import-preview" role="dialog" aria-modal="true" aria-label="BibTeX import preview">
        <div class="modal-header">
          <h3>${ICONS.upload} Import BibTeX — ${entries.length} entr${entries.length === 1 ? 'y' : 'ies'}</h3>
          <button class="icon-btn" data-action="close-modal" title="Close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="ip-toolbar">
            <button class="ghost-btn sm" data-action="ip-select-fresh">Select new</button>
            <button class="ghost-btn sm" data-action="ip-select-all">Select all</button>
            <button class="ghost-btn sm" data-action="ip-select-none">None</button>
            <span class="ip-count" id="ip-count"></span>
          </div>
          <div class="ip-list">${rows}</div>
          <div class="ip-target">
            <label for="ip-group-select">Move imported into</label>
            <select class="rd-select" id="ip-group-select">${groupOptions}</select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="ghost-btn" data-action="close-modal">Cancel</button>
          <button class="primary-btn" data-action="ip-confirm">${ICONS.download}<span>Import <b id="ip-n">0</b> selected</span></button>
        </div>
      </div>
    </div>
  `;
}
function OpenImportPreview(entries, fileName) {
  ImportCtx = { entries: entries || [], fileName: fileName || '' };
  const root = document.getElementById('rd-modal-root');
  if (!root) return;
  root.innerHTML = GetImportPreviewHTML(ImportCtx.entries, ImportCtx.fileName);
  IpUpdateCount();
}
function IpUpdateCount() {
  const checks = [...document.querySelectorAll('.ip-check')];
  let n = 0;
  checks.forEach((c) => { if (c.checked && !c.disabled) n++; });
  const out = document.getElementById('ip-n');
  if (out) out.textContent = String(n);
  const cnt = document.getElementById('ip-count');
  if (cnt) cnt.textContent = n + ' of ' + checks.length + ' selected';
  const btn = document.querySelector('[data-action="ip-confirm"]');
  if (btn) btn.disabled = n === 0;
}
function IpSetChecks(mode) {
  // mode: 'all' | 'none' | 'fresh'
  document.querySelectorAll('.ip-check').forEach((c) => {
    if (c.disabled) { c.checked = false; return; }
    c.checked = mode === 'all' || mode === 'fresh';
  });
  IpUpdateCount();
}
function ConfirmImportPreview() {
  if (!ImportCtx) return;
  const checks = [...document.querySelectorAll('.ip-check')];
  const selected = ImportCtx.entries.filter((en, i) => checks[i] && checks[i].checked && !checks[i].disabled);
  if (!selected.length) {
    ShowToast('error', 'Nothing selected', 'Tick at least one entry to import.');
    return;
  }
  const sel = document.getElementById('ip-group-select');
  let groupId = null;
  let groupName = 'Unsorted';
  if (sel && sel.value === '__NEW__') {
    const base = ImportCtx.fileName.replace(/\.bib$/i, '').replace(/[_-]+/g, ' ').trim() || 'Imported';
    const g = AddGroup(base);
    groupId = g.id;
    groupName = g.name;
  } else if (sel && sel.value) {
    groupId = sel.value;
    const g = GetGroup(groupId);
    groupName = g ? g.name : 'group';
  }

  // bucket the selected entries by their per-row destination override
  const buckets = new Map(); // groupId|null -> entries
  const names = new Map();
  selected.forEach((en) => {
    let dest = en.__group || '';
    if (dest && !GetGroup(dest)) dest = '';
    if (!buckets.has(dest)) buckets.set(dest, []);
    buckets.get(dest).push(en);
    if (dest) names.set(dest, (GetGroup(dest) || { name: 'group' }).name);
  });
  EnsureKeys(selected);
  let created = [];
  buckets.forEach((entries2, dest) => {
    const g = dest ? { groupId: dest } : (groupId ? { groupId } : {});
    created = created.concat(AddItems(entries2, g));
  });
  const blocked = ImportCtx.entries.filter((en) => en.__dup).length;
  const warnedKeys = ImportCtx.entries.filter((en) => en.__dupKey).length;
  ImportCtx = null;
  const root = document.getElementById('rd-modal-root');
  if (root) root.innerHTML = '';
  if (window.RDUI && typeof window.RDUI.RenderAll === 'function') window.RDUI.RenderAll();

  // destination summary for the toast
  const parts = [];
  buckets.forEach((entries2, dest) => {
    const nm = dest ? names.get(dest) : groupName;
    parts.push(entries2.length + ' → ' + nm);
  });
  ShowToast(
    'success',
    created.length + ' entr' + (created.length === 1 ? 'y' : 'ies') + ' imported',
    parts.join(' · ') + '.' + (blocked ? ' ' + blocked + ' duplicate' + (blocked === 1 ? '' : 's') + ' were skipped.' : '') + (warnedKeys ? ' ' + warnedKeys + ' reused citation key' + (warnedKeys === 1 ? '' : 's') + '.' : ''),
    blocked ? {
      actionLabel: 'Review',
      duration: 9000,
      onAction: () => {
        if (window.RDUI && typeof window.RDUI.OpenDuplicatesModal === 'function') {
          window.RDUI.OpenDuplicatesModal();
        }
      }
    } : undefined
  );
}
async function ImportBibtexFile(file) {
  try {
    const text = await file.text();
    const all = ParseBibtexAll(text);
    if (!all.length) {
      ShowToast('error', 'No BibTeX entries found', 'The file does not contain any @article/@book/@phdthesis entries.');
      return;
    }
    EnsureKeys(all);
    const seenFileKeys = new Set();
    all.forEach((en) => {
      en.__dup = !!(en.title && FindDuplicates({ doi: en.doi, title: en.title }).length);
      const nk = NormKey(en.bibtexKey || '');
      en.__dupKey = !!(nk && (FindDuplicates({ bibtexKey: en.bibtexKey }).length || seenFileKeys.has(nk)));
      if (nk) seenFileKeys.add(nk);
    });
    OpenImportPreview(all, file.name);
  } catch (err) {
    ShowToast('error', 'BibTeX import failed', err.message);
  }
}
async function ImportJSONFile(file) {
  try {
    const text = await file.text();
    const parsed = ParseSnapshot(text);
    const ok = await ConfirmAction({
      title: 'Import this library?',
      html: 'The backup contains <b>' + parsed.rd.items.length + ' items</b>, <b>' +
        parsed.rd.groups.length + ' groups</b> and <b>' + parsed.rd.links.length +
        ' links</b>.<br><br>Your current library in this browser will be replaced.',
      okLabel: 'Replace library',
      danger: true
    });
    if (!ok) return;
    ReplaceAll(parsed.rd);
    if (window.RDUI && typeof window.RDUI.RenderAll === 'function') window.RDUI.RenderAll();
    ShowToast('success', 'Library imported', parsed.rd.items.length + ' items restored.');
  } catch (err) {
    ShowToast('error', 'Import failed', err.message);
  }
}
function ResetLibrary() {
  Clear();
  const fresh = DefaultState();
  ReplaceAll(fresh.rd);
  SeedDemoData();
  if (window.RDUI && typeof window.RDUI.RenderAll === 'function') window.RDUI.RenderAll();
  ShowToast('success', 'Library reset', 'Fresh demo library loaded.');
}

if (typeof window !== 'undefined') {
  window.RDImport = {
    GetImportPreviewHTML,
    OpenImportPreview,

    IpSetChecks,

    ResetLibrary

}

      ${GetHeaderHTML()}
      ${GetTabbarHTML()}
      ${GetToolbarHTML()}
      <div class="rd-dashboard-wrap" id="rd-dashboard" ${isDashOpen ? '' : 'hidden'}>
        <div class="rd-stats-grid" id="rd-stats-bar"></div>
        <div id="rd-resume-section"></div>
        <div id="rd-heatmap-section"></div>
        <div id="rd-tag-bar"></div>
      </div>
      <main class="rd-content">
        <section class="rd-tab-panel active" id="panel-list" aria-label="List view"></section>
        <section class="rd-tab-panel" id="panel-timeline" aria-label="Timeline view">
          <div class="rd-canvas-wrap" id="wrap-timeline">
            <div class="rd-canvas-world" id="world-timeline"></div>
            ${GetCanvasControlsHTML('timeline')}
            <div class="rd-canvas-legend">${ICONS.clock} Drag cards anywhere &middot; Shift-drag selects &middot; Double-click opens notes</div>
