  // HTML5 drag & drop for the list tab (delegated).
  function InitListDnD() {
    const panel = document.getElementById('panel-list');
    if (!panel) return;
    let draggedId = null;
    let draggedSection = null;

    panel.addEventListener('dragstart', (e) => {
      const card = e.target.closest('.rd-item-card');
      const header = e.target.closest('[data-section-drag]');
      if (card) {
        draggedId = card.dataset.itemId;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', draggedId);
      } else if (header) {
        draggedSection = header.dataset.sectionDrag;
        header.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'grp:' + draggedSection);
      }
    });

    panel.addEventListener('dragend', () => {
      panel.querySelectorAll('.dragging, .drop-before, .drop-after, .drag-over').forEach((el) => {
        el.classList.remove('dragging', 'drop-before', 'drop-after', 'drag-over');
      });
      draggedId = null;
      draggedSection = null;
    });

    panel.addEventListener('dragover', (e) => {
      if (draggedSection) {
        const header = e.target.closest('[data-section-drag]');
        if (header && header.dataset.sectionDrag !== draggedSection) {
          e.preventDefault();
          header.classList.add('drag-over');
        }
        return;
      }
      if (!draggedId) return;
      const card = e.target.closest('.rd-item-card');
      const grid = e.target.closest('.rd-cards-grid');
      if (card && card.dataset.itemId !== draggedId) {
        e.preventDefault();
        const r = card.getBoundingClientRect();
        const after = (e.clientY - r.top) > r.height / 2;
        card.classList.toggle('drop-after', after);
        card.classList.toggle('drop-before', !after);
      } else if (grid) {
        e.preventDefault();
        grid.classList.add('drag-over');
      }
    });

    panel.addEventListener('dragleave', (e) => {
      const card = e.target.closest && e.target.closest('.rd-item-card');
      if (card) card.classList.remove('drop-before', 'drop-after');
      const grid = e.target.closest && e.target.closest('.rd-cards-grid');
      if (grid) grid.classList.remove('drag-over');
    });

    panel.addEventListener('drop', (e) => {
      e.preventDefault();
      // group reorder
      if (draggedSection) {
        const header = e.target.closest('[data-section-drag]');
        if (header && header.dataset.sectionDrag !== draggedSection) {
          const RD = RDPapers.State();
          const order = RD.groupOrder.filter((id) => id !== draggedSection);
          const tIdx = order.indexOf(header.dataset.sectionDrag);
          if (tIdx === -1) order.push(draggedSection);
          else order.splice(tIdx, 0, draggedSection);
          RDPapers.SetGroupOrder(order);
          RenderAll();
        }
        return;
      }
      if (!draggedId) return;
      const card = e.target.closest('.rd-item-card');
      const grid = e.target.closest('.rd-cards-grid');
      if (card && card.dataset.itemId !== draggedId) {
        const r = card.getBoundingClientRect();
        const after = (e.clientY - r.top) > r.height / 2;
        const targetId = card.dataset.itemId;
        const targetItem = RDPapers.GetItem(targetId);
        RDPapers.ReorderItemBefore(draggedId, after ? null : targetId, targetItem ? targetItem.groupId : null);
        if (after) {
          // place right after target: reorder once more past it
          const RD = RDPapers.State();
          const order = RD.itemOrder.filter((id) => id !== draggedId);
          const tIdx = order.indexOf(targetId);
          if (tIdx !== -1) {
            order.splice(tIdx + 1, 0, draggedId);
            RD.itemOrder = order;
            RDPapers.Commit();
          }
        }
        RenderAll();
      } else if (grid) {
        const gid = grid.dataset.dropGroup === 'UNSORTED' ? null : grid.dataset.dropGroup;
        RDPapers.ReorderItemBefore(draggedId, null, gid);
        RenderAll();
      }
    });
  }

  // ---------- TIMELINE ----------

  function RenderTimeline() {
    const world = document.getElementById('world-timeline');
    if (!world) return;
    const RD = RDPapers.State();
    const visible = RDPapers.VisibleItems();
    const cols = RDPapers.TimelineColumns();
    const L = RDPapers.LAYOUT.TL;
    const totalW = Math.max(900, L.X0 + cols.length * L.GAP);

    const axis = `<div class="rd-tl-axis" style="left:-1000px; width:${totalW + 2000}px; top:${L.LINE_Y - 2}px;"></div>`;
    const bands = cols.map((c, i) => {
      const x = L.X0 + i * L.GAP;
      return `<div class="rd-tl-yearband" style="left:${x}px;"></div>`;
    }).join('');
    const bobs = cols.map((c, i) => {
      const x = L.X0 + i * L.GAP;
      const label = c.year === '????' ? 'Unknown' : c.year;
      const count = visible.filter((v) => (v.year || '????') === c.year).length;
      const active = RD.ui.yearFilter && String(RD.ui.yearFilter) === String(c.year) ? ' active' : '';
      return `
        <button type="button" class="rd-tl-bob${active}" data-action="tl-year" data-year="${c.year}"
             style="left:${x}px; top:${L.LINE_Y}px;" title="Click to show only ${label} — ${count} item(s)"
             aria-pressed="${active ? 'true' : 'false'}" aria-label="Filter year ${label}: ${count} items">
          <span class="bob-count">${count}</span>
          <span class="bob-year">${label}</span>
        </button>`;
    }).join('');
    const visIds = new Set(visible.map((v) => v.id));
    const cards = RDPapers.GetAllItems()
      .filter((it) => visIds.has(it.id))
      .map((it) => GetNodeCardHTML(it, 'timeline')).join('');

    // v1.8: "today" marker — a dashed line at the current year's position,
    // interpolated between columns so it shows even if no item is from this year
    let nowMarker = '';
    const nowYear = new Date().getFullYear();
    const numCols = cols.filter((c) => c.year !== '????').map((c) => ({ y: Number(c.year), x: L.X0 + cols.indexOf(c) * L.GAP }));
    let nx = null;
    if (numCols.length) {
      const exact = numCols.find((c) => c.y === nowYear);
      if (exact) nx = exact.x;
      else if (nowYear < numCols[0].y) nx = numCols[0].x - (numCols[0].y - nowYear) * L.GAP;
      else if (nowYear > numCols[numCols.length - 1].y) nx = numCols[numCols.length - 1].x + (nowYear - numCols[numCols.length - 1].y) * L.GAP;
      else {
        for (let i = 0; i < numCols.length - 1; i++) {
          const a = numCols[i], b = numCols[i + 1];
          if (nowYear > a.y && nowYear < b.y) { nx = a.x + ((nowYear - a.y) / (b.y - a.y)) * (b.x - a.x); break; }
        }
      }
    }
    if (nx !== null) {
      const maxCardY = RDPapers.GetAllItems().reduce((m, it) => {
        const p = (it.positions && it.positions.timeline) ? it.positions.timeline.y : 0;
        return Math.max(m, p || 0);
      }, 0);
      const lineH = Math.max(900, maxCardY + 260);
      nowMarker = `
        <div class="rd-tl-now" style="left:${Math.round(nx)}px; height:${lineH}px;" aria-hidden="true">
          <span class="rd-tl-now-chip" style="top:${L.LINE_Y - 36}px;">TODAY &middot; ${nowYear}</span>
          <span class="rd-tl-now-pulse" style="top:${L.LINE_Y}px;"></span>
        </div>`;
    }

    world.innerHTML = axis + bands + nowMarker + bobs + (cards || `
      <div class="rd-canvas-empty-hint" style="left:${totalW / 2}px;">
        ${ICONS.clock}<span>Nothing on the timeline yet<br>Add papers with a publication year</span>
      </div>`);
    ApplyView('timeline');
    EnsureMinimap('timeline');
  }

  // ---------- MAP ----------

  function RenderMap() {
    const world = document.getElementById('world-map');
    if (!world) return;
    const visible = RDPapers.VisibleItems();
    const visIds = new Set(visible.map((v) => v.id));
    const cards = RDPapers.GetAllItems()
      .filter((it) => visIds.has(it.id))
      .map((it) => GetNodeCardHTML(it, 'map')).join('');
    world.innerHTML = `
      <svg class="rd-map-svg" id="rd-map-svg">${RenderLinkPathsInner()}</svg>
      ${cards || `<div class="rd-canvas-empty-hint" style="left:420px; top:220px;">
        ${ICONS.network}<span>Your mind map is empty<br>Add papers, then drag from a card's dot to connect ideas</span>
      </div>`}`;
    ApplyView('map');
    EnsureMinimap('map');
    requestAnimationFrame(() => RenderLinkPaths());
  }

  function RenderLinkPathsIfNeeded() { /* timeline has no links */ }

  // Pan the timeline so the given year's column sits in the middle of the view.
  function CenterTimelineOnYear(year) {
    const wrap = document.getElementById('wrap-timeline');
    if (!wrap) return;
    const idx = RDPapers.TimelineColumns().findIndex((c) => String(c.year) === String(year));
    if (idx === -1) return;
    const L = RDPapers.LAYOUT.TL;
    const colX = L.X0 + idx * L.GAP;
    const v = RDPapers.State().ui.views.timeline;
    const k = v.k || 1;
    RDPapers.SetView('timeline', { x: wrap.getBoundingClientRect().width / 2 - colX * k, y: 0 });
    ApplyView('timeline');
  }

  function AnchorPointFor(el, anchor) {
    const x = el.offsetLeft, y = el.offsetTop;
    const w = el.offsetWidth, h = el.offsetHeight;
    switch (anchor) {
      case 'a-n': return { x: x + w / 2, y: y };
      case 'a-e': return { x: x + w, y: y + h / 2 };
      case 'a-s': return { x: x + w / 2, y: y + h };
      case 'a-w': default: return { x: x, y: y + h / 2 };
    }
  }

  function AnchorNormal(anchor) {
    switch (anchor) {
      case 'a-n': return { x: 0, y: -1 };
      case 'a-e': return { x: 1, y: 0 };
      case 'a-s': return { x: 0, y: 1 };
      default: return { x: -1, y: 0 };
    }
  }

  function LinkPathD(p1, a1, p2, a2) {
    const n1 = AnchorNormal(a1), n2 = AnchorNormal(a2);
    const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    const k = Math.min(160, Math.max(36, dist * 0.38));
    const c1 = { x: p1.x + n1.x * k, y: p1.y + n1.y * k };
    const c2 = { x: p2.x + n2.x * k, y: p2.y + n2.y * k };
    return `M ${p1.x} ${p1.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`;
  }

  function RenderLinkPathsInner() {
    const links = RDPapers.GetLinks();
    const world = document.getElementById('world-map');
    if (!world) return '';
    let out = '';
    links.forEach((l) => {
      const elFrom = world.querySelector(`[data-item-id="${l.from}"]`);
      const elTo = world.querySelector(`[data-item-id="${l.to}"]`);
      if (!elFrom || !elTo) return;
      const p1 = AnchorPointFor(elFrom, l.fromAnchor);
      const p2 = AnchorPointFor(elTo, l.toAnchor);
      out += `<path class="rd-link-path" data-link-id="${l.id}" d="${LinkPathD(p1, l.fromAnchor, p2, l.toAnchor)}"></path>`;
    });
    return out;
  }

  function RenderLinkPaths() {
    const svg = document.getElementById('rd-map-svg');
    if (!svg) return;
    svg.innerHTML = RenderLinkPathsInner();
  }

  // ---------- GROUP ----------

  function RenderGroup() {
    const world = document.getElementById('world-group');
    if (!world) return;
    const RD = RDPapers.State();
    const groups = RDPapers.GetAllGroups();
    const visible = RDPapers.VisibleItems();
    const visIds = new Set(visible.map((v) => v.id));

    const boxes = groups.map((g) => GetGroupBoxHTML(g)).join('');
    const cards = RDPapers.GetAllItems()
      .filter((it) => visIds.has(it.id))
      .map((it) => GetNodeCardHTML(it, 'group')).join('');

    const L = RDPapers.LAYOUT.GRP;
    const anyMembers = RD.items.some((i) => i.groupId);
    world.innerHTML = boxes + cards + (RD.items.length ? '' : `
      <div class="rd-canvas-empty-hint" style="left:430px; top:${L.Y0 + 120}px;">
        ${ICONS.folder}<span>No items yet<br>Add papers, then drag them into group boxes</span>
      </div>`) + (RD.items.length && !anyMembers && !groups.length ? `
      <div class="rd-canvas-empty-hint" style="left:430px; top:${L.Y0 + 120}px;">
        ${ICONS.folder}<span>Create a group box, then drag cards into it</span>
      </div>` : '');
    ApplyView('group');
    FitGroupBoxes();
    EnsureMinimap('group');
  }

  // Grow group boxes so every member card that visually sits inside the
  // box is fully contained (card heights vary with title length).
  function FitGroupBoxes() {
    const world = document.getElementById('world-group');
    if (!world) return;
    const RD = RDPapers.State();
    world.querySelectorAll('.rd-group-box').forEach((box) => {
      const bx = box.offsetLeft, by = box.offsetTop, bw = box.offsetWidth, bh = box.offsetHeight;
      let maxBottom = 0;
      RD.items.forEach((it) => {
        if (it.groupId !== box.dataset.groupId) return;
        const el = world.querySelector(`[data-item-id="${it.id}"]`);
        if (!el) return;
        const cx = el.offsetLeft + el.offsetWidth / 2;
        const cy = el.offsetTop + el.offsetHeight / 2;
        // only contain cards whose centre is inside (or just below) the box
        if (cx < bx || cx > bx + bw || cy < by || cy > by + bh + 80) return;
        maxBottom = Math.max(maxBottom, el.offsetTop + el.offsetHeight);
      });
      if (maxBottom) {
        const needed = maxBottom - by + 18;
        if (needed > bh) box.style.height = Math.round(needed) + 'px';
      }
    });
  }

  // ---------- FOOTER ----------

  function RenderFooter() {
    const el = document.getElementById('rd-footer-stats');
    if (!el) return;
    const s = RDPapers.Stats();
    el.innerHTML = `
      <span class="rd-stat">${ICONS.file}<b>${s.papers}</b> papers</span>
      <span class="rd-stat">${ICONS.book}<b>${s.books}</b> books</span>
      <span class="rd-stat">${ICONS.grad}<b>${s.theses}</b> thesis</span>
      <span class="rd-stat">${ICONS.folder}<b>${s.groups}</b> groups</span>
      <span class="rd-stat">${ICONS.network}<b>${s.links}</b> links</span>
      <span class="rd-stat">${ICONS.check}<b>${s.read}</b>/${s.total} read</span>
      <span class="rd-stat" title="Average reading progress">${ICONS.clock}<b>${s.avgProgress}%</b> avg</span>
    `;
    // duplicates chip — visible only when the scanner finds something
    const chip = document.getElementById('rd-dups-chip');
    if (chip) {
      const clusters = RDPapers.FindDuplicateClusters();
      const n = clusters.length;
      chip.hidden = n === 0;
      const cnt = document.getElementById('rd-dups-count');
      if (cnt) cnt.textContent = `${n} duplicate${n === 1 ? '' : 's'}`;
    }
  }

  // ---------- SECTIONS DROPDOWN (group filter + reorder) ----------

  let DropdownColumns = 2;

  function ComputeUniformTileWidth(groups) {
    let maxCharLength = 0;
    groups.forEach((g) => { if (g && g.length > maxCharLength) maxCharLength = g.length; });
    const computed = Math.ceil(maxCharLength * 8.5) + 68;
    return Math.min(280, Math.max(150, computed));
  }

  function GetMaxPossibleColumns(tileWidth) {
    const windowPadding = 28;
    const gap = 8;
    const viewportMax = Math.min(window.innerWidth - 20, 780);
    const maxCols = Math.floor((viewportMax - windowPadding + gap) / (tileWidth + gap));
    return Math.max(1, maxCols);
  }

  function InitSectionsDropdown() {
    const RD = RDPapers.State();
    DropdownColumns = Math.min(4, Math.max(1, RD.ui.columnCount || 2));
    const toggleBtn = document.getElementById('sections-dropdown-toggle');
    const dropdownWindow = document.getElementById('sections-dropdown-window');
    const closeBtn = document.getElementById('close-sections-dropdown');
    const searchInput = document.getElementById('section-search-input');
    const colDecBtn = document.getElementById('col-dec-btn');
    const colIncBtn = document.getElementById('col-inc-btn');

    if (toggleBtn && dropdownWindow) {
      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        dropdownWindow.classList.toggle('hidden');
        if (!dropdownWindow.classList.contains('hidden')) {
          RenderSectionsDropdownGrid();
          if (searchInput) searchInput.focus();
        }
      });
    }
    if (closeBtn && dropdownWindow) {
      closeBtn.addEventListener('click', () => dropdownWindow.classList.add('hidden'));
    }
    document.addEventListener('click', (e) => {
      if (dropdownWindow && !dropdownWindow.classList.contains('hidden') &&
          !dropdownWindow.contains(e.target) && toggleBtn && !toggleBtn.contains(e.target)) {
        dropdownWindow.classList.add('hidden');
      }
    });
    if (searchInput) {
      searchInput.addEventListener('input', () => RenderSectionsDropdownGrid());
    }
    if (colDecBtn) {
      colDecBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (DropdownColumns > 1) {
          DropdownColumns--;
          RDPapers.SetUI({ columnCount: DropdownColumns });
          RenderSectionsDropdownGrid();
        }
      });
    }
    if (colIncBtn) {
      colIncBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const currentList = GetDropdownEntries();
        const tileWidth = ComputeUniformTileWidth(currentList.map((t) => t.name));
        const maxCols = GetMaxPossibleColumns(tileWidth);
        if (DropdownColumns < maxCols) {
          DropdownColumns++;
          RDPapers.SetUI({ columnCount: DropdownColumns });
          RenderSectionsDropdownGrid();
        }
      });
    }
    window.addEventListener('resize', () => {
      if (dropdownWindow && !dropdownWindow.classList.contains('hidden')) RenderSectionsDropdownGrid();
    });
  }

  function GetDropdownEntries() {
    const RD = RDPapers.State();
    const counts = {};
    RD.items.forEach((i) => {
      const key = i.groupId || 'UNSORTED';
      counts[key] = (counts[key] || 0) + 1;
    });
    const entries = [{ key: 'ALL', name: 'ALL', color: null, count: RD.items.length }];
    RD.groupOrder.forEach((gid) => {
      const g = RDPapers.GetGroup(gid);
      if (g) entries.push({ key: g.id, name: g.name, color: g.color, count: counts[g.id] || 0 });
    });
    entries.push({ key: 'UNSORTED', name: 'Unsorted', color: null, count: counts['UNSORTED'] || 0 });
    return entries;
  }

  function RenderSectionsDropdownGrid() {
    const grid = document.getElementById('sections-grid-container');
    const dropdownWindow = document.getElementById('sections-dropdown-window');
    if (!grid || !dropdownWindow) return;

    const searchInput = document.getElementById('section-search-input');
    const searchVal = ((searchInput && searchInput.value) || '').toLowerCase().trim();
    const colValEl = document.getElementById('col-count-val');
    const colDecBtn = document.getElementById('col-dec-btn');
    const colIncBtn = document.getElementById('col-inc-btn');
    const RD = RDPapers.State();

    const entries = SectionTmpOrder || GetDropdownEntries();
    const names = entries.map((t) => t.name);
    const tileWidth = ComputeUniformTileWidth(names);
    const maxPossibleCols = GetMaxPossibleColumns(tileWidth);

    if (DropdownColumns > maxPossibleCols) DropdownColumns = maxPossibleCols;
    if (colValEl) colValEl.textContent = DropdownColumns;
    if (colDecBtn) colDecBtn.disabled = DropdownColumns <= 1;
    if (colIncBtn) colIncBtn.disabled = DropdownColumns >= maxPossibleCols;

    if (DropdownColumns === 1) {
      dropdownWindow.style.width = '250px';
      grid.style.gridTemplateColumns = '1fr';
    } else {
      dropdownWindow.style.width = 'max-content';
      grid.style.gridTemplateColumns = `repeat(${DropdownColumns}, ${tileWidth}px)`;
    }

    const filtered = entries.filter((t) => !searchVal || t.name.toLowerCase().includes(searchVal));

    grid.innerHTML = filtered.map((t) => `
      <div class="section-grid-tile ${RD.ui.activeSection === t.key ? 'active' : ''} ${SectionDraggingKey === t.key ? 'is-dragging' : ''}"
           data-section="${t.key}" data-section-name="${esc(t.name)}"
           draggable="${t.key !== 'ALL' && t.key !== 'UNSORTED' ? 'true' : 'false'}"
           style="${DropdownColumns === 1 ? 'width: 100%;' : `width: ${tileWidth}px;`}">
        ${t.color ? `<span class="section-tile-dot" style="background:${t.color};"></span>` : ''}
        <span class="section-tile-title">${esc(t.name)}</span>
        <span class="count-badge">${t.count}</span>
      </div>
    `).join('');

    grid.querySelectorAll('.section-grid-tile').forEach((tile) => {
      tile.addEventListener('click', (e) => {
        e.stopPropagation();
        RDPapers.SetUI({ activeSection: tile.dataset.section });
        RenderToolbarLabels();
        RenderAll();
        dropdownWindow.classList.add('hidden');
      });
      const key = tile.dataset.section;
      if (key !== 'ALL' && key !== 'UNSORTED') {
        tile.addEventListener('dragstart', (e) => {
          SectionDraggingKey = key;
          SectionTmpOrder = [...entries];
          tile.classList.add('is-dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', 'sec:' + key);
        });
        tile.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          if (!SectionDraggingKey || SectionDraggingKey === key) return;
          const srcIdx = SectionTmpOrder.findIndex((t) => t.key === SectionDraggingKey);
          const tgtIdx = SectionTmpOrder.findIndex((t) => t.key === key);
          if (srcIdx !== -1 && tgtIdx !== -1 && srcIdx !== tgtIdx) {
            const oldPositions = new Map();
            grid.querySelectorAll('.section-grid-tile').forEach((el) => {
              oldPositions.set(el.dataset.section, el.getBoundingClientRect());
            });
            const [item] = SectionTmpOrder.splice(srcIdx, 1);
            SectionTmpOrder.splice(tgtIdx, 0, item);
            RenderSectionsDropdownGrid();
            grid.querySelectorAll('.section-grid-tile').forEach((el) => {
              const sec = el.dataset.section;
              if (sec === SectionDraggingKey) return;
              const oldPos = oldPositions.get(sec);
              if (oldPos) {
                const newPos = el.getBoundingClientRect();
                const dx = oldPos.left - newPos.left;
                const dy = oldPos.top - newPos.top;
                if (dx !== 0 || dy !== 0) {
                  el.style.transform = `translate(${dx}px, ${dy}px)`;
                  el.style.transition = 'none';
                  requestAnimationFrame(() => {
                    el.style.transition = 'transform 0.24s cubic-bezier(0.2, 0, 0, 1)';
                    el.style.transform = '';
                  });
                }
              }
            });
          }
        });
        tile.addEventListener('dragend', () => {
          tile.classList.remove('is-dragging');
          if (SectionTmpOrder) {
            const reorderedKeys = SectionTmpOrder.map((t) => t.key)
              .filter((k) => k !== 'ALL' && k !== 'UNSORTED');
            RDPapers.SetGroupOrder(reorderedKeys);
            SectionTmpOrder = null;
            SectionDraggingKey = null;
            RenderSectionsDropdownGrid();
            RenderAll();
          }
        });
      }
    });
  }

  let SectionDraggingKey = null;

  // ---------- PAN / ZOOM / DRAG (canvas tabs) ----------

  function ApplyView(view) {
    const world = document.getElementById('world-' + view);
    const RD = RDPapers.State();
    if (!world) return;
    const v = RD.ui.views[view];
    world.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.k})`;
    const zl = document.getElementById('zoom-val-' + view);
    if (zl) zl.textContent = Math.round(v.k * 100) + '%';
    ScheduleMinimap(view);
  }

  // ---------- MINIMAP (canvas overview, v1.6) ----------
  // A small glass panel in the bottom-right of every canvas tab. Dots are
  // the world content (cards + group boxes, group-coloured); the accent
  // rectangle is the current viewport. Click / drag inside it to navigate.
  const MM = { W: 176, H: 112, PAD: 10 };
  const MinimapTimers = {};

  function ScheduleMinimap(view) {
    if (MinimapTimers[view]) return;
    MinimapTimers[view] = requestAnimationFrame(() => {
      MinimapTimers[view] = null;
      UpdateMinimap(view);
    });
  }

  function MinimapVisible(view) {
    return RDPapers.State().ui.minimap !== false;
  }

  function EnsureMinimap(view) {
    const wrap = document.getElementById('wrap-' + view);
    if (!wrap) return;
    let mm = wrap.querySelector('.rd-minimap');
    if (!MinimapVisible(view)) {
      if (mm) mm.remove();
      return;
    }
    if (!mm) {
      mm = document.createElement('div');
      mm.className = 'rd-minimap';
      mm.id = 'rd-minimap-' + view;
      mm.setAttribute('aria-label', 'Canvas minimap — drag to navigate');
      mm.innerHTML = `
        <svg class="rd-minimap-dots" width="${MM.W}" height="${MM.H}" aria-hidden="true"></svg>
        <div class="rd-minimap-vp" aria-hidden="true"></div>
        <span class="rd-minimap-hint">overview &middot; click a dot</span>`;
      wrap.appendChild(mm);
      mm.addEventListener('pointerdown', (e) => StartMinimapNav(view, wrap, mm, e));
    }
    UpdateMinimap(view);
  }

  function MinimapContentRect(view) {
    const world = document.getElementById('world-' + view);
    if (!world) return null;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    world.querySelectorAll('.rd-node-card, .rd-group-box').forEach((el) => {
      const l = el.offsetLeft, t = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
      if (!w || !h) return;
      minX = Math.min(minX, l); minY = Math.min(minY, t);
      maxX = Math.max(maxX, l + w); maxY = Math.max(maxY, t + h);
    });
    if (minX === Infinity) return null;
    return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
  }

  function UpdateMinimap(view) {
    const wrap = document.getElementById('wrap-' + view);
    const mm = wrap && wrap.querySelector('.rd-minimap');
    if (!wrap || !mm) return;
    const RD = RDPapers.State();
    const v = RD.ui.views[view] || { x: 0, y: 0, k: 1 };
    const rect = wrap.getBoundingClientRect();
    const content = MinimapContentRect(view);

    // world bounds = content bbox unioned with the current viewport (so the
    // viewport rectangle always sits inside the minimap even when panned far)
    const vpW = rect.width / v.k, vpH = rect.height / v.k;
    const vpX = -v.x / v.k, vpY = -v.y / v.k;
    let minX = content ? content.x : vpX, minY = content ? content.y : vpY;
    let maxX = content ? content.x + content.w : vpX + vpW;
    let maxY = content ? content.y + content.h : vpY + vpH;
    minX = Math.min(minX, vpX); minY = Math.min(minY, vpY);
    maxX = Math.max(maxX, vpX + vpW); maxY = Math.max(maxY, vpY + vpH);
    const bw = Math.max(1, maxX - minX), bh = Math.max(1, maxY - minY);
    const scale = Math.min((MM.W - MM.PAD * 2) / bw, (MM.H - MM.PAD * 2) / bh);
    const ox = (MM.W - bw * scale) / 2, oy = (MM.H - bh * scale) / 2;
    mm.dataset.bounds = JSON.stringify({ minX, minY, scale, ox, oy });

    // dots
    const world = document.getElementById('world-' + view);
    let dots = '';
    const dotMeta = []; // v1.8: minimap dot hit-testing (click a dot to jump)
    if (world) {
      world.querySelectorAll('.rd-group-box').forEach((box) => {
        const x = ox + (box.offsetLeft - minX) * scale, y = oy + (box.offsetTop - minY) * scale;
        const w = Math.max(6, box.offsetWidth * scale), h = Math.max(4, box.offsetHeight * scale);
        dots += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2"
                 fill="${box.style.getPropertyValue('--group-color') || 'var(--accent)'}" opacity="0.28" stroke="currentColor" stroke-width="0.5"/>
                 <line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x + w).toFixed(1)}" y2="${y.toFixed(1)}"
                 stroke="${box.style.getPropertyValue('--group-color') || 'var(--accent)'}" stroke-width="1.4" opacity="0.9"/>`;
      });
      world.querySelectorAll('.rd-node-card').forEach((el) => {
        const x = ox + (el.offsetLeft - minX) * scale, y = oy + (el.offsetTop - minY) * scale;
        const w = Math.max(3.5, el.offsetWidth * scale), h = Math.max(2.5, el.offsetHeight * scale);
        const col = el.style.getPropertyValue('--card-stripe') || 'var(--text-dim)';
        const sel = SelectedIds.has(el.dataset.itemId);
        dots += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="1"
                 fill="${col}" opacity="${sel ? '1' : '0.62'}" ${sel ? 'stroke="var(--accent)" stroke-width="0.8"' : ''}/>`;
        dotMeta.push({ id: el.dataset.itemId, x, y, w, h });
      });
    }
    mm.dataset.dots = JSON.stringify(dotMeta);
    const svg = mm.querySelector('.rd-minimap-dots');
    if (svg) svg.innerHTML = dots;

    // viewport rectangle
    const vp = mm.querySelector('.rd-minimap-vp');
    if (vp) {
      vp.style.left = (ox + (vpX - minX) * scale) + 'px';
      vp.style.top = (oy + (vpY - minY) * scale) + 'px';
      vp.style.width = Math.max(8, vpW * scale) + 'px';
      vp.style.height = Math.max(6, vpH * scale) + 'px';
    }
  }

  // v1.8 helpers: minimap-pixel -> world navigation + dot hit-testing
  function MinimapJumpTo(view, wrap, mm, px, py) {
    const bounds = (() => { try { return JSON.parse(mm.dataset.bounds || 'null'); } catch (err) { return null; } })();
    if (!bounds) return;
    const v = RDPapers.State().ui.views[view];
    const wx = (px - bounds.ox) / bounds.scale + bounds.minX;
    const wy = (py - bounds.oy) / bounds.scale + bounds.minY;
    const wrect = wrap.getBoundingClientRect();
    v.x = wrect.width / 2 - wx * v.k;
    v.y = wrect.height / 2 - wy * v.k;
    ApplyView(view);
    RDPapers.SaveQuiet();
  }

  function MinimapDotAt(mm, px, py) {
    let dots = null;
    try { dots = JSON.parse(mm.dataset.dots || 'null'); } catch (err) { dots = null; }
    if (!dots || !dots.length) return null;
    const PAD = 2; // a little forgiveness around tiny rects
    for (let i = dots.length - 1; i >= 0; i--) {
      const d = dots[i];
      if (px >= d.x - PAD && px <= d.x + d.w + PAD && py >= d.y - PAD && py <= d.y + d.h + PAD) return d;
    }
    return null;
  }

  // Click / drag inside the minimap moves the viewport (world centre follows).
  // v1.8: a plain click on a card dot jumps to that card and flashes it
  // (Ctrl/Cmd-click also toggles its selection); dragging near the minimap
  // edge auto-pans so huge libraries can be traversed without letting go.
  function StartMinimapNav(view, wrap, mm, e) {
    e.preventDefault();
    e.stopPropagation();
    const RD = RDPapers.State();
    const v = RD.ui.views[view];
    const rect = mm.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const dotHit = MinimapDotAt(mm, e.clientX - rect.left, e.clientY - rect.top);

    mm.classList.add('navigating');
    const jump = (ev) => {
      MinimapJumpTo(view, wrap, mm, ev.clientX - rect.left, ev.clientY - rect.top);
    };
    jump(e);
    // v1.8 edge auto-pan: keep flying while the pointer is held past the edge
    let autoRaf = 0, autoVec = null;
    const stepAuto = () => {
      if (!autoVec) { autoRaf = 0; return; }
      v.x -= autoVec.x * v.k;
      v.y -= autoVec.y * v.k;
      ApplyView(view);
      RDPapers.SaveQuiet();
      autoRaf = requestAnimationFrame(stepAuto);
    };
    const onMove = (ev) => {
      const dx = ev.clientX - rect.left, dy = ev.clientY - rect.top;
      const EDGE = 14, SPEED = 11;
      if (dx < -EDGE || dy < -EDGE || dx > rect.width + EDGE || dy > rect.height + EDGE) {
        const cx = rect.width / 2, cy = rect.height / 2;
        autoVec = { x: (dx - cx) / Math.max(1, Math.abs(dx - cx)) * SPEED, y: (dy - cy) / Math.max(1, Math.abs(dy - cy)) * SPEED };
        if (!autoRaf) autoRaf = requestAnimationFrame(stepAuto);
      } else {
        autoVec = null;
        jump(ev);
      }
    };
    const onUp = (ev) => {
      autoVec = null;
      if (autoRaf) cancelAnimationFrame(autoRaf);
      autoRaf = 0;
      mm.classList.remove('navigating');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      // v1.8: a still click that started on a card dot = jump to that card
      if (dotHit && Math.hypot(ev.clientX - startX, ev.clientY - startY) <= 5) {
        const card = document.querySelector(`#world-${view} [data-item-id="${dotHit.id}"]`);
        if (card) {
          card.classList.remove('mm-flash');
          void card.offsetWidth; // restart the animation
          card.classList.add('mm-flash');
          setTimeout(() => card.classList.remove('mm-flash'), 1500);
        }
        if (ev.ctrlKey || ev.metaKey) {
          if (SelectedIds.has(dotHit.id)) { SelectedIds.delete(dotHit.id); SyncSelectionClasses(dotHit.id); }
          else SelectCard(dotHit.id);
          RenderBulkBar();
        }
      }
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  function ToggleMinimap(view) {
    const next = MinimapVisible(view) ? false : true;
    RDPapers.SetUI({ minimap: next });
    // sync the three control buttons + panels
    document.querySelectorAll('[data-action="toggle-minimap"]').forEach((b) => b.classList.toggle('active', next));
    ['timeline', 'map', 'group'].forEach((vw) => EnsureMinimap(vw));
    ShowToast('info', next ? 'Minimap on' : 'Minimap off', next ? 'Drag inside it to jump around the canvas.' : 'Toggle it back with the Map button or M.', { duration: 2400 });
  }

  function ClampView(v) {
    v.k = Math.min(2.5, Math.max(0.3, v.k));
    return v;
  }

  // Fit every card (and group box) into the viewport: compute the world-space
  // bounding box of all content, choose the zoom that contains it (with padding)
  // and centre it. Works on Timeline / Map / Group.
  // v1.5: when cards are selected, "Fit" zooms to the selection instead —
  // one click frames exactly the papers you were working with.
  function FitView(view) {
    const wrap = document.getElementById('wrap-' + view);
    const world = document.getElementById('world-' + view);
    if (!wrap || !world) return;
    let els = [...world.querySelectorAll('.rd-node-card, .rd-group-box')];
    if (!els.length) return;
    if (SelectedIds.size) {
      const inSel = els.filter((el) => SelectedIds.has(el.dataset.itemId));
      if (inSel.length) els = inSel;
    }
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    els.forEach((el) => {
      const l = el.offsetLeft, t = el.offsetTop, w = el.offsetWidth, h = el.offsetHeight;
      minX = Math.min(minX, l); minY = Math.min(minY, t);
      maxX = Math.max(maxX, l + w); maxY = Math.max(maxY, t + h);
    });
    const pad = 70;
    const bw = (maxX - minX) + pad * 2;
    const bh = (maxY - minY) + pad * 2;
    const rect = wrap.getBoundingClientRect();
    const k = Math.min(1.4, Math.max(0.3, Math.min(rect.width / bw, rect.height / bh)));
    const v = ClampView(RDPapers.State().ui.views[view]);
    v.k = k;
    v.x = (rect.width - bw * k) / 2 - (minX - pad) * k;
    v.y = (rect.height - bh * k) / 2 - (minY - pad) * k;
    ApplyView(view);
    RDPapers.SaveQuiet();
  }

  function AttachCanvasEvents(view) {
    const wrap = document.getElementById('wrap-' + view);
    if (!wrap) return;
    wrap.addEventListener('wheel', (e) => {
      e.preventDefault();
      const RD = RDPapers.State();
      const v = ClampView(RD.ui.views[view]);
      const rect = wrap.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const oldK = v.k;
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      v.k = Math.min(2.5, Math.max(0.3, v.k * factor));
      // keep the point under the cursor stable
      v.x = mx - ((mx - v.x) * v.k) / oldK;
      v.y = my - ((my - v.y) * v.k) / oldK;
      ApplyView(view);
      RDPapers.SaveQuiet();
    }, { passive: false });

    wrap.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 && e.button !== undefined) return;
      const target = e.target;

      // let native controls behave (minimap has its own handlers)
      if (target.closest('button, input, select, textarea')) return;
      if (target.closest('.rd-minimap')) return;

      const anchorEl = target.closest('.card-anchor-node');
      const cardEl = target.closest('.rd-node-card');
      const groupHeader = target.closest('.rd-group-box-header');

      if (anchorEl && view === 'map') {
        StartLinkDraw(view, wrap, e, anchorEl);
        return;
      }
      if (cardEl) {
        // Ctrl/Cmd + click toggles the card in the multi-selection
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          ToggleCardSelection(cardEl.dataset.itemId);
          return;
        }
        StartCardDrag(view, wrap, e, cardEl);
        return;
      }
      if (groupHeader) {
        StartGroupDrag(view, wrap, e, groupHeader.closest('.rd-group-box'));
        return;
      }
      if (e.shiftKey) {
        StartMarquee(view, wrap, e);
        return;
      }
      if (SelectedIds.size) ClearSelection();
      StartPan(view, wrap, e);
    });
  }

  function ScreenToWorld(view, wrap, clientX, clientY) {
    const RD = RDPapers.State();
    const v = RD.ui.views[view];
    const rect = wrap.getBoundingClientRect();
    return {
      x: (clientX - rect.left - v.x) / v.k,
      y: (clientY - rect.top - v.y) / v.k
    };
  }

  function MarkDragMoved() {
    LastDragEnd = Date.now();
  }

  function WasRecentlyDragging() {
    return Date.now() - LastDragEnd < 400;
  }

  // --- panning ---
  function StartPan(view, wrap, e) {
    e.preventDefault();
    const RD = RDPapers.State();
    const v = RD.ui.views[view];
    const startX = e.clientX, startY = e.clientY;
    const origX = v.x, origY = v.y;
    wrap.classList.add('panning');

    function onMove(ev) {
      v.x = origX + (ev.clientX - startX);
      v.y = origY + (ev.clientY - startY);
      ApplyView(view);
    }
    function onUp() {
      wrap.classList.remove('panning');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      RDPapers.SaveQuiet();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  // --- node card dragging (timeline / map / group) ---
  function StartCardDrag(view, wrap, e, cardEl) {
    e.preventDefault();
    const id = cardEl.dataset.itemId;
    const item = RDPapers.GetItem(id);
    if (!item) return;
    const start = ScreenToWorld(view, wrap, e.clientX, e.clientY);
    let moved = false;
    cardEl.classList.add('dragging');

    // v1.7 timeline re-year: while dragging on the timeline, the year bob
    // under the cursor becomes the drop target (card gets that year).
    let reyearBob = null;
    const clearReyear = () => {
      if (reyearBob) { reyearBob.classList.remove('reyear-target'); reyearBob = null; }
    };
    const updateReyear = (ev) => {
      if (view !== 'timeline') return;
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const bob = under && under.closest ? under.closest('.rd-tl-bob') : null;
      if (bob !== reyearBob) {
        clearReyear();
        if (bob && bob.dataset.year !== undefined) { bob.classList.add('reyear-target'); reyearBob = bob; }
      }
    };

    // bulk drag: moving a selected card moves every selected card
    const bulk = SelectedIds.has(id) && SelectedIds.size > 1
      ? [...SelectedIds].map((iid) => {
          const it = RDPapers.GetItem(iid);
          const el = document.querySelector(`#world-${view} [data-item-id="${iid}"]`);
          return it && el ? { id: iid, el, orig: { ...(it.positions[view] || { x: 0, y: 0 }) } } : null;
        }).filter(Boolean)
      : [{ id, el: cardEl, orig: { ...(item.positions[view] || { x: 0, y: 0 }) } }];

    function onMove(ev) {
      const p = ScreenToWorld(view, wrap, ev.clientX, ev.clientY);
      const dx = p.x - start.x, dy = p.y - start.y;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      moved = true;
      bulk.forEach((b) => {
        b.el.style.left = (b.orig.x + dx) + 'px';
        b.el.style.top = (b.orig.y + dy) + 'px';
      });
      if (view === 'map' && LinkCtx) return;
      if (view === 'group') HighlightGroupUnderCard(cardEl);
      if (view === 'map') RenderLinkPaths();
      updateReyear(ev);
      ScheduleMinimap(view);
    }
    function onUp(ev) {
      cardEl.classList.remove('dragging');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if (moved && reyearBob) {
        const year = reyearBob.dataset.year;
        clearReyear();
        ReyearItemFromTimeline(id, year);
        MarkDragMoved();
        return;
      }
      clearReyear();
      if (!moved) return; // plain click — keep dblclick alive
      const p = ScreenToWorld(view, wrap, ev.clientX, ev.clientY);
      const dx = p.x - start.x, dy = p.y - start.y;
      bulk.forEach((b) => RDPapers.SetItemPosition(b.id, view, b.orig.x + dx, b.orig.y + dy, { silent: true }));
      if (view === 'group') ResolveGroupDrop(cardEl, id);
      if (view === 'map') RenderLinkPaths();
      MarkDragMoved();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  // Drop a timeline card onto a year bob: set the year and snap the card
  // into that year's column (bottom row). Undo restores the old year + pos.
  function ReyearItemFromTimeline(id, year) {
    const item = RDPapers.GetItem(id);
    if (!item) return;
    const newYear = year === '????' ? null : Number(year);
    if (item.year === newYear) return;
    const oldYear = item.year;
    const oldPos = item.positions.timeline ? { ...item.positions.timeline } : null;
    item.year = newYear;
    item.positions.timeline = null;
    RDPapers.EnsureDefaultsForItem(item);
    RDPapers.Commit();
    RenderAll();
    ShowToast('success', 'Moved to ' + (newYear || 'Unknown year'), '“' + RDPapers.ShortTitle(item.title) + '” re-dated to ' + (newYear || '?') + '.', {
      actionLabel: 'Undo', duration: 7000,
      onAction: () => {
        const it = RDPapers.GetItem(id);
        if (!it) return;
        it.year = oldYear;
        it.positions.timeline = oldPos || { ...it.positions.timeline };
        RDPapers.Commit();
        RenderAll();
      }
    });
  }

  // --- multi-select ---
  function SyncSelectionClasses(id) {
    document.querySelectorAll(`.rd-node-card[data-item-id="${id}"], .rd-item-card[data-item-id="${id}"]`)
      .forEach((el) => el.classList.toggle('selected', SelectedIds.has(id)));
    document.querySelectorAll(`.rd-card-check[data-id="${id}"]`)
      .forEach((el) => {
        el.classList.toggle('checked', SelectedIds.has(id));
        el.setAttribute('aria-pressed', String(SelectedIds.has(id)));
      });
  }

  function ToggleCardSelection(id) {
    if (!id) return;
    if (SelectedIds.has(id)) SelectedIds.delete(id);
    else SelectedIds.add(id);
    SyncSelectionClasses(id);
    RenderBulkBar();
  }

  function SelectCard(id) {
    if (!id || SelectedIds.has(id)) return;
    SelectedIds.add(id);
    SyncSelectionClasses(id);
    RenderBulkBar();
  }

  function ClearSelection() {
    if (!SelectedIds.size) return;
    const ids = [...SelectedIds];
    SelectedIds.clear();
    LastListCheckId = null;
    ids.forEach(SyncSelectionClasses);
    RenderBulkBar();
  }

  // Shift + drag on empty canvas draws a marquee rectangle; every card
  // intersecting it becomes selected (screen-space rect, world-space hit test).
  function StartMarquee(view, wrap, e) {
    e.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
    let marquee = wrap.querySelector('.rd-marquee');
    if (!marquee) {
      marquee = document.createElement('div');
      marquee.className = 'rd-marquee';
      wrap.appendChild(marquee);
    }
    let lastHits = [];
    let moved = false;

    function hitTest(x1, y1, x2, y2) {
      // screen corners -> world corners
      const a = ScreenToWorld(view, wrap, rect.left + x1, rect.top + y1);
      const b = ScreenToWorld(view, wrap, rect.left + x2, rect.top + y2);
      const wx1 = Math.min(a.x, b.x), wy1 = Math.min(a.y, b.y);
      const wx2 = Math.max(a.x, b.x), wy2 = Math.max(a.y, b.y);
      const hits = [];
      document.querySelectorAll(`#world-${view} .rd-node-card`).forEach((el) => {
        const l = el.offsetLeft, t = el.offsetTop;
        const w = el.offsetWidth, h = el.offsetHeight;
        if (!(l > wx2 || l + w < wx1 || t > wy2 || t + h < wy1)) hits.push(el.dataset.itemId);
      });
      return hits;
    }

    function paintRect(cx, cy) {
      const x = Math.min(sx, cx), y = Math.min(sy, cy);
      marquee.style.left = x + 'px';
      marquee.style.top = y + 'px';
      marquee.style.width = Math.abs(cx - sx) + 'px';
      marquee.style.height = Math.abs(cy - sy) + 'px';
      marquee.style.display = 'block';
    }

    function onMove(ev) {
      const cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
      if (!moved && Math.abs(cx - sx) * Math.abs(cy - sy) < 24) return;
      moved = true;
      paintRect(cx, cy);
      lastHits = hitTest(cx, cy, sx, sy);
      document.querySelectorAll(`#world-${view} .rd-node-card`).forEach((el) => {
        el.classList.toggle('selected', lastHits.indexOf(el.dataset.itemId) !== -1);
      });
    }
    function onUp() {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      marquee.style.display = 'none';
      marquee.style.width = '0px';
      marquee.style.height = '0px';
      if (!moved) return;
      SelectedIds = new Set(lastHits);
      document.querySelectorAll(`#world-${view} .rd-node-card`).forEach((el) => {
        el.classList.toggle('selected', SelectedIds.has(el.dataset.itemId));
      });
      RenderBulkBar();
      if (SelectedIds.size) ShowToast('info', SelectedIds.size + ' selected', 'Bulk actions below — drag any selected card to move them all. Esc clears.', { duration: 3200 });
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  // --- floating bulk action bar ---
  function RenderBulkBar() {
    const bar = document.getElementById('rd-bulk-bar');
    if (!bar) return;
    const n = SelectedIds.size;
    if (!n) {
      bar.classList.remove('visible');
      bar.innerHTML = '';
      return;
    }
    const RD = RDPapers.State();
    const opts = ['<option value="">Move to group&hellip;</option>', '<option value="__UNSORTED__">&mdash; Unsorted &mdash;</option>']
      .concat(RD.groupOrder.map((gid) => {
        const g = RDPapers.GetGroup(gid);
        return g ? `<option value="${g.id}">${esc(g.name)}</option>` : '';
      })).join('');
    const colorDots = ['<button class="bulk-color-dot auto" data-action="bulk-color" data-color="" title="Reset colours — follow group"><span></span></button>']
      .concat(RDPapers.ITEM_PALETTE.map((c) =>
        `<button class="bulk-color-dot" data-action="bulk-color" data-color="${c}" style="background:${c}" title="Recolour selection ${c}" aria-label="Recolour selection ${c}"></button>`))
      .join('');
    bar.innerHTML = `
      <span class="bulk-count">${n} selected</span>
      <span class="bulk-sep"></span>
      <span class="bulk-colors" role="group" aria-label="Recolour selection">${colorDots}</span>
      <span class="bulk-sep"></span>
      <button class="bulk-btn" data-action="bulk-status" data-status="read" title="Mark selection as read">${ICONS.check}<span>Read</span></button>
      <button class="bulk-btn" data-action="bulk-status" data-status="reading" title="Mark selection as reading">${ICONS.clock}<span>Reading</span></button>
      <button class="bulk-btn" data-action="bulk-status" data-status="unread" title="Mark selection as unread">${ICONS.zoomOut}<span>Unread</span></button>
      <button class="bulk-btn" data-action="bulk-star" title="Star selection">${ICONS.star}<span>Star</span></button>
      <button class="bulk-btn" data-action="bulk-unstar" title="Unstar selection">${ICONS.x}<span>Unstar</span></button>
      <button class="bulk-btn" data-action="bulk-bibtex" title="Copy BibTeX for every selected item — paste straight into your .bib file">${ICONS.copy}<span>BibTeX</span></button>
      <select class="bulk-select" data-change="bulk-assign" aria-label="Move selection to group">${opts}</select>
      <span class="bulk-sep"></span>
      <button class="bulk-btn ghost" data-action="bulk-select-all" title="Select every item matching the current filters">${ICONS.grid}<span>All</span></button>
      <button class="bulk-btn danger" data-action="bulk-delete" title="Delete selection">${ICONS.trash}<span>Delete</span></button>
      <button class="bulk-btn ghost" data-action="bulk-clear" title="Clear selection (Esc)">${ICONS.x}</button>
    `;
    bar.classList.add('visible');
  }

  // Select every item that survives the current filters (list + canvases).
  function SelectAllVisible() {
    const ids = RDPapers.VisibleItems().map((i) => i.id);
    SelectedIds = new Set(ids);
    ids.forEach(SyncSelectionClasses);
    // canvases may not be rendered right now — toggle whatever exists
    document.querySelectorAll('.rd-node-card, .rd-item-card').forEach((el) => {
      el.classList.toggle('selected', SelectedIds.has(el.dataset.itemId));
    });
    RenderBulkBar();
    ShowToast('info', ids.length + ' selected', 'Everything matching the current filters.', { duration: 2600 });
  }

  function DoBulkUpdate(patch) {
    const ids = [...SelectedIds];
    if (!ids.length) return;
    const touched = RDPapers.BulkUpdate(ids, patch);
    ClearSelection();
    RenderAll();
    ShowToast('success', touched + ' item' + (touched === 1 ? '' : 's') + ' updated', 'Bulk change applied.');
  }

  async function BulkDeleteFlow() {
    const ids = [...SelectedIds];
    const n = ids.length;
    if (!n) return;
    const ok = await ConfirmAction({
      title: 'Delete ' + n + ' item' + (n === 1 ? '' : 's') + '?',
      html: 'This removes ' + n + ' item' + (n === 1 ? '' : 's') + ' and any mind-map links attached to them.',
      okLabel: 'Delete', danger: true
    });
    if (!ok) return;
    const snapshot = JSON.parse(JSON.stringify(RDPapers.State()));
    const removed = RDPapers.BulkDelete(ids);
    ClearSelection();
    RenderAll();
    ShowToast('info', removed + ' item' + (removed === 1 ? '' : 's') + ' deleted', 'You can undo for a few seconds.', {
      actionLabel: 'Undo', duration: 8000,
      onAction: () => { RDPapers.ReplaceAll(snapshot); RenderAll(); }
    });
  }

  // --- group box dragging ---
  function StartGroupDrag(view, wrap, e, boxEl) {
    if (!boxEl) return;
    e.preventDefault();
    const gid = boxEl.dataset.groupId;
    const g = RDPapers.GetGroup(gid);
    if (!g) return;
    const start = ScreenToWorld(view, wrap, e.clientX, e.clientY);
    const orig = { x: g.x, y: g.y };
    let moved = false;

    function onMove(ev) {
      const p = ScreenToWorld(view, wrap, ev.clientX, ev.clientY);
      const dx = p.x - start.x, dy = p.y - start.y;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      moved = true;
      boxEl.style.left = (orig.x + dx) + 'px';
      boxEl.style.top = (orig.y + dy) + 'px';
      // move member cards live
      const world = document.getElementById('world-group');
      RDPapers.State().items.forEach((it) => {
        if (it.groupId !== gid) return;
        const el = world.querySelector(`[data-item-id="${it.id}"]`);
        const o = it.positions.group;
        if (el && o) {
          el.style.left = (o.x + dx) + 'px';
          el.style.top = (o.y + dy) + 'px';
        }
      });
      ScheduleMinimap(view);
    }
    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      if (!moved) { MarkDragMoved(); return; }
      const p = ScreenToWorld(view, wrap, ev.clientX, ev.clientY);
      RDPapers.SetGroupPosition(gid, orig.x + (p.x - start.x), orig.y + (p.y - start.y),
        p.x - start.x, p.y - start.y, { silent: true });
      MarkDragMoved();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  // --- group drop resolution ---
  function HighlightGroupUnderCard(cardEl) {
    const world = document.getElementById('world-group');
    if (!world) return;
    const cx = cardEl.offsetLeft + cardEl.offsetWidth / 2;
    const cy = cardEl.offsetTop + cardEl.offsetHeight / 2;
    world.querySelectorAll('.rd-group-box').forEach((box) => {
      const bx = box.offsetLeft, by = box.offsetTop;
      const bw = box.offsetWidth, bh = box.offsetHeight;
      const inside = cx >= bx && cx <= bx + bw && cy >= by && cy <= by + bh;
      box.classList.toggle('drop-hover', inside);
    });
  }

  function ResolveGroupDrop(cardEl, itemId) {
    const world = document.getElementById('world-group');
    if (!world) return;
    let targetGid = null;
    const cx = cardEl.offsetLeft + cardEl.offsetWidth / 2;
    const cy = cardEl.offsetTop + cardEl.offsetHeight / 2;
    world.querySelectorAll('.rd-group-box').forEach((box) => {
      const bx = box.offsetLeft, by = box.offsetTop;
      const bw = box.offsetWidth, bh = box.offsetHeight;
      if (cx >= bx && cx <= bx + bw && cy >= by && cy <= by + bh) targetGid = box.dataset.groupId;
      box.classList.remove('drop-hover');
    });
    const item = RDPapers.GetItem(itemId);
    if (!item) return;
    if ((item.groupId || null) !== (targetGid || null)) {
      RDPapers.AssignItemToGroup(itemId, targetGid);
      const g = targetGid ? RDPapers.GetGroup(targetGid) : null;
      ShowToast('success', g ? 'Moved to ' + g.name : 'Moved to Unsorted');
      RenderAll();
    }
  }

  // --- map link drawing ---
  function StartLinkDraw(view, wrap, e, anchorEl) {
    e.preventDefault();
    e.stopPropagation();
    const cardEl = anchorEl.closest('.rd-node-card');
    if (!cardEl) return;
    const fromId = cardEl.dataset.itemId;
    const fromAnchor = anchorEl.dataset.anchor;
    const svg = document.getElementById('rd-map-svg');
    if (!svg) return;

    const start = ScreenToWorld(view, wrap, e.clientX, e.clientY);
    cardEl.classList.add('linking-source');
    const temp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    temp.setAttribute('class', 'rd-link-temp');
    temp.setAttribute('d', `M ${start.x} ${start.y} L ${start.x} ${start.y}`);
    svg.appendChild(temp);

    let hoverCard = null;
    function onMove(ev) {
      const p = ScreenToWorld(view, wrap, ev.clientX, ev.clientY);
      temp.setAttribute('d', `M ${start.x} ${start.y} L ${p.x} ${p.y}`);
      const elUnder = document.elementFromPoint(ev.clientX, ev.clientY);
      const c = elUnder ? elUnder.closest('.rd-node-card') : null;
      if (hoverCard && hoverCard !== c) hoverCard.classList.remove('selected');
      if (c && c.dataset.itemId !== fromId) { c.classList.add('selected'); hoverCard = c; }
      else hoverCard = null;
    }
    function onUp(ev) {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      temp.remove();
      cardEl.classList.remove('linking-source');
      if (hoverCard) hoverCard.classList.remove('selected');
      const elUnder = document.elementFromPoint(ev.clientX, ev.clientY);
      const c = elUnder ? elUnder.closest('.rd-node-card') : null;
      if (c && c.dataset.itemId !== fromId) {
        const link = RDPapers.AddLink(fromId, c.dataset.itemId, fromAnchor, anchorFromElement(c, ev));
        if (link) {
          ShowToast('success', 'Linked', 'Connection created — click the dashed line to remove it.');
          RenderMap();
        }
      }
      MarkDragMoved();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }

  function anchorFromElement(cardEl, ev) {
    const r = cardEl.getBoundingClientRect();
    const dx = (ev.clientX - r.left) / r.width;
    const dy = (ev.clientY - r.top) / r.height;
    if (Math.abs(dx - 0.5) < Math.abs(dy - 0.5)) return dy < 0.5 ? 'a-n' : 'a-s';
    return dx < 0.5 ? 'a-w' : 'a-e';
  }

  // ---------- MODAL ----------

  function InitModalRoot() {
    const root = document.getElementById('rd-modal-root');
    root.addEventListener('mousedown', (e) => {
      if (e.target.classList && e.target.classList.contains('modal-overlay')) {
        CloseItemModal();
      }
    });
  }

  function OpenItemModal(mode, itemId, prefill) {
    const root = document.getElementById('rd-modal-root');
    ModalCtx = { mode: mode || 'add', itemId: itemId || null, busy: false, pendingEntries: [], dupWarned: false };
    const item = itemId ? RDPapers.GetItem(itemId) : null;
    const fields = item ? { ...item } : Object.assign({ type: 'paper', status: 'unread', authors: [], tags: [] }, prefill || {});
    root.innerHTML = GetItemModalHTML(ModalCtx.mode, fields);
    PaintProgressSlider();
    const titleInput = document.getElementById('rd-f-title');
    if (titleInput) {
      titleInput.focus();
      if (!fields.title) titleInput.placeholder = 'Required — paste a DOI or BibTeX above to autofill, or type here';
    }
    if (!item && prefill && prefill.doi) {
      // auto-lookup when opened with a DOI prefill (e.g. quick-add flows)
      FetchDoiIntoModal();
    }
  }

  function CloseItemModal() {
    const root = document.getElementById('rd-modal-root');
    if (root) root.innerHTML = '';
    ModalCtx = { mode: 'add', itemId: null, busy: false, pendingEntries: [], dupWarned: false };
  }

  function ShowImportAlert(kind, html) {
    const alertEl = document.getElementById('rd-import-alert');
    if (!alertEl) return;
    alertEl.className = 'rd-alert ' + kind;
    alertEl.innerHTML = (kind === 'success' ? ICONS.check : kind === 'error' ? ICONS.alert : ICONS.info) + '<span>' + html + '</span>';
  }

  function FillModalFields(fields) {
    const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
    set('rd-f-title', fields.title || '');
    set('rd-f-type', fields.type || 'paper');
    set('rd-f-status', fields.status || 'unread');
    set('rd-f-authors', (fields.authors || []).join('; '));
    set('rd-f-journal', fields.journal || '');
    set('rd-f-volume', fields.volume || '');
    set('rd-f-issue', fields.issue || '');
    set('rd-f-pages', fields.pages || '');
    set('rd-f-year', fields.year || '');
    set('rd-f-publisher', fields.publisher || '');
    set('rd-f-doi', fields.doi || '');
    set('rd-f-tags', (fields.tags || []).join(', '));
    set('rd-f-progress', (typeof fields.progress === 'number' ? fields.progress : 0));
    const pv = document.getElementById('rd-progress-val');
    if (pv) pv.textContent = (fields.progress || 0) + '%';
  }

  async function FetchDoiIntoModal() {
    const doiInput = document.getElementById('rd-doi-input');
    const btn = document.getElementById('rd-fetch-doi-btn');
    if (!doiInput || ModalCtx.busy) return;
    const raw = doiInput.value.trim();
    if (!raw) {
      ShowImportAlert('error', 'Type a DOI first (e.g. 10.1002/0470841559.ch1).');
      return;
    }
    ModalCtx.busy = true;
    const oldHtml = btn.innerHTML;
    btn.innerHTML = '<span class="spin" style="display:inline-block;width:13px;height:13px;border:2px solid var(--border-light);border-top-color:var(--accent);border-radius:50%;"></span> Fetching';
    btn.disabled = true;
    try {
      const res = await RDDoi.LookupDOI(raw);
      FillModalFields(res.fields);
      const doiField = document.getElementById('rd-f-doi');
      if (doiField) doiField.value = res.fields.doi || raw;
      ShowImportAlert('success', '<b>Metadata loaded from ' + esc(res.source) + '.</b> Review the fields below and edit anything before saving.');
    } catch (err) {
      ShowImportAlert('error', '<b>' + esc(err.message || 'Lookup failed.') + '</b>');
    } finally {
      ModalCtx.busy = false;
      btn.disabled = false;
      btn.innerHTML = oldHtml;
    }
  }

  function ParseBibtexIntoModal() {
    const ta = document.getElementById('rd-bibtex-input');
    if (!ta) return;
    const text = ta.value.trim();
    if (!text) {
      ShowImportAlert('error', 'Paste a BibTeX entry first, then press Parse.');
      return;
    }
    const all = RDBibtex.ParseBibtexAll(text);
    if (!all.length) {
      ShowImportAlert('error', 'Could not parse any BibTeX entry. Check that the text starts with @article{...}, @book{...} or @phdthesis{...}.');
      return;
    }
    FillModalFields(all[0]);
    ModalCtx.pendingEntries = all.slice(1);
    if (ModalCtx.pendingEntries.length) {
      ShowImportAlert('info', '<b>' + all.length + ' entries found.</b> The first one fills the form below; the other ' +
        ModalCtx.pendingEntries.length + ' will be imported together when you press Save.');
    } else {
      ShowImportAlert('info', '<b>BibTeX parsed.</b> Review the fields below — everything stays editable.');
    }
  }

  function CollectModalFields() {
    const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const authors = val('rd-f-authors')
      .split(/;|\band\b/i)
      .map((a) => a.trim()).filter(Boolean);
    const tags = val('rd-f-tags').split(',').map((t) => t.trim()).filter(Boolean);
    return {
      title: val('rd-f-title'),
      type: val('rd-f-type') || 'paper',
      status: val('rd-f-status') || 'unread',
      progress: Number(val('rd-f-progress')) || 0,
      authors,
      journal: val('rd-f-journal'),
      publisher: val('rd-f-publisher'),
      volume: val('rd-f-volume'),
      issue: val('rd-f-issue'),
      pages: val('rd-f-pages'),
      year: val('rd-f-year') ? Number(val('rd-f-year')) : null,
      doi: val('rd-f-doi'),
      tags,
      groupId: val('rd-f-group') || null
    };
  }

  function SaveItemFromModal() {
    const fields = CollectModalFields();
    const titleEl = document.getElementById('rd-f-title');
    if (!fields.title) {
      if (titleEl) {
        titleEl.classList.add('error');
        titleEl.focus();
        setTimeout(() => titleEl.classList.remove('error'), 1600);
      }
      ShowImportAlert('error', '<b>Paper Title is required.</b> All other fields are optional.');
      return;
    }

    // Non-blocking duplicate warning: first Save click warns, second click proceeds.
    const dups = RDPapers.FindDuplicates(fields, ModalCtx.itemId);
    if (dups.length && !ModalCtx.dupWarned) {
      ModalCtx.dupWarned = true;
      const names = dups.slice(0, 2).map((d) => '“' + (d.title.length > 46 ? d.title.slice(0, 46) + '…' : d.title) + '”').join(', ');  
      ShowImportAlert('error', '<b>Possible duplicate:</b> ' + esc(names) + (dups.length > 2 ? ' and ' + (dups.length - 2) + ' more' : '') +
        (dups.length === 1 ? ' is already' : ' are already') + ' in your library. Press <b>' + (ModalCtx.mode === 'edit' ? 'Save Changes' : 'Save Paper') + '</b> again to add it anyway.');
      const saveBtn = document.querySelector('[data-action=save-item]');
      if (saveBtn) saveBtn.textContent = 'Save Anyway';
      return;
    }

    // ensure a clean citation key
    const RD = RDPapers.State();
    const usedKeys = new Set(RD.items.map((i) => i.bibtexKey).filter(Boolean));
    if (ModalCtx.itemId) {
      const existing = RDPapers.GetItem(ModalCtx.itemId);
      if (existing && existing.bibtexKey) usedKeys.delete(existing.bibtexKey);
    }
    if (!fields.bibtexKey) fields.bibtexKey = RDBibtex.GenerateCitationKey(fields, usedKeys);

    let extraCount = 0;
    if (ModalCtx.mode === 'edit' && ModalCtx.itemId) {
      RDPapers.UpdateItem(ModalCtx.itemId, fields);
      ShowToast('success', 'Paper updated', fields.title);
    } else {
      RDPapers.AddItem(fields, { groupId: fields.groupId });
      ShowToast('success', 'Paper added to library', fields.title);
    }
    // bulk entries parsed from a multi-entry BibTeX paste
    if (ModalCtx.pendingEntries && ModalCtx.pendingEntries.length) {
      const used = new Set(RDPapers.State().items.map((i) => i.bibtexKey).filter(Boolean));
      const extras = ModalCtx.pendingEntries.filter((pe) => {
        if (pe.title && RDPapers.FindDuplicates({ doi: pe.doi, title: pe.title }).length) return false;
        return true;
      });
      extras.forEach((pe) => { if (!pe.bibtexKey) pe.bibtexKey = RDBibtex.GenerateCitationKey(pe, used); });
      if (extras.length) {
        RDPapers.AddItems(extras);
        extraCount = extras.length;
        ShowToast('info', extraCount + ' extra BibTeX entr' + (extraCount === 1 ? 'y' : 'ies') + ' imported', 'Parsed from the same paste.');
      }
    }
    CloseItemModal();
  }

  async function CopyBibtexForItem(id) {
    const item = RDPapers.GetItem(id);
    if (!item) return;
    const bib = RDBibtex.ItemToBibtex(item);
    const ok = await RDBibtex.CopyToClipboard(bib);
    if (ok) ShowToast('success', 'BibTeX copied', item.bibtexKey || item.title);
    else ShowToast('error', 'Copy failed', 'Select and copy manually from the BibTeX view.');
  }

  // ---------- TOASTS & CONFIRM ----------

  function ShowToast(kind, title, sub, opts) {
    const stack = document.getElementById('rd-toast-stack');
    if (!stack) return;
    const el = document.createElement('div');
    el.className = 'rd-toast ' + (kind || 'info');
    el.innerHTML = (kind === 'success' ? ICONS.check : kind === 'error' ? ICONS.alert : ICONS.info) +
      '<div><div style="font-weight:700;">' + esc(title) + '</div>' +
      (sub ? '<div style="opacity:.75; margin-top:2px;">' + esc(sub) + '</div>' : '') + '</div>';
    let done = false;
    const dismiss = () => {
      if (done) return;
      done = true;
      el.classList.add('leaving');
      setTimeout(() => el.remove(), 260);
    };
    if (opts && opts.actionLabel && typeof opts.onAction === 'function') {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'rd-toast-action';
      b.textContent = opts.actionLabel;
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        dismiss();
        opts.onAction();
      });
      el.appendChild(b);
    }
    stack.appendChild(el);
    setTimeout(dismiss, (opts && opts.duration) || 3400);
  }

  let ConfirmResolve = null;

  function ConfirmAction(opts) {
    const root = document.getElementById('rd-confirm-root');
    root.innerHTML = GetConfirmHTML(opts);
    return new Promise((resolve) => {
      ConfirmResolve = resolve;
    });
  }

  function SettleConfirm(val) {
    const root = document.getElementById('rd-confirm-root');
    if (root) root.innerHTML = '';
    if (ConfirmResolve) { ConfirmResolve(val); ConfirmResolve = null; }
  }

  // ---------- TAG RENAME DIALOG (rename a tag across the library) ----------

  function RenameTagDialog(oldTag) {
    const root = document.getElementById('rd-confirm-root');
    if (!root || !oldTag) return;
    const count = RDPapers.GetAllItems().filter((it) => (it.tags || []).some((t) => String(t).toLowerCase() === String(oldTag).toLowerCase())).length;
    root.innerHTML = `
      <div class="modal-overlay" style="z-index:1000;" id="rd-rename-overlay">
        <div class="modal-card" style="width:min(400px,100%);" role="dialog" aria-modal="true" aria-label="Rename tag">
          <div class="modal-header"><h3>${ICONS.pencil} Rename tag</h3></div>
          <div class="modal-body">
            <div class="rd-rename-preview">
              <span class="rd-tag-pill editable">#${esc(oldTag)}</span>
              <span class="rd-rename-arrow">${ICONS.arrowRight}</span>
              <span class="rd-tag-pill editable ghosted" id="rd-rename-live">#—</span>
            </div>
            <input type="text" id="rd-rename-input" class="rd-rename-input" maxlength="32"
                   placeholder="New tag name" value="${esc(oldTag)}" aria-label="New tag name" />
            <div class="rd-rename-hint">Renames <b>#${esc(oldTag)}</b> on <b>${count}</b> item${count === 1 ? '' : 's'} — everywhere it appears (cards, drawer, stats, filters).</div>
          </div>
          <div class="modal-footer">
            <button class="ghost-btn" id="rd-rename-cancel">Cancel</button>
            <button class="primary-btn" id="rd-rename-ok">Rename everywhere</button>
          </div>
        </div>
      </div>`;
    const input = document.getElementById('rd-rename-input');
    const live = document.getElementById('rd-rename-live');
    const finish = (save) => {
      if (save) {
        const to = (input.value || '').trim().replace(/^#/, '');
        if (!to) { input.classList.add('invalid'); input.focus(); return; }
        const n = RDPapers.RenameTag(oldTag, to);
        if (n > 0) {
          ShowToast('success', 'Tag renamed', `#${oldTag} → #${to} on ${n} item${n === 1 ? '' : 's'}.`);
          RenderAll();
          if (DrawerItemId) RefreshDrawer();
        } else if (n === 0) {
          ShowToast('info', 'Nothing to rename', 'No item carries that tag anymore.');
        }
      }
      root.innerHTML = '';
    };
    document.getElementById('rd-rename-ok').addEventListener('click', () => finish(true));
    document.getElementById('rd-rename-cancel').addEventListener('click', () => finish(false));
    document.getElementById('rd-rename-overlay').addEventListener('mousedown', (e) => {
      if (e.target.id === 'rd-rename-overlay') finish(false);
    });
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); finish(true); }
      if (ev.key === 'Escape') { ev.preventDefault(); finish(false); }
      ev.stopPropagation();
    });
    input.addEventListener('input', () => {
      const v = (input.value || '').trim().replace(/^#/, '');
      live.textContent = v ? '#' + v : '#—';
      input.classList.remove('invalid');
    });
    input.focus();
    input.select();
  }

  // ---------- DETAIL DRAWER (metadata, tags & BibTeX per item) ----------

  let DrawerItemId = null;

  function MetaRow(label, value, opts) {
    if (!value) return '';
    const o = opts || {};
    return `<div class="rd-drawer-meta-row">
      <span class="rd-drawer-meta-label">${label}</span>
      <span class="rd-drawer-meta-value ${o.mono ? 'mono' : ''}">${o.raw ? value : esc(value)}</span>
    </div>`;
  }

  function GetDrawerHTML(item) {
    const group = item.groupId ? RDPapers.GetGroup(item.groupId) : null;
    const authors = item.authors || [];
    const key = item.bibtexKey || (RDBibtex.ItemToBibtex(item).match(/@\w+\{([^,]+)/) || [])[1] || '';
    const doi = (item.doi || '').replace(/^https?:\/\/(dx\.)?doi\.org\//i, '');
    const tagChips = (item.tags || []).map((t) =>
      `<span class="rd-tag-pill editable">#${esc(t)}<button class="rd-tag-x" data-action="rename-tag" data-tag="${esc(t)}" title="Rename this tag everywhere" aria-label="Rename tag ${esc(t)}">${ICONS.pencil}</button><button class="rd-tag-x" data-action="drawer-remove-tag" data-tag="${esc(t)}" title="Remove tag" aria-label="Remove tag ${esc(t)}">&times;</button></span>`
    ).join('');
    const linked = RDPapers.LinkedItems(item.id);
    const linkedRows = linked.map(({ other, dir }) => {

  function OpenDrawer(id) {
    const item = RDPapers.GetItem(id);
    if (!item) return;
    DrawerItemId = id;
    const root = document.getElementById('rd-drawer-root');
    if (!root) return;
    root.innerHTML = GetDrawerHTML(item);
    requestAnimationFrame(() => {
      const backdrop = root.querySelector('.rd-drawer-backdrop');
      const panel = root.querySelector('.rd-drawer');
      if (backdrop) backdrop.classList.add('show');
      if (panel) panel.classList.add('show');
    });
    WireDrawer(item.id);
  }

  function CloseDrawer() {
    DrawerItemId = null;
    const root = document.getElementById('rd-drawer-root');
    if (!root || !root.innerHTML) return;
    const backdrop = root.querySelector('.rd-drawer-backdrop');
    const panel = root.querySelector('.rd-drawer');
    if (backdrop) backdrop.classList.remove('show');
    if (panel) panel.classList.remove('show');
    setTimeout(() => { if (!DrawerItemId) root.innerHTML = ''; }, 240);
  }

  function RefreshDrawer() {
    if (!DrawerItemId) return;
    const item = RDPapers.GetItem(DrawerItemId);
    const root = document.getElementById('rd-drawer-root');
    if (!item || !root) { DrawerItemId = null; if (root) root.innerHTML = ''; return; }
    root.innerHTML = GetDrawerHTML(item);
    const backdrop = root.querySelector('.rd-drawer-backdrop');
    const panel = root.querySelector('.rd-drawer');
    if (backdrop) backdrop.classList.add('show');
    if (panel) panel.classList.add('show');
    WireDrawer(item.id);
  }

  function WireDrawer(id) {
    const input = document.getElementById('rd-drawer-tag-input');
    if (input) {
      input.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const tag = input.value.trim().replace(/^#/, '');
        if (!tag) return;
        const item = RDPapers.GetItem(id);
        if (!item) return;
        const tags = Array.from(new Set([...(item.tags || []), tag]));
        RDPapers.UpdateItem(id, { tags });
        RenderAll();
        RefreshDrawer();
        const ni = document.getElementById('rd-drawer-tag-input');
        if (ni) { ni.focus(); }
      });
    }
    const slider = document.getElementById('rd-drawer-progress');
    if (slider) {
      slider.addEventListener('input', () => {
        const v = document.getElementById('rd-drawer-progress-val');
        if (v) v.textContent = slider.value + '%';
        slider.style.setProperty('--fill', slider.value + '%');
      });
      slider.addEventListener('change', () => {
        const p = Number(slider.value);
        const patch = { progress: p };
        if (p >= 100) patch.status = 'read';
        else if (p > 0 && RDPapers.GetItem(id) && RDPapers.GetItem(id).status === 'unread') patch.status = 'reading';
        RDPapers.UpdateItem(id, patch);
        RenderAll();
        RefreshDrawer();
      });
    }
    // local notes: debounced auto-save that does NOT re-render (keeps caret)
    const notes = document.getElementById('rd-drawer-notes');
    if (notes) {
      let timer = null;
      const statusEl = document.getElementById('rd-drawer-notes-status');
      const countEl = document.getElementById('rd-drawer-notes-count');
      const setSaved = () => { if (statusEl) { statusEl.textContent = 'Saved ✓'; statusEl.classList.add('saved'); } };
      notes.addEventListener('input', () => {
        if (statusEl) { statusEl.textContent = 'Saving…'; statusEl.classList.remove('saved'); }
        if (countEl) countEl.textContent = notes.value.length + ' chars';
        clearTimeout(timer);
        timer = setTimeout(() => {
          const it = RDPapers.GetItem(id);
          if (!it) return;
          it.notes = notes.value;
          it.updatedAt = new Date().toISOString();
          RDPapers.SaveQuiet();
          setSaved();
        }, 500);
      });
      notes.addEventListener('blur', () => {
        clearTimeout(timer);
        const it = RDPapers.GetItem(id);
        if (it && it.notes !== notes.value) {
          it.notes = notes.value;
          it.updatedAt = new Date().toISOString();
          RDPapers.SaveQuiet();
        }
        setSaved();
      });
    }
  }

  // ---------- READING QUEUE (slide-in, left) ----------

  function GetQueueHTML() {
    const RD = RDPapers.State();
    const items = RDPapers.QueueItems();
    const reading = items.filter((i) => i.status === 'reading').length;
    const mode = RDPapers.QUEUE_SORTS.indexOf(RD.ui.queueSort) !== -1 ? RD.ui.queueSort : 'smart';
    const hasManualOrder = mode === 'smart' && (RD.ui.queueOrder || []).length > 0;
    const sortOptions = [
      ['smart', 'Smart order'],
      ['added-desc', 'Recently added'],
      ['year-asc', 'Oldest first'],
      ['year-desc', 'Newest first'],
      ['title', 'Title A–Z'],
      ['venue', 'Venue / journal']
    ];
    const rows = items.map((item, idx) => {
      const group = item.groupId ? RDPapers.GetGroup(item.groupId) : null;
      const meta = [
        (item.authors || []).slice(0, 2).join('; ') + ((item.authors || []).length > 2 ? ' et al.' : ''),
        item.year || '',
        group ? group.name : ''
      ].filter(Boolean).join(' · ');
      const p = item.progress || 0;
      return `
        <li class="rd-queue-row ${item.status}" data-item-id="${item.id}" ${mode === 'smart' ? 'draggable="true"' : ''} data-queue-drag="${item.id}">
          ${mode === 'smart' ? `<span class="rd-queue-grip" title="Drag to pin your own order">${ICONS.grip}</span>` : '<span class="rd-queue-grip locked" title="Hand-pinning is off while a sort mode is active"></span>'}
          <span class="rd-queue-pos">${idx + 1}</span>
          <div class="rd-queue-main" data-action="queue-open" data-id="${item.id}" title="Open details">
            <div class="rd-queue-title">
              <span class="rd-queue-status-dot ${item.status}" title="${STATUS_LABEL[item.status]}"></span>
              ${item.starred ? `<span class="rd-queue-star" title="Starred — pinned up the queue">${ICONS.star}</span>` : ''}
              <span class="t">${esc(item.title)}</span>
            </div>
            <div class="rd-queue-meta">${esc(meta)}</div>
            <div class="rd-queue-bar"><div class="rd-queue-bar-fill ${item.status}" style="width:${p}%"></div></div>
          </div>
          <div class="rd-queue-actions">
            ${item.status === 'reading'
              ? `<button class="rd-action-btn" data-action="queue-mark-read" data-id="${item.id}" title="Mark as read">${ICONS.check}</button>`
              : `<button class="rd-action-btn" data-action="queue-start" data-id="${item.id}" title="Start reading now">${ICONS.play}</button>`}
            <button class="rd-action-btn" data-action="queue-open" data-id="${item.id}" title="Details">${ICONS.info}</button>
          </div>

    }).join('');
    return `
      <div class="rd-queue-backdrop ${RD.ui.queueOpen ? 'show' : ''}" data-action="close-queue"></div>
      <aside class="rd-queue ${RD.ui.queueOpen ? 'show' : ''}" role="dialog" aria-label="Reading queue">
        <div class="rd-queue-head">
          <div class="rd-queue-head-text">
            <span class="rd-queue-title-big">${ICONS.queue} Reading Queue</span>
            <span class="rd-queue-sub">${items.length} to go &middot; ${reading} in progress</span>
          </div>
          <button class="icon-btn" data-action="close-queue" title="Close (Esc / Q)" aria-label="Close reading queue">${ICONS.x}</button>
        </div>
        ${items.length === 0 ? `
          <div class="rd-queue-empty">
            ${ICONS.check}
            <div class="rd-queue-empty-title">All caught up!</div>
            <div class="rd-queue-empty-sub">Nothing is waiting to be read. Mark something unread — or add a new paper — and it lands here.</div>
          </div>` : `
          <div class="rd-queue-sortbar">
            <label class="rd-queue-sort-label" for="rd-queue-sort">Order</label>
            <select class="rd-select sm" id="rd-queue-sort" data-action="queue-sort" title="How the queue is ordered">
              ${sortOptions.map(([v, l]) => `<option value="${v}" ${v === mode ? 'selected' : ''}>${l}</option>`).join('')}
            </select>

          <ol class="rd-queue-list" id="rd-queue-list">${rows}</ol>
