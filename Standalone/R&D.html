              ? `<span>Drag the grip to pin your own order${hasManualOrder ? ' — <b>manual order active</b>' : ''}. Unpinned items: reading first (most progress), starred jump the line, older publications next.</span>`
              : `<span>Sorted by <b>${sortOptions.find(([v]) => v === mode)[1]}</b>. Switch back to <b>Smart order</b> to hand-pin rows.</span>`}
            ${mode === 'smart' && hasManualOrder ? `<button class="ghost-btn sm" data-action="queue-reset-order" title="Go back to the automatic smart order">${ICONS.reset}<span>Auto order</span></button>` : ''}

  function ToggleQueue() {
    const open = !RDPapers.State().ui.queueOpen;
    RDPapers.SetUI({ queueOpen: open });
    RenderQueue();
  }

  function CloseQueue() {
    if (!RDPapers.State().ui.queueOpen) return;
    RDPapers.SetUI({ queueOpen: false });
    RenderQueue();
  }

  // Re-paints only the queue panel (cheap; called from RenderAll too).
  function RenderQueue() {
    const root = document.getElementById('rd-queue-root');
    if (!root) return;
    const open = !!RDPapers.State().ui.queueOpen;
    if (!open && !root.innerHTML) return;
    root.innerHTML = GetQueueHTML();
  }

  // HTML5 drag & drop for the reading queue rows (manual pinning).
  function InitQueueDnD() {
    const root = document.getElementById('rd-queue-root');
    if (!root) return;
    let draggedId = null;
    root.addEventListener('dragstart', (e) => {
      const row = e.target.closest('[data-queue-drag]');
      if (!row) return;
      draggedId = row.dataset.queueDrag;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'q:' + draggedId);
    });
    root.addEventListener('dragend', () => {
      root.querySelectorAll('.dragging, .drop-before, .drop-after').forEach((el) => {
        el.classList.remove('dragging', 'drop-before', 'drop-after');
      });
      draggedId = null;
    });
    root.addEventListener('dragover', (e) => {
      if (!draggedId) return;
      const row = e.target.closest('[data-queue-drag]');
      if (row && row.dataset.queueDrag !== draggedId) {
        e.preventDefault();
        const r = row.getBoundingClientRect();
        const after = (e.clientY - r.top) > r.height / 2;
        row.classList.toggle('drop-after', after);
        row.classList.toggle('drop-before', !after);
      }
    });
    root.addEventListener('dragleave', (e) => {
      const row = e.target.closest && e.target.closest('[data-queue-drag]');
      if (row) row.classList.remove('drop-before', 'drop-after');
    });
    root.addEventListener('drop', (e) => {
      if (!draggedId) return;
      e.preventDefault();
      const row = e.target.closest('[data-queue-drag]');
      if (row && row.dataset.queueDrag !== draggedId) {
        const current = RDPapers.QueueItems().map((i) => i.id);
        const order = current.filter((id) => id !== draggedId);
        const tIdx = order.indexOf(row.dataset.queueDrag);
        const r = row.getBoundingClientRect();
        const after = (e.clientY - r.top) > r.height / 2;
        order.splice(after ? tIdx + 1 : tIdx, 0, draggedId);
        RDPapers.SetQueueOrder(order);
        RenderQueue();
      }
    });
  }

  // ---------- STATS POPOVER (library insights) ----------

  function DonutSVG(stats) {
    const total = stats.total || 1;
    const segs = [
      { n: stats.read, color: 'var(--green)' },
      { n: stats.reading, color: 'var(--yellow)' },
      { n: stats.unread, color: 'var(--text-dim)' }
    ].filter((s) => s.n > 0);
    const C = 2 * Math.PI * 15.9155;
    let offset = 25; // start at 12 o'clock
    const circles = segs.map((s) => {
      const frac = s.n / total;
      const dash = `${frac * C} ${C - frac * C}`;
      const el = `<circle class="donut-seg" r="15.9155" cx="21" cy="21" fill="none" stroke="${s.color}" stroke-width="5.5"\n         stroke-dasharray="${dash}" stroke-dashoffset="${offset}" stroke-linecap="butt"><title>${s.n} item(s)</title></circle>`;
      offset -= frac * 100;
      return el;
    }).join(' ');
    return `<svg class="rd-stats-donut" viewBox="0 0 42 42" width="120" height="120" role="img" aria-label="Reading status donut">
      <circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--border)" stroke-width="5.5"></circle>
      ${circles}
      <text x="21" y="20" class="donut-num">${stats.total}</text>
      <text x="21" y="26" class="donut-cap">items</text>
    </svg>`;
  }

  function GetStatsPopoverHTML() {
    const items = RDPapers.GetAllItems();
    const stats = RDPapers.Stats();
    const legend = [
      { label: 'Read', n: stats.read, cls: 'read' },
      { label: 'Reading', n: stats.reading, cls: 'reading' },
      { label: 'Unread', n: stats.unread, cls: 'unread' }
    ].map((l) => `<span class="rd-stats-legend-item"><span class="rd-status-dot ${l.cls}"></span>${l.label}<b>${l.n}</b></span>`).join('');

    const maxType = Math.max(1, stats.papers, stats.books, stats.theses);
    const typeBars = [
      { label: 'Papers', n: stats.papers, icon: ICONS.file },
      { label: 'Books', n: stats.books, icon: ICONS.book },
      { label: 'Thesis', n: stats.theses, icon: ICONS.grad }
    ].map((t) => `<div class="rd-stats-bar-row" title="${t.n} ${t.label.toLowerCase()}">
        <span class="rd-stats-bar-label">${t.icon}${t.label}</span>
        <span class="rd-stats-bar-track"><span class="rd-stats-bar-fill" style="width:${Math.round((t.n / maxType) * 100)}%"></span></span>
        <b class="rd-stats-bar-n">${t.n}</b>
      </div>`).join('');

    // top tags
    const tagCount = new Map();
    items.forEach((it) => (it.tags || []).forEach((t) => tagCount.set(t, (tagCount.get(t) || 0) + 1)));
    const topTags = Array.from(tagCount.entries()).sort((a, b) => b[1] - a[1]).slice(0, 8);
    const tagChips = topTags.length
      ? topTags.map(([t, n]) => `<button class="rd-tag-pill" data-action="filter-tag" data-tag="${esc(t)}" title="Show items tagged “${esc(t)}”">#${esc(t)}<b>${n}</b></button>`).join('')
      : '<span class="rd-stats-empty">No tags yet</span>';

    // year histogram
    const yearCount = new Map();
    items.forEach((it) => {
      const y = it.year || '????';
      yearCount.set(y, (yearCount.get(y) || 0) + 1);
    });
    const years = Array.from(yearCount.entries()).sort((a, b) => String(a[0]).localeCompare(String(b[0]))).slice(-12);
    const maxY = Math.max(1, ...years.map(([, n]) => n));
    const histogram = years.map(([y, n]) =>
      `<div class="rd-stats-year" title="${y}: ${n} item(s)">
        <span class="rd-stats-year-bar" style="height:${Math.max(8, Math.round((n / maxY) * 46))}px"></span>
        <span class="rd-stats-year-label">${esc(String(y))}</span>
      </div>`).join('');

    return `
      <div class="rd-stats-popover" role="dialog" aria-label="Library statistics">
        <div class="rd-stats-head">Library statistics</div>
        <div class="rd-stats-grid">
          <div class="rd-stats-cell">
            ${DonutSVG(stats)}

  // ---------- COMMAND PALETTE (Ctrl/Cmd + K, v1.5) ----------
  // One keyboard surface for everything: jump to any paper, switch tabs,
  // run actions. Type to filter; ↑/↓ + Enter to run; Esc closes.

  let PaletteState = { open: false, query: '', active: 0, entries: [] };

  function PaletteActions() {
    const tab = CurrentTab();
    const acts = [
      { icon: 'plus', label: 'Add a new paper…', hint: 'N', kbd: 'N', run: () => OpenItemModal('add') },
      { icon: 'queue', label: 'Toggle reading queue', hint: 'Q', kbd: 'Q', run: () => ToggleQueue() },
      { icon: 'search', label: 'Library statistics', hint: 'footer', run: () => { ToggleStatsPopover(); } },
      { icon: 'health', label: 'Library health check', hint: 'H', kbd: 'H', run: () => OpenHealthModal('ALL') },
      { icon: 'alert', label: 'Find duplicate papers', hint: 'footer chip', run: () => OpenDuplicatesModal() },
      { icon: 'download', label: 'Save standalone HTML', hint: 'one-file export', run: () => { const b = document.querySelector('[data-action="export-standalone"]'); if (b) b.click(); } },
      { icon: 'copy', label: 'Export library as .bib', hint: 'BibTeX file', run: () => { const b = document.querySelector('[data-action="export-bibtex"]'); if (b) b.click(); } },
      { icon: 'copy', label: 'Export .bib — current filters (' + RDPapers.VisibleItems().length + ' items)', hint: 'subset export', run: () => { EnsureExportModule().then((m) => m.DownloadBibtexFile({ mode: 'visible' })); } },
      { icon: 'download', label: 'Export library as JSON', hint: 'backup', run: () => { const b = document.querySelector('[data-action="export-json"]'); if (b) b.click(); } },
      { icon: 'upload', label: 'Import a .bib file…', hint: 'bulk import', run: () => { const b = document.querySelector('[data-action="import-bibtex-file"]'); if (b) b.click(); } },
      { icon: 'spark', label: 'Toggle light / dark theme', hint: 'appearance', run: () => { document.getElementById('rd-theme-btn').click(); } },
      { icon: 'help', label: 'Help & keyboard shortcuts', hint: '?', kbd: '?', run: () => ShowHelpPanel() }
    ];
    if (tab === 'timeline' || tab === 'map' || tab === 'group') {
      acts.push({
        icon: 'fit', label: SelectedIds.size ? 'Zoom to selection' : 'Fit view to content', hint: 'F', kbd: 'F',
        run: () => FitView(tab)
      });
      if (tab === 'map') acts.splice(acts.length - 1, 0, { icon: 'network', label: 'Auto-arrange map', hint: 'layout', run: () => { const b = document.querySelector('#panel-map [data-action="auto-arrange"]'); if (b) b.click(); } });
    }
    [['list', 'List'], ['timeline', 'Timeline'], ['map', 'Map'], ['group', 'Group']].forEach(([id, label], i) => {
      acts.push({ icon: { list: 'list', timeline: 'clock', map: 'network', group: 'folder' }[id], label: 'Go to ' + label + ' tab', hint: String(i + 1), kbd: String(i + 1), run: () => SwitchTab(id) });
    });
    return acts;
  }

  function BuildPaletteEntries(query) {
    const q = String(query || '').trim().toLowerCase();
    const norm = (s) => String(s || '').toLowerCase();
    const score = (hay) => {
      if (!q) return 1;
      const idx = norm(hay).indexOf(q);
      if (idx === -1) {
        // fuzzy: every query char must appear in order
        let i = 0;
        const h = norm(hay);
        for (const c of q) { i = h.indexOf(c, i); if (i === -1) return -1; i++; }
        return 0.4;
      }
      return idx === 0 ? 1 : 0.7;
    };
    const actions = PaletteActions()
      .map((a) => ({ kind: 'action', icon: a.icon, label: a.label, hint: a.hint, kbd: a.kbd, run: a.run, _s: score(a.label) }))
      .filter((a) => a._s >= 0)
      .sort((a, b) => b._s - a._s)
      .slice(0, q ? 6 : 10);
    const items = RDPapers.GetAllItems()
      .map((it) => {
        const hay = it.title + ' ' + (it.authors || []).join(' ') + ' ' + (it.journal || '') + ' #' + (it.tags || []).join(' #');
        const s = score(it.title) * 2 + score(hay);
        return { kind: 'item', id: it.id, icon: TYPE_ICON[it.type] || 'file', label: it.title, hint: [it.year || '', STATUS_LABEL[it.status]].filter(Boolean).join(' · '), run: () => OpenDrawer(it.id), _s: s };
      })
      .filter((e) => e._s > 0)
      .sort((a, b) => b._s - a._s)
      .slice(0, q ? 8 : 6);
    return actions.concat(items);
  }

  function RenderPalette() {
    const root = document.getElementById('rd-palette-root');
    if (!root) return;
    if (!PaletteState.open) { root.innerHTML = ''; return; }
    PaletteState.entries = BuildPaletteEntries(PaletteState.query);
    if (PaletteState.active >= PaletteState.entries.length) PaletteState.active = Math.max(0, PaletteState.entries.length - 1);
    if (PaletteState.active < 0) PaletteState.active = 0;
    let lastKind = null;
    const rows = PaletteState.entries.map((en, i) => {
      const groupHead = en.kind !== lastKind
        ? `<div class="pal-group-head">${en.kind === 'action' ? 'Actions' : 'Jump to a paper'}</div>`
        : '';
      lastKind = en.kind;
      return groupHead + `
        <button class="pal-row ${i === PaletteState.active ? 'active' : ''}" data-pal-idx="${i}" type="button">
          <span class="pal-icon">${ICONS[en.icon] || ICONS.info}</span>
          <span class="pal-label">${esc(en.label)}</span>
          ${en.hint ? `<span class="pal-hint">${esc(en.hint)}</span>` : ''}
          ${en.kbd ? `<kbd class="pal-kbd">${esc(en.kbd)}</kbd>` : ''}
        </button>`;
    }).join('');
    root.innerHTML = `
      <div class="pal-overlay" data-action="close-palette">
        <div class="pal-panel" role="dialog" aria-modal="true" aria-label="Command palette">
          <div class="pal-input-row">
            ${ICONS.search}
            <input id="pal-input" type="text" placeholder="Search papers, run a command…" autocomplete="off" spellcheck="false"
                   value="${esc(PaletteState.query)}" />
            <kbd class="pal-kbd esc">esc</kbd>
          </div>
          <div class="pal-list" id="pal-list">
            ${rows || '<div class="pal-empty">Nothing matches “' + esc(PaletteState.query) + '”</div>'}
          </div>
          <div class="pal-foot">
            <span><kbd class="pal-kbd">↑</kbd><kbd class="pal-kbd">↓</kbd> navigate</span>
            <span><kbd class="pal-kbd">↵</kbd> run</span>
            <span><kbd class="pal-kbd">esc</kbd> close</span>
            <span class="pal-brand">R&amp;D command palette</span>
          </div>
        </div>
      </div>
    `;
    const input = document.getElementById('pal-input');
    if (input) {
      input.addEventListener('input', () => {
        PaletteState.query = input.value;
        PaletteState.active = 0;
        RenderPalette();
        const inp = document.getElementById('pal-input');
        if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowDown') { e.preventDefault(); PaletteState.active = Math.min(PaletteState.entries.length - 1, PaletteState.active + 1); RenderPalette(); FocusPaletteActive(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); PaletteState.active = Math.max(0, PaletteState.active - 1); RenderPalette(); FocusPaletteActive(); }
        else if (e.key === 'Enter') { e.preventDefault(); PaletteRun(PaletteState.active); }
        else if (e.key === 'Escape') { e.preventDefault(); ClosePalette(); }
      });
      input.focus();
    }
    root.querySelectorAll('.pal-row').forEach((row) => {
      row.addEventListener('mouseenter', () => {
        const idx = Number(row.dataset.palIdx);
        if (idx !== PaletteState.active) {
          PaletteState.active = idx;
          root.querySelectorAll('.pal-row').forEach((r) => r.classList.toggle('active', Number(r.dataset.palIdx) === idx));
        }
      });
      row.addEventListener('click', () => PaletteRun(Number(row.dataset.palIdx)));
    });
  }

  function FocusPaletteActive() {
    const el = document.querySelector('.pal-row.active');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  }

  function PaletteRun(idx) {
    const en = PaletteState.entries[idx];
    if (!en) return;
    ClosePalette();
    try { en.run(); } catch (err) { console.error('palette action failed', err); }
  }

  function OpenPalette() {
    PaletteState = { open: true, query: '', active: 0, entries: [] };
    RenderPalette();
  }

  function ClosePalette() {
    if (!PaletteState.open) return;
    PaletteState.open = false;
    RenderPalette();
  }

  // ---------- DUPLICATES: scan list + merge dialog (v1.5) ----------

  let DupDismissed = new Set(); // "idA|idB" pairs hidden for this session

  function OpenDuplicatesModal() {
    const clusters = RDPapers.FindDuplicateClusters().filter((c) => !DupDismissed.has(c.items.map((i) => i.id).sort().join('|')));
    const root = document.getElementById('rd-modal-root');
    if (!root) return;
    const items = clusters.map((c, idx) => {
      const reason = c.reason === 'doi' ? 'same DOI' : c.reason === 'title' ? 'same title' : 'same DOI & title';
      const rows = c.items.map((it) => {
        const g = it.groupId ? RDPapers.GetGroup(it.groupId) : null;
        return `
          <div class="dup-item">

              <span class="dup-item-tags">${[it.doi ? 'DOI' : '', (it.tags || []).slice(0, 4).map((t) => '#' + esc(t))].flat().filter(Boolean).join(' ') || '&nbsp;'}</span>
            </span>

      }).join('');
      return `
        <div class="dup-cluster">

            <span class="dup-cluster-actions">

    root.innerHTML = `

            <button class="icon-btn" data-action="close-modal" title="Close">&times;</button>
          </div>
          <div class="modal-body">
            ${clusters.length ? `
              <p class="dup-intro">These entries look like the same work. Merging keeps one card and combines tags, notes, status and mind-map links — nothing is lost silently, and <b>Undo</b> is one click away.</p>
              ${items}` : `
              <div class="dup-none">
                ${ICONS.check}

              </div>`}
          </div>
          <div class="modal-footer">
            <button class="ghost-btn" data-action="dup-dismiss-all" ${clusters.length ? '' : 'disabled'} title="Hide every cluster for this session">Dismiss all</button>
            <button class="ghost-btn" data-action="close-modal">Close</button>
          </div>
        </div>
      </div>
    `;
    // stash the filtered clusters for the button handlers

    DupCtx = clusters;
  }

  let DupCtx = [];
  let MergeCtx = null; // { primaryId, secondaryIds: [...] } — N-way merge (v1.6)

  function GetMergeHTML() {
    const FIELDS = [
      ['title', 'Title'], ['authors', 'Authors'], ['type', 'Type'], ['journal', 'Journal / venue'],
      ['volume', 'Volume'], ['issue', 'Issue'], ['pages', 'Pages'], ['year', 'Year'],
      ['publisher', 'Publisher'], ['doi', 'DOI'], ['url', 'URL'], ['bibtexKey', 'Citation key']
    ];
    const primary = RDPapers.GetItem(MergeCtx.primaryId);
    const secondaries = MergeCtx.secondaryIds.map((id) => RDPapers.GetItem(id)).filter(Boolean);
    if (!primary || !secondaries.length) return '';
    const participants = [primary].concat(secondaries);
    const fmt = (v) => {
      if (Array.isArray(v)) return v.join('; ');
      if (v === null || v === undefined || v === '') return '<i class="dup-empty">empty</i>';
      return esc(String(v));
    };
    const nonEmpty = (v) => v !== null && v !== undefined && String(v) !== '' && !(Array.isArray(v) && !v.length);
    const shortName = (it, idx) => idx === 0 ? 'Survivor' : 'Alt ' + idx + ' — ' + (String(it.title).length > 22 ? String(it.title).slice(0, 22) + '…' : it.title);

    // participant chips (survivor + merged-in, each removable except the survivor)
    const chips = participants.map((it, idx) => `
      <div class="merge-chip ${idx === 0 ? 'winner' : ''}">
        <span class="merge-side">${idx === 0 ? 'Survivor' : 'Merged'}</span>
        <span class="merge-chip-title" title="${esc(it.title)}">${esc(it.title)}</span>
        <span class="merge-chip-meta">${esc([(it.authors || []).slice(0, 1).join('; '), it.year || ''].filter(Boolean).join(' · '))}</span>
        ${idx > 0 ? `<button class="merge-chip-x" data-action="merge-drop" data-id="${it.id}" title="Keep this paper out of the merge" aria-label="Exclude ${esc(it.title)}">${ICONS.x}</button>` : ''}
      </div>`).join('');

    // field rows: one compact select per differing field, one option per participant
    const fieldRows = FIELDS.map(([key, label]) => {
      const vals = participants.map((p) => JSON.stringify(p[key] ?? null));
      const allSame = vals.every((x) => x === vals[0]);
      if (allSame && !nonEmpty(participants[0][key])) return ''; // all empty — skip
      if (allSame) return `<div class="merge-row same"><span class="merge-label">${label}</span><span class="merge-val full">${fmt(participants[0][key])}</span></div>`;
      let defIdx = participants.findIndex((p) => nonEmpty(p[key]));
      if (defIdx === -1) defIdx = 0;
      const opts = participants.map((p, idx) =>
        `<option value="${idx === 0 ? 'primary' : 'sec:' + p.id}" ${idx === defIdx ? 'selected' : ''}>${esc(shortName(p, idx))}: ${esc(Array.isArray(p[key]) ? p[key].join('; ') : String(p[key] ?? ''))}</option>`).join('');
      return `
        <div class="merge-row">
          <span class="merge-label">${label}</span>
          <select class="rd-select merge-select" name="mf-${key}">${opts}</select>
        </div>`;
    }).join('');

    // reading status
    const statVal = (it) => STATUS_LABEL[it.status] + ' · ' + (it.progress || 0) + '%';
    const statusAllSame = participants.every((p) => p.status === primary.status && (p.progress || 0) === (primary.progress || 0));
    const statusRow = statusAllSame
      ? `<div class="merge-row status"><span class="merge-label">Reading status</span><span class="merge-val full">${statVal(primary)}</span></div>`
      : (() => {
          const rank = { read: 2, reading: 1, unread: 0 };
          let defIdx = 0, best = -1;
          participants.forEach((p, idx) => { const s = (rank[p.status] || 0) * 1000 + (p.progress || 0); if (s > best) { best = s; defIdx = idx; } });
          const opts = participants.map((p, idx) =>
            `<option value="${idx === 0 ? 'primary' : 'sec:' + p.id}" ${idx === defIdx ? 'selected' : ''}>${esc(shortName(p, idx))}: ${esc(statVal(p))}</option>`).join('');
          return `<div class="merge-row status"><span class="merge-label">Reading status</span><select class="rd-select merge-select" name="mf-status">${opts}</select></div>`;
        })();

    // tags union preview
    const allTags = (() => {
      const seen = new Map();
      participants.forEach((i) => (i.tags || []).forEach((t) => { const k = String(t).toLowerCase(); if (!seen.has(k)) seen.set(k, t); }));
      return [...seen.values()];
    })();

    // notes: one checkbox per participant that has notes (survivor keeps its own)
    const notesRows = secondaries.filter((s) => String(s.notes || '').trim())
      .map((s) => `
        <label class="merge-notes-row">
          <input type="checkbox" data-notes-for="${s.id}" checked />
          <span>Append notes from <b>${esc(String(s.title).length > 34 ? String(s.title).slice(0, 34) + '…' : s.title)}</b> <span class="merge-notes-sub">(rule-separated — nothing is deleted)</span></span>
        </label>`).join('');

    return `
      <div class="modal-overlay" id="rd-merge-modal">
        <div class="modal-card merge" role="dialog" aria-modal="true" aria-label="Merge duplicate papers">
          <div class="modal-header">
            <h3>${ICONS.link} Merge ${participants.length} papers</h3>
            <button class="icon-btn" data-action="close-modal" title="Close">&times;</button>
          </div>
          <div class="modal-body">
            <p class="dup-intro">One card survives — it keeps its id, group and mind-map links. Pick a source per field; tags are combined; notes are appended, never deleted. <b>Undo</b> is one click away.</p>
            <div class="merge-chips">${chips}</div>
            <div class="merge-fields">${fieldRows}</div>
            ${statusRow}
            <div class="merge-extras">
              <div class="merge-tags-row"><span class="merge-label">Tags</span><span class="merge-tags">${allTags.map((t) => `<span class="rd-tag-pill">#${esc(t)}</span>`).join('') || '<i class="dup-empty">none</i>'}</span></div>
              ${notesRows}
            </div>
          </div>
          <div class="modal-footer">
            <button class="ghost-btn" data-action="close-modal">Cancel</button>
            <button class="primary-btn" data-action="merge-confirm">${ICONS.link}<span>Merge ${participants.length} → 1</span></button>
          </div>
        </div>
      </div>
    `;
  }

  // primaryId: string; secondaryIds: array (a single id also works).
  function OpenMergeModal(primaryId, secondaryIds) {
    const p = RDPapers.GetItem(primaryId);
    const secs = (Array.isArray(secondaryIds) ? secondaryIds : [secondaryIds]).map((id) => RDPapers.GetItem(id)).filter(Boolean);
    if (!p || !secs.length) return;
    MergeCtx = { primaryId: p.id, secondaryIds: secs.map((s) => s.id) };
    const root = document.getElementById('rd-modal-root');
    if (!root) return;
    root.innerHTML = GetMergeHTML();
  }

  function ConfirmMerge() {
    if (!MergeCtx) return;
    const fields = {};
    document.querySelectorAll('#rd-merge-modal select[name^="mf-"]').forEach((sel) => {
      const key = sel.name.replace(/^mf-/, '');
      if (sel.value && sel.value !== 'primary') fields[key] = sel.value; // 'sec:<id>'
    });
    const statusSel = document.querySelector('#rd-merge-modal select[name="mf-status"]');
    const status = statusSel && statusSel.value && statusSel.value !== 'primary' ? statusSel.value : 'primary';
    const appendNotesFrom = [...document.querySelectorAll('#rd-merge-modal input[data-notes-for]:checked')].map((c) => c.dataset.notesFor);
    const snapshot = JSON.parse(JSON.stringify(RDPapers.State()));
    const merged = RDPapers.MergeItems(MergeCtx.primaryId, MergeCtx.secondaryIds.slice(), {
      fields, status, appendNotes: appendNotesFrom.length > 0, appendNotesFrom
    });
    MergeCtx = null;
    CloseItemModal();
    RenderAll();
    if (merged) {
      const g = merged.groupId ? RDPapers.GetGroup(merged.groupId) : null;
      ShowToast('success', 'Papers merged', '“' + (merged.title.length > 40 ? merged.title.slice(0, 40) + '…' : merged.title) + '”' + (g ? ' stays in ' + g.name : ''), {
        actionLabel: 'Undo', duration: 8000,
        onAction: () => { RDPapers.ReplaceAll(snapshot); RenderAll(); }
      });
    }
  }

  // ---------- LIBRARY HEALTH CHECK (v1.7) ----------

  let HealthFilter = 'ALL'; // ALL | warn | <kind>

  function GetHealthHTML() {
    const RD = RDPapers.State();
    const rep = RDPapers.HealthReport();
    const kinds = [];
    rep.issues.forEach((i) => { if (!kinds.some((k) => k.kind === i.kind)) kinds.push({ kind: i.kind, n: 1 }); else kinds.find((k) => k.kind === i.kind).n++; });
    const KIND_LABEL = {
      'key-clash': 'Key clash', 'no-doi': 'No DOI', 'no-key': 'No citation key',
      'no-year': 'No year', 'no-group': 'No group', 'no-tags': 'No tags',
      'no-authors': 'No authors', 'empty-group': 'Empty group'
    };
    const filtered = HealthFilter === 'ALL' ? rep.issues
      : HealthFilter === 'warn' ? rep.issues.filter((i) => i.severity === 'warn')
      : rep.issues.filter((i) => i.kind === HealthFilter);
    const groupOpts = ['<option value="">Move to group&hellip;</option>']
      .concat(RD.groupOrder.map((gid) => {
        const g2 = RDPapers.GetGroup(gid);
        return g2 ? `<option value="${g2.id}">${esc(g2.name)}</option>` : '';
      })).join('');
    const rows = filtered.map((i) => {
      const it = i.itemId ? RDPapers.GetItem(i.itemId) : null;
      const g = it && it.groupId ? RDPapers.GetGroup(it.groupId) : null;
      // v1.8: fixable kinds get inline repair controls instead of a dead end
      let fix = '';
      if (it && i.kind === 'no-year') {
        fix = `<span class="health-fix">
                 <input type="number" class="health-fix-input" data-fix-year-input="${it.id}" placeholder="e.g. 2024"
                        aria-label="Publication year for ${esc(it.title)}" />
                 <button class="health-fix-btn" data-action="health-fix-year" data-id="${it.id}" title="Save the year">Set</button>
               </span>`;
      } else if (it && i.kind === 'no-group') {
        fix = `<span class="health-fix">
                 <select class="rd-select sm health-fix-select" data-fix-group-sel="${it.id}" aria-label="Move ${esc(it.title)} to group">${groupOpts}</select>
                 <button class="health-fix-btn" data-action="health-fix-group" data-id="${it.id}" title="Move this item">Move</button>
               </span>`;
      } else if (it && i.kind === 'no-key') {
        fix = `<span class="health-fix">
                 <button class="health-fix-btn" data-action="health-fix-key" data-id="${it.id}" title="Generate a citation key from authors + year + title">Generate key</button>
               </span>`;
      }
      const inner = `
        <span class="health-dot ${i.severity}"></span>
        <span class="health-kind">${KIND_LABEL[i.kind] || i.kind}</span>
        <span class="health-msg">${esc(i.message)}</span>
        ${g ? `<span class="health-group" style="color:${g.color}">${esc(g.name)}</span>` : ''}
        ${fix}
        <span class="health-go">${it ? ICONS.arrowRight : ICONS.folder}</span>`;
      return fix
        ? `<div class="health-row ${i.severity} fixable">${inner}</div>`
        : `<button class="health-row ${i.severity}" ${it ? 'data-action="health-open-item" data-id="' + it.id + '"' : 'disabled'}
                title="${it ? 'Open details for this item' : 'Group issue — fix on the Group tab'}">${inner}</button>`;
    }).join('');
    const noKeyCount = rep.issues.filter((i) => i.kind === 'no-key').length;
    const chips = ['<button class="health-chip ' + (HealthFilter === 'ALL' ? 'active' : '') + '" data-action="health-filter" data-filter="ALL">All ' + rep.total + '</button>',
      '<button class="health-chip ' + (HealthFilter === 'warn' ? 'active' : '') + '" data-action="health-filter" data-filter="warn">Warnings ' + rep.warns + '</button>']
      .concat(kinds.map((k) => '<button class="health-chip ' + (HealthFilter === k.kind ? 'active' : '') + '" data-action="health-filter" data-filter="' + k.kind + '">' + (KIND_LABEL[k.kind] || k.kind) + ' ' + k.n + '</button>'))
      .join('');
    const scoreColor = rep.score >= 80 ? 'var(--green)' : rep.score >= 50 ? 'var(--yellow)' : 'var(--red)';
    return `
      <div class="modal-overlay" id="rd-health-modal">
        <div class="modal-card health" role="dialog" aria-modal="true" aria-label="Library health check">
          <div class="modal-header">
            <h3>${ICONS.health} Library health</h3>
            <button class="icon-btn" data-action="close-modal" title="Close">&times;</button>
          </div>
          <div class="modal-body">
            <div class="health-score-row">
              <div class="health-score" style="color:${scoreColor}">${rep.score}<span>%</span></div>
              <div class="health-score-copy">
                <b>${rep.total === 0 ? 'Everything looks healthy' : rep.total + ' suggestion' + (rep.total === 1 ? '' : 's')}</b>
                <span>${rep.warns} warning${rep.warns === 1 ? '' : 's'} across ${RDPapers.GetAllItems().length} items — nothing is broken, this is data hygiene.</span>
              </div>
            </div>
            ${rep.total ? `<div class="health-chips">${chips}</div>
            <div class="health-list">${rows || '<div class="health-none">Nothing in this category.</div>'}</div>` : `
            <div class="health-none big">${ICONS.check}<span>Every item has a year, an author list, a citation key and a group. Beautiful.</span></div>`}
          </div>
          <div class="modal-footer">
            <button class="ghost-btn" data-action="close-modal">Close</button>
            ${noKeyCount ? `<button class="ghost-btn" data-action="health-fix-keys-all" title="Generate citation keys for every item that is missing one">${ICONS.spark}<span>Generate ${noKeyCount} missing key${noKeyCount === 1 ? '' : 's'}</span></button>` : ''}
            <button class="primary-btn" data-action="open-duplicates">${ICONS.alert}<span>Scan for duplicates</span></button>
          </div>
        </div>
      </div>
    `;
  }

  function OpenHealthModal(filter) {
    if (typeof filter === 'string') HealthFilter = filter;
    const root = document.getElementById('rd-modal-root');
    if (!root) return;
    root.innerHTML = GetHealthHTML();
    // v1.8: Enter inside an inline fix input applies the fix
    root.querySelectorAll('.health-fix-input').forEach((inp) => {
      inp.addEventListener('keydown', (ev) => {
        if (ev.key !== 'Enter') return;
        ev.preventDefault();
        const btn = inp.parentElement.querySelector('[data-action="health-fix-year"]');
        if (btn) btn.click();
      });
    });
  }

  // ---------- GLOBAL KEYS ----------

  function InitGlobalKeys() {
    document.addEventListener('keydown', (e) => {
      // Ctrl/Cmd + K — command palette (works even while typing elsewhere)
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        e.stopPropagation();
        if (PaletteState.open) ClosePalette(); else OpenPalette();
        return;
      }
      if (e.key === 'Escape') {
        if (PaletteState.open) { ClosePalette(); return; }
        const overlayOpen = !!document.querySelector('#rd-modal-root .modal-overlay, #rd-confirm-root .modal-overlay');
        const drawerOpen = !!document.querySelector('#rd-drawer-root .rd-drawer-backdrop');
        if (SelectedIds.size && !overlayOpen && !drawerOpen) { ClearSelection(); return; }
        CloseItemModal();
        SettleConfirm(false);
        CloseDrawer();
        CloseQueue();
        CloseStatsPopover();
        CloseHelpPanel(false);
        const dd = document.getElementById('sections-dropdown-window');
        if (dd) dd.classList.add('hidden');
        return;
      }
      const t = e.target;
      const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
      if (e.key === '/' && !e.metaKey && !e.ctrlKey && !typing) {
        e.preventDefault();
        const s = document.getElementById('rd-search-input');
        if (s) s.focus();
        return;
      }
      if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
      // Enter on a focused card opens its detail drawer
      if (e.key === 'Enter' && t && t.closest) {
        const card = t.closest('.rd-item-card, .rd-node-card');
        if (card && card.dataset.itemId) {
          e.preventDefault();
          OpenDrawer(card.dataset.itemId);
          return;
        }
      }
      if (e.key === 'n' || e.key === 'N') {
        e.preventDefault();
        OpenItemModal('add');
        return;
      }
      if (e.key === 'q' || e.key === 'Q') {
        e.preventDefault();
        ToggleQueue();
        return;
      }
      if (e.key === 'f' || e.key === 'F') {
        const tab = CurrentTab();
        if (tab === 'timeline' || tab === 'map' || tab === 'group') {
          e.preventDefault();
          FitView(tab);
        }
        return;
      }
      // M — toggle the canvas minimap (v1.6)
      if (e.key === 'm' || e.key === 'M') {
        const tab = CurrentTab();
        if (tab === 'timeline' || tab === 'map' || tab === 'group') {
          e.preventDefault();
          ToggleMinimap(tab);
        }
        return;
      }
      // H — library health check (v1.7)
      if (e.key === 'h' || e.key === 'H') {
        e.preventDefault();
        OpenHealthModal('ALL');
        return;
      }
      const tabIndex = { '1': 'list', '2': 'timeline', '3': 'map', '4': 'group' }[e.key];
      if (tabIndex) {
        e.preventDefault();
        SwitchTab(tabIndex);
        return;
      }
      if (e.key === '?') {
        e.preventDefault();
        ShowHelpPanel();
      }
    });
  }

  // ---------- CLICK / CHANGE / DBLCLICK DELEGATION ----------

  function InitDelegatedEvents() {
    document.addEventListener('click', async (e) => {
      // mind map: click a connection to remove it (hover turns it red)
      const linkPath = e.target.closest('.rd-link-path');
      if (linkPath && linkPath.dataset && linkPath.dataset.linkId) {
        const link = RDPapers.GetLinks().find((l) => l.id === linkPath.dataset.linkId);
        if (link) {
          const snapshot = JSON.parse(JSON.stringify(RDPapers.State()));
          RDPapers.DeleteLink(link.id);
          ShowToast('info', 'Link removed', 'Connections delete on click.', {
            actionLabel: 'Undo', duration: 6500,
            onAction: () => { RDPapers.ReplaceAll(snapshot); RenderAll(); }
          });
          RenderMap();
          return;
        }
      }

      const actionEl = e.target.closest('[data-action]');
      if (!actionEl || actionEl.dataset.action !== 'toggle-stats') {
        // close the stats popover when clicking anywhere else
        const pop = document.querySelector('#rd-stats-root .rd-stats-popover');
        if (pop && !pop.contains(e.target) && !e.target.closest('#rd-footer-stats')) CloseStatsPopover();
      }
      if (actionEl) {
        const action = actionEl.dataset.action;
        const id = actionEl.dataset.id;
        switch (action) {
          case 'switch-tab': SwitchTab(actionEl.dataset.tab); return;
          case 'set-type':
            RDPapers.SetUI({ typeFilter: actionEl.dataset.type, activeTab: CurrentTab() });
            RenderAll(); return;
          case 'open-add-modal': {
            const group = actionEl.dataset.group;
            const prefill = group && group !== 'UNSORTED' ? { groupId: group } : null;
            OpenItemModal('add', null, prefill); return;
          }
          case 'add-item-in': { // "＋" on a group section header
            const group = actionEl.dataset.group;
            const prefill = group && group !== 'UNSORTED' ? { groupId: group } : null;
            OpenItemModal('add', null, prefill); return;
          }
          case 'edit-item': OpenItemModal('edit', id); return;
          case 'delete-item': {
            const item = RDPapers.GetItem(id);
            if (!item) return;
            const ok = await ConfirmAction({
              title: 'Delete this ' + TYPE_LABEL[item.type] + '?',
              html: '<b style="color:var(--text);">' + esc(item.title) + '</b><br>This removes it from every tab. You will get a short window to undo.',
              okLabel: 'Delete', danger: true
            });
            if (ok) {
              const snapshot = JSON.parse(JSON.stringify(RDPapers.State()));
              if (DrawerItemId === id) CloseDrawer();
              CloseStatsPopover();
              RDPapers.DeleteItem(id);
              RenderAll();
              ShowToast('info', 'Deleted', item.title, {
                actionLabel: 'Undo', duration: 8000,
                onAction: () => {
                  RDPapers.ReplaceAll(snapshot);
                  RenderAll();
                  ShowToast('success', 'Restored', item.title);
                }
              });
            }
            return;
          }
          case 'duplicate-item': {
            RDPapers.DuplicateItem(id);
            ShowToast('success', 'Duplicated');
            RenderAll(); return;
          }
          case 'copy-bibtex': CopyBibtexForItem(id); return;
          case 'cycle-status':
            RDPapers.CycleItemStatus(id);
            RenderAll();
            if (DrawerItemId === id) RefreshDrawer();
            return;
          case 'toggle-star':
            RDPapers.ToggleStar(id);
            RenderAll();
            if (DrawerItemId === id) RefreshDrawer();
            return;
          case 'open-drawer':
            if (e.detail > 1) return; // part of a double-click (notes)
            OpenDrawer(id);
            return;
          case 'close-drawer': CloseDrawer(); return;
          case 'drawer-toggle-star':
            RDPapers.ToggleStar(id);
            RenderAll();
            RefreshDrawer();
            return;
          case 'drawer-remove-tag': {
            const item = RDPapers.GetItem(DrawerItemId || id);
            if (!item) return;
            const tag = actionEl.dataset.tag;
            RDPapers.UpdateItem(item.id, { tags: (item.tags || []).filter((t) => t !== tag) });
            RenderAll();
            RefreshDrawer();
            return;
          }
          case 'drawer-copy-key': {
            const item = RDPapers.GetItem(id);
            if (!item) return;
            const key = item.bibtexKey || (RDBibtex.ItemToBibtex(item).match(/@\w+\{([^,]+)/) || [])[1] || '';
            RDBibtex.CopyToClipboard(key);
            ShowToast('success', 'Citation key copied', key);
            return;
          }
          case 'copy-doi': {
            const item = RDPapers.GetItem(id);
            if (!item) return;
            const doi = (item.doi || '').replace(/^https?:\/\/(dx\.)?doi\.org\//i, '');
            if (!doi) return;
            RDBibtex.CopyToClipboard(doi);
            ShowToast('success', 'DOI copied', doi);
            return;
          }
          case 'drawer-open-notes': {
            const item = RDPapers.GetItem(id);
            if (!item) return;
            HandleNotesOpen(item);
            return;
          }
          case 'tl-year': {
            const year = actionEl.dataset.year;
            const cur = RDPapers.State().ui.yearFilter;
            const turningOn = String(cur) !== String(year);
            RDPapers.SetUI({ yearFilter: turningOn ? year : null });
            RenderAll();
            if (turningOn) CenterTimelineOnYear(year);
            return;
          }
          case 'clear-year':
            RDPapers.SetUI({ yearFilter: null });
            RenderAll();
            return;
          case 'filter-tag': {
            if (e.detail > 1) return;
            const tag = actionEl.dataset.tag;
            CloseStatsPopover();
            const input = document.getElementById('rd-search-input');
            if (input) input.value = tag;
            RDPapers.SetUI({ search: tag });
            RenderAll();
            ShowToast('info', 'Filtered by tag', '#' + tag + ' — clear the search box to see everything again.');
            return;
          }
          case 'toggle-stats': ToggleStatsPopover(); return;
          case 'show-help': ShowHelpPanel(); return;
          case 'close-help': CloseHelpPanel(true); return;
          case 'help-add':
            CloseHelpPanel(true);
            OpenItemModal('add');
            return;
          case 'toggle-link-mode': {
            const wrap = document.getElementById('wrap-map');
            const on = wrap.classList.toggle('rd-map-linking');
            actionEl.classList.toggle('active', on);
            return;
          }
          case 'add-group': {
            const g = RDPapers.AddGroup('');
            ShowToast('success', 'Group created', 'Double-click its name to rename it.');
            RenderAll(); return;
          }
          case 'delete-group': {
            const g = RDPapers.GetGroup(id);
            if (!g) return;
            const ok = await ConfirmAction({
              title: 'Delete group “' + g.name + '”?',
              html: 'Items inside become <b>Unsorted</b> — nothing is lost.',
              okLabel: 'Delete group', danger: true
            });
            if (ok) {
              RDPapers.DeleteGroup(id);
              ShowToast('success', 'Group deleted', g.name);
              RenderAll();
            }
            return;
          }
          case 'relayout': {
            RDPapers.RelayoutAll(actionEl.dataset.view);
            RenderAll();
            ShowToast('info', 'Layout reset', 'Cards snapped back to their default arrangement.');
            return;
          }
          case 'reset-view': {
            const view = actionEl.dataset.view;
            RDPapers.SetView(view, { x: 0, y: 0, k: 1 });
            ApplyView(view); return;
          }
          case 'fit-view': FitView(actionEl.dataset.view); return;
          case 'zoom': {
            const view = actionEl.dataset.view;
            const RD = RDPapers.State();
            const v = ClampView(RD.ui.views[view]);
            v.k = Math.min(2.5, Math.max(0.3, v.k * (actionEl.dataset.dir === 'in' ? 1.2 : 1 / 1.2)));
            ApplyView(view);
            RDPapers.SaveQuiet(); return;
          }
          case 'export-standalone': {
            const mod = await EnsureExportModule();
            mod.DownloadStandaloneHTML();
            return;
          }
          case 'export-json': {
            const mod = await EnsureExportModule();
            mod.DownloadJSON();
            return;
          }
          case 'import-json': {
            const input = document.getElementById('rd-import-file');
            if (input) input.click();
            return;
          }
          case 'reset-data': {
            const ok = await ConfirmAction({
              title: 'Clear the whole library?',
              html: 'Every paper, group and link will be removed from this browser. Export a backup first if unsure.',
              okLabel: 'Clear everything', danger: true
            });
            if (ok) {
              const mod = await EnsureExportModule();
              mod.ResetLibrary();
            }
            return;
          }
          case 'clear-search': {
            RDPapers.SetUI({ search: '' });
            RenderAll(); return;
          }
          case 'toggle-theme': {
            const next = RDPapers.State().ui.theme === 'light' ? 'dark' : 'light';
            RDPapers.SetUI({ theme: next });
            ApplyTheme();
            return;
          }
          case 'toggle-starred-filter': {
            RDPapers.SetUI({ starredOnly: !RDPapers.State().ui.starredOnly });
            RenderToolbarLabels();
            RenderAll(); return;
          }
          case 'export-bibtex': {
            const mod = await EnsureExportModule();
            mod.DownloadBibtexFile();
            return;
          }
          // v1.8: subset export — only what survives the current filters
          case 'export-bibtex-visible': {
            const mod = await EnsureExportModule();
            mod.DownloadBibtexFile({ mode: 'visible' });
            return;
          }
          // v1.8: copy the whole selection's BibTeX from the bulk bar
          case 'bulk-bibtex': {
            const mod = await EnsureExportModule();
            mod.CopyBibtexForSelection([...SelectedIds]);
            return;
          }
          case 'import-bibtex-file': {
            const input = document.getElementById('rd-bibtex-file');
            if (input) input.click();
            return;
          }
          case 'fetch-doi': FetchDoiIntoModal(); return;
          case 'parse-bibtex': ParseBibtexIntoModal(); return;
          case 'save-item': SaveItemFromModal(); return;
          case 'close-modal': CloseItemModal(); return;
          case 'confirm-ok': SettleConfirm(true); return;
          case 'confirm-cancel': SettleConfirm(false); return;
          // --- bulk selection bar ---
          case 'bulk-status': DoBulkUpdate({ status: actionEl.dataset.status }); return;
          case 'bulk-star': DoBulkUpdate({ starred: true }); return;
          case 'bulk-unstar': DoBulkUpdate({ starred: false }); return;
          case 'bulk-delete': BulkDeleteFlow(); return;
          case 'bulk-clear': ClearSelection(); return;
          case 'bulk-select-all': SelectAllVisible(); return;
          // --- list checkbox multi-select (shift = range) ---
          case 'toggle-select': {
            const tid = actionEl.dataset.id;
            if (!tid) return;
            if (SelectedIds.has(tid)) {
              SelectedIds.delete(tid);
              SyncSelectionClasses(tid);
              LastListCheckId = null;
              RenderBulkBar();
              return;
            }
            if (e.shiftKey && LastListCheckId && LastListCheckId !== tid) {
              // range-select between the last checked card and this one,
              // following DOM order within the visible list
              const cards = [...document.querySelectorAll('#panel-list .rd-item-card')];
              const i1 = cards.findIndex((c) => c.dataset.itemId === LastListCheckId);
              const i2 = cards.findIndex((c) => c.dataset.itemId === tid);
              if (i1 !== -1 && i2 !== -1) {
                const [a, b] = i1 < i2 ? [i1, i2] : [i2, i1];
                for (let i = a; i <= b; i++) SelectCard(cards[i].dataset.itemId);
                LastListCheckId = tid;
                return;
              }
            }
            SelectCard(tid);
            LastListCheckId = tid;
            return;
          }
          // --- reading queue ---
          case 'toggle-queue': ToggleQueue(); return;
          case 'close-queue': CloseQueue(); return;
          case 'queue-open':
            if (e.detail > 1) return;
            OpenDrawer(actionEl.dataset.id);
            return;
          case 'queue-start': {
            const qid = actionEl.dataset.id;
            const it = RDPapers.GetItem(qid);
            if (!it) return;
            RDPapers.UpdateItem(qid, { status: 'reading' });
            RenderAll();
            if (DrawerItemId === qid) RefreshDrawer();
            ShowToast('success', 'Started reading', it.title, { duration: 2600 });
            return;
          }
          case 'queue-mark-read': {
            const qid2 = actionEl.dataset.id;
            const it2 = RDPapers.GetItem(qid2);
            if (!it2) return;
            RDPapers.UpdateItem(qid2, { status: 'read' });
            RenderAll();
            if (DrawerItemId === qid2) RefreshDrawer();
            ShowToast('success', 'Finished!', it2.title + ' — marked as read. 🎉', { duration: 3000 });
            return;
          }
          case 'queue-reset-order':
            RDPapers.SetUI({ queueOrder: [] });
            RenderQueue();
            ShowToast('info', 'Smart order restored', 'The queue is scored automatically again.');
            return;
          // --- command palette (v1.5) ---
          case 'open-palette':
            OpenPalette();
            return;
          case 'close-palette':
            // only the backdrop (outside .pal-panel) closes it
            if (e.target.closest('.pal-panel')) return;
            ClosePalette();
            return;
          // --- duplicates & merge (v1.5) ---
          case 'open-duplicates':
            OpenDuplicatesModal();
            return;
          case 'dup-dismiss': {
            const cluster = DupCtx[Number(actionEl.dataset.idx)];
            if (cluster) {
              DupDismissed.add(cluster.items.map((i) => i.id).sort().join('|'));
              OpenDuplicatesModal(); // re-render with it hidden
              RenderFooter();
              ShowToast('info', 'Kept both', 'You can reopen the scan any time from the footer chip.');
            }
            return;
          }
          case 'dup-open-merge': {
            const cluster2 = DupCtx[Number(actionEl.dataset.idx)];
            if (cluster2 && cluster2.items.length >= 2) {
              // survivor = earliest createdAt with the most filled fields;
              // v1.6: every other member joins the merge (droppable in the dialog)
              const ranked = cluster2.items.slice().sort((a, b) => {
                const fill = (i) => [i.title, i.doi, i.journal, i.publisher, i.year, (i.tags || []).length].filter(Boolean).length;
                return String(a.createdAt).localeCompare(String(b.createdAt)) || fill(b) - fill(a);
              });
              OpenMergeModal(ranked[0].id, ranked.slice(1).map((i) => i.id));
            }
            return;
          }
          case 'merge-confirm':
            ConfirmMerge();
            return;
          case 'dup-dismiss-all': {
            DupCtx.forEach((c) => DupDismissed.add(c.items.map((i) => i.id).sort().join('|')));
            OpenDuplicatesModal();
            RenderFooter();
            ShowToast('info', 'All clusters dismissed', 'Reopen the scan any time from the footer chip.');
            return;
          }
          // --- library health (v1.7) ---
          case 'open-health':
            OpenHealthModal('ALL');
            return;
          case 'health-filter':
            OpenHealthModal(actionEl.dataset.filter || 'ALL');
            return;
          case 'health-open-item':
            CloseItemModal();
            OpenDrawer(actionEl.dataset.id);
            return;
          // --- health fix-it helpers (v1.8) ---
          case 'health-fix-year': {
            const fid = actionEl.dataset.id;
            const input = document.querySelector(`[data-fix-year-input="${fid}"]`);
            const yr = parseInt(input && input.value, 10);
            if (!yr || yr < 1000 || yr > 3000) {
              ShowToast('error', 'Enter a valid year', 'Four digits, e.g. 2024.');
              if (input) input.focus();
              return;
            }
            RDPapers.UpdateItem(fid, { year: yr });
            const fixed = RDPapers.GetItem(fid);
            OpenHealthModal();
            RenderAll();
            ShowToast('success', 'Year set to ' + yr, '“' + RDPapers.ShortTitle(fixed.title) + '” is back on the Timeline.');
            return;
          }
          case 'health-fix-group': {
            const gid2 = actionEl.dataset.id;
            const sel = document.querySelector(`[data-fix-group-sel="${gid2}"]`);
            if (!sel || !sel.value) {
              ShowToast('error', 'Pick a group', 'Choose a destination group from the dropdown first.');
              if (sel) sel.focus();
              return;
            }
            const gFix = RDPapers.GetGroup(sel.value);
            RDPapers.UpdateItem(gid2, { groupId: sel.value });
            const itFix = RDPapers.GetItem(gid2);
            OpenHealthModal();
            RenderAll();
            ShowToast('success', 'Moved to “' + (gFix ? gFix.name : 'group') + '”', RDPapers.ShortTitle(itFix.title));
            return;
          }
          case 'health-fix-key': {
            const kid = actionEl.dataset.id;
            RDBibtex.EnsureKeys([RDPapers.GetItem(kid)]);
            const itKey = RDPapers.GetItem(kid);
            RDPapers.UpdateItem(kid, { bibtexKey: itKey.bibtexKey });
            OpenHealthModal();
            ShowToast('success', 'Citation key generated', itKey.bibtexKey, { duration: 4200 });
            return;
          }
          case 'health-fix-keys-all': {
            const missing = RDPapers.GetAllItems().filter((i) => !i.bibtexKey);
            if (!missing.length) { OpenHealthModal(); return; }
            RDBibtex.EnsureKeys(missing);
            missing.forEach((m) => RDPapers.UpdateItem(m.id, { bibtexKey: m.bibtexKey }));
            OpenHealthModal();
            ShowToast('success', missing.length + ' key' + (missing.length === 1 ? '' : 's') + ' generated', 'Every item now has a citation key.');
            return;
          }
          // --- bulk recolour (v1.7) ---
          case 'bulk-color':
            DoBulkUpdate({ color: actionEl.dataset.color || '' });
            return;
          case 'merge-drop': {
            // exclude one participant from the running merge (v1.6, N-way)
            if (!MergeCtx) return;
            MergeCtx.secondaryIds = MergeCtx.secondaryIds.filter((id) => id !== actionEl.dataset.id);
            if (!MergeCtx.secondaryIds.length) { MergeCtx = null; CloseItemModal(); return; }
            const root = document.getElementById('rd-modal-root');
            if (root) root.innerHTML = GetMergeHTML();
            return;
          }
          // --- select all in a group/section (v1.6) ---
          case 'select-group': {
            const gid = actionEl.dataset.group;
            const vis = new Set(RDPapers.VisibleItems().map((i) => i.id));
            const ids = RDPapers.State().items
              .filter((i) => vis.has(i.id) && (gid === 'UNSORTED' ? !i.groupId : i.groupId === gid))
              .map((i) => i.id);
            SelectedIds = new Set(ids);
            LastListCheckId = null;
            ids.forEach(SyncSelectionClasses);
            document.querySelectorAll('.rd-node-card, .rd-item-card').forEach((el) => {
              el.classList.toggle('selected', SelectedIds.has(el.dataset.itemId));
            });
            RenderBulkBar();
            const gsel = gid === 'UNSORTED' ? null : RDPapers.GetGroup(gid);
            ShowToast('info', ids.length + ' selected', 'Everything in ' + (gsel ? '“' + gsel.name + '”' : 'Unsorted') + ' — use the bulk bar below.', { duration: 2800 });
            return;
          }
          // --- minimap toggle (v1.6) ---
          case 'toggle-minimap':
            ToggleMinimap(actionEl.dataset.view || CurrentTab());
            return;
          // --- item colour chips (v1.6) ---
          case 'set-item-color': {
            const cid = actionEl.dataset.id;
            RDPapers.UpdateItem(cid, { color: actionEl.dataset.color || '' });
            RenderAll();
            RefreshDrawer();
            return;
          }
          // --- list section collapse ---
          case 'toggle-section-collapse': {
            const sec = actionEl.dataset.sec;
            const RDs = RDPapers.State();
            const cur = RDs.ui.collapsedSections || [];
            const next = cur.includes(sec) ? cur.filter((x) => x !== sec) : cur.concat(sec);
            RDPapers.SetUI({ collapsedSections: next });
            RenderAll();
            return;
          }
          case 'collapse-all-sections': {
            const RDc = RDPapers.State();
            const secs = RDPapers.ItemsBySection().map((s) => (s.group ? s.group.id : 'UNSORTED'));
            const allCollapsed = secs.length > 0 && secs.every((sid) => (RDc.ui.collapsedSections || []).includes(sid));
            RDPapers.SetUI({ collapsedSections: allCollapsed ? [] : secs });
            RenderAll();
            return;
          }
          // --- tag rename (drawer pencil button) ---
          case 'rename-tag':
            RenameTagDialog(actionEl.dataset.tag);
            return;
          // --- drawer linked rows ---
          case 'drawer-open-linked':
            OpenDrawer(actionEl.dataset.id);
            return;
          // --- .bib import preview ---
          case 'ip-select-fresh': IpSetChecks('fresh'); return;
          case 'ip-select-all': IpSetChecks('all'); return;
          case 'ip-select-none': IpSetChecks('none'); return;
          case 'ip-confirm': ConfirmImportPreview(); return;
          default: return;
        }
      }

      // rename group on dblclick of title handled separately below
    });

    document.addEventListener('dblclick', (e) => {
      if (WasRecentlyDragging()) return;
      const renameEl = e.target.closest('[data-dblclick="rename-group"]');
      if (renameEl) {
        StartGroupInlineRename(renameEl.dataset.id);
        return;
      }
      const noteEl = e.target.closest('[data-dblclick="open-notes"]');
      if (noteEl) {
        const item = RDPapers.GetItem(noteEl.dataset.itemId);
        if (item) HandleNotesOpen(item);
      }
    });

    // right-click any tag pill (cards, drawer, stats popover) to rename it everywhere
    document.addEventListener('contextmenu', (e) => {
      const pill = e.target.closest('.rd-tag-pill[data-action="filter-tag"], .rd-drawer-tags .rd-tag-pill');
      if (!pill) return;
      e.preventDefault();
      const tag = pill.dataset.tag || pill.textContent.replace(/^#/, '').replace(/×\s*$/, '').trim();
      if (tag) RenameTagDialog(tag);
    });

    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'rd-search-input') {
        // toolbar is static — the input keeps focus/caret while panels re-render
        RDPapers.SetUI({ search: t.value });
        RenderAll();
        return;
      }
    });

    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.change === 'status-filter') {
        RDPapers.SetUI({ statusFilter: t.value }); RenderAll(); return;
      }
      if (t.dataset.change === 'sort-mode') {
        RDPapers.SetUI({ sortMode: t.value }); RenderAll(); return;
      }
      if (t.dataset.change === 'bulk-assign') {
        if (!t.value) return; // placeholder option
        const gid = t.value === '__UNSORTED__' ? null : t.value;
        DoBulkUpdate({ groupId: gid });
        t.value = '';
        return;
      }
      if (t.classList && t.classList.contains('ip-check')) {
        IpUpdateCount();
        return;
      }
      // v1.5: per-entry type override in the .bib import preview
      if (t.classList && t.classList.contains('ip-type')) {
        const idx = Number(t.dataset.ipType);
        if (ImportCtx && ImportCtx.entries[idx]) ImportCtx.entries[idx].type = t.value;
        return;
      }
      // v1.8: per-entry destination group override
      if (t.classList && t.classList.contains('ip-group')) {
        const idx = Number(t.dataset.ipGroup);
        if (ImportCtx && ImportCtx.entries[idx]) ImportCtx.entries[idx].__group = t.value || '';
        return;
      }
      // v1.5: reading-queue sort mode
      if (t.id === 'rd-queue-sort') {
        const mode = RDPapers.SetQueueSort(t.value);
        RenderQueue();
        ShowToast('info', 'Queue order updated', mode === 'smart'
          ? 'Smart order — drag grips to hand-pin rows.'
          : 'Sorted by ' + t.options[t.selectedIndex].text + '.');
        return;
      }
      if (t.dataset.change === 'group-color') {
        RDPapers.UpdateGroup(t.dataset.id, { color: t.value });
        RenderAll(); return;
      }
      // v1.6: custom colour input in the drawer
      if (t.dataset.change === 'item-color') {
        RDPapers.UpdateItem(t.dataset.id, { color: t.value });
        RenderAll();
        RefreshDrawer();
        return;
      }
      if (t.id === 'rd-import-file' && t.files && t.files[0]) {
        EnsureExportModule().then((mod) => mod.ImportJSONFile(t.files[0]));
        t.value = '';
        return;
      }
      if (t.id === 'rd-bibtex-file' && t.files && t.files[0]) {
        EnsureExportModule().then((mod) => mod.ImportBibtexFile(t.files[0]));
        t.value = '';
        return;
      }
    });
  }

  function ApplyTheme() {
    const root = document.getElementById('rd-root');
    if (!root) return;
    const theme = RDPapers.State().ui.theme === 'light' ? 'light' : 'dark';
    root.setAttribute('data-theme', theme);
    const btn = document.getElementById('rd-theme-btn');
    if (btn) btn.title = theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme';
  }

  function StartGroupInlineRename(groupId) {
    const g = RDPapers.GetGroup(groupId);
    if (!g) return;
    // find the title element in whichever context is visible
    const titleEls = document.querySelectorAll(`[data-dblclick="rename-group"][data-id="${groupId}"]`);
    const el = Array.from(titleEls).find((n) => n.offsetParent !== null) || titleEls[0];
    if (!el) return;
    const input = document.createElement('input');
    input.className = el.classList.contains('rd-group-box-title') ? 'rd-section-name-input' : 'rd-section-name-input';
    input.value = g.name;
    input.style.width = Math.max(140, el.offsetWidth + 20) + 'px';
    el.replaceWith(input);
    input.focus();
    input.select();
    const finish = (save) => {
      if (save && input.value.trim() && input.value.trim() !== g.name) {
        RDPapers.UpdateGroup(groupId, { name: input.value.trim() });
        ShowToast('success', 'Group renamed', input.value.trim());
      }
      RenderAll();
    };
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') finish(true);
      if (ev.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  }

  // export.js is imported statically by app.js — this helper simply
  // forwards to it (kept async so future dynamic loading is easy).
  let ExportModuleRef = null;
  function SetExportModule(mod) { ExportModuleRef = mod; }
  function EnsureExportModule() {
    return Promise.resolve(ExportModuleRef);
  }

  return {
    GetAppHTML,
    InitApp,
    RenderAll,
    RenderList, RenderTimeline, RenderMap, RenderGroup, RenderFooter, RenderToolbarLabels,
    RenderSectionsDropdownGrid, RenderBulkBar, ClearSelection,
    SwitchTab, ApplyView, FitView,
    CurrentTabName: CurrentTab,
    ToggleQueue, CloseQueue, RenderQueue,
    OpenItemModal, CloseItemModal,
    OpenDrawer, CloseDrawer,
    OpenImportPreview,
    ShowToast, ConfirmAction,
    ShowHelpPanel, CloseHelpPanel,
    OpenPalette, ClosePalette,
    OpenDuplicatesModal, OpenMergeModal, OpenHealthModal,
    SetExportModule,
    ICONS
  };
})();

// ============================================================
// R&D Library — export.js
// Recursive standalone builder: combines HTML shell + CSS +
// all JS modules + the current library data into ONE html file
// that runs anywhere (double-click, file://) and can itself
// re-export. Also handles JSON backup import/export + reset.
// ============================================================


const RDExport = (() => {
  // Bundle order matters: dependencies first, controller last.
  const MODULE_FILES = [
    'storage.js',
    'bibtex.js',
    'doi.js',
    'papers.js',
    'ui.js',
    'export.js',
    'app.js'
  ];

  function IsStandalone() {
    return !!document.getElementById('rd-inline-bundle');
  }

  // Strip ES module syntax so every module can live in one plain
  // <script>. Our modules follow a strict convention: imports are
  // single lines at the top, and each file ends with one
  // `export { Name };` statement — both are safe to remove here.
  function TransformModuleSource(src) {
    return src
      .split('\n')
      .filter((line) => !/^\s*import\s/.test(line))
      .map((line) => line.replace(/^\s*export\s*\{[^}]*\};?\s*$/, ''))
      .join('\n');
  }

  async function GatherAssets() {
    if (IsStandalone()) {
      // Re-export from inside a standalone file: everything is already here.
      const cssEl = document.getElementById('rd-inline-css');
      const bundleEl = document.getElementById('rd-inline-bundle');
      const iconEl = document.querySelector('link[rel="icon"]');
      return {
        css: cssEl ? cssEl.textContent : '',
        bundle: bundleEl ? bundleEl.textContent : '',
        faviconUri: iconEl ? iconEl.getAttribute('href') : '',
        logoUri: (typeof window.__RD_LOGO__ === 'string') ? window.__RD_LOGO__ : ''
      };
    }
    // Development mode: fetch the live sources from the dev server.
    const bust = '?v=' + Date.now();
    const fetchText = (url) => fetch(url + bust).then((r) => {
      if (!r.ok) throw new Error('Could not fetch ' + url);
      return r.text();
    });
    const [css, faviconUri, logoSvg, ...moduleSources] = await Promise.all([
      fetchText('/css/style.css'),
      fetchText('/assets/favicon.txt').catch(() => ''),
      fetchText('/assets/logo.svg').catch(() => ''),
      ...MODULE_FILES.map((name) => fetchText('/js/' + name))
    ]);
    let logoUri = '';
    try {
      logoUri = 'data:image/svg+xml;utf8,' + encodeURIComponent(logoSvg);
    } catch (e) { logoUri = ''; }
    return { css, faviconUri, logoUri, moduleSources };
  }

  function SplashHTML() {
    return '<div class="rd-splash">' +
      '<div class="rd-splash-spinner"></div>' +
      '<div class="rd-splash-title">R&amp;D</div>' +
      '<div class="rd-splash-sub">RESEARCH &amp; DEVELOPMENT LIBRARY</div>' +
      '</div>';
  }

  function BuildStandaloneHTML(parts) {
    const dataJson = JSON.stringify({ rd: parts.data })
      .replace(/</g, '\\u003c')
      .replace(/\u2028/g, '\\u2028')
      .replace(/\u2029/g, '\\u2029');
    const logoJson = JSON.stringify(parts.logoUri || '');
    const favicon = parts.faviconUri || 'data:,';
    return '<!DOCTYPE html>\n' +
      '<html lang="en" data-theme="dark">\n' +
      '<head>\n' +
      '<meta charset="UTF-8" />\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0" />\n' +
      '<title>R&amp;D — Research &amp; Development Library</title>\n' +
      '<link rel="icon" type="image/svg+xml" href="' + favicon + '" />\n' +
      '<style id="rd-inline-css">\n' + parts.css + '\n</style>\n' +
      '</head>\n' +
      '<body>\n' +
      '<div id="rd-root">' + SplashHTML() + '</div>\n' +
      '<script>\n' +
      'window.__RD_INITIAL_DATA__ = ' + dataJson + ';\n' +
      'window.__RD_LOGO__ = ' + logoJson + ';\n' +
      '<\/script>\n' +
      '<script id="rd-inline-bundle">\n' + parts.bundle + '\n<\/script>\n' +
      '</body>\n' +
      '</html>';
  }

  function StampExport() {
    const rd = RDPapers.State();
    rd.meta.exportedAt = new Date().toISOString();
    rd.meta.exportCount = (rd.meta.exportCount || 0) + 1;
    RDPapers.SaveQuiet();
  }

  async function DownloadStandaloneHTML() {
    try {
      RDUI.ShowToast('info', 'Building standalone HTML', 'Bundling app + CSS + modules + your data…');
      StampExport();
      const assets = await GatherAssets();
      const bundle = assets.bundle || (assets.moduleSources || []).map(TransformModuleSource).join('\n;\n');
      const html = BuildStandaloneHTML({
        css: assets.css,
        bundle,
        faviconUri: assets.faviconUri,
        logoUri: assets.logoUri,
        data: RDPapers.State()
      });
      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      a.href = url;
      a.download = 'RD-Library-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      RDUI.ShowToast('success', 'Standalone HTML saved', 'One file: app + library. Open it anywhere, keep editing, export again.');
    } catch (err) {
      console.error('[R&D] standalone export failed:', err);
      RDUI.ShowToast('error', 'Export failed', err.message || 'Could not gather application sources.');
    }
  }

  // ---------- JSON backup ----------

  function DownloadTextFile(filename, text, mime) {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  // Whole library (or a subset — v1.8) -> one .bib file (LaTeX/JabRef/Zotero).
  // opts: { mode: 'all' | 'visible' | 'ids', ids: [...] }
  function DownloadBibtexFile(opts) {
    try {
      const mode = (opts && opts.mode) || 'all';
      let items;
      let label;
      if (mode === 'ids') {
        const ids = (opts && opts.ids) || [];
        items = RDPapers.GetAllItems().filter((i) => ids.indexOf(i.id) !== -1);
        label = 'selection';
      } else if (mode === 'visible') {
        items = RDPapers.VisibleItems();
        label = 'current filters';
      } else {
        items = RDPapers.GetAllItems();
        label = 'library';
      }
      if (!items.length) {
        RDUI.ShowToast('error', 'Nothing to export', mode === 'all' ? 'Add some papers first.' : 'No items match — loosen the filters first.');
        return;
      }
      const body = RDBibtex.ItemsToBibtexFile(items);
      const header = '% R&D Library — exported ' + new Date().toISOString().slice(0, 10) +
        '\n% ' + items.length + ' entr' + (items.length === 1 ? 'y' : 'ies') + ' (' + label + ')\n\n';
      const suffix = mode === 'all' ? '' : '-filtered';
      DownloadTextFile('rd-library' + suffix + '.bib', header + body + '\n', 'text/x-bibtex;charset=utf-8');
      RDUI.ShowToast('success', 'BibTeX file saved', items.length + ' entr' + (items.length === 1 ? 'y' : 'ies') + ' (' + label + ') → rd-library' + suffix + '.bib');
    } catch (err) {
      RDUI.ShowToast('error', 'BibTeX export failed', err.message);
    }
  }

  // v1.8: copy the BibTeX of the current bulk selection to the clipboard.
  function CopyBibtexForSelection(ids) {
    const items = RDPapers.GetAllItems().filter((i) => (ids || []).indexOf(i.id) !== -1);
    if (!items.length) {
      RDUI.ShowToast('error', 'Nothing selected', 'Select some cards first, then copy their citations.');
      return Promise.resolve(false);
    }
    RDBibtex.EnsureKeys(items);
    items.forEach((it) => { if (it.bibtexKey) RDPapers.UpdateItem(it.id, { bibtexKey: it.bibtexKey }, { silent: true }); });
    const text = RDBibtex.ItemsToBibtexFile(items);
    return RDBibtex.CopyToClipboard(text).then((ok) => {
      if (ok) RDUI.ShowToast('success', items.length + ' citation' + (items.length === 1 ? '' : 's') + ' copied', 'BibTeX for the whole selection is on your clipboard.');
      else RDUI.ShowToast('error', 'Copy failed', 'Your browser blocked clipboard access — try again or use the per-item copy button.');
      return ok;
    });
  }

  // Bulk import a .bib file — opens a preview modal where the user ticks
  // entries, sees duplicate flags, and picks a destination group.
  async function ImportBibtexFile(file) {
    try {
      const text = await file.text();
      const all = RDBibtex.ParseBibtexAll(text);
      if (!all.length) {
        RDUI.ShowToast('error', 'No BibTeX entries found', 'The file does not contain any @article/@book/@phdthesis entries.');
        return;
      }
      // Assign keys first, then flag entries that already exist in the
      // library: __dup (same DOI or title — blocked) and __dupKey (citation
      // key already used here or duplicated within the file — warned).
      RDBibtex.EnsureKeys(all);
      const seenFileKeys = new Set();
      all.forEach((en) => {
        en.__dup = !!(en.title && RDPapers.FindDuplicates({ doi: en.doi, title: en.title }).length);
        const nk = RDPapers.NormKey(en.bibtexKey || '');
        en.__dupKey = !!(nk && (RDPapers.FindDuplicates({ bibtexKey: en.bibtexKey }).length || seenFileKeys.has(nk)));
        if (nk) seenFileKeys.add(nk);
      });
      RDUI.OpenImportPreview(all, file.name);
    } catch (err) {
      RDUI.ShowToast('error', 'BibTeX import failed', err.message);
    }
  }

  function DownloadJSON() {
    try {
      StampExport();
      const json = RDStorage.ExportSnapshot({ rd: RDPapers.State() });
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'rd-library-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      RDUI.ShowToast('success', 'JSON backup saved');
    } catch (err) {
      RDUI.ShowToast('error', 'JSON export failed', err.message);
    }
  }

  async function ImportJSONFile(file) {
    try {
      const text = await file.text();
      const parsed = RDStorage.ParseSnapshot(text);
      const ok = await RDUI.ConfirmAction({
        title: 'Import this library?',
        html: 'The backup contains <b>' + parsed.rd.items.length + ' items</b>, <b>' +
          parsed.rd.groups.length + ' groups</b> and <b>' + parsed.rd.links.length +
          ' links</b>.<br><br>Your current library in this browser will be replaced.',
        okLabel: 'Replace library', danger: true
      });
      if (!ok) return;
      RDPapers.ReplaceAll(parsed.rd);
      RDUI.RenderAll();
      RDUI.ShowToast('success', 'Library imported', parsed.rd.items.length + ' items restored.');
    } catch (err) {
      RDUI.ShowToast('error', 'Import failed', err.message);
    }
  }

  function ResetLibrary() {
    RDStorage.Clear();
    const fresh = RDStorage.DefaultState();
    RDPapers.ReplaceAll(fresh.rd);
    RDPapers.SeedDemoData();
    RDUI.RenderAll();
    RDUI.ShowToast('success', 'Library reset', 'Fresh demo library loaded.');
  }

  return {
    IsStandalone,
    TransformModuleSource,
    GatherAssets,
    BuildStandaloneHTML,
    DownloadStandaloneHTML,
    DownloadJSON,
    ImportJSONFile,
    DownloadBibtexFile,
    CopyBibtexForSelection,
    ImportBibtexFile,
    ResetLibrary
  };
})();



;
// ============================================================
// R&D Library — app.js
// Main controller: boots the application, connects the modules
// and exposes the window.RD integration API (notes hook etc).
// ============================================================


const RDApp = (() => {

  function init() {
    if (typeof window === 'undefined') return;
    if (window.__RD_INITIALIZED__) return;
    window.__RD_INITIALIZED__ = true;

    // 1. Load state (browser storage, embedded standalone data, or fresh)
    const state = RDStorage.Load();
    const pendingEmbedded = state.__pendingEmbedded || null;
    delete state.__pendingEmbedded;

    RDPapers.Attach(state);

    // 2. First run -> seed the demo library so every tab has something to show
    if (!state.rd.meta.seededAt && state.rd.items.length === 0) {
      RDPapers.SeedDemoData();
    }
    RDPapers.EnsureAllDefaults();

    // 3. Build the UI shell and wire everything together
    const root = document.getElementById('rd-root');
    if (root) root.innerHTML = RDUI.GetAppHTML();

    // In a standalone export the logo is embedded as a data URI.
    if (typeof window.__RD_LOGO__ === 'string' && window.__RD_LOGO__) {
      document.querySelectorAll('[data-logo]').forEach((img) => { img.src = window.__RD_LOGO__; });
    }

    RDUI.SetExportModule(RDExport);
    RDUI.InitApp();

    // 4. Public integration API — your notes window can hook in here:
    //    RD.onNotes = (item) => { open your notes window for item }
    //    or listen for the "rd:open-notes" CustomEvent on window.
    window.RD = {
      version: '1.8.0',
      storage: RDStorage,
      papers: RDPapers,
      bibtex: RDBibtex,
      doi: RDDoi,
      ui: RDUI,
      export: RDExport,
      app: RDApp,
      state: () => state.rd,
      openDrawer: (id) => RDUI.OpenDrawer(id),
      openQueue: () => RDUI.ToggleQueue(),
      openPalette: () => RDUI.OpenPalette(),
      findDuplicates: () => RDUI.OpenDuplicatesModal(),
      healthCheck: (filter) => RDUI.OpenHealthModal(filter),
      fitView: (view) => RDUI.FitView(view || RDUI.CurrentTabName()),
      showHelp: () => RDUI.ShowHelpPanel(),
      onNotes: null // assign your own notes-window opener
    };

    // 5. If this standalone file carries newer data than the browser
    //    storage, let the user choose which one wins.
    if (pendingEmbedded && pendingEmbedded.rd) {
      const when = pendingEmbedded.rd.meta && pendingEmbedded.rd.meta.exportedAt
        ? new Date(pendingEmbedded.rd.meta.exportedAt).toLocaleString()
        : 'recently';
      RDUI.ConfirmAction({
        title: 'Load the library embedded in this file?',
        html: 'This standalone file was exported <b>' + esc(when) + '</b> and appears newer than the data saved in this browser.<br><br>' +
          'Loading it replaces the current browser data. Choose “Keep browser data” to continue with what is already stored here.',
        okLabel: 'Load file data'
      }).then((yes) => {
        if (yes) {
          RDPapers.ReplaceAll(pendingEmbedded.rd);
          RDUI.RenderAll();
          RDUI.ShowToast('success', 'Loaded library from file');
        } else {
          state.rd.meta.embeddedExportedAt = pendingEmbedded.rd.meta.exportedAt || null;
          RDPapers.SaveQuiet();
        }
      });
    }

    console.info('%c R&D Library ready — window.RD is available ', 'background:#8b6dff;color:#fff;padding:2px 8px;border-radius:4px;');
  }

  function esc(v) {
    return String(v || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  return { init };
})();

RDApp.init();



</script>
