// Local HUB logo HTML and CSS
function GetLogoHTML(options = {}) {
  const variant = (options.variant && LOGO_VARIANTS[options.variant]) || LOGO_VARIANTS.hub;
  const markSvg = options.markSvg || variant.markSvg;
  const title = options.title || variant.title;
  const subtitle = options.subtitle || variant.subtitle;
  const accent = options.accent !== undefined ? options.accent : variant.accent;
  const tooltip = options.tooltip || 'Back to Landing Page';
  const accentStyle = accent ? ` style="--accent: ${accent};"` : '';

  return `
    <style>
      .logo-btn {
        display: flex;
        align-items: center;
        gap: 20px;
        cursor: pointer;
        border: none;
        background: none;
        font-family: inherit;
        color: inherit;
        padding: 0;
        margin: 0;
        text-decoration: none;
        user-select: none;
      }

      @media (max-width: 440px) {
        .logo-btn {
          gap: 10px;
        }
      }

      .logo-mark {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text, #e8eaf2);
        transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s;
      }

      .logo-btn:hover .logo-mark {
        color: var(--accent, #8b6dff);
        transform: scale(1.05);
      }

      .logo-mark svg {
        height: 60px;
        width: 45px;
        display: block;
      }

      .site-name {
        display: flex;
        flex-direction: column;
        line-height: 1;
        text-align: center;
      }

      .site-name .title {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--text, #e8eaf2);
        white-space: nowrap;
      }

      .site-name .subtitle {
        font-size: 8.5px;
        font-weight: 500;
        color: var(--text-secondary, #a0a4b8);
        opacity: 0.65;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-top: 3px;
        white-space: nowrap;
      }
    </style>

    <button class="logo-btn" id="logo-btn" title="${tooltip}"${accentStyle}>
      <span class="logo-mark">
${markSvg}
      </span>
      <span class="site-name">
        <span class="title">${title}</span>
        <span class="subtitle">${subtitle}</span>
      </span>
    </button>
  `;
}

// Click on Logo takes you back to the hub:
//  - shells that define window.__LOCALHUB_HUB_URL__ (Bookmarks.html / Notes.html and their
//    standalone builds) navigate to that hub file;
//  - everywhere else (Index.html and the all-in-one Local_HUB.html) the original
//    "clear the hash" SPA navigation is used.
function InitLogoLogic() {
  const logoBtn = document.getElementById('logo-btn');
  if (logoBtn) {
    logoBtn.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('#notes-text-floating-dock').forEach(el => {
        if (typeof el.__cleanup === 'function') el.__cleanup();
        el.remove();
      });
      const hubUrl = (typeof window !== 'undefined' && window.__LOCALHUB_HUB_URL__) || '';
      if (hubUrl) {
        window.location.href = hubUrl;
      } else {
        // Navigate back to the Landing Page by clearing hash
        window.location.hash = '';
      }
    });
  }
}

const THEME_SUN_ICON_SVG = `
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5" />
    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
  </svg>
`.trim();

const THEME_MOON_ICON_SVG = `
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
  </svg>
`.trim();

function updateThemeToggleButtons(theme) {
  const isLight = theme === 'light';
  const btns = document.querySelectorAll('#theme-toggle-btn');
  btns.forEach(btn => {
    btn.innerHTML = isLight ? THEME_SUN_ICON_SVG : THEME_MOON_ICON_SVG;
    btn.title = isLight ? 'Current: Light Theme (Click for Dark Theme)' : 'Current: Dark Theme (Click for Light Theme)';
    btn.setAttribute('aria-label', isLight ? 'Current: Light Theme (Click for Dark Theme)' : 'Current: Dark Theme (Click for Light Theme)');
  });
}

// GetThemeToggleHTML(): HTML and CSS string for the theme button with a sun/moon icon.
function GetThemeToggleHTML() {
  const isLight = typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme') === 'light';
  const iconSvg = isLight ? THEME_SUN_ICON_SVG : THEME_MOON_ICON_SVG;
  const titleText = isLight ? 'Current: Light Theme (Click for Dark Theme)' : 'Current: Dark Theme (Click for Light Theme)';

  return `
    <style>
      /* Option A: Instant Theme Switch - Disables transition lag during theme toggle */
      .theme-switching,
      .theme-switching *,
      .theme-switching *::before,
      .theme-switching *::after {
        transition: none !important;
      }

      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 8px;
        border: 1px solid var(--border, #2a2e40);
        background: var(--surface, #181b27);
        color: var(--text-secondary, #a0a4b8);
        cursor: pointer;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: inherit;
        user-select: none;
      }

      .icon-btn:hover {
        color: var(--text, #e8eaf2);
        border-color: var(--accent, #8b6dff);
        background: var(--card, #1c1f2e);
        box-shadow: 0 0 10px var(--accent-glow, rgba(139, 109, 255, 0.2));
      }

      .icon-btn svg {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
      }

      @media (max-width: 420px) {
        .icon-btn {
          width: 32px;
          height: 32px;
        }
        .icon-btn svg {
          width: 15px;
          height: 15px;
        }
      }
    </style>

    <button class="icon-btn" id="theme-toggle-btn" title="${titleText}" aria-label="${titleText}">
      ${iconSvg}
    </button>
  `;
}

// InitThemeToggleLogic(): Change the Theme on click and Update the storage.
function InitThemeToggleLogic() {
  const btn = document.getElementById('theme-toggle-btn');

  // Load saved theme or default to dark
  const savedTheme = localStorage.getItem('lh_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeToggleButtons(savedTheme);

  if (btn) {
    btn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';

      // Option A: Clean, Instant Theme Switch (disable transitions during theme flip)
      document.documentElement.classList.add('theme-switching');
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('lh_theme', next);
      updateThemeToggleButtons(next);

      // Re-enable transitions on the next animation frame for normal hover effects
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          document.documentElement.classList.remove('theme-switching');
        });
      });
    });
  }
}

// GetScrollbarStyles: HTML and CSS for ultra-thin (4px) for scrollbars Theme Changable
function GetScrollbarStyles() {
  return `
    <style id="universal-scrollbar-styles">
      /* Universal Thin Opposite-Theme Scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: thin;
        scrollbar-color: rgba(232, 234, 242, 0.45) transparent;
      }

      [data-theme="light"] *,
      [data-theme="light"] *::before,
      [data-theme="light"] *::after {
        scrollbar-color: rgba(26, 29, 46, 0.45) transparent;
      }

      /* WebKit & Chromium Horizontal & Vertical Scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }

      ::-webkit-scrollbar-track {
        background: transparent !important;
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(232, 234, 242, 0.42);
        border-radius: 9999px;
      }

      ::-webkit-scrollbar-thumb:hover {

  if (window.__LOCALHUB_PAGE__ && window.__LOCALHUB_PAGE__ !== 'hub') {
    return String(window.__LOCALHUB_PAGE__).toLowerCase().trim();
  }
  if (typeof document !== 'undefined') {
    if (document.getElementById('NotesData') && !document.getElementById('LandingPageData') && !document.getElementById('Bookmarks')) {

}

function sanitizeImportedNote(n, idx = 0) {
  if (!n || typeof n !== 'object') {
    return {
      id: `note_${Date.now()}_${idx}`,
      title: 'Untitled Note',
      folder: 'General',
      tags: [],
      blocks: [],
      macros: { equation: '', tikz: '' },
      meta: { created: new Date().toISOString().slice(0, 10), author: 'User' }
    };
  }
  return {
    id: n.id || `note_${Date.now()}_${idx}`,
    slug: n.slug || (n.title ? n.title.toLowerCase().replace(/[^a-z0-9]+/g, '-') : `note-${idx}`),
    title: n.title || 'Untitled Note',
    folder: n.folder || 'General',
    tags: Array.isArray(n.tags) ? n.tags : [],
    description: n.description || '',
    meta: n.meta || { created: new Date().toISOString().slice(0, 10), author: 'User' },
    flashcard: n.flashcard || null,
    blocks: Array.isArray(n.blocks) ? n.blocks : [],
    autoNumbering: n.autoNumbering || { h1: 'numeric', h2: 'numeric', h3: 'numeric' },
    logo: n.logo || null,
    macros: (n.macros && typeof n.macros === 'object') ? {
      equation: n.macros.equation || '',
      tikz: n.macros.tikz || ''
    } : { equation: '', tikz: '' }
  };
}

// Logic For Universal Self-Healing Import
function TriggerImport(onSuccess = null) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const importedData = JSON.parse(event.target.result);
        if (!importedData || typeof importedData !== 'object') {
          throw new Error('Imported file does not contain a valid JSON object.');
        }

        const now = Date.now();
        const activeTab = getActiveTabPage();

        // ========================================================
        // INDIVIDUAL TAB MODE: Isolated to active tab only
        // ========================================================
        if (activeTab === 'notes') {
          let targetData = null;
          if (importedData.NotesData && typeof importedData.NotesData === 'object') {
            targetData = importedData.NotesData;
          } else if (Array.isArray(importedData.notes) || importedData.vaultMeta) {
            targetData = importedData;
          } else {
            throw new Error('No notes data found in this file.');
          }

          let cleanData = JSON.parse(JSON.stringify(targetData));
          delete cleanData._unsaved;
          delete cleanData._savedAt;

          cleanData.vaultMeta = cleanData.vaultMeta || { title: "My Research & Notes Vault", version: "1.0.0" };
          cleanData.vaultMeta.lastSaved = now;
          cleanData.globalMacros = cleanData.globalMacros || { ...DEFAULT_MACROS };
          cleanData.tableTemplates = Array.isArray(cleanData.tableTemplates) ? cleanData.tableTemplates : [];
          cleanData.tikzTemplates = Array.isArray(cleanData.tikzTemplates) ? cleanData.tikzTemplates : [];
          cleanData.bibliography = Array.isArray(cleanData.bibliography) ? cleanData.bibliography : [];
          cleanData.citationStyle = typeof cleanData.citationStyle === 'string' ? cleanData.citationStyle : 'numeric';
          cleanData.notes = Array.isArray(cleanData.notes) ? cleanData.notes.map(sanitizeImportedNote) : [];
          cleanData.folders = Array.isArray(cleanData.folders) && cleanData.folders.length > 0 
            ? cleanData.folders 
            : Array.from(new Set(cleanData.notes.map(n => n.folder || 'General').filter(Boolean)));
          cleanData.tags = Array.isArray(cleanData.tags) && cleanData.tags.length > 0 
            ? cleanData.tags 
            : Array.from(new Set(cleanData.notes.flatMap(n => n.tags || []).filter(Boolean)));

          // Update DOM script block
          let scriptBlock = document.getElementById('NotesData');
          if (!scriptBlock) {
            scriptBlock = document.createElement('script');
            scriptBlock.type = 'application/json';
            scriptBlock.id = 'NotesData';
            document.head.appendChild(scriptBlock);
          }
          scriptBlock.textContent = JSON.stringify(cleanData, null, 2);

          // Update live memory
          if (typeof window !== 'undefined' && window.NotesState) {
            Object.assign(window.NotesState, cleanData);
          }

          // Update localStorage cache
          try {
            if (typeof localStorage !== 'undefined') {
              const cachePayload = {
                ...cleanData,
                _unsaved: true,
                _savedAt: now
              };
              localStorage.setItem('NotesData_Local_Cache', JSON.stringify(cachePayload));
            }
          } catch (err) {
            console.warn('[Notes Import] Failed to cache in localStorage:', err);
          }

          alert('Notes imported successfully! Remember to click SAVE to make it permanent in your HTML.');
          if (onSuccess) {
            onSuccess(cleanData);
          } else {
            window.location.reload();
          }
          return;
        }

        if (activeTab === 'bookmarks') {
          let targetData = null;
          if (importedData.Bookmarks && typeof importedData.Bookmarks === 'object') {
            targetData = importedData.Bookmarks;
          } else if (Array.isArray(importedData.bookmarks) || importedData.sectionOrder) {
            targetData = importedData;
          } else {
            throw new Error('No bookmarks data found in this file.');
          }

          let cleanData = JSON.parse(JSON.stringify(targetData));
          delete cleanData._unsaved;
          delete cleanData._savedAt;
          cleanData.bookmarks = Array.isArray(cleanData.bookmarks) ? cleanData.bookmarks : [];
          cleanData.sectionOrder = Array.isArray(cleanData.sectionOrder) ? cleanData.sectionOrder : ['ALL'];
          if (!cleanData.sectionOrder.includes('ALL')) cleanData.sectionOrder.unshift('ALL');
          cleanData._lastSaved = now;

          let scriptBlock = document.getElementById('Bookmarks');
          if (!scriptBlock) {
            scriptBlock = document.createElement('script');
            scriptBlock.type = 'application/json';
            scriptBlock.id = 'Bookmarks';
            document.head.appendChild(scriptBlock);
          }
          scriptBlock.textContent = JSON.stringify(cleanData, null, 2);

          if (typeof window !== 'undefined' && window.BookmarkState) {
            Object.assign(window.BookmarkState, cleanData);
          }

          try {
            if (typeof localStorage !== 'undefined') {
              const cachePayload = {
                ...cleanData,
                _unsaved: true,
                _savedAt: now
              };
              localStorage.setItem('Bookmarks_Local_Cache', JSON.stringify(cachePayload));
            }
          } catch (err) {
            console.warn('[Bookmarks Import] Failed to cache in localStorage:', err);
          }

          alert('Bookmarks imported successfully! Remember to click SAVE to make it permanent in your HTML.');
          if (onSuccess) {
            onSuccess(cleanData);
          } else {
            window.location.reload();
          }
          return;
        }

        // ========================================================
        // GLOBAL HUB MODE: Master multi-tab container & single payloads
        // ========================================================
        let masterBlocks = {};
        if (importedData.LandingPageData || importedData.Bookmarks || importedData.NotesData || importedData.ProfessorsData || importedData.RDData) {
          masterBlocks = importedData;
        } else if (Array.isArray(importedData.notes) || importedData.vaultMeta) {
          masterBlocks['NotesData'] = importedData;
        } else if (Array.isArray(importedData.bookmarks) || importedData.sectionOrder) {
          masterBlocks['Bookmarks'] = importedData;
        } else if (Array.isArray(importedData.professors)) {
          masterBlocks['ProfessorsData'] = importedData;
        } else if (Array.isArray(importedData.items) || importedData.groupOrder || importedData.links) {
          masterBlocks['RDData'] = importedData;
        } else if (Array.isArray(importedData.tabs)) {
          masterBlocks['LandingPageData'] = importedData;
        } else {
          masterBlocks = importedData;
        }

        // Universally sanitize, auto-create missing fields, and sync to DOM & localStorage
        for (const [id, rawData] of Object.entries(masterBlocks)) {
          if (!rawData || typeof rawData !== 'object') continue;

          let cleanData = JSON.parse(JSON.stringify(rawData));
          delete cleanData._unsaved;
          delete cleanData._savedAt;

          // Auto-create missing parts for NotesData
          if (id === 'NotesData' || Array.isArray(cleanData.notes) || cleanData.vaultMeta) {
            cleanData.vaultMeta = cleanData.vaultMeta || { title: "My Research & Notes Vault", version: "1.0.0" };
            cleanData.vaultMeta.lastSaved = now;
            cleanData.globalMacros = cleanData.globalMacros || { ...DEFAULT_MACROS };
            cleanData.tableTemplates = Array.isArray(cleanData.tableTemplates) ? cleanData.tableTemplates : [];
            cleanData.tikzTemplates = Array.isArray(cleanData.tikzTemplates) ? cleanData.tikzTemplates : [];
            cleanData.bibliography = Array.isArray(cleanData.bibliography) ? cleanData.bibliography : [];
            cleanData.citationStyle = typeof cleanData.citationStyle === 'string' ? cleanData.citationStyle : 'numeric';
            cleanData.notes = Array.isArray(cleanData.notes) ? cleanData.notes.map(sanitizeImportedNote) : [];
            cleanData.folders = Array.isArray(cleanData.folders) && cleanData.folders.length > 0 
              ? cleanData.folders 
              : Array.from(new Set(cleanData.notes.map(n => n.folder || 'General').filter(Boolean)));
            cleanData.tags = Array.isArray(cleanData.tags) && cleanData.tags.length > 0 
              ? cleanData.tags 
              : Array.from(new Set(cleanData.notes.flatMap(n => n.tags || []).filter(Boolean)));
          }
          // Auto-create missing parts for Bookmarks
          else if (id === 'Bookmarks' || Array.isArray(cleanData.bookmarks)) {
            cleanData.bookmarks = Array.isArray(cleanData.bookmarks) ? cleanData.bookmarks : [];
            cleanData.sectionOrder = Array.isArray(cleanData.sectionOrder) ? cleanData.sectionOrder : ['ALL'];
            if (!cleanData.sectionOrder.includes('ALL')) cleanData.sectionOrder.unshift('ALL');
            cleanData._lastSaved = now;
          }
          // Auto-create missing parts for ProfessorsData
          else if (id === 'ProfessorsData' || Array.isArray(cleanData.professors)) {
            cleanData.version = cleanData.version || 1;
            cleanData.updatedAt = new Date().toISOString();
            cleanData.professors = Array.isArray(cleanData.professors) ? cleanData.professors : [];
            try {
              if (typeof localStorage !== 'undefined') {
                localStorage.setItem('profftrack:v1', JSON.stringify(cleanData));
              }
            } catch (err) {
              console.warn('[Import] Failed to save profftrack:v1 in localStorage:', err);
            }
          }
          // Auto-create missing parts for RDData
          else if (id === 'RDData' || Array.isArray(cleanData.items)) {
            cleanData.version = cleanData.version || 1;
            cleanData.updatedAt = new Date().toISOString();
            cleanData.items = Array.isArray(cleanData.items) ? cleanData.items : [];
            cleanData.groups = Array.isArray(cleanData.groups) ? cleanData.groups : [];
            cleanData.groupOrder = Array.isArray(cleanData.groupOrder) ? cleanData.groupOrder : [];
            cleanData.itemOrder = Array.isArray(cleanData.itemOrder) ? cleanData.itemOrder : [];
            cleanData.links = Array.isArray(cleanData.links) ? cleanData.links : [];
            try {
              if (typeof localStorage !== 'undefined') {
                localStorage.setItem('rd_library_v1', JSON.stringify({ rd: cleanData }));
              }
            } catch (err) {
              console.warn('[Import] Failed to save rd_library_v1 in localStorage:', err);
            }
          }
          // Auto-create missing parts for LandingPageData
          else if (id === 'LandingPageData' || Array.isArray(cleanData.tabs)) {
            cleanData.tabs = Array.isArray(cleanData.tabs) ? cleanData.tabs : [];
            cleanData._lastSaved = now;
          } else {
            cleanData._lastSaved = now;
          }

          // A. Update or create DOM <script type="application/json" id="...">
          let scriptBlock = document.getElementById(id);
          if (!scriptBlock) {
            scriptBlock = document.createElement('script');
            scriptBlock.type = 'application/json';
            scriptBlock.id = id;
            document.head.appendChild(scriptBlock);
          }
          scriptBlock.textContent = JSON.stringify(cleanData, null, 2);

          // B. Update in-memory window state objects if present
          if (typeof window !== 'undefined') {
            if (id === 'NotesData' && window.NotesState) Object.assign(window.NotesState, cleanData);
            if (id === 'Bookmarks' && window.BookmarkState) Object.assign(window.BookmarkState, cleanData);
            if (id === 'LandingPageData' && window.AppState) Object.assign(window.AppState, cleanData);
            if (id === 'ProfessorsData') {
              if (window.ProfessorsState) Object.assign(window.ProfessorsState, cleanData);
              if (typeof window.replaceState === 'function') window.replaceState(cleanData);
            }
            if (id === 'RDData') {
              if (window.RDState) Object.assign(window.RDState, { rd: cleanData });
              if (window.RD && typeof window.RD.replaceState === 'function') window.RD.replaceState(cleanData);
            }
            if (window[id + 'State']) Object.assign(window[id + 'State'], cleanData);
            if (window[id]) Object.assign(window[id], cleanData);
          }

          // C. Save to LocalStorage with _unsaved: true and _savedAt: now
          try {
            if (typeof localStorage !== 'undefined') {
              const cachePayload = {
                ...cleanData,
                _unsaved: true,
                _savedAt: now
              };
              localStorage.setItem(id + '_Local_Cache', JSON.stringify(cachePayload));
            }
          } catch (err) {
            console.warn(`[Import] Failed to cache ${id} in localStorage:`, err);
          }
        }

        alert('Data imported successfully! All missing fields were automatically structured. Remember to click SAVE to make it permanent in your HTML.');

        if (onSuccess) {
          onSuccess(masterBlocks);
        } else {
          window.location.reload();
        }
      } catch (err) {
        alert('Invalid JSON file: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

    if ((!foundData || !foundData.professors || foundData.professors.length === 0) && id === 'ProfessorsData') {

          if (parsed && Array.isArray(parsed.professors) && parsed.professors.length > 0) {
            foundData = parsed;
          }
        }
      } catch (e) { }
    }

    if ((!foundData || !foundData.items || foundData.items.length === 0) && id === 'RDData') {
      try {
        const stored = typeof localStorage !== 'undefined' ? localStorage.getItem('rd_library_v1') : null;
        if (stored) {
          const parsed = JSON.parse(stored);
          if (parsed && typeof parsed === 'object') {
            foundData = parsed.rd || parsed;
          }
        }
      } catch (e) { }
    }

    if (foundData) {
      const cleanData = JSON.parse(JSON.stringify(foundData));
      delete cleanData._unsaved;
      delete cleanData._savedAt;
      masterBackup[id] = cleanData;
    }
  });

  const dataStr = JSON.stringify(masterBackup, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Local_HUB_DATA.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Automatically syncs all DOM <script type="application/json"> blocks with live window states and localStorage caches
function syncAllStatesToDOM(doc) {
  if (typeof window === 'undefined') return;
  if (typeof window.flushNotesSave === 'function') window.flushNotesSave();

  const now = Date.now();
  const dataScripts = doc.querySelectorAll('script[type="application/json"][id]');
  dataScripts.forEach(script => {
    const id = script.id;
    let foundData = null;

    // 1. Check window state matching id (e.g. window.BookmarkState, window.NotesState, window.AppState, window.RD, window[id])
    if (id === 'RDData') {
      if (window.RD && typeof window.RD.state === 'function') {
        foundData = window.RD.state();
      } else if (window.RDState) {
        foundData = window.RDState.rd || window.RDState;
      }
    }

    const candidateKeys = [
      id,
      id + 'State',
      id.replace(/Data$/, '') + 'State',
      'App' + id,
      'AppState',
      'BookmarkState',
      'NotesState',
      'ProfessorsState',
      'RDState'
    ];

    if (!foundData) {
      for (const key of candidateKeys) {
        if (window[key] && typeof window[key] === 'object' && Object.keys(window[key]).length > 0) {
          if (
            key === id ||
            key === id + 'State' ||
            key === id.replace(/Data$/, '') + 'State' ||
            (id === 'LandingPageData' && key === 'AppState') ||
            (id === 'Bookmarks' && key === 'BookmarkState') ||
            (id === 'NotesData' && key === 'NotesState') ||
            (id === 'ProfessorsData' && key === 'ProfessorsState') ||
            (id === 'RDData' && key === 'RDState')
          ) {
            foundData = (id === 'RDData' && window[key].rd) ? window[key].rd : window[key];
            break;
          }
        }
      }
    }

    // 2. Check localStorage cache for latest edits only if not found in live window state
    if (!foundData) {
      const cacheKeys = [id + '_Local_Cache', id.replace(/Data$/, '') + '_Local_Cache', id];
      if (id === 'RDData') cacheKeys.push('rd_library_v1');
      for (const ck of cacheKeys) {
        try {
          const cached = localStorage.getItem(ck);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed && typeof parsed === 'object') {
              foundData = (id === 'RDData' && parsed.rd) ? parsed.rd : parsed;
              break;
            }
          }
        } catch (e) { }
      }
    }

    if (foundData) {
      try {
        // Deep clone to sanitize and set lastSaved
        const cleanData = JSON.parse(JSON.stringify(foundData));
        delete cleanData._unsaved;
        delete cleanData._savedAt;

        if (id === 'NotesData') {
          if (!cleanData.vaultMeta) cleanData.vaultMeta = {};
          cleanData.vaultMeta.lastSaved = now;
          if (window.NotesState && window.NotesState.vaultMeta) {
            window.NotesState.vaultMeta.lastSaved = now;
          }
        } else if (id === 'RDData') {
          cleanData.updatedAt = new Date().toISOString();
        } else {
          cleanData._lastSaved = now;
          if (id === 'Bookmarks' && window.BookmarkState) {
            window.BookmarkState._lastSaved = now;
          } else if (id === 'LandingPageData' && window.AppState) {
            window.AppState._lastSaved = now;
          }
        }

        script.textContent = JSON.stringify(cleanData, null, 2);

        // Also update live in-memory document script tag
        if (typeof document !== 'undefined') {
          const liveScript = document.getElementById(id);
          if (liveScript && liveScript !== script) {
            liveScript.textContent = JSON.stringify(cleanData, null, 2);
          }
        }
      } catch (e) { }
    }
  });
}

  const DocClone = document.documentElement.cloneNode(true);

  // 1. Auto-sync all data blocks from in-memory / localStorage

  // 2. Check if running in standalone mode
  const isStandalone = typeof window !== 'undefined' && window.__IS_STANDALONE__ === true;

  if (!isStandalone) {
    async function bundleFile(filePath) {
      try {
        const cleanPath = filePath.endsWith('.js') ? filePath : filePath + '.js';
        const resolvedUrl = new URL('../' + cleanPath, import.meta.url).href;
        const res = await fetch(resolvedUrl);
        if (!res.ok) {
          console.warn(`[Bundler] Skipping unavailable file: ${cleanPath} (${res.status})`);
          return '';
        }
        let code = await res.text();
        if (!code || !code.trim()) return '';

        // Strip module imports/exports for flat bundle embedding
        code = code.replace(/^\s*import\s+[\s\S]*?from\s+['"][^'"]+['"];?\s*$/gm, '');
        code = code.replace(/^\s*import\s+['"][^'"]+['"];?\s*$/gm, '');
        code = code.replace(/^\s*export\s+\*[\s\S]*?from\s+['"][^'"]+['"];?\s*$/gm, '');
        code = code.replace(/^\s*export\s*\{[\s\S]*?\}\s*from\s+['"][^'"]+['"];?\s*$/gm, '');
        code = code.replace(/^\s*export\s*\{[\s\S]*?\};?\s*$/gm, '');

        code = code.replace(/^\s*export\s+(async\s+)?(function|const|let|var|class)/gm, (m, p1, p2) => (p1 || '') + p2);
        return `\n/* --- ${cleanPath} --- */\n${code}\n`;

// Clears all unsaved local cache keys from browser localStorage
function ClearAllLocalCaches() {
  if (typeof localStorage === 'undefined') return;
  // 1. Clear known tab cache keys based on DOM data blocks
  if (typeof document !== 'undefined') {
    const dataScripts = document.querySelectorAll('script[type="application/json"][id]');
    dataScripts.forEach(s => {
      try {
        localStorage.removeItem(s.id + '_Local_Cache');
        localStorage.removeItem(s.id.replace(/Data$/, '') + '_Local_Cache');
        localStorage.removeItem(s.id);
      } catch (e) { }
    });
  }
  // 2. Also sweep any key in localStorage ending with _Local_Cache
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const key = localStorage.key(i);
      if (key && (key.endsWith('_Local_Cache') || key.includes('_Cache'))) {
        localStorage.removeItem(key);
      }
    }
  } catch (e) { }

  // 3. Clear per-block undo/redo history stacks from memory
  if (typeof window !== 'undefined' && window.__blockHistories) {
    try {
      window.__blockHistories.clear();
    } catch (e) { }
  }

  console.log('[Save] All unsaved local caches flushed successfully.');
}

/**
 * 00_Components/06_Color_Selector.js
 * Universal Dual-Theme Color Selector Component [ + | ○ Light | ○ Dark ].
 * Supports:
 * - Dual-color specification: Light Mode Hex & Dark Mode Hex (#Light|#Dark)
 * - Dynamic theme detection (observes [data-theme="light"] vs default dark)
 * - Clickable color swatches with native <input type="color">
 * - Active swatch highlighting according to current system/app theme
 * - Shared helper resolveThemeColors() to translate #Light|#Dark into current theme hex
 */

let activeLightColor = '#dc2626'; // Default red for light mode
let activeDarkColor = '#f87171';  // Default bright coral for dark mode

/**
 * Resolves dual-theme color syntax #LightHex|#DarkHex into a single valid hex code
 * based on the active theme.
 * Also handles \textcolor{#Light|#Dark}{...}
 */
function resolveThemeColors(text, isDarkMode = null) {
  if (!text || typeof text !== 'string') return text || '';
  const isDark = (isDarkMode !== null)
    ? isDarkMode
    : (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme') !== 'light');

  // Replace #light|#dark with active theme hex
  return text.replace(/#([0-9a-fA-F]{3,8})\|#([0-9a-fA-F]{3,8})/g, (_, light, dark) => {
    return isDark ? `#${dark}` : `#${light}`;
  });
}

/**
 * Returns currently active color pair
 */
function getCurrentColorPair() {
  return {
    light: activeLightColor,
    dark: activeDarkColor,
    dual: `${activeLightColor}|${activeDarkColor}`,
    activeHex: (typeof document !== 'undefined' && document.documentElement.getAttribute('data-theme') === 'light')
      ? activeLightColor
      : activeDarkColor
  };
}

/**
 * Sets current active colors programmatically
 */
function setCurrentColorPair(light, dark) {
  if (light) activeLightColor = light;
  if (dark) activeDarkColor = dark;
}

/**
 * Creates a DOM node for the [ + | ○ Light | ○ Dark ] component.
 */
function CreateColorSelector({
  defaultLight = activeLightColor,
  defaultDark = activeDarkColor,
  onApply = null,        // Called when [+] is clicked: ({ light, dark, dual, activeHex })
  onColorChange = null,  // Called when either light or dark color is adjusted
  btnTitle = "Insert color code at cursor",
  className = ""
} = {}) {
  let light = defaultLight || activeLightColor;
  let dark = defaultDark || activeDarkColor;

  const container = document.createElement('div');
  container.className = `color-selector-widget inline-flex items-center rounded-md border border-[var(--border)] bg-[var(--surface)] h-7 overflow-hidden flex-shrink-0 shadow-xs select-none transition-all ${className}`;

  container.innerHTML = `
    <!-- Plus / Apply Button -->
    <button type="button" class="btn-color-apply px-2 h-full text-xs font-bold hover:bg-[var(--card-hover)] active:scale-95 transition-all flex items-center justify-center text-[var(--text)] cursor-pointer" title="${btnTitle}">
      <span class="text-sm font-bold leading-none select-none">+</span>
    </button>

    <div class="w-[1px] h-3.5 bg-[var(--border)] flex-shrink-0"></div>

    <!-- Light Mode Swatch (Sun Icon / L) -->
    <label class="swatch-label swatch-light px-1.5 h-full flex items-center justify-center cursor-pointer hover:bg-[var(--card-hover)] transition-all relative flex-shrink-0" title="Light Theme Color (Click to change)">
      <span class="swatch-dot swatch-dot-light w-3 h-3 rounded-full border border-black/25 shadow-xs inline-block transition-transform hover:scale-110" style="background-color: ${light};"></span>
      <span class="absolute bottom-0.5 right-0.5 w-1 h-1 rounded-full bg-amber-400 opacity-80 pointer-events-none" title="Light mode"></span>
      <input type="color" class="input-color-light absolute inset-0 opacity-0 cursor-pointer w-full h-full" value="${light}" />
    </label>

    <div class="w-[1px] h-3.5 bg-[var(--border)] flex-shrink-0"></div>

    <!-- Dark Mode Swatch (Moon Icon / D) -->
    <label class="swatch-label swatch-dark px-1.5 h-full flex items-center justify-center cursor-pointer hover:bg-[var(--card-hover)] transition-all relative flex-shrink-0" title="Dark Theme Color (Click to change)">
      <span class="swatch-dot swatch-dot-dark w-3 h-3 rounded-full border border-white/30 shadow-xs inline-block transition-transform hover:scale-110" style="background-color: ${dark};"></span>
      <span class="absolute bottom-0.5 right-0.5 w-1 h-1 rounded-full bg-indigo-400 opacity-80 pointer-events-none" title="Dark mode"></span>
      <input type="color" class="input-color-dark absolute inset-0 opacity-0 cursor-pointer w-full h-full" value="${dark}" />
    </label>
  `;

  const btnApply = container.querySelector('.btn-color-apply');
  const inputLight = container.querySelector('.input-color-light');
  const dotLight = container.querySelector('.swatch-dot-light');
  const labelLight = container.querySelector('.swatch-light');

  const inputDark = container.querySelector('.input-color-dark');
  const dotDark = container.querySelector('.swatch-dot-dark');
  const labelDark = container.querySelector('.swatch-dark');

  // Update theme highlight on swatches
  function updateThemeHighlight() {
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    if (isLight) {
      labelLight.classList.add('bg-amber-500/20');
      labelDark.classList.remove('bg-indigo-500/20');
    } else {
      labelDark.classList.add('bg-indigo-500/20');
      labelLight.classList.remove('bg-amber-500/20');
    }
  }
  updateThemeHighlight();

  // Watch for theme changes
  const observer = new MutationObserver(() => {
    updateThemeHighlight();
  });
  observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // Light color input change
  inputLight.addEventListener('input', (e) => {
    light = e.target.value;
    activeLightColor = light;
    dotLight.style.backgroundColor = light;
    if (onColorChange) onColorChange({ light, dark, dual: `${light}|${dark}` });
  });

  // Dark color input change
  inputDark.addEventListener('input', (e) => {
    dark = e.target.value;
    activeDarkColor = dark;
    dotDark.style.backgroundColor = dark;
    if (onColorChange) onColorChange({ light, dark, dual: `${light}|${dark}` });
  });

  // Apply button clicked
  btnApply.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const isLight = document.documentElement.getAttribute('data-theme') === 'light';
    const activeHex = isLight ? light : dark;
    if (onApply) {
      onApply({
        light,
        dark,
        dual: `${light}|${dark}`,
        activeHex,
        latexCommand: `\\textcolor{${light}|${dark}}{}`
      });
    }
  });

  return container;
}

// Per-tab standalone Save handler for 02_Bookmarks/Bookmarks.html.
//
// This file is deliberately SELF-CONTAINED (no imports from 00_Components) and is
// NOT part of the all-in-one bundler lists in 00_Components/05_Save_Button.js.
// Index.html never loads it. Its only job: on the Bookmarks.html page, the Save
// button compiles exactly this tab (shared components + these handler files +
// the bookmark modules) into ONE standalone HTML file and downloads it.
//
// The shared Save button on Index.html (all-in-one build) is completely untouched.

const TAB_OUTPUT_NAME = 'Bookmarks.html';

// Syncs all DOM <script type="application/json"> vault blocks with live window
// states and localStorage caches (local copy of the proven shared sync logic).
function syncTabStatesToDOM(doc) {
  if (typeof window === 'undefined') return;
  if (typeof window.flushNotesSave === 'function') window.flushNotesSave();

  const now = Date.now();
  const dataScripts = doc.querySelectorAll('script[type="application/json"][id]');
  dataScripts.forEach(script => {
    const id = script.id;
    let foundData = null;

    const candidateKeys = [
      id,
      id + 'State',
      id.replace(/Data$/, '') + 'State',
      'App' + id,
      'AppState',
      'BookmarkState',
      'NotesState'
    ];

    for (const key of candidateKeys) {
      if (window[key] && typeof window[key] === 'object' && Object.keys(window[key]).length > 0) {
        if (
          key === id ||
          key === id + 'State' ||
          key === id.replace(/Data$/, '') + 'State' ||
          (id === 'LandingPageData' && key === 'AppState') ||
          (id === 'Bookmarks' && key === 'BookmarkState') ||
          (id === 'NotesData' && key === 'NotesState')
        ) {
          foundData = window[key];
          break;
        }
      }
    }

    if (!foundData) {
      const cacheKeys = [id + '_Local_Cache', id.replace(/Data$/, '') + '_Local_Cache', id];
      for (const ck of cacheKeys) {
        try {
          const cached = localStorage.getItem(ck);
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed && typeof parsed === 'object') {
              foundData = parsed;
              break;
            }
          }
        } catch (e) { }
      }
    }

    if (foundData) {
      try {
        const cleanData = JSON.parse(JSON.stringify(foundData));
        delete cleanData._unsaved;
        delete cleanData._savedAt;

        if (id === 'NotesData') {
          if (!cleanData.vaultMeta) cleanData.vaultMeta = {};
          cleanData.vaultMeta.lastSaved = now;
          if (window.NotesState && window.NotesState.vaultMeta) {
            window.NotesState.vaultMeta.lastSaved = now;
          }
        } else {
          cleanData._lastSaved = now;
          if (id === 'Bookmarks' && window.BookmarkState) {
            window.BookmarkState._lastSaved = now;
          } else if (id === 'LandingPageData' && window.AppState) {
            window.AppState._lastSaved = now;
          }
        }

        script.textContent = JSON.stringify(cleanData, null, 2);

        if (typeof document !== 'undefined') {
          const liveScript = document.getElementById(id);
          if (liveScript && liveScript !== script) {
            liveScript.textContent = JSON.stringify(cleanData, null, 2);
          }
        }
      } catch (e) { }
    }
  });
}

// Clears all unsaved local cache keys from browser localStorage (local copy).
function clearAllTabLocalCaches() {
  if (typeof localStorage === 'undefined') return;
  try {
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const key = localStorage.key(i);
      if (key && (key.endsWith('_Local_Cache') || key.includes('_Cache'))) {
        localStorage.removeItem(key);
      }
    }
  } catch (e) { }

  if (typeof window !== 'undefined' && window.__blockHistories) {
    try {
      window.__blockHistories.clear();

}

// Fetches one modular JS file and strips ES module syntax for flat embedding.
// Resolves paths against the project root (this file sits one level deep).
async function bundleTabFile(filePath) {
  try {
    const cleanPath = filePath.endsWith('.js') ? filePath : filePath + '.js';
    const resolvedUrl = new URL('../' + cleanPath, import.meta.url).href;
    const res = await fetch(resolvedUrl);
    if (!res.ok) {
      console.warn(`[TabBundler] Skipping unavailable file: ${cleanPath} (${res.status})`);
      return '';
    }
    let code = await res.text();
    if (!code || !code.trim()) return '';

    code = code.replace(/^\s*import\s+[\s\S]*?from\s+['"][^'"]+['"];?\s*$/gm, '');
    code = code.replace(/^\s*import\s+['"][^'"]+['"];?\s*$/gm, '');
    code = code.replace(/^\s*export\s+\*[\s\S]*?from\s+['"][^'"]+['"];?\s*$/gm, '');
    code = code.replace(/^\s*export\s*\{[\s\S]*?\}\s*from\s+['"][^'"]+['"];?\s*$/gm, '');
    code = code.replace(/^\s*export\s*\{[\s\S]*?\};?\s*$/gm, '');
    code = code.replace(/^\s*export\s+default\s+/gm, '');
    code = code.replace(/^\s*export\s+(async\s+)?(function|const|let|var|class)/gm, (m, p1, p2) => (p1 || '') + p2);
    return `\n/* --- ${cleanPath} --- */\n${code}\n`;
  } catch (e) {
    console.warn(`[TabBundler] Error reading ${filePath}:`, e);
    return '';
  }
}

async function bundleTabGroup(files) {
  let out = '';
  for (const f of files) out += await bundleTabFile(f);
  return out;
}

// Compiles THIS tab into one standalone HTML file and downloads it.
// Inside an already-standalone file it just re-emits itself with fresh vault data.
async function SaveBookmarksStandalone() {
  const DocClone = document.documentElement.cloneNode(true);

  syncTabStatesToDOM(DocClone);

  const isStandalone = typeof window !== 'undefined' && window.__IS_STANDALONE__ === true;

  if (!isStandalone) {
    const [bundledComponents, bundledHandlers, bundledTab] = await Promise.all([
      bundleTabGroup(sharedComponentFiles),
      bundleTabGroup(tabHandlerFiles),
      bundleTabGroup(tabModuleFiles)
    ]);

    const finalModuleCode = `

window.__LOCALHUB_PAGE__ = 'bookmarks';
window.__LOCALHUB_HUB_URL__ = 'Index.html';

   SHARED COMPONENTS
   ========================================================================== */
${bundledComponents}

   ========================================================================== */

}

/* ==========================================================================

   ========================================================================== */
function handlePageRoute() {
  const root = document.getElementById('root');
  if (root) root.innerHTML = '';
  LoadThisPage();
}

window.addEventListener('hashchange', handlePageRoute);
handlePageRoute();
`;

    // Replace this page's boot script (deterministic id, sniffing fallback)
    let replaced = false;
    const routerScript = DocClone.querySelector('script#localhub-router');
    if (routerScript) {
      const inlineScript = document.createElement('script');
      inlineScript.type = 'module';
      inlineScript.textContent = finalModuleCode;
      routerScript.replaceWith(inlineScript);
      replaced = true;
    }
    if (!replaced) {
      const scripts = DocClone.querySelectorAll('script[type="module"]');
      for (let s of scripts) {
        if (s.textContent.includes('Bookmarks.js') || s.textContent.includes('bootBookmarksPage')) {
          const inlineScript = document.createElement('script');
          inlineScript.type = 'module';
          inlineScript.textContent = finalModuleCode;
          s.replaceWith(inlineScript);
          break;
        }
      }
    }
  }

  // Cleanup runtime containers before download
  DocClone.querySelectorAll('script[src*="livepreview"], script[src*="livereload"]').forEach(s => s.remove());
  ['#canvas-container', '#loading-container', '#root'].forEach(sel => {
    const el = DocClone.querySelector(sel);
    if (el) el.innerHTML = '';
  });

  const currentHTML = '<!DOCTYPE html>\n' + DocClone.outerHTML;
  const blob = new Blob([currentHTML], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = TAB_OUTPUT_NAME;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);

  clearAllTabLocalCaches();

  const saveBtn = document.getElementById('save-btn');
  if (saveBtn) {
    const originalHTML = saveBtn.innerHTML;
    const originalBg = saveBtn.style.background;
    saveBtn.style.background = '#16a34a';
    saveBtn.title = 'Saved to file & Cache Cleared!';
    saveBtn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    `;
    setTimeout(() => {
      saveBtn.style.background = originalBg;
      saveBtn.title = 'SAVE APPLICATION';
      saveBtn.innerHTML = originalHTML;
    }, 2000);
  }
}

// Dedicated Bookmarks tab export
function TriggerTabExport() {
  let foundData = null;

  if (typeof window !== 'undefined' && window.BookmarkState && typeof window.BookmarkState === 'object') {
    foundData = window.BookmarkState;
  }

  if (!foundData) {
    const script = document.getElementById('Bookmarks');
    if (script && script.textContent.trim()) {
      try {
        foundData = JSON.parse(script.textContent);
      } catch (e) { }
    }
  }

  if (!foundData) {
    try {
      const cached = typeof localStorage !== 'undefined' ? localStorage.getItem('Bookmarks_Local_Cache') : null;
      if (cached) {
        foundData = JSON.parse(cached);
      }
    } catch (e) { }
  }

  const now = Date.now();
  const rawBookmarks = foundData?.bookmarks || foundData?.bookmark || [];
  let secOrder = Array.isArray(foundData?.sectionOrder) ? [...foundData.sectionOrder] : ['ALL'];
  if (!secOrder.includes('ALL')) secOrder.unshift('ALL');

  const cleanData = {
    bookmarks: Array.isArray(rawBookmarks) ? rawBookmarks : [],
    sectionOrder: secOrder,
    _lastSaved: now
  };

  const dataStr = JSON.stringify(cleanData, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Bookmarks_DATA.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Dedicated Bookmarks tab import with multi-tab envelope resilience
function TriggerTabImport(onSuccess = null) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const importedData = JSON.parse(event.target.result);
        if (!importedData || typeof importedData !== 'object') {
          throw new Error('Imported file does not contain a valid JSON object.');
        }

        // Resilient extraction: direct bookmarks vs global multi-tab envelope
        let targetData = null;
        if (importedData.Bookmarks && typeof importedData.Bookmarks === 'object') {
          targetData = importedData.Bookmarks;
        } else if (Array.isArray(importedData.bookmarks) || importedData.sectionOrder) {
          targetData = importedData;
        } else if (Array.isArray(importedData.bookmark)) {
          targetData = { bookmarks: importedData.bookmark, sectionOrder: ['ALL'] };
        } else {
          throw new Error('No bookmarks data found in this file.');
        }

        const now = Date.now();
        const bms = Array.isArray(targetData.bookmarks) ? targetData.bookmarks : (Array.isArray(targetData.bookmark) ? targetData.bookmark : []);
        let secOrder = Array.isArray(targetData.sectionOrder) ? [...targetData.sectionOrder] : ['ALL'];
        if (!secOrder.includes('ALL')) secOrder.unshift('ALL');

        const cleanData = {
          bookmarks: bms,
          sectionOrder: secOrder,
          _lastSaved: now
        };

        // 1. Sync to DOM script block
        let scriptBlock = document.getElementById('Bookmarks');
        if (!scriptBlock) {
          scriptBlock = document.createElement('script');
          scriptBlock.type = 'application/json';
          scriptBlock.id = 'Bookmarks';
          document.head.appendChild(scriptBlock);
        }
        scriptBlock.textContent = JSON.stringify(cleanData, null, 2);

        // 2. Sync to in-memory state
        if (typeof window !== 'undefined') {
          if (window.BookmarkState) {
            window.BookmarkState.bookmarks = cleanData.bookmarks;
            window.BookmarkState.sectionOrder = cleanData.sectionOrder;
            window.BookmarkState._lastSaved = now;
          } else {
            window.BookmarkState = cleanData;
          }
        }

        // 3. Save to localStorage with recovery buffer
        try {
          if (typeof localStorage !== 'undefined') {
            const cachePayload = {
              ...cleanData,
              _unsaved: true,
              _savedAt: now
            };
            localStorage.setItem('Bookmarks_Local_Cache', JSON.stringify(cachePayload));
          }
        } catch (err) {
          console.warn('[Bookmarks Import] Failed to cache in localStorage:', err);
        }

        alert('Bookmarks imported successfully! Remember to click SAVE to make it permanent in your HTML.');

        if (onSuccess) {
          onSuccess(cleanData);
        } else {
          window.location.reload();
        }
      } catch (err) {
        alert('Invalid JSON file: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Swaps the shared Import/Export bindings for the local copies above.
// Called after initBookmarksApp() mounts the header.
function InitTabImportExportOverride() {
  const importBtn = document.getElementById('btn-import');
  const exportBtn = document.getElementById('btn-export');

  if (exportBtn) {
    const clone = exportBtn.cloneNode(true);

      TriggerTabExport();

  }

  if (importBtn) {

      TriggerTabImport(null);

let BookmarkState = {
  bookmarks: [],
  sectionOrder: ['ALL']
};
function LoadBookmarkState() {
  const dataBlock = typeof document !== 'undefined' ? document.getElementById('Bookmarks') : null;
  let domState = null;

  if (dataBlock && dataBlock.textContent.trim()) {
    try {
      const parsed = JSON.parse(dataBlock.textContent);
      if (parsed && typeof parsed === 'object') {
        const bms = parsed.bookmarks || parsed.bookmark || [];
        let secOrder = parsed.sectionOrder || [];
        if (!secOrder.includes('ALL')) secOrder.unshift('ALL');
        domState = {
          bookmarks: bms,
          sectionOrder: secOrder,
          _lastSaved: parsed._lastSaved || 0
        };
      }
    } catch (e) {
      console.error('Failed to parse Bookmarks JSON data block:', e);
    }
  }

  // 1. Check if browser Local Storage has an active unsaved crash recovery buffer
  try {
    const cached = typeof localStorage !== 'undefined' ? localStorage.getItem('Bookmarks_Local_Cache') : null;
    if (cached) {
      const parsedCache = JSON.parse(cached);
      const domTimestamp = domState?._lastSaved || 0;
      const cacheTimestamp = parsedCache?._savedAt || 0;

      // Only restore from cache if it represents active unsaved edits newer than the HTML file
      if (parsedCache && parsedCache._unsaved === true && cacheTimestamp > domTimestamp && Array.isArray(parsedCache.bookmarks)) {
        console.log('[BookmarkState] Recovering uncommitted bookmark edits from local cache...');
        BookmarkState = {
          bookmarks: parsedCache.bookmarks,
          sectionOrder: Array.isArray(parsedCache.sectionOrder) ? parsedCache.sectionOrder : ['ALL'],
          _lastSaved: cacheTimestamp
        };
        if (dataBlock) dataBlock.textContent = JSON.stringify(BookmarkState, null, 2);
        if (typeof window !== 'undefined') window.BookmarkState = BookmarkState;
        return BookmarkState;
      }
    }
  } catch (e) {
    console.warn('Could not read Bookmarks_Local_Cache:', e);
  }

  // 2. Pure, clean load directly from HTML data vault (#Bookmarks)
  if (domState) {
    BookmarkState = {
      bookmarks: domState.bookmarks,
      sectionOrder: domState.sectionOrder,
      _lastSaved: domState._lastSaved || 0
    };
    if (typeof window !== 'undefined') window.BookmarkState = BookmarkState;
    return BookmarkState;
  }

  // 3. Default empty state
  BookmarkState = { bookmarks: [], sectionOrder: ['ALL'], _lastSaved: 0 };
  if (typeof window !== 'undefined') window.BookmarkState = BookmarkState;
  return BookmarkState;
}
function SaveBookmarkState(newState = null) {
  if (newState) BookmarkState = newState;

  const dataBlock = typeof document !== 'undefined' ? document.getElementById('Bookmarks') : null;
  if (dataBlock) dataBlock.textContent = JSON.stringify(BookmarkState, null, 2);

  if (typeof window !== 'undefined') window.BookmarkState = BookmarkState;

  // Persist to browser Local Storage as active unsaved working buffer
  try {
    if (typeof localStorage !== 'undefined') {
      const cachePayload = {
        ...BookmarkState,
        _unsaved: true,
        _savedAt: Date.now()
      };
      localStorage.setItem('Bookmarks_Local_Cache', JSON.stringify(cachePayload));
    }
  } catch (e) {

  }

  if (closeBtn && dropdownWindow) {
    closeBtn.addEventListener('click', () => {
      dropdownWindow.classList.add('hidden');
    });
  }

  document.addEventListener('click', (e) => {
    if (dropdownWindow && !dropdownWindow.contains(e.target) && toggleBtn && !toggleBtn.contains(e.target)) {
      dropdownWindow.classList.add('hidden');
    }
  });

  if (searchInput) {
    searchInput.addEventListener('input', () => {
      RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
    });
  }

  if (colDecBtn && colIncBtn) {
    colDecBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (ColumnCount > 1) {
        ColumnCount--;
        RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
      }
    });

    colIncBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const currentList = state.sectionOrder || ['ALL'];
      const tileWidth = ComputeUniformTileWidth(currentList);
      const maxCols = GetMaxPossibleColumns(tileWidth);

      if (ColumnCount < maxCols) {
        ColumnCount++;
        RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
      }
    });
  }

  // Handle window resizing dynamically
  window.addEventListener('resize', () => {
    if (dropdownWindow && !dropdownWindow.classList.contains('hidden')) {
      RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
    }
  });

  RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
}

// Calculate the uniform tile width based on the longest group name
function ComputeUniformTileWidth(groups) {
  let maxCharLength = 0;
  groups.forEach(g => {
    if (g && g.length > maxCharLength) maxCharLength = g.length;
  });

  const computed = Math.ceil(maxCharLength * 8.5) + 68;
  return Math.min(280, Math.max(150, computed));
}

// Calculate the maximum number of columns that can fit without horizontal overflow
function GetMaxPossibleColumns(tileWidth) {
  const windowPadding = 28;
  const gap = 8;
  const viewportMax = Math.min(window.innerWidth - 20, 780);
  const maxCols = Math.floor((viewportMax - windowPadding + gap) / (tileWidth + gap));
  return Math.max(1, maxCols);
}

// Renders interactive drag-and-drop grid inside dropdown to reorder bookmark groups.
function RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate) {
  const grid = document.getElementById('sections-grid-container');
  const dropdownWindow = document.getElementById('sections-dropdown-window');
  if (!grid || !dropdownWindow) return;

  const searchInput = document.getElementById('section-search-input');
  const searchVal = (searchInput?.value || '').toLowerCase().trim();
  const colValEl = document.getElementById('col-count-val');
  const colDecBtn = document.getElementById('col-dec-btn');
  const colIncBtn = document.getElementById('col-inc-btn');

  const counts = {};
  (state.bookmarks || []).forEach(b => {
    counts[b.group] = (counts[b.group] || 0) + 1;
  });
  counts['ALL'] = (state.bookmarks || []).length;

  const rawOrder = state.sectionOrder && state.sectionOrder.length > 0
    ? state.sectionOrder
    : ['ALL', ...Object.keys(counts).filter(k => k !== 'ALL')];

  if (!rawOrder.includes('ALL')) {
    rawOrder.unshift('ALL');
  }

  const currentList = TemporaryOrder || rawOrder;
  const tileWidth = ComputeUniformTileWidth(currentList);
  const maxPossibleCols = GetMaxPossibleColumns(tileWidth);

  // Clamp ColumnCount to prevent horizontal overflow
  if (ColumnCount > maxPossibleCols) {
    ColumnCount = maxPossibleCols;
  }
  if (colValEl) colValEl.textContent = ColumnCount;
  if (colDecBtn) colDecBtn.disabled = ColumnCount <= 1;
  if (colIncBtn) colIncBtn.disabled = ColumnCount >= maxPossibleCols;

  // Window Width Sizing:
  // When ColumnCount is 1: window width is set to exactly 250px
  // When ColumnCount > 1: window expands to max-content (enveloping multi-column grid)
  if (ColumnCount === 1) {
    dropdownWindow.style.width = '250px';
    grid.style.gridTemplateColumns = '1fr';
  } else {
    dropdownWindow.style.width = 'max-content';
    grid.style.gridTemplateColumns = `repeat(${ColumnCount}, ${tileWidth}px)`;
  }

  const filtered = currentList.filter(s => !searchVal || s.toLowerCase().includes(searchVal));

  grid.innerHTML = filtered.map(s => `
    <div class="section-grid-tile ${ActiveSection === s ? 'active' : ''} ${DraggedSection === s ? 'is-dragging' : ''}"
         data-section="${s}"
         draggable="${s !== 'ALL' ? 'true' : 'false'}"
         style="${ColumnCount === 1 ? 'width: 100%;' : `width: ${tileWidth}px;`}">
      <span class="section-tile-title">${s}</span>
      <span class="count-badge">${counts[s] || 0}</span>
    </div>
  `).join('');

  // Attach click selection and Animated Drag & Drop
  grid.querySelectorAll('.section-grid-tile').forEach(tile => {
    const sectionName = tile.dataset.section;

    tile.addEventListener('click', (e) => {
      e.stopPropagation();
      ActiveSection = sectionName;
      const label = document.getElementById('current-section-label');
      if (label) label.textContent = ActiveSection;
      RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
      if (onSectionSelect) onSectionSelect(ActiveSection);
      document.getElementById('sections-dropdown-window')?.classList.add('hidden');
    });

    if (sectionName !== 'ALL') {
      tile.addEventListener('dragstart', (e) => {
        IsDragging = true;
        DraggedSection = sectionName;
        TemporaryOrder = [...currentList];
        tile.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', sectionName);
      });

      tile.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';

        if (!IsDragging || !DraggedSection || DraggedSection === sectionName) return;

        const srcIdx = TemporaryOrder.indexOf(DraggedSection);
        const tgtIdx = TemporaryOrder.indexOf(sectionName);

        if (srcIdx !== -1 && tgtIdx !== -1 && srcIdx !== tgtIdx) {
          // Record old positions for FLIP animation
          const oldPositions = new Map();
          grid.querySelectorAll('.section-grid-tile').forEach(el => {
            oldPositions.set(el.dataset.section, el.getBoundingClientRect());
          });

          // Reorder temporary array
          const [item] = TemporaryOrder.splice(srcIdx, 1);
          TemporaryOrder.splice(tgtIdx, 0, item);

          // Re-render DOM with temporary order
          RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);

          // Animate the shifting tiles smoothly
          grid.querySelectorAll('.section-grid-tile').forEach(el => {
            const sec = el.dataset.section;
            if (sec === DraggedSection) return;

            const oldPos = oldPositions.get(sec);
            if (oldPos) {
              const newPos = el.getBoundingClientRect();
              const dx = oldPos.left - newPos.left;
              const dy = oldPos.top - newPos.top;

              if (dx !== 0 || dy !== 0) {
                el.style.transform = `translate(${dx}px, ${dy}px)`;
                el.style.transition = 'none';

                requestAnimationFrame(() => {
                  el.style.transition = 'transform 0.24s cubic-bezier(0.2, 0, 0, 1)';
                  el.style.transform = '';
                });
              }
            }
          });
        }
      });

      tile.addEventListener('dragend', () => {
        IsDragging = false;
        tile.classList.remove('is-dragging');

        if (TemporaryOrder) {
          state.sectionOrder = [...TemporaryOrder];
          TemporaryOrder = null;
          DraggedSection = null;
          SaveBookmarkState();
          RenderSectionsDropdownGrid(state, onSectionSelect, onOrderUpdate);
          if (onOrderUpdate) onOrderUpdate(state.sectionOrder);
        }
      });
    }
  });
}

// Helper to extract favicon.ico URL from a domain
function ExtractFaviconUrl(urlStr) {
  if (!urlStr) return '';
  try {
    let clean = urlStr.trim();
    if (!/^https?:\/\//i.test(clean)) {
      clean = 'https://' + clean;
    }
    const parsed = new URL(clean);
    return `${parsed.origin}/favicon.ico`;
  } catch (e) {
    return '';
  }
}

// Collect non-favicon.ico custom icon URLs used across bookmarks
function GetNonFaviconIcons(state) {
  const set = new Set();
  (state.bookmarks || []).forEach(b => {
    if (b.customIcon && typeof b.customIcon === 'string') {
      const lower = b.customIcon.toLowerCase().trim();
      if (!lower.endsWith('/favicon.ico')) {
        set.add(b.customIcon.trim());
      }
    }
  });
  return Array.from(set);
}

function PopulateCustomIconPalette(state, selectedUrl = '') {
  const pal = document.getElementById('bm-logo-palette');
  if (!pal) return;

  const icons = GetNonFaviconIcons(state);
  pal.innerHTML = icons.map(url => `
    <img src="${url}" class="logo-palette-img ${selectedUrl === url ? 'selected' : ''}" data-url="${url}" alt="" onerror="this.style.display='none'"/>
  `).join('');

  pal.querySelectorAll('.logo-palette-img').forEach(img => {
    img.addEventListener('click', () => {
      const iconIn = document.getElementById('bm-icon-url');
      const titleLogoCb = document.getElementById('bm-title-logo-cb');

      StoredIconUrl = img.dataset.url;
      if (iconIn) iconIn.value = StoredIconUrl;
      if (titleLogoCb) {
        titleLogoCb.checked = false;
        SetLetterLogoActiveState(false);
      }

      HighlightSelectedPalette(StoredIconUrl);
    });
  });
}

function HighlightSelectedPalette(url) {
  const pal = document.getElementById('bm-logo-palette');
  if (!pal) return;
  pal.querySelectorAll('.logo-palette-img').forEach(img => {
    img.classList.toggle('selected', img.dataset.url === url);
  });
}

// Controls greyed-out uneditable state of Icon URL and Palette when Letter Logo is active
function SetLetterLogoActiveState(isLetterLogo) {
  const iconIn = document.getElementById('bm-icon-url');
  const paletteEl = document.getElementById('bm-logo-palette');

  if (iconIn) {
    if (isLetterLogo) {
      if (iconIn.value) StoredIconUrl = iconIn.value;
      iconIn.disabled = true;
      iconIn.classList.add('disabled-icon-input');
      iconIn.value = '';
      iconIn.placeholder = 'Letter logo enabled';
    } else {
      iconIn.disabled = false;
      iconIn.classList.remove('disabled-icon-input');
      iconIn.placeholder = 'https://.../favicon.ico';
      iconIn.value = StoredIconUrl || '';
    }
  }

  if (paletteEl) {
    paletteEl.classList.toggle('palette-disabled', isLetterLogo);
    if (isLetterLogo) {
      HighlightSelectedPalette('');
    } else {
      HighlightSelectedPalette(StoredIconUrl);
    }
  }
}

function RenderSectionCombobox(state) {
  const secIn = document.getElementById('bm-section');
  const secDropdown = document.getElementById('bm-section-dropdown');
  if (!secIn || !secDropdown) return;

  const val = secIn.value.toLowerCase().trim();
  const groups = (state.sectionOrder || []).filter(s => s !== 'ALL');
  const filtered = groups.filter(g => g.toLowerCase().includes(val));

  let html = filtered.map(g => `
    <div class="combobox-item" data-value="${g}">${g}</div>
  `).join('');

  if (!html) {
    html = `<div style="padding:6px 10px; font-size:11px; color:var(--text-secondary, #a0a4b8);">No matching groups</div>`;
  }

  secDropdown.innerHTML = html;

  secDropdown.querySelectorAll('.combobox-item').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      secIn.value = item.dataset.value;
      secDropdown.classList.add('hidden');
    });
  });
}
function OpenBookmarkModal(b = null, state) {
  EditingId = b ? b.id : null;
  const modal = document.getElementById('bookmark-modal');
  const nameIn = document.getElementById('bm-name');
  const urlIn = document.getElementById('bm-url');
  const secIn = document.getElementById('bm-section');
  const titleLogoCb = document.getElementById('bm-title-logo-cb');
  const iconIn = document.getElementById('bm-icon-url');
  const titleEl = document.getElementById('bookmark-modal-title');

  if (!modal) return;

  if (titleEl) titleEl.textContent = b ? 'Edit Bookmark' : 'Add Bookmark';
  if (nameIn) nameIn.value = b ? b.name : '';
  if (urlIn) urlIn.value = b ? b.url : '';

  const activeSec = GetActiveSection();
  if (secIn) {
    secIn.value = b ? b.group : (activeSec !== 'ALL' ? activeSec : '');
  }

  const useTitle = b ? (b.useTitleLogo === true) : false;
  if (titleLogoCb) titleLogoCb.checked = useTitle;

  StoredIconUrl = '';
  if (b) {
    if (b.customIcon) StoredIconUrl = b.customIcon;
    else if (!b.useTitleLogo && b.url) StoredIconUrl = ExtractFaviconUrl(b.url);
  }

  if (iconIn) {
    iconIn.value = StoredIconUrl;
  }

  PopulateCustomIconPalette(state, StoredIconUrl);
  SetLetterLogoActiveState(useTitle);

  modal.classList.remove('hidden');
  if (nameIn) nameIn.focus();
}
function CloseBookmarkModal() {
  const modal = document.getElementById('bookmark-modal');
  const secDropdown = document.getElementById('bm-section-dropdown');
  if (modal) modal.classList.add('hidden');
  if (secDropdown) secDropdown.classList.add('hidden');
  EditingId = null;
  StoredIconUrl = '';
}
function DeleteBookmark(id, state, onUpdate, showToast) {
  const b = state.bookmarks.find(x => x.id === id);
  if (!b) return;
  if (confirm(`Delete bookmark "${b.name}"?`)) {
    state.bookmarks = state.bookmarks.filter(x => x.id !== id);
    SaveBookmarkState();
    if (onUpdate) onUpdate();
    if (showToast) showToast('Bookmark deleted');
  }
}
function InitModal(state, onUpdate, showToast) {
  OnModalUpdate = onUpdate;
  ShowToastFn = showToast;

  const closeBtn = document.getElementById('close-bookmark-modal');
  const cancelBtn = document.getElementById('cancel-bookmark-modal');
  const saveBtn = document.getElementById('save-bookmark-modal-btn');
  const titleLogoCb = document.getElementById('bm-title-logo-cb');
  const urlIn = document.getElementById('bm-url');
  const iconIn = document.getElementById('bm-icon-url');
  const secIn = document.getElementById('bm-section');
  const secDropdown = document.getElementById('bm-section-dropdown');

  if (closeBtn) closeBtn.addEventListener('click', CloseBookmarkModal);
  if (cancelBtn) cancelBtn.addEventListener('click', CloseBookmarkModal);

  // Auto-extract favicon when typing / pasting URL
  if (urlIn) {
    urlIn.addEventListener('input', () => {
      const autoFav = ExtractFaviconUrl(urlIn.value);
      if (autoFav) {
        StoredIconUrl = autoFav;
        if (titleLogoCb && !titleLogoCb.checked && iconIn) {
          iconIn.value = autoFav;
          HighlightSelectedPalette(autoFav);
        }
      }
    });
  }

  // Update Icon URL field manually if edited
  if (iconIn) {
    iconIn.addEventListener('input', () => {
      StoredIconUrl = iconIn.value.trim();
      HighlightSelectedPalette(StoredIconUrl);
    });
  }

  // Toggle Letter Logo checkbox: grey-out and make uneditable
  if (titleLogoCb) {
    titleLogoCb.addEventListener('change', () => {
      SetLetterLogoActiveState(titleLogoCb.checked);
      if (!titleLogoCb.checked && (!StoredIconUrl || StoredIconUrl.endsWith('/favicon.ico'))) {
        if (urlIn && urlIn.value) {
          StoredIconUrl = ExtractFaviconUrl(urlIn.value);
          if (iconIn) iconIn.value = StoredIconUrl;
        }
      }
    });
  }

  // Group combobox interactions
  if (secIn && secDropdown) {
    secIn.addEventListener('focus', () => {
      RenderSectionCombobox(state);
      secDropdown.classList.remove('hidden');
    });
    secIn.addEventListener('input', () => {
      RenderSectionCombobox(state);
      secDropdown.classList.remove('hidden');
    });
    document.addEventListener('click', (e) => {
      const wrapper = document.getElementById('bm-section-combobox');
      if (wrapper && !wrapper.contains(e.target)) {
        secDropdown.classList.add('hidden');
      }
    });
  }

  // Save Bookmark
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const nameIn = document.getElementById('bm-name');
      const name = nameIn ? nameIn.value.trim() : '';
      const url = urlIn ? urlIn.value.trim() : '';
      const group = (secIn && secIn.value.trim()) ? secIn.value.trim() : '';
      const useTitleLogo = titleLogoCb ? (titleLogoCb.checked === true) : false;
      const rawIcon = StoredIconUrl || (iconIn ? iconIn.value.trim() : '') || ExtractFaviconUrl(url);

      if (!name || !url || !group) {
        if (ShowToastFn) ShowToastFn('Please enter title, URL, and group');
        return;
      }

      if (group.toUpperCase() === 'ALL') {
        if (ShowToastFn) ShowToastFn('"ALL" is reserved. Please use another group name.');
        if (secIn) secIn.focus();
        return;
      }

      // Add new group to sectionOrder if not already present
      if (!state.sectionOrder.includes(group)) {
        state.sectionOrder.push(group);
      }

      const customIcon = rawIcon;

      if (EditingId) {
        const b = state.bookmarks.find(x => x.id === EditingId);
        if (b) {
          b.name = name;
          b.url = url;
          b.group = group;
          b.customIcon = customIcon;
          b.useTitleLogo = useTitleLogo;
        }
      } else {
        state.bookmarks.push({
          id: 'b_' + Date.now(),
          name,
          url,
          group,
          customIcon,
          useTitleLogo
        });
      }

      SaveBookmarkState();
      CloseBookmarkModal();
      if (OnModalUpdate) OnModalUpdate();
      if (ShowToastFn) ShowToastFn(EditingId ? 'Bookmark updated' : 'Bookmark added');
    });
  }
}
